<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>METIS — A Lens for the Wisdom</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="METIS">
<meta name="description" content="A Lens for the Wisdom">
<meta property="og:title" content="METIS — A Lens for the Wisdom">
<meta property="og:site_name" content="METIS">
<meta property="og:description" content="A Lens for the Wisdom">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- 작업13: 전 화면 공통 상단 헤더(로고+로그인상태) -->
<link rel="stylesheet" href="/css/common/appHeader.css">
<style>
  :root {
    --bg: #f5f7ff;
    --surface: #ffffff;
    --surface2: #eef1fb;
    --border: #dde2f5;
    --accent: #e2583b;
    --accent2: #f54a7a;
    --accent3: #16a34a;
    --accent-ko: #e67e22;
    --accent-ja: #b3261e;
    --accent-zh: #c0392b;
    --text: #1a1f3c;
    --text2: #4a5070;
    --text3: #9398b5;
    --correct: #16a34a;
    --wrong: #dc2626;
    --radius: 16px;
    --radius-sm: 10px;
    /* 작업12: 기존 52px 상단 nav 대비 50% 키운 값. OCR 버튼/토스트/main
       하단 여백이 전부 이 값 + 안전영역을 기준으로 계산되므로 바 높이를
       바꿀 일이 있으면 여기 하나만 고치면 됨. */
    --navbar-h: 78px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* NAV - 작업12: 상단 sticky에서 하단 fixed로 이동. 활성 표시선은
     border-bottom(바 맨 아래 가장자리라 거의 안 보임) 대신 border-top으로
     바꿔서 탭 위쪽에 표시되게 함. 높이는 --navbar-h(기존 대비 50% 증가) +
     안전영역만큼 padding-bottom을 더해서, 제스처 바가 있는 기기에서도
     탭이 그 밑에 깔리지 않게 함. */
  nav {
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(226,88,59,0.07);
    padding: 0 16px max(8px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 0;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    min-height: var(--navbar-h);
  }

  .nav-tabs {
    display: flex;
    flex: 1;
    overflow-x: auto;
    /* overflow-x만 지정하면 overflow-y가 스펙상 암묵적으로 auto가 되어,
       세로 오버플로가 전혀 없어도 스크롤바 트랙이 나타나는 경우가
       있어서 명시적으로 막음. */
    overflow-y: hidden;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
    /* 작업12-b: 탭 사이 간격을 padding이 아니라 이 gap 하나로만
       통일 - 라벨 길이/뱃지 유무와 무관하게 항상 동일한 간격 보장
       작업34: 로고 블록 제거로 생긴 여유 공간만큼 간격을 20px→40px로 확대 */
    gap: 40px;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .nav-tab {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: center;
    gap: 2px;
    padding: 10px 4px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    border-top: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
    background: none;
    border-bottom: none;
    border-left: none;
    border-right: none;
    scroll-snap-align: start;
  }
  /* 작업31: 뱃지를 라벨 위 슬롯 대신 라벨 옆으로 옮기면서
     (docs/design/dictionary-minimal-redesign.md) 고정 높이 확보가
     더 이상 필요 없어짐 - 빈 슬롯은 자연스럽게 폭 0으로 접힘 */
  .nav-tab-badge-slot {
    display: inline-flex;
    align-items: baseline;
  }
  .nav-tab.active {
    color: var(--accent);
    border-top-color: var(--accent);
  }
  .nav-tab:hover:not(.active) { color: var(--text); }

  .nav-tab-metacong {
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .nav-tab-metacong:hover { border-bottom-color: var(--accent3); }

  /* 작업31: 필(pill) 배지 대신 라벨 옆 작은 보조색 숫자로 */
  .badge {
    display: inline-block;
    background: none;
    color: var(--text3);
    font-size: 11px;
    font-weight: 700;
    margin-left: 4px;
    vertical-align: baseline;
  }

  /* 작업12: 검색 입력 블록을 화면 상단에서 1/3 지점(세로 중앙보다 약간
     위)에 오도록 배치 - 예전에는 상단 nav 바로 아래에 sticky로 붙어
     있었지만, nav가 하단으로 옮겨가면서 그럴 이유가 없어짐.
     작업13: 검색을 실행하면 .searched 클래스가 붙어서 공통 헤더 바로
     아래로 부드럽게 이동함(margin-top 트랜지션) - 한 번 이동한 뒤에는
     입력창을 지우거나 다시 검색해도 계속 위에 머무름(doSearch()에서
     한 번 추가된 클래스를 다시 제거하지 않음). */
  .search-page-wrap {
    margin-top: 33vh;
    transition: margin-top 0.4s ease;
  }
  .search-page-wrap.searched {
    margin-top: 12px;
  }

  .search-wrap {
    display: flex;
    gap: 8px;
  }

  .search-input-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    padding: 12px 40px 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  .search-clear-btn {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    color: var(--text3);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    display: none;
    border-radius: 50%;
    transition: color 0.15s;
  }
  .search-clear-btn:hover { color: var(--text); }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.danger { background: var(--wrong); }

  /* 작업12: 검색 페이지의 검색 버튼만 세로 크기 50% 증가(12px -> 18px
     상하 padding). .btn은 결과카드/단어장/퀴즈 등 앱 전체에서 공용으로
     쓰여서 거기를 직접 키우면 관련 없는 화면까지 다 커짐 - #search-btn
     하나만 타겟팅. 입력창도 같은 높이로 맞춰서 나란히 놨을 때 어긋나
     보이지 않게 함. */
  #search-btn { padding-top: 18px; padding-bottom: 18px; }
  #page-search .search-input { padding-top: 18px; padding-bottom: 18px; }

  /* LANG INDICATOR */
  .lang-indicator {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .lang-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--text3);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .lang-tag.active-en {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .lang-tag.active-ko {
    background: var(--accent-ko);
    color: white;
    border-color: var(--accent-ko);
  }
  .lang-tag.active-ja {
    background: var(--accent-ja);
    color: white;
    border-color: var(--accent-ja);
  }
  .lang-tag.active-zh {
    background: var(--accent-zh);
    color: white;
    border-color: var(--accent-zh);
  }

  /* MAIN */
  main {
    flex: 1;
    /* 작업12: 하단 고정 nav(--navbar-h + 안전영역)에 콘텐츠가 가려지지
       않도록 여백 확보 */
    padding: 0 16px calc(var(--navbar-h) + env(safe-area-inset-bottom) + 16px);
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
  }

  .page { display: none; }
  .page.active { display: block; }

  /* RESULT CARD */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    animation: fadeUp 0.3s ease;
    box-shadow: 0 4px 20px rgba(226,88,59,0.08);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-word {
    font-family: 'Sora', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .result-pronunciation {
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    color: var(--text3);
    margin-bottom: 10px;
    letter-spacing: 0.03em;
  }

  .word-headline {
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .word-etymology, .word-tone {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .word-tone { margin-bottom: 14px; }

  .derivatives-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .derivative-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .derivative-word {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
  }
  .derivative-pos {
    font-size: 11px;
    color: var(--text3);
  }
  .derivative-meaning {
    font-size: 13px;
    color: var(--text2);
  }

  .result-pos-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  /* 작업31: 알약 배지 제거 - 언어별(ko/ja/zh) 강조색도 없애고 EN과
     같은 단일 accent 색 하나로 통일(플레인 텍스트) */
  .result-pos-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
  }

  .result-section {
    margin-bottom: 20px;
  }

  .result-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 10px;
  }

  .result-section-body {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
  }

  .usage-item {
    margin-bottom: 14px;
    padding: 12px 14px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--accent);
  }

  .usage-item.ko { border-left-color: var(--accent-ko); }

  .usage-context {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .usage-desc {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.6;
  }

  .usage-example {
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    color: var(--text);
    font-style: italic;
    margin-bottom: 4px;
  }

  .usage-translation {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
  }

  .similar-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .similar-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .similar-item:last-child { border-bottom: none; padding-bottom: 0; }

  .similar-word {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    min-width: 100px;
    cursor: pointer;
  }
  .similar-word:hover { color: var(--accent); }

  .similar-diff {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
  }

  /* KO RESULT - English word entries - 작업31: 채워진 배경+좌측
     강조선 박스 대신 구분선(border-bottom)으로, 언어별 강조색도
     result-pos-tag와 동일하게 단일 accent 색으로 통일 */
  .ko-entry {
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .ko-entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  .ko-entry-word {
    font-family: 'Sora', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }

  .ko-entry-pronunciation {
    font-size: 12px;
    color: var(--text3);
    font-family: 'Sora', sans-serif;
    margin-bottom: 6px;
  }

  .ko-entry-meaning {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
  }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text2);
    font-size: 14px;
    padding: 20px 0;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Sora', sans-serif;
    font-size: 18px;
    font-weight: 700;
  }

  /* WORDBOOK 2-COLUMN LAYOUT (left rail = controls, right = word list) */
  .wb-layout {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  /* 작업5-a: 페이지는 body 전체 스크롤 방식(별도 스크롤 컨테이너 없음)이고
     .wb-layout이 그냥 flex라서, .wb-side가 static이면 .wb-main과 함께
     그대로 스크롤되어 화면 밖으로 밀려남. sticky + top을 공용 헤더의
     실측 높이(48px)로 맞춰서 항상 화면에 붙어있게 함. .wb-layout에
     이미 align-items:flex-start가 있어서 .wb-side가 .wb-main 높이만큼
     늘어나 있지 않은 상태라 sticky가 바로 효과를 냄. 배경을 불투명하게
     줘서(#wb-select-row와 동일한 이유) 밑에서 스크롤되는 단어 카드가
     비쳐 보이지 않게 함. */
  .wb-side {
    width: 74px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 48px;
    background: var(--bg);
    z-index: 15;
  }
  .wb-side-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .wb-side-group:last-child { border-bottom: none; margin-bottom: 0; }
  .wb-side-group.wb-side-gap-before { margin-top: 10px; }
  .wb-side-label {
    font-size: 9px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0 2px 1px;
  }
  .wb-side-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 2px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 9px;
    font-weight: 700;
    color: var(--text2);
    cursor: pointer;
    line-height: 1.2;
    text-align: center;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .wb-side-icon { font-size: 17px; line-height: 1; }
  .wb-side-btn.active-en, .wb-side-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(226,88,59,0.06); }
  .wb-side-btn.active-ko { border-color: var(--accent-ko); color: var(--accent-ko); background: rgba(230,126,34,0.06); }
  .wb-side-btn.active-ja { border-color: var(--accent-ja); color: var(--accent-ja); background: rgba(179,38,30,0.06); }
  .wb-side-btn.active-zh { border-color: var(--accent-zh); color: var(--accent-zh); background: rgba(192,57,43,0.06); }
  .wb-side-btn.danger.active { border-color: var(--wrong); color: var(--wrong); background: rgba(239,68,68,0.08); }
  .wb-main { flex: 1; min-width: 0; }

  /* Selection action bar (전체선택/재생 or 전체선택/선택 삭제/취소) - sticks
     just below the common top header (작업13, 48px) while the word list
     scrolls, in both 선택 듣기 and 삭제 모드. Solid background so list
     chips scrolling underneath don't show through.
     작업5-a: top이 예전 상단 nav(52px, 작업12에서 하단으로 옮겨져 지금은
     존재하지 않음) 기준 그대로 남아있던 걸 공용 헤더의 실측 높이로 수정 -
     .wb-side와 같은 값을 써서 둘이 같은 줄에 나란히 고정되게 맞춤. */
  #wb-select-row {
    position: sticky;
    top: 48px;
    z-index: 20;
    background: var(--bg);
    padding: 8px 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  #wb-select-row:empty { padding: 0; box-shadow: none; }

  /* WORD GRID */
  .word-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .alpha-section {
    margin-bottom: 8px;
  }

  .alpha-header {
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    padding: 6px 4px 4px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 6px;
  }

  .alpha-header.ko { color: var(--accent-ko); border-bottom-color: var(--accent-ko); }
  .alpha-header.ja { color: var(--accent-ja); border-bottom-color: var(--accent-ja); }
  .alpha-header.zh { color: var(--accent-zh); border-bottom-color: var(--accent-zh); }

  .alpha-words {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .word-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .word-chip:hover { border-color: var(--accent); }
  .word-chip.ko:hover { border-color: var(--accent-ko); }
  .word-chip.ja:hover { border-color: var(--accent-ja); }
  .word-chip.zh:hover { border-color: var(--accent-zh); }

  .word-chip-text {
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .word-chip-del {
    display: none;
    color: var(--text3);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .word-chip-del:hover { color: var(--wrong); }
  .wb-delete-mode .word-chip-del { display: flex; }
  .word-chip.selected { border-color: var(--accent); background: rgba(226,88,59,0.06); }
  .word-chip-check {
    width: 16px; height: 16px; flex-shrink: 0;
    border: 1.5px solid var(--border); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: transparent; transition: all 0.15s;
  }
  .word-chip.selected .word-chip-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wb-sort-btn {
    padding: 5px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    border: 1.5px solid var(--border); background: none;
    color: var(--text2); cursor: pointer;
    transition: all 0.15s; font-family: 'Sora', sans-serif;
  }
  .wb-sort-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(226,88,59,0.08); }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text3);
  }

  .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state-text { font-size: 14px; line-height: 1.6; }

  /* QUIZ */
  .quiz-start-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
  }

  .quiz-type-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin: 24px 0;
  }

  .quiz-type-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .quiz-type-btn:hover, .quiz-type-btn.selected {
    border-color: var(--accent);
    background: rgba(226,88,59,0.08);
  }

  .quiz-type-label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .quiz-type-desc {
    font-size: 12px;
    color: var(--text3);
  }

  /* QUIZ CARD */
  .quiz-progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .progress-text {
    font-size: 12px;
    color: var(--text3);
    white-space: nowrap;
    font-family: 'Sora', sans-serif;
  }

  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    animation: fadeUp 0.25s ease;
  }

  .quiz-type-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
  }

  .quiz-question {
    font-family: 'Sora', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    line-height: 1.3;
    color: var(--text);
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .quiz-option {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    text-align: left;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
    line-height: 1.5;
  }
  .quiz-option:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(226,88,59,0.08);
  }
  .quiz-option.correct {
    border-color: var(--correct);
    background: rgba(74,222,128,0.1);
    color: var(--correct);
  }
  .quiz-option.wrong {
    border-color: var(--wrong);
    background: rgba(248,113,113,0.1);
    color: var(--wrong);
  }
  .quiz-option:disabled { cursor: not-allowed; }

  .quiz-feedback {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    display: none;
  }
  .quiz-feedback.correct {
    background: rgba(74,222,128,0.1);
    color: var(--correct);
    border: 1px solid rgba(74,222,128,0.3);
    display: block;
  }
  .quiz-feedback.wrong {
    background: rgba(248,113,113,0.1);
    color: var(--wrong);
    border: 1px solid rgba(248,113,113,0.3);
    display: block;
  }

  .quiz-next-btn {
    width: 100%;
    margin-top: 16px;
    display: none;
  }

  /* RESULT */
  .quiz-result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    animation: fadeUp 0.3s ease;
  }

  .result-score {
    font-family: 'Sora', sans-serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin: 12px 0 4px;
  }

  .result-score-label {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 24px;
  }

  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    /* 작업12: 하단 고정 nav 위로 띄워서 겹치지 않게 */
    bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom) + 24px);
    left: 50%;
    /* bottom 기준점이 24px에서 nav 높이만큼 올라간 만큼, 숨김 상태일 때
       화면 밖으로 밀어내는 translateY 값도 함께 키워야 함 - 안 그러면
       "숨겨진" 토스트가 nav 위에 살짝 걸쳐 보임 (80px로는 더 이상
       충분히 안 밀림). */
    transform: translateX(-50%) translateY(150px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 40px;
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  /* 클릭 가능한 영어 단어 */
  .ko-entry-word-link {
    font-family: 'Sora', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    display: inline-block;
  }
  .ko-entry-word-link:hover {
    color: var(--accent);
  }

  /* 추가 번역 버튼 */
  .extra-trans-wrap {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .extra-trans-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
  }
  .extra-trans-btns {
    display: flex;
    gap: 8px;
  }
  .extra-trans-btn {
    flex: 1;
    padding: 10px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    transition: all 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .extra-trans-btn.ja:hover {
    border-color: var(--accent-ja);
    color: var(--accent-ja);
    background: rgba(179,38,30,0.06);
  }
  .extra-trans-btn.zh:hover {
    border-color: var(--accent-zh);
    color: var(--accent-zh);
    background: rgba(192,57,43,0.06);
  }
  .extra-trans-btn.loading {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .extra-trans-result {
    margin-top: 12px;
    animation: fadeUp 0.25s ease;
  }

  /* ─── LOGIN OVERLAY ──────────────────────────────────────────── */
  #login-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: linear-gradient(135deg, #eef2ff 0%, #f0f4ff 60%, #e8f0ff 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 40px rgba(226,88,59,0.13);
    padding: 44px 36px; max-width: 360px; width: 90%;
    text-align: center;
  }
  .login-logo { height: 56px; margin-bottom: 20px; }
  .login-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: 'Sora', sans-serif; }
  .login-subtitle { font-size: 14px; color: var(--text2); margin-bottom: 32px; line-height: 1.6; }
  .google-login-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; border: 1.5px solid var(--border);
    border-radius: 12px; padding: 13px 20px; width: 100%;
    font-size: 15px; font-weight: 600; color: var(--text);
    cursor: pointer; transition: all 0.2s; text-decoration: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .google-login-btn:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(226,88,59,0.15); }
  .google-icon { width: 20px; height: 20px; }

  /* ─── NAV USER INFO ───────────────────────────────────────────── */
  .nav-user {
    display: flex; align-items: center;
    padding-left: 8px; flex-shrink: 0;
  }
  .nav-admin-btn {
    margin-left: 8px; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px;
    background: #ede9fe; color: #6d28d9;
    text-decoration: none; white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .nav-admin-btn:hover { background: #ddd6fe; }

  /* ─── SEARCH WELCOME ─────────────────────────────────────────── */
  .user-welcome-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    border-radius: var(--radius);
    margin: 16px 16px 8px;
    border: 1px solid var(--border);
  }
  .user-welcome-name {
    font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px;
  }
  .user-welcome-sub {
    font-size: 12px; color: var(--text3);
  }
  /* TTS BUTTON */
  /* 작업35: 아이콘 전용 버튼 대신 아이콘+"발음" 텍스트를 나란히 배치한
     심플 버튼으로. 아이콘(이모지)은 재생 상태(대기/로딩/재생중)에 따라
     playTTS()가 .tts-icon만 바꿔치기하고, .tts-label("발음")은 그대로 둠 */
  .tts-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.2;
    flex-shrink: 0;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .tts-icon { font-size: 16px; line-height: 1; }
  .tts-btn:hover { border-color: var(--accent); background: rgba(226,88,59,0.06); }
  .tts-btn.playing { border-color: var(--accent); background: rgba(226,88,59,0.12); }

  /* MEANING SET (new EN structure) - 작업31: 채워진 배경+좌측 강조선
     박스 대신 구분선(border-bottom)으로 항목을 나눔 */
  .meaning-set {
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .meaning-set:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
  }
  .meaning-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  /* 작업33: 원형 배지 대신 굵은 텍스트 숫자만 - .result-pos-tag 등
     다른 요소들과 같은 플레인 텍스트 패턴으로 통일 */
  .meaning-num {
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    flex-shrink: 0;
  }
  .meaning-core {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .meaning-domain {
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 0.03em;
  }
  .meaning-nuance {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  /* 작업38: 뜻 블록 안 예문만 왼쪽 세로선으로 강조 - 작업31에서 뺀
     "뜻풀이 블록 전체" 박스+강조선과는 별개로, 예문 한 줄에만 스코프 */
  .meaning-set .usage-example {
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    margin-top: 6px;
  }
  .base-form-hint {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 8px;
    font-family: 'Sora', sans-serif;
    letter-spacing: 0.02em;
  }
  .similar-core {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
    font-weight: 500;
  }

  /* PODCAST PLAYER */
  .podcast-player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 2px solid var(--border);
    padding: 14px 20px 30px;
    z-index: 200;
    box-shadow: 0 -6px 28px rgba(226,88,59,0.12);
    display: none;
  }
  .podcast-player.show { display: block; }
  .podcast-top-row {
    display: flex; align-items: flex-start;
    justify-content: space-between; margin-bottom: 8px;
  }
  .podcast-word-info { flex: 1; min-width: 0; }
  .podcast-word-display {
    font-family: 'Sora', sans-serif; font-size: 20px;
    font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .podcast-meaning-display {
    font-size: 13px; color: var(--text2); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .podcast-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .podcast-close-btn {
    background: none; border: none; font-size: 20px;
    color: var(--text3); cursor: pointer; padding: 0 0 0 10px;
    flex-shrink: 0; line-height: 1.2;
  }
  .podcast-progress-bar {
    height: 3px; background: var(--border); border-radius: 2px;
    margin-bottom: 14px; overflow: hidden;
  }
  .podcast-progress-fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 0.5s ease;
  }
  .podcast-controls {
    display: flex; align-items: center;
    justify-content: center; gap: 28px; margin-bottom: 12px;
  }
  .podcast-ctrl-btn {
    background: none; border: none; font-size: 28px;
    cursor: pointer; padding: 2px; color: var(--text);
    line-height: 1; transition: opacity 0.15s;
  }
  .podcast-ctrl-btn:hover { opacity: 0.6; }
  .podcast-play-btn {
    background: var(--accent); color: white;
    border-radius: 50%; width: 50px; height: 50px;
    font-size: 22px; display: flex; align-items: center;
    justify-content: center; padding: 0; flex-shrink: 0;
    cursor: pointer; transition: opacity 0.15s;
  }
  .podcast-play-btn:hover { opacity: 0.88; }
  .podcast-speed-row { display: flex; justify-content: center; gap: 8px; }
  .podcast-speed-btn {
    padding: 5px 13px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    border: 1.5px solid var(--border); background: none;
    color: var(--text2); cursor: pointer;
    transition: all 0.15s; font-family: 'Sora', sans-serif;
  }
  .podcast-speed-btn.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(226,88,59,0.08);
  }
  .podcast-mode-row, .podcast-repeat-row, .podcast-gap-row { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }
  .podcast-mode-btn, .podcast-repeat-btn, .podcast-gap-btn {
    padding: 5px 13px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    border: 1.5px solid var(--border); background: none;
    color: var(--text2); cursor: pointer;
    transition: all 0.15s; font-family: 'Sora', sans-serif;
  }
  .podcast-mode-btn.active, .podcast-repeat-btn.active, .podcast-gap-btn.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(226,88,59,0.08);
  }


  /* DASHBOARD */
  @keyframes skel-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  /* 작업31: 파란기 도는 회색(#d8ddf0) 대신 중립 연회색으로 */
  .skel-block {
    background: linear-gradient(90deg, var(--surface2) 25%, #dfe1e6 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.4s infinite;
    border-radius: var(--radius-sm);
  }

  /* METACOG QUIZ */
  .metacog-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    animation: fadeUp 0.25s ease;
  }
  .metacog-word-info {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 8px;
  }
  .metacog-question {
    font-size: 19px;
    font-weight: 700;
    margin: 16px 0 20px;
    line-height: 1.4;
    color: var(--text);
  }
  .metacog-ox-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }
  .metacog-ox-btn {
    font-size: 34px;
    padding: 20px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text);
  }
  .metacog-ox-btn:hover { transform: scale(1.04); border-color: var(--accent); background: rgba(226,88,59,0.08); }
  .metacog-ox-btn.correct { background: rgba(22,163,74,0.12); border-color: var(--correct); }
  .metacog-ox-btn.wrong   { background: rgba(220,38,38,0.12); border-color: var(--wrong); }
  .metacog-options { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
  .metacog-option {
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .metacog-option:hover { border-color: var(--accent); background: rgba(226,88,59,0.08); }

<!-- 작업13: 전 화면 공통 상단 헤더 - body 맨 앞에 prepend되므로 아래
     로그인 오버레이/nav/main보다 항상 위(DOM 순서상으로도, sticky로도)에 옴 -->
<script src="/js/common/appHeader.js"></script>
<script>MetisAppHeader.inject();</script>
<script>
// 작업27: 사전 페이지 한정 헤더 재배치 실험. appHeader.js/css는 수정하지
// 않고, inject()가 만든 DOM(.metis-app-header-name/.metis-app-header-btn
// 등 기존 클래스)을 이 페이지 안에서만 재배치한다. renderAuthWidget()이
// 비동기(fetch /api/me)라 완료 시점을 MutationObserver로 감지 - 콜백에서
// 바로 observer를 끊어서, 이 안에서 노드를 옮기는 것 자체가 다시
// childList 변화를 일으켜 무한 루프가 되는 걸 막는다.
(function () {
  const header = document.querySelector('.metis-app-header');
  if (!header) return;
  header.classList.add('dict-exp-header');
  const logo = header.querySelector('.metis-app-header-logo');
  const right = header.querySelector('.metis-app-header-right');
  if (!logo || !right) return;

  const left = document.createElement('div');
  left.className = 'dict-exp-header-left';
  header.insertBefore(left, logo);
  left.appendChild(logo);
  const subtext = document.createElement('div');
  subtext.className = 'dict-exp-header-subtext';
  left.appendChild(subtext);

  const observer = new MutationObserver(function () {
    observer.disconnect();
    const adminLink = right.querySelector('.metis-app-header-btn.admin');
    const nameSpan = right.querySelector('.metis-app-header-name');
    const logoutBtn = Array.prototype.find.call(
      right.querySelectorAll('.metis-app-header-btn'),
      function (b) { return !b.classList.contains('admin') && !b.classList.contains('primary'); }
    );
    // 비로그인(Google 로그인 버튼만 있는 상태)이면 subtext는 비워두고
    // 기존 로그인 버튼은 손대지 않는다.
    if (!adminLink && !nameSpan) return;
    if (adminLink) {
      adminLink.classList.add('dict-exp-admin-link');
      subtext.appendChild(adminLink);
      if (nameSpan) subtext.appendChild(document.createTextNode(' · '));
    }
    if (nameSpan) subtext.appendChild(nameSpan);
    if (logoutBtn) logoutBtn.classList.add('dict-exp-logout-btn');
  });
  observer.observe(right, { childList: true });
})();
</script>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let wordbook = [];
let wrongNote = JSON.parse(localStorage.getItem('mydict_wrong') || '[]');
let quizState = null;
let currentResult = null;
let wordbookTab = 'en'; // 'en' | 'ko'

// ─── AUTH ─────────────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('mydict_token'); }
function setToken(t) { localStorage.setItem('mydict_token', t); }
function clearToken() { localStorage.removeItem('mydict_token'); }

function parseJwt(token) {
  try {
    // atob() decodes Base64 into a Latin-1 string, not UTF-8 - a JWT payload
    // holding a Korean name (or any multi-byte character) comes out mangled,
    // and depending on the exact bytes can even break JSON.parse outright.
    // Re-expand each decoded byte through decodeURIComponent to rebuild the
    // real UTF-8 string before parsing.
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(
      atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
    );
    return JSON.parse(json);
  } catch { return null; }
}

function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

// ─── METACONG ─────────────────────────────────────────────────────────────────
let userPerms = null;

async function initAuth() {
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  if (urlToken) {
    setToken(urlToken);
    // Leftover from before 작업8, when this file WAS served at the site root:
    // hardcoding '/' here rewrote the address bar to the site root while the
    // dictionary page's own DOM stayed loaded - harmless until the next
    // refresh, which would then actually navigate to '/' (now the home-wheel
    // app) instead of reloading this page. Keep the actual current path.
    window.history.replaceState({}, document.title, window.location.pathname);
  } else if (params.get('approval') === 'pending') {
    // 작업9-b: /auth/google now returns to whichever page started the login
    // (see routes/auth.js's state round-trip), so a pending account logging
    // in from here lands back here with this param instead of always on '/'.
    window.history.replaceState({}, document.title, window.location.pathname);
    showLoginScreen();
    showToast('관리자 승인 후 이용 가능합니다.');
    return;
  }

  const token = getToken();
  if (!token) { showLoginScreen(); return; }

  const payload = parseJwt(token);
  if (!payload || payload.exp * 1000 < Date.now()) {
    clearToken(); showLoginScreen(); return;
  }

  document.getElementById('login-overlay').style.display = 'none';

  currentUserName = payload.name || '';

  // Fetch fresh permissions and name from server (overrides stale JWT payload)
  try {
    const r = await fetch('/api/me', { headers: authHeaders() });
    if (r.ok) {
      userPerms = await r.json();
      if (userPerms.name) currentUserName = userPerms.name;
      if (userPerms.is_blocked) {
        clearToken(); showLoginScreen();
        showToast('계정이 차단되었습니다. 관리자에게 문의하세요.');
        return;
      }
    }
  } catch (e) { console.error('[initAuth] /api/me fetch/처리 실패:', e); }

  // 작업9-c: 위에서 로그인 오버레이는 이미 숨겼는데(1928행), 아래 중 하나가
  // 예외를 던지면 initAuth()가 여기서 조용히 멈춰버려서 showPage('search')까지
  // 못 가고 검색 화면도 못 뜨는 채로 방치됨 - 서버 로그로는 절대 안 보이는
  // 클라이언트 예외라 감지 자체가 안 됐을 수 있음. 방어적으로 감싸서 무슨
  // 일이 있어도 최소한 검색 화면까지는 가고, 콘솔에 원인을 남기게 함.
  try {
    await loadWordbookFromDB();
    updateBadges();
    backfillShortMeanings();
    setupBackButtonBlock();
  } catch (e) {
    console.error('[initAuth] 로그인 후 초기화 중 예외 발생 (검색 화면은 계속 진행함):', e);
  }
  showPage('search');
}

function showLoginScreen() {
  document.getElementById('login-overlay').style.display = 'flex';
}

// ─── WORDBOOK DB API ──────────────────────────────────────────────────────────
async function loadWordbookFromDB() {
  try {
    const res = await fetch('/api/wordbook', { headers: authHeaders() });
    if (!res.ok) return;
    const rows = await res.json();
    wordbook = rows.map(r => ({ ...(r.data || {}), id: r.id, word: r.word, lang: r.lang, savedAt: new Date(r.created_at).getTime() }));
  } catch (e) { console.error('wordbook load error:', e); }
}

async function saveWordToDB(wordData) {
  try {
    const res = await fetch('/api/wordbook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ word: wordData.word, lang: wordData.lang || 'en', data: wordData })
    });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { console.error('wordbook save error:', e); return null; }
}

async function deleteWordFromDB(id) {
  try {
    await fetch('/api/wordbook/' + id, { method: 'DELETE', headers: authHeaders() });
  } catch (e) { console.error('wordbook delete error:', e); }
}

// ─── API CALL ─────────────────────────────────────────────────────────────────
function safeParseJSON(text) {
  try {
    return JSON.parse(text);
  } catch (e) {
    // 응답이 잘린 경우: 마지막 완전한 '}'까지 잘라서 재시도
    const start = text.indexOf('{');
    if (start === -1) throw new Error('응답이 잘렸습니다. 다시 시도해주세요.');
    let end = text.lastIndexOf('}');
    while (end > start) {
      try { return JSON.parse(text.slice(start, end + 1)); } catch (_) {}
      end = text.lastIndexOf('}', end - 1);
    }
    throw new Error('응답이 잘렸습니다. 다시 시도해주세요.');
  }
}

async function callAI(prompt) {
  const response = await fetch('/api/ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt })
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error);
  if (!response.ok) throw new Error('서버 오류가 발생했습니다.');
  return (data.result ?? '').replace(/```json|```/g, '').trim();
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function save() {

// ─── LANGUAGE DETECTION ───────────────────────────────────────────────────────
function detectLang(text) {
  if (/[가-힣]/.test(text)) return 'ko';
  if (/[ぁ-んァ-ン]/.test(text)) return 'ja';
  if (/[一-鿿]/.test(text)) return 'zh';
  return 'en';
}

function updateLangIndicator(lang) {
  var tags = {
    'en': ['lang-tag-en2', 'active-en'],
    'ko': ['lang-tag-ko2', 'active-ko'],
    'ja': ['lang-tag-ja2', 'active-ja'],
    'zh': ['lang-tag-zh2', 'active-zh']
  };
  Object.keys(tags).forEach(function(l) {
    var el = document.getElementById(tags[l][0]);
    if (el) el.className = 'lang-tag' + (l === lang ? ' ' + tags[l][1] : '');
  });
}

// 작업27: 언어 탭을 클릭해서 명시적으로 고른 언어. detectLang()의 자동감지
// 결과보다 우선하되, 검색창에 새로 입력하면(아래 input 리스너) 바로
// 풀리는 임시 오버라이드 - "다음 타이핑 전까지만 유지".
let _langOverride = null;

function selectLang(lang) {
  _langOverride = lang;
  updateLangIndicator(lang);
  document.getElementById('search-input').focus();
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
document.getElementById('search-input').addEventListener('input', e => {
  _langOverride = null;
  updateLangIndicator(detectLang(e.target.value));
  document.getElementById('search-clear-btn').style.display = e.target.value ? 'block' : 'none';
});
// 작업15: 검색 결과를 본 뒤 다시 검색창을 탭/클릭하면 이전 검색어가
// 전체 선택되어, 바로 타이핑만 해도 새 단어로 덮어써지게 함.
document.getElementById('search-input').addEventListener('focus', e => {
  e.target.select();
});

function clearSearchInput() {
  const input = document.getElementById('search-input');
  input.value = '';
  document.getElementById('search-clear-btn').style.display = 'none';
  _langOverride = null;
  updateLangIndicator('en');
  input.focus();
}

async function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  if (!query) return;

  // 작업13: 검색 실행 시 입력 블록을 헤더 바로 아래로 애니메이션 이동
  document.querySelector('.search-page-wrap').classList.add('searched');

  // 모바일 키보드 내리기
  document.getElementById('search-input').blur();


  // 작업27: 언어 탭으로 명시적으로 고른 언어가 있으면 그걸 우선 사용
  const lang = _langOverride || detectLang(query);
  updateLangIndicator(lang);

  const resultDiv = document.getElementById('search-result');
  const btn = document.getElementById('search-btn');

  // 단어장 캐시 확인
  const cached = wordbook.find(w => {
    if (lang === 'en') return w.word.toLowerCase() === query.toLowerCase() && w.lang === 'en';
    return w.word === query && w.lang === lang;
  });
  if (cached) {
    if (lang === 'en') renderResultEN(cached, true);
    else if (lang === 'ko') renderResultKO(cached, true);
    else if (lang === 'ja') renderResultJA(cached, true);
    else if (lang === 'zh') renderResultZH(cached, true);
    return;
  }

  resultDiv.innerHTML = `<div class="loading"><div class="spinner"></div>검색 중...</div>`;
  btn.disabled = true;

  try {
    if (lang === 'en') {
      await searchEnglish(query, resultDiv);
    } else if (lang === 'ko') {
      await searchKorean(query, resultDiv);
    } else if (lang === 'ja') {
      await searchJapanese(query, resultDiv);
    } else if (lang === 'zh') {
      await searchChinese(query, resultDiv);
    }
  } catch (err) {
    resultDiv.innerHTML = `<div class="result-card" style="color:var(--wrong)">오류가 발생했습니다. 다시 시도해주세요.<br><small>${err.message}</small></div>`;
  }

  btn.disabled = false;
}

// ─── ENGLISH SEARCH ───────────────────────────────────────────────────────────
// 작업14: Claude 호출 1회로 전체(사전적의미+파생어+활용뉘앙스+예문+유의어+
// Collocation+번역)를 다 받던 것을 2단계로 분리 - 1차는 사전적 의미/발음/
// 기본 파생어만 빠르게 받아 즉시 렌더링하고, 나머지는 2차 호출로 이어받아
// 채워넣는다. 최종 result 객체의 필드 구성은 기존과 동일하게 맞춰서
// 단어장/퀴즈 등 다른 기능이 이 함수 밖에서 받는 데이터 형태는 그대로다.
function buildDictQuickPrompt(query) {
  return `You are an English dictionary assistant for a Korean learner. This is STEP 1 of 2 - respond with ONLY the core lookup info as fast as possible. A second call right after this one will fill in usage notes, examples, synonyms and collocations, so do NOT include those here.
For the English word or phrase: "${query}"

First identify the base/dictionary form (e.g., running→run, better→good, mice→mouse, meandering→meander). If it's already the base form, set word equal to search_query.

Respond ONLY in valid JSON with this exact structure:
{
  "word": "base form dictionary entry",
  "search_query": "${query}",
  "pronunciation": "/prəˌnʌnsiˈeɪʃən/",
  "short_gloss": "가장 흔한 의미 하나를 1~3단어의 아주 간결한 한국어 대응어로 (예: apple→사과, severe→심각한, run→달리다)",
  "meanings": [
    {
      "pos": "noun",
      "domain": "일반",
      "definition": "암기하기 쉬운 짧은 한국어 대응어/구 2~4개를 쉼표로 나열 (완전한 문장 금지, 예: '심한, 극심한' - '정도가 심하거나 극단적인' 같은 문장형 금지)"
    }
  ],
  "derivatives": [
    {
      "word": "derived word",
      "pos": "명사",
      "meaning": "의미 한국어"
    }
  ]
}

Rules:
- meanings: 2-4 entries, ordered by REAL-WORLD USAGE FREQUENCY (most common sense first). If the word has senses across different parts of speech, include them all in this SAME array (still frequency-ordered overall) - each entry's "pos" marks which part of speech it belongs to.
- definition: 짧고 기억하기 쉬운 한국어 단어/구 위주로 작성. "정도가 심하거나 극단적인" 같은 완전한 문장 대신 "심한, 극심한"처럼 짧은 대응어 2~4개를 쉼표로 나열. 의미가 안 통할 정도로 지나치게 줄이지는 말고, 단어 하나로 어색하면 2~3단어 짧은 구 형태(예: "정도가 심한")는 허용. 이 필드는 short_gloss(퀴즈용으로 쓰이는 가장 흔한 의미 1개, 1~3단어)와는 별개이니 통합하거나 혼동하지 말 것 - definition은 그 의미 하나를 설명하는 여러 개의 간결한 한국어 대응어 나열이다.
- derivatives: up to 5 related word forms.
- domain: one of 일반, 비즈니스, 의학, 법률, 기술, 구어체, 문학, 격식체, 비격식.
- short_gloss must be a single short word/phrase (1-3 words), never a full clause or sentence - it is used as a multiple-choice quiz answer, not a definition.
- Do NOT include etymology or word-origin information anywhere in the response.
- Do NOT include usage_note, example, translation, similar, or collocations fields - those belong to the follow-up call only.
YOUR ENTIRE RESPONSE MUST BE A SINGLE VALID JSON OBJECT ONLY.`;
}

function buildDictDetailPrompt(result) {
  const meaningsList = result.meanings.map((m, i) => `${i + 1}. [${m.pos || ''}] ${m.definition || ''}`).join('\n');
  return `You are continuing an English dictionary lookup for a Korean learner. This is STEP 2 of 2 - the word and its core definitions were already determined in a previous call; add only the remaining detail sections below.

Word: "${result.word}" (original search query: "${result.search_query || result.word}")
Existing meanings, in this exact order - your "meanings" array below MUST have exactly this many entries, in this same order, one per index (do not add, remove, or reorder):
${meaningsList}

Respond ONLY in valid JSON with this exact structure:
{
  "meanings": [
    {
      "usage_note": "이 의미가 실제로 자주 쓰이는 상황·장소·톤을 1~2문장 한국어로 (뉘앙스 보조 설명)",
      "example": "English example sentence.",
      "translation": "예문의 한국어 해석"
    }
  ],
  "similar": [
    {
      "word": "similar English word",
      "core_meaning": "이 유사어의 핵심 의미 5단어 이내 한국어",
      "diff": "검색 단어와의 뉘앙스 차이 1~2문장 한국어로"
    }
  ],
  "collocations": [
    {
      "phrase": "실제 자주 쓰이는 단어 조합 (예: severe pain)",
      "meaning": "그 조합 표현의 한국어 뜻 (예: 심한 통증)"
    }
  ]
}

Rules:
- meanings: exactly ${result.meanings.length} entries, matching the numbered list above 1:1 in the same order - entry i in your response is additional detail for meaning i above.
- similar: 3-4 near-synonyms with a one-line nuance difference from "${result.word}".
- collocations: 2-3 real, commonly-used word combinations (adjective+noun, verb+noun, etc.) built around "${result.word}", each with its Korean meaning.
- Do NOT include etymology or word-origin information anywhere in the response.
YOUR ENTIRE RESPONSE MUST BE A SINGLE VALID JSON OBJECT ONLY.`;
}

async function searchEnglish(query, resultDiv) {
  const t0 = performance.now();
  const quickText = await callAI(buildDictQuickPrompt(query));
  const result = safeParseJSON(quickText);
  result.lang = 'en';
  currentResult = result;
  console.log(`[dict-2stage] 1차(사전적 의미) 응답: ${Math.round(performance.now() - t0)}ms`);

  // 1차만으로도 화면에 바로 보여줄 수 있는 최소 필드(short_meaning)는 지금
  // 채워두고, usage_note가 필요한 nuance는 2차 완료 후 다시 계산한다.
  result.short_meaning = result.short_gloss || result.meanings?.[0]?.definition || '';
  result.nuance = '';

  // 활용/예문/유의어/Collocation은 아직 없음 - 스켈레톤과 함께 1차 결과부터 즉시 렌더링
  renderResultEN(result, false, { loadingDetail: true });

  try {
    const detailText = await callAI(buildDictDetailPrompt(result));
    const detail = safeParseJSON(detailText);
    (result.meanings || []).forEach((m, i) => {
      Object.assign(m, detail.meanings?.[i] || {});
    });
    result.similar = detail.similar || [];
    result.collocations = detail.collocations || [];
    result.nuance = result.meanings?.map(m => m.usage_note).filter(Boolean).join(' ') || '';
    console.log(`[dict-2stage] 2차(나머지 상세) 응답: ${Math.round(performance.now() - t0)}ms (전체 경과)`);
  } catch (e) {
    console.error('[dict-2stage] 2차 호출 실패 - 1차 결과만 유지:', e);
  }

  // 사용자가 1차만 보고 페이지를 떠날 수도 있으니, 2차까지 끝난 완전한
  // 형태가 됐을 때 저장한다(완성 전 저장 시 단어장/퀴즈에 반쪽짜리
  // usage_note/example 없는 데이터가 남는 것을 방지).
  const alreadySaved = wordbook.some(w => w.word.toLowerCase() === result.word.toLowerCase() && w.lang === 'en');
  if (!alreadySaved) {
    const saved = await saveWordToDB(result);
    if (saved) wordbook.push({ ...result, id: saved.id, savedAt: Date.now() });
    updateBadges();
  }
  renderResultEN(result, alreadySaved);
}

function renderResultEN(result, alreadySaved, opts = {}) {
  const loadingDetail = !!opts.loadingDetail;
  // 작업14: 2차 호출이 아직 안 끝난 섹션 자리에 표시할 스켈레톤 -
  // 홈 대시보드에서 쓰던 것과 같은 .skel-block 셰이머 재사용
  const detailSkeleton = (lines = 2) =>
    Array.from({ length: lines }).map(() =>
      `<div class="skel-block" style="height:36px;margin-bottom:8px"></div>`
    ).join('');

  const posMap = {
    'noun': '명사', 'verb': '동사', 'adjective': '형용사', 'adverb': '부사',
    'preposition': '전치사', 'conjunction': '접속사', 'pronoun': '대명사',
    'interjection': '감탄사', 'phrase': '구', 'idiom': '관용어'
  };

  // 작업38: meanings[]를 한 번만 순회해 뜻 번호당 정의→뉘앙스→예문/번역을
  // 한 .meaning-set 블록에 묶는다(기존엔 이 세 가지를 각각 따로 순회해서
  // "사전적 의미"/"활용·뉘앙스"/"예문" 3개 섹션에 같은 번호가 반복 출력됐음)
  let definitionsHtml = '';
  let examplesHtml = '';
  if (result.meanings && result.meanings.length > 0) {
    definitionsHtml = result.meanings.map((m, i) => {
      const note = m.usage_note || m.nuance;
      const noteHtml = note ? `<div class="meaning-nuance">${note}</div>` : '';
      const exampleHtml = m.example
        ? `<div class="usage-example">${m.example}</div>${m.translation ? `<div class="usage-translation">→ ${m.translation}</div>` : ''}`
        : (loadingDetail ? detailSkeleton(1) : '');
      return `
      <div class="meaning-set">
        <div class="meaning-header">
          <span class="meaning-num">${i + 1}</span>
          <span class="result-pos-tag">${posMap[(m.pos || '').toLowerCase()] || m.pos || ''}</span>
          ${m.domain ? `<span class="meaning-domain">${m.domain}</span>` : ''}
        </div>
        <div class="meaning-core">${m.definition || m.core_meaning || ''}</div>
        ${noteHtml}
        ${exampleHtml}
      </div>`;
    }).join('');
  } else {
    // fallback for old saved words (usages[] + nuance) - predates the meanings[] schema
    const posHtml = (result.pos || []).map(p =>
      `<span class="result-pos-tag">${posMap[p.toLowerCase()] || p}</span>`
    ).join('');
    definitionsHtml = (posHtml ? `<div class="result-pos-list">${posHtml}</div>` : '') +
      `<div class="result-section-body" style="margin-bottom:12px">${result.nuance || ''}</div>`;
    examplesHtml = (result.usages || []).map(u => `
        <div class="usage-item">
          <div class="usage-context">${u.context}</div>
          <div class="usage-desc">${u.description}</div>
          <div class="usage-example">${u.example}</div>
          ${u.translation ? `<div class="usage-translation">→ ${u.translation}</div>` : ''}
        </div>
      `).join('');
  }

  const similarHtml = (result.similar || []).map(s => `
    <div class="similar-item">
      <div style="min-width:100px">
        <div class="similar-word" onclick="searchWord('${s.word.replace(/'/g, "\\'")}', 'en')">${s.word}</div>
        ${s.core_meaning ? `<div class="similar-core">${s.core_meaning}</div>` : ''}
      </div>
      <div class="similar-diff">${s.diff}</div>
    </div>
  `).join('');

  const collocationsHtml = (result.collocations || []).map(c => `
    <div class="derivative-item">
      <span class="derivative-word">${c.phrase}</span>
      <span class="derivative-meaning">${c.meaning}</span>
    </div>
  `).join('');

  // 2차가 아직 안 끝난 상태에서 각 섹션이 비어있으면(정상 - 1차 응답에는
  // 애초에 이 필드들이 없음) 빈 채로 숨기는 대신 스켈레톤을 보여줌.
  // (뜻풀이당 예문 스켈레톤은 위 definitionsHtml 조립 시 블록 안에서 처리됨 -
  // examplesSection은 이제 옛 스키마 fallback(usages[])의 "예문" 섹션에만 쓰임.
  // loadingDetail=true는 항상 새 meanings[] 스키마 쪽에서만 오고 그 경로에서는
  // examplesHtml을 채우지 않으므로, 여기엔 별도 스켈레톤 분기를 두지 않는다 -
  // 안 그러면 2차 로딩 중에 뜻 블록별 스켈레톤과 별개로 빈 "예문" 섹션에도
  // 스켈레톤이 중복으로 떴었음)
  const examplesSection = examplesHtml;
  const similarSection = similarHtml || (loadingDetail ? detailSkeleton(3) : '');
  const collocationsSection = collocationsHtml || (loadingDetail ? detailSkeleton(2) : '');

  const searchQuery = result.search_query || '';
  const baseFormHint = searchQuery && searchQuery.toLowerCase() !== result.word.toLowerCase()
    ? `<div class="base-form-hint">${searchQuery} → ${result.word}</div>`
    : '';

  document.getElementById('search-result').innerHTML = `
    <div class="result-card">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="result-word">${result.word}</div>
        <button class="tts-btn" data-tts="${encodeURIComponent(result.word)}" data-lang="en" onclick="playTTSFromBtn(this)" title="발음 듣기"><span class="tts-icon">🔊</span><span class="tts-label">발음</span></button>
      </div>
      ${baseFormHint}
      ${result.pronunciation ? `<div class="result-pronunciation">${result.pronunciation}</div>` : ''}

      <div class="result-section">
        <div class="result-section-title">사전적 의미</div>
        ${definitionsHtml}
      </div>

      ${result.derivatives && result.derivatives.length > 0 ? `
      <div class="result-section">
        <div class="result-section-title">파생어</div>
        <div class="derivatives-list">
          ${result.derivatives.map(d => `
            <div class="derivative-item">
              <span class="derivative-word">${d.word}</span>
              ${d.pos ? `<span class="derivative-pos">${d.pos}</span>` : ''}
              <span class="derivative-meaning">${d.meaning}</span>
            </div>
          `).join('')}
        </div>
      </div>` : ''}

      ${examplesSection ? `
      <div class="result-section">
        <div class="result-section-title">예문</div>
        ${examplesSection}
      </div>` : ''}

      <div class="result-section">
        <div class="result-section-title">유의어</div>
        <div class="similar-list">${similarSection}</div>
      </div>

      ${collocationsSection ? `
      <div class="result-section">
        <div class="result-section-title">Collocation</div>
        <div class="derivatives-list">${collocationsSection}</div>
      </div>` : ''}

      <div class="extra-trans-wrap">
        <div class="extra-trans-label">추가 번역</div>
        <div class="extra-trans-btns">
          <button class="extra-trans-btn ja" onclick="loadExtraTrans('${result.word}', 'ja', this)">일본어로 보기</button>
          <button class="extra-trans-btn zh" onclick="loadExtraTrans('${result.word}', 'zh', this)">중국어로 보기</button>
        </div>
        <div class="extra-trans-result" id="extra-trans-result"></div>
      </div>
    </div>
  `;
  prefetchTTS(result.word, 'en');
}

}

Return up to 5 derivatives and 2-3 entries. YOUR ENTIRE RESPONSE MUST BE A SINGLE VALID JSON OBJECT ONLY.`;

  const text = await callAI(prompt);

// ─── WORDBOOK ─────────────────────────────────────────────────────────────────
let currentWordbookTab = 'en';
let wordbookSortOrder = 'abc';
let selectedWords = new Set();
let currentUserName = '';
// 'none' | 'listen' | 'delete' - mutually exclusive by construction (a single
// variable, not two flags), matching 작업5's "동시에 둘 다 켜질 수 없음" requirement.
let wordbookMode = 'none';
let _currentPage = 'search';

function switchWordbookTab(tab) {
  currentWordbookTab = tab;
  selectedWords.clear();
  wordbookMode = 'none';
  ['en','ko','ja','zh'].forEach(function(l) {
    var el = document.getElementById('wb-tab-' + l);
    if (el) el.className = 'wb-side-btn' + (tab === l ? ' active-' + l : '');
  });
  updateModeButtons();
  updateSelectRow();
  renderWordbook();
}

// 한국어 초성 추출 (쌍자음 → 기본자음 통합)
const KO_CHOSUNG_ALL = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const KO_CHOSUNG_MAP = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
const KO_ORDER = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function getChosung(char) {
  const code = char.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return char.toUpperCase();
  const idx = Math.floor((code - 0xAC00) / 588);
  const ch = KO_CHOSUNG_ALL[idx];
  return KO_CHOSUNG_MAP[ch] || ch;
}

function renderWordbook() {
  var el = document.getElementById('wordbook-list');
  var tab = currentWordbookTab;
  var filtered = wordbook.filter(function(w) { return (w.lang || 'en') === tab; });

  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">아직 저장된 단어가 없어요.<br>검색하면 자동으로 저장됩니다.</div></div>';
    updateSelectedBtn();
    return;
  }

  var locale = {en:'en', ko:'ko', ja:'ja', zh:'zh'}[tab] || 'en';
  var chipClass = tab !== 'en' ? tab : '';
  var headerClass = tab !== 'en' ? tab : '';

  function makeChip(w) {
    var key = w.word + '|' + tab;
    var isSelected = selectedWords.has(key);
    var safeWord = w.word.split("'").join("\\'");
    var inSelectMode = wordbookMode !== 'none';
    var clickAction = inSelectMode
      ? 'toggleWordSelect(\'' + safeWord + '\',\'' + tab + '\')'
      : 'searchFromWordbook(\'' + safeWord + '\', \'' + tab + '\')';
    return '<div class="word-chip ' + chipClass + (isSelected ? ' selected' : '') + '" onclick="' + clickAction + '">' +
      '<span style="display:flex;align-items:center;gap:8px">' +
      (inSelectMode ? '<span class="word-chip-check">✓</span>' : '') +
      '<span class="word-chip-text">' + w.word + '</span>' +
      '</span>' +
      '<span class="word-chip-del" onclick="event.stopPropagation();deleteWord(\'' + safeWord + '\', \'' + tab + '\')">×</span>' +
      '</div>';
  }

  var html;
  if (wordbookSortOrder === 'recent') {
    var recentSorted = filtered.slice().sort(function(a, b) { return (b.savedAt || 0) - (a.savedAt || 0); });
    html = '<div class="alpha-section"><div class="alpha-words">' + recentSorted.map(makeChip).join('') + '</div></div>';
  } else {
    var sorted = filtered.slice().sort(function(a, b) { return a.word.localeCompare(b.word, locale); });
    var groups = {};
    sorted.forEach(function(w) {
      var letter = tab === 'ko' ? getChosung(w.word[0]) : w.word[0].toUpperCase();
      if (!groups[letter]) groups[letter] = [];
      groups[letter].push(w);
    });
    var sortedKeys;
    if (tab === 'ko') {
      sortedKeys = Object.keys(groups).sort(function(a, b) {
        var ai = KO_ORDER.indexOf(a), bi = KO_ORDER.indexOf(b);
        if (ai === -1 && bi === -1) return a.localeCompare(b, 'ko');
        if (ai === -1) return 1; if (bi === -1) return -1;
        return ai - bi;
      });
    } else {
      sortedKeys = Object.keys(groups).sort();
    }
    html = sortedKeys.map(function(letter) {
      return '<div class="alpha-section">' +
        '<div class="alpha-header ' + headerClass + '">' + letter + '</div>' +
        '<div class="alpha-words">' + groups[letter].map(makeChip).join('') + '</div>' +
        '</div>';
    }).join('');
  }

  el.innerHTML = '<div class="word-grid">' + html + '</div>';
  updateSelectedBtn();
}
function setWordbookSort(sort) {
  wordbookSortOrder = sort;
  document.querySelectorAll('.wb-sort-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.sort === sort);
  });
  renderWordbook();
}

function toggleWordSelect(word, lang) {
  const key = word + '|' + lang;
  if (selectedWords.has(key)) selectedWords.delete(key);
  else selectedWords.add(key);
  renderWordbook();
}

function toggleSelectAll() {
  const tab = currentWordbookTab;
  const tabWords = wordbook.filter(w => (w.lang || 'en') === tab);
  const allSelected = tabWords.length > 0 && tabWords.every(w => selectedWords.has(w.word + '|' + tab));
  if (allSelected) tabWords.forEach(w => selectedWords.delete(w.word + '|' + tab));
  else tabWords.forEach(w => selectedWords.add(w.word + '|' + tab));
  renderWordbook();
}

function updateSelectedBtn() {
  const tab = currentWordbookTab;
  const tabWords = wordbook.filter(w => (w.lang || 'en') === tab);
  const count = tabWords.filter(w => selectedWords.has(w.word + '|' + tab)).length;
  const btn = document.getElementById('wb-selected-action-btn');
  if (btn) {
    const label = wordbookMode === 'delete' ? '🗑 선택 삭제'
      : wordbookMode === 'quiz' ? '🎯 퀴즈'
      : '🎧 재생';
    btn.textContent = `${label} (${count}개)`;
    btn.disabled = count === 0;
    btn.style.opacity = count === 0 ? '0.4' : '1';
  }
  const selectAllBtn = document.getElementById('wb-select-all-btn');
  if (selectAllBtn) {
    const allSelected = tabWords.length > 0 && tabWords.every(w => selectedWords.has(w.word + '|' + tab));
    selectAllBtn.textContent = allSelected ? '전체해제' : '전체선택';
  }
}

function podcastStartSelected() {
  const tab = currentWordbookTab;
  const words = wordbook.filter(w => (w.lang || 'en') === tab && selectedWords.has(w.word + '|' + tab));
  if (words.length === 0) { showToast('선택된 단어가 없습니다.'); return; }
  // Exit select mode before starting playback
  setWordbookMode('none');
  if (ttsCurrentAudio) {
    ttsCurrentAudio.pause(); ttsCurrentAudio = null;
    document.querySelectorAll('.tts-btn').forEach(b => { setTtsIcon(b, '🔊'); b.classList.remove('playing'); });
  }
  const locale = { en: 'en', ko: 'ko', ja: 'ja', zh: 'zh' }[tab] || 'en';
  podcastPlaylist = words.slice().sort((a, b) => a.word.localeCompare(b.word, locale));
  podcastIndex = 0; podcastAudio = null; podcastSegments = []; podcastSegIdx = 0;
  podcastPlaying = true;
  _updatePodcastBtn(); _showPodcastPlayer(); _podcastPlayFromCurrentWord();
}

// 작업16: 선택 퀴즈 - 현재 퀴즈 엔진(startQuiz/renderQuizQuestion)은
// 영어 단어장(en2ko/ko2en/similar) 전제로 만들어져 있어서, 다른 언어
// 탭에서 선택한 단어로 돌리면 오답 보기 풀(enWords 기준)이나 nuance
// 필드 등이 안 맞아 깨질 수 있음 - 영어 탭에서만 허용.
function startSelectedWordsQuiz() {
  const tab = currentWordbookTab;
  if (tab !== 'en') {
    showToast('선택 퀴즈는 영어 단어장에서만 가능합니다.');
    return;
  }
  const words = wordbook.filter(w => (w.lang || 'en') === tab && selectedWords.has(w.word + '|' + tab));
  if (words.length === 0) { showToast('선택된 단어가 없습니다.'); return; }
  setWordbookMode('none'); // 선택 모드 종료 (words는 이미 위에서 확보해뒀으니 clear돼도 무방)
  isWrongQuiz = false;
  selectedQuizType = 'en2ko';
  // showPage('quiz')는 항상 renderQuizStart(false)를 먼저 호출해 유형
  // 선택 화면을 그리지만, 같은 동기 실행 흐름 안에서 바로 이어지는
  // startQuiz(words)가 그 내용을 즉시 덮어써서 실제로는 화면에 그려질
  // 틈 없이 퀴즈 문제 화면으로 바로 넘어감 - renderQuizStart나 showPage를
  // 건드리지 않고 "유형 선택 화면 건너뛰기"를 구현하는 방법.
  showPage('quiz');
  startQuiz(words);
}

async function confirmDeleteSelectedWords() {
  const tab = currentWordbookTab;
  const words = wordbook.filter(w => (w.lang || 'en') === tab && selectedWords.has(w.word + '|' + tab));
  if (words.length === 0) { showToast('선택된 단어가 없습니다.'); return; }
  if (!confirm(`선택한 ${words.length}개 단어를 삭제하시겠습니까?`)) return;
  await Promise.all(words.filter(w => w.id).map(w => deleteWordFromDB(w.id)));
  const keys = new Set(words.map(w => w.word + '|' + tab));
  wordbook = wordbook.filter(w => !keys.has(w.word + '|' + (w.lang || 'en')));
  setWordbookMode('none');
  updateBadges();
  showToast(`${words.length}개 단어를 삭제했습니다.`);
}

// 선택 듣기/삭제 모드는 상호 배타적: 같은 모드를 다시 누르면 해제(취소),
// 다른 모드를 누르면 자동으로 이전 모드가 꺼지고 새 모드로 전환됨
// (wordbookMode가 단일 값이라 둘이 동시에 켜지는 상태 자체가 존재하지 않음).
function setWordbookMode(mode) {
  wordbookMode = (wordbookMode === mode) ? 'none' : mode;
  selectedWords.clear();
  updateModeButtons();
  updateSelectRow();
  renderWordbook();
}

function updateModeButtons() {
  const listenBtn = document.getElementById('wb-mode-listen-btn');
  const quizBtn = document.getElementById('wb-mode-quiz-btn');
  const deleteBtn = document.getElementById('wb-mode-delete-btn');
  if (listenBtn) listenBtn.classList.toggle('active', wordbookMode === 'listen');
  if (quizBtn) quizBtn.classList.toggle('active', wordbookMode === 'quiz');
  if (deleteBtn) deleteBtn.classList.toggle('active', wordbookMode === 'delete');
}

function updateSelectRow() {
  const row = document.getElementById('wb-select-row');
  if (!row) return;
  if (wordbookMode === 'listen') {
    row.innerHTML =

function searchFromWordbook(word, lang) {

  updateLangIndicator(lang);
  showPage('search');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  doSearch();
