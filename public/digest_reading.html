<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한입 독서</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 작업13: 전 화면 공통 상단 헤더(로고+로그인상태) -->
<link rel="stylesheet" href="/css/common/appHeader.css">
<style>
  :root {
    --primary: #1D9E75;
    --primary-light: #E1F5EE;
    --primary-dark: #085041;
    --bg: #FAFAF9;
    --card: #FFFFFF;
    --text1: #1a1a1a;
    --text2: #6b7280;
    --border: rgba(0,0,0,0.08);
    --error: #E24B4A;
    --error-light: #FCEBEB;
    --tab-height: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text1);
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 999; gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text2); font-size: 14px; }

  /* ── Views ── */
  .view { display: none; min-height: 100dvh; padding-bottom: var(--tab-height); }
  .view.active { display: block; }

  /* ── Top Bar ── */
  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .top-bar h1 { font-size: 18px; font-weight: 700; color: var(--text1); flex: 1; }
  .top-bar .subtitle { font-size: 12px; color: var(--text2); font-weight: 400; }
  .back-btn {
    background: none; border: none; cursor: pointer;
    padding: 6px; border-radius: 8px;
    color: var(--text2); display: flex; align-items: center;
    transition: background 0.15s;
  }
  .back-btn:hover { background: var(--primary-light); color: var(--primary); }
  .back-btn svg { width: 20px; height: 20px; }

  /* ── Tab Bar ── */
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    height: var(--tab-height);
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex; z-index: 200;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px; background: none; border: none; cursor: pointer;
    color: var(--text2); font-size: 11px; font-weight: 500;
    transition: color 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  /* 작업83: 활성 탭은 색 + 굵기 + 밑줄 (색 단독 구분 금지 원칙) - digest_reading.html과
     literature_compass.html의 탭바가 같은 복사본이라 두 파일 동일하게 유지 */
  .tab-btn.active {
    color: var(--primary); font-weight: 700;
    text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px;
  }
  .tab-btn svg { width: 22px; height: 22px; }
  .tab-btn.disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── View 1: List (작업81: 3D 캐러셀) ──
     home-wheel ThreeDWheelPicker의 "중심 기준 offset" 방식을 가로(rotateY)로
     옮긴 것. 겹침 순서는 z-index가 아니라 translateZ로만 정함(iOS
     preserve-3d에서 z-index가 무시되는 문제 회피). overflow:hidden은
     바깥 래퍼(.carousel-clip)에만 - perspective/preserve-3d 요소에 걸면
     3D가 납작해짐. */
  /* 작업86: 목록 화면에는 [캐러셀 / ‹ › 이동 / 범례]만 남기고, 헤더와 하단
     탭바 사이 남는 높이 안에서 세로 가운데 정렬.
     --hdr-h는 공통 헤더 실제 높이(JS에서 측정) - 이걸 빼야 목록 화면이
     딱 한 화면 높이가 되어 불필요한 스크롤이 안 생김 */
  #view-list.active {
    display: flex; flex-direction: column;
    min-height: calc(100dvh - var(--hdr-h, 0px));
  }
  #view-list .content {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px;
  }

  #list-carousel {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 8px 0;
  }
  .carousel-clip {
    overflow: hidden;
    margin: 0 -16px;
  }
  .carousel-viewport {
    position: relative;
    outline: none;
    user-select: none; -webkit-user-select: none;
    touch-action: pan-y;
    perspective-origin: 50% 50%;
  }
  .carousel-viewport:focus-visible { box-shadow: inset 0 0 0 2px var(--metis-coral, #e2583b); }
  .carousel-track {
    position: absolute; inset: 0;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
  }
  /* 화이트 카드 + 두께감: 블러 없는 그림자만 겹쳐서(가벼움) 위쪽 장르 띠,
     아래쪽 베벨, 1px 외곽선, 카드 아래로 비치는 옆면(두께)을 표현.
     블러 드롭섀도는 성능상 중앙 카드에만 추가 (작업81 원칙 유지) */
  .carousel-card {
    --card-edge:
      inset 0 4px 0 var(--genre-ink),
      inset 0 -2px 0 rgba(0,0,0,0.035),
      0 0 0 1px rgba(0,0,0,0.07),
      0 4px 0 -1px #E6E2DA,
      0 5px 0 -1px rgba(0,0,0,0.07);
    position: absolute; top: 50%; left: 50%;
    display: flex; flex-direction: column;
    padding: 20px 18px 16px;
    border-radius: 14px;
    color: #1A1A1E;
    background: linear-gradient(180deg, #FFFFFF 0%, #FBFAF8 100%);
    box-shadow: var(--card-edge);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    cursor: pointer;
    overflow: hidden;
  }
  .carousel-track.moving .carousel-card { will-change: transform, opacity; }
  .carousel-card.is-center {
    box-shadow: var(--card-edge), 0 16px 30px -8px rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.05);
  }
  /* 작업85: [태그 줄] / [제목·작가·one_line] 배치 (작업86에서 "읽기 →" 제거).
     가운데 블록은 제목 margin-top:auto + one_line margin-bottom:auto로
     남는 높이를 위아래 반씩 나눠 가져 세로 가운데에 옴 (전에는 margin-top:auto
     하나뿐이라 빈 공간이 전부 위로 몰려 내용이 카드 아래쪽에 붙었음).
     짧은 카드에서 공간이 없을 땐 태그 줄 아래 12px만 남음 */
  .carousel-card-meta {
    margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: 0.08em; color: #6B7280;
  }
  .carousel-card-meta .g { color: var(--genre-ink); font-weight: 700; }
  .carousel-card-title {
    margin-top: auto;
    font-size: var(--title-size, 22px); font-weight: 500; line-height: 1.3;
    word-break: keep-all;
  }
  /* 선택 상태는 색만이 아니라 굵기 + 밑줄로도 구분 */
  .carousel-card.is-center .carousel-card-title {
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--genre-ink);
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
  }
  .carousel-card-author { margin-top: 6px; font-size: 13px; color: #6B7280; }
  /* 인용 강조 규칙: 왼쪽 2px 세로선 (장르 색) */
  .carousel-card-line {
    flex-shrink: 0;
    margin-top: 14px; margin-bottom: auto; padding-left: 10px;
    border-left: 2px solid var(--genre-ink);
    font-size: 13px; line-height: 1.6; color: #374151;
    display: -webkit-box; -webkit-line-clamp: var(--line-clamp, 4); -webkit-box-orient: vertical;
    overflow: hidden; word-break: keep-all;
  }
  .carousel-card-done { color: #1A1A1E; font-weight: 700; letter-spacing: 0.02em; }
  .carousel-nav {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin-top: 8px;
    font-size: 12px; color: var(--text2);
  }
  .carousel-nav-count { font-family: 'Inter', sans-serif; min-width: 56px; text-align: center; }
  .carousel-nav-btn {
    position: relative;
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .carousel-nav-btn svg { width: 16px; height: 16px; }
  /* 작업83: 보이는 크기(34px)는 그대로, ::after로 터치 영역만 44×44
     (admin.html 토글과 같은 방식) */
  /* inset은 테두리(1px) 안쪽 기준이라 32 + 6×2 = 44 */
  .carousel-nav-btn::after { content: ''; position: absolute; inset: -6px; }
  .carousel-legend {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 14px;
    margin-top: 12px; font-size: 12px; color: var(--text2);
  }
  .carousel-legend span::before {
    content: ''; display: inline-block; width: 8px; height: 8px;
    margin-right: 5px; background: var(--genre-ink); vertical-align: 0;
  }

  /* 높이 600 미만(1세대 SE 320×568 등): 세로 여백 압축 */
  @media (max-height: 599px) {
    #view-list .content { padding-top: 10px; padding-bottom: 10px; }
    #list-carousel { padding: 0; }
    .carousel-card.is-center {
      box-shadow: var(--card-edge), 0 8px 16px -6px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.05);
    }
    .carousel-nav { margin-top: 0; }
  }

  /* ── View 2: Digest ── */
  /* 작업88: 미니멀 원칙 정리 - 초록 계열 제거, 앱 코랄로 통일.
     코랄 #e2583b는 흰 배경 대비 3.7:1이라 선·아이콘(비텍스트 3:1 기준)에만 쓰고,
     코랄 글자는 짙은 코랄 #b8442e(5.4:1, 틴트 배경 위 4.8:1)로.
     제목은 사전 상세(표제어)처럼 본문 큰 제목 하나만 - 상단 바에선 뺌 */
  #view-digest {
    --coral: var(--metis-coral, #e2583b);
    --coral-ink: #b8442e;
    --coral-tint: #FDF0EC;
  }
  #view-digest .content { padding: 20px 16px 100px; }
  #view-digest .back-btn:hover { background: var(--coral-tint); color: var(--coral-ink); }

  .digest-work-header {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .digest-work-title { font-size: 24px; font-weight: 700; color: var(--text1); margin-bottom: 6px; line-height: 1.3; }
  .digest-work-meta { font-size: 14px; color: var(--text2); font-family: 'Inter', sans-serif; }

  .digest-section {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  /* 섹션 라벨: 색 강조 없이 짙은 회색, 본문(400)과는 굵기(700)로 구분 */
  .digest-section-label {
    font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    color: #3A3A40; margin-bottom: 10px;
  }
  /* 인용 강조 규칙: 배경 박스 없이 왼쪽 2px 코랄 세로선만 */
  .digest-one-line {
    border-left: 2px solid var(--coral);
    padding: 2px 0 2px 12px;
    font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--text1);
  }
  .digest-summary {
    font-size: 14px; line-height: 1.8; color: var(--text1);
  }
  .key-scene-list { display: flex; flex-direction: column; gap: 12px; }
  .key-scene-item { display: flex; gap: 8px; align-items: baseline; }
  /* 원형 숫자 배지 대신 굵은 숫자 + 점 (사전 .meaning-num과 같은 기준) */
  .scene-num {
    flex-shrink: 0; min-width: 16px;
    font-size: 14px; font-weight: 800; font-family: 'Inter', sans-serif;
    color: var(--text1);
  }
  .scene-text { font-size: 14px; line-height: 1.7; color: var(--text1); flex: 1; }

  /* 주제·정서: 알약 배지 대신 텍스트 - 주제는 굵게, 정서는 쉼표로 이어서 */
  .digest-theme { font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--text1); }
  .digest-emotion { margin-top: 6px; font-size: 14px; line-height: 1.6; color: #4B5563; }

  /* 연결 작품: 회색 박스 대신 1px 구분선으로 나눈 줄, 화살표·관계는 코랄 */
  .related-list { display: flex; flex-direction: column; }
  /* 작업88-a: div onclick → 실제 <button>. 버튼 기본 모양(배경·테두리·가운데
     정렬·폰트)만 걷어내고 기존 줄 스타일 그대로 */
  .related-item {
    display: flex; align-items: flex-start; gap: 10px;
    width: 100%; margin: 0;
    padding: 12px 4px;
    background: none; border: none; border-top: 1px solid var(--border);
    font: inherit; color: inherit; text-align: left;
    cursor: pointer; transition: background 0.15s;
  }
  .related-item:focus-visible { outline: 2px solid var(--coral); outline-offset: -2px; }
  .related-item:first-child { border-top: none; padding-top: 4px; }
  .related-item:hover { background: var(--coral-tint); }
  .related-item svg { width: 14px; height: 14px; color: var(--coral); flex-shrink: 0; margin-top: 3px; }
  /* 버튼 안에는 phrasing 요소만 둘 수 있어 span을 block으로 */
  .related-info { flex: 1; }
  .related-info > span { display: block; }
  .related-title { font-size: 14px; font-weight: 700; color: var(--text1); }
  .related-author { font-size: 12px; color: var(--text2); }
  .related-relation { font-size: 12px; color: var(--coral-ink); font-weight: 600; margin-top: 2px; }

  /* 작업91: 전문 모드 - 시 원문 (연 = 문단, 줄 = 한 줄) */
  .poem { font-size: 16px; line-height: 1.9; color: var(--text1); word-break: keep-all; }
  .poem-stanza + .poem-stanza { margin-top: 1.2em; }
  .poem-line {
    display: block;
    white-space: pre-wrap;              /* 줄 앞 공백(들여쓰기) 보존 */
    padding-left: 1em; text-indent: -1em; /* 화면에서 접힌 줄은 내어쓰기 */
  }
  .poem-source { margin-top: 16px; font-size: 12px; color: var(--text2); }

  /* Conquest toggle */
  .conquest-bar {
    position: fixed; bottom: var(--tab-height); left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    padding: 10px 16px;
    background: var(--card);
    border-top: 1px solid var(--border);
    z-index: 150;
  }
  .conquest-btn {
    width: 100%; padding: 14px;
    border-radius: 14px; border: 2px solid var(--border);
    background: var(--bg); cursor: pointer;
    font-size: 15px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--text2); transition: all 0.2s;
  }
  .conquest-btn.conquered {
    background: var(--coral-tint); border-color: var(--coral);
    color: var(--coral-ink);
  }
  .conquest-btn svg { width: 18px; height: 18px; }

  /* ── View 3: Quiz ── */
  #view-quiz .content { padding: 20px 16px; }

  .quiz-progress-bar-wrap {
    height: 6px; background: var(--primary-light);
    border-radius: 3px; margin-bottom: 20px; overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%; background: var(--primary);
    border-radius: 3px; transition: width 0.3s ease;
  }
  .quiz-round-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--primary); margin-bottom: 6px;
  }
  .quiz-question-counter { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
  .quiz-card {
    background: var(--card); border-radius: 16px;
    border: 1px solid var(--border); padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .quiz-question {
    font-size: 16px; font-weight: 600; line-height: 1.6;
    margin-bottom: 20px; color: var(--text1);
  }
  .mcq-options { display: flex; flex-direction: column; gap: 10px; }
  .mcq-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 12px; cursor: pointer; transition: all 0.15s;
  }
  .mcq-option:hover:not(.answered) { border-color: var(--primary); background: var(--primary-light); }
  .mcq-option.correct { background: var(--primary-light); border-color: var(--primary); }
  .mcq-option.wrong { background: var(--error-light); border-color: var(--error); }
  .mcq-option.correct-hint { background: var(--primary-light); border-color: var(--primary); }
  .mcq-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; color: var(--text2);
    transition: all 0.15s;
  }
  .mcq-option.correct .mcq-num { background: var(--primary); color: #fff; }
  .mcq-option.wrong .mcq-num { background: var(--error); color: #fff; }
  .mcq-option.correct-hint .mcq-num { background: var(--primary); color: #fff; }
  .mcq-text { font-size: 14px; color: var(--text1); }

  .ox-buttons { display: flex; gap: 12px; margin-top: 4px; }
  .ox-btn {
    flex: 1; height: 80px;
    border-radius: 14px; border: 2px solid var(--border);
    background: var(--bg); cursor: pointer;
    font-size: 32px; font-weight: 700;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .ox-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
  .ox-btn.correct { background: var(--primary-light); border-color: var(--primary); }
  .ox-btn.wrong { background: var(--error-light); border-color: var(--error); }
  .ox-btn:disabled { cursor: default; }
  .ox-feedback {
    margin-top: 12px; padding: 10px 14px;
    border-radius: 10px; font-size: 13px; font-weight: 500; display: none;
  }
  .ox-feedback.show { display: block; }
  .ox-feedback.correct-fb { background: var(--primary-light); color: var(--primary-dark); }
  .ox-feedback.wrong-fb { background: var(--error-light); color: var(--error); }

  .quiz-next-btn {
    margin-top: 20px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 12px;
    padding: 14px; width: 100%;
    font-size: 15px; font-weight: 700; cursor: pointer;
    display: none; font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s;
  }
  .quiz-next-btn.visible { display: block; }
  .quiz-next-btn:hover { background: var(--primary-dark); }

  /* ── View 4: Result ── */
  #view-result .content { padding: 24px 16px; }
  .result-score-wrap {
    text-align: center; margin-bottom: 28px;
    padding: 28px; background: var(--card);
    border-radius: 20px; border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .result-emoji { font-size: 48px; margin-bottom: 12px; }
  .result-score { font-size: 42px; font-weight: 700; color: var(--primary); font-family: 'Inter', sans-serif; }
  .result-score span { font-size: 20px; color: var(--text2); }
  .result-msg { font-size: 16px; font-weight: 600; color: var(--text1); margin-top: 8px; }
  .result-submsg { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .result-section-label { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 12px; letter-spacing: 0.03em; }
  .result-wrong-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .result-wrong-item {
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--border); padding: 12px 14px;
  }
  .result-wrong-q { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  .result-wrong-a { font-size: 14px; font-weight: 600; color: var(--primary); }
  .result-wrong-a::before { content: '정답: '; color: var(--text2); font-weight: 400; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .result-btn {
    border-radius: 14px; padding: 15px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    border: none; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .result-btn-primary { background: var(--primary); color: #fff; }
  .result-btn-primary:hover { background: var(--primary-dark); }
  .result-btn-secondary { background: var(--card); color: var(--text1); border: 1.5px solid var(--border); }
  .result-btn-secondary:hover { background: var(--bg); }

  /* ── Misc ── */
  .error-msg { text-align: center; padding: 40px 24px; color: var(--error); font-size: 14px; }
</style>
</head>
<body>

<!-- 작업13: 전 화면 공통 상단 헤더 - 화면별 top-bar(뒤로가기/제목)는
     그대로 두고 그 위에 얹음(대체하지 않음) -->
<script src="/js/common/appHeader.js"></script>
<script>MetisAppHeader.inject();</script>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>작품 데이터 로딩 중…</p>
</div>

<!-- Access Denied -->
<div id="access-denied" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center">
  <div style="font-size:48px">🔒</div>
  <h2 style="font-size:20px;font-weight:700;color:var(--text1)">이용 권한이 없습니다</h2>
  <p style="font-size:14px;color:var(--text2);line-height:1.6">한입 독서 이용 권한이 없습니다.<br>관리자에게 문의해주세요.</p>
  <a href="/" style="display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;padding:14px 24px;border-radius:14px;font-size:15px;font-weight:700;text-decoration:none">METIS 홈으로</a>
</div>

<!-- View 1: List -->
<div id="view-list" class="view">

  </div>
</div>

<!-- View 2: Digest -->
<div id="view-digest" class="view">
  <div class="top-bar">
    <button class="back-btn" onclick="goList()" aria-label="목록으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
  </div>
  <div class="content" id="digest-content"></div>
  <div class="conquest-bar">
    <button class="conquest-btn" id="conquest-btn" onclick="toggleConquest()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>

      이 작품 정복 완료
    </button>

<div id="view-quiz" class="view">
  <div class="top-bar">
    <button class="back-btn" onclick="goList()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-list" onclick="goList()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    홈
  </button>
  <button class="tab-btn disabled" id="tab-quiz" onclick="startQuizFlow()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
    퀴즈
  </button>

<script>
// ── State ──
let DB = null;
let currentWorkId = null;
let quizState = { questions: [], currentIdx: 0, score: 0, wrong: [] };

// ── Utility ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isConquered(id) {
  return localStorage.getItem(`digest_conquest_${id}`) === 'true';
}

function setConquered(id, val) {
  localStorage.setItem(`digest_conquest_${id}`, val ? 'true' : 'false');
}

function getConqueredWorks() {
  if (!DB) return [];
  return DB.works.filter(w => isConquered(w.id));
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('tab-list').classList.toggle('active', id === 'view-list');
  document.getElementById('tab-quiz').classList.toggle('active', id === 'view-quiz' || id === 'view-result');
}

// ── History (작업95) ──
// 원래 showView는 화면만 바꾸고 기록을 전혀 남기지 않아서, 상세/퀴즈 화면에서
// 기기·브라우저 뒤로가기를 누르면 이 페이지 자체를 떠나 앱 홈(/)으로 나갔음.
// 사전 페이지(작업55/58)와 같은 방식으로: 목록(list)을 바닥 상태로 깔고,
// 상세·퀴즈·결과는 그 위에 한 칸만 쌓음(이미 한 칸 위면 replace). 그래서
// 어느 화면에서든 뒤로가기 한 번이면 목록, 목록에서 한 번 더면 페이지를 떠남.
// 연결 작품으로 옮겨 갈 때도 replace라서 앱 안 ‹ 버튼(goList)과 똑같이 목록으로 감.
let _navFromPop = false;
function navState(state) {
  if (_navFromPop) return; // popstate로 그리는 중에는 기록을 건드리지 않음
  const cur = history.state && history.state.view;
  if (!cur || cur === 'list') history.pushState(state, '');
  else history.replaceState(state, '');
}
function showListView() {
  renderList();
  showView('view-list');
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  if (!DB) return;
  const st = e.state || { view: 'list' };
  _navFromPop = true;
  try {
    // 방어적 확인(작업58 교훈): 없는 작품 id나 이미 사라진 퀴즈 상태로 돌아오면 목록으로
    if (st.view === 'digest' && DB.works.some(w => w.id === st.id)) {
      showDigest(st.id);
    } else if (st.view === 'quiz' && quizState.questions.length && quizState.currentIdx < quizState.questions.length) {
      showView('view-quiz');
      renderQuestion();
      window.scrollTo(0, 0);
    } else if (st.view === 'result' && quizState.questions.length) {
      showResult();
    } else {
      showListView();
    }
  } finally {
    _navFromPop = false;
  }
});

// ── Permission Check ──
async function checkPermission() {
  const token = localStorage.getItem('mydict_token');
  if (!token) return true;
  try {
    const r = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return true;
    const me = await r.json();
    return me.perm_digest_reading !== false;
  } catch { return true; }
}

// ── Data Load ──
async function loadDB() {
  const allowed = await checkPermission();
  if (!allowed) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('access-denied').style.display = 'flex';
    return;
  }
  try {
    const res = await fetch('digest_db.json');
    if (!res.ok) throw new Error('네트워크 오류');
    DB = await res.json();
    document.getElementById('loading').style.display = 'none';
    renderList();
    showView('view-list');
    // 작업95: 새로고침해도 history.state는 남음 - 상세였으면 그 작품을 다시 열고,
    // 퀴즈/결과처럼 메모리 상태가 사라진 화면이었으면 목록 상태로 바꿔 둠
    const st = history.state;
    if (st && st.view === 'digest' && DB.works.some(w => w.id === st.id)) {
      _navFromPop = true;
      try { showDigest(st.id); } finally { _navFromPop = false; }
    } else {
      history.replaceState({ view: 'list' }, '');
    }
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div class="error-msg">데이터를 불러오지 못했습니다.<br>${e.message}</div>`;
  }
}

// ── View 1: List (작업81: 3D 캐러셀) ──

// 장르 → 카드 색. 새 장르는 여기에 한 줄만 추가하면 됨.
// 작업82: 카드는 흰 배경. tone은 기획 기준색, ink는 흰 카드(#FBFAF8까지)
// 위 장르 라벨·띠·밑줄·인용선에 쓰는 색으로 AA 4.5:1을 넘기도록 같은 계열에서
// 어둡게 조정 (기준색 그대로는 흰 배경 대비 2.4~3.7:1).
const GENRE_COLORS = {
  '시':       { tone: '#C97452', ink: '#A65A3B' }, // 테라코타
  '소설':     { tone: '#6E88A6', ink: '#56708E' }, // 블루
  '시조':     { tone: '#C9A24A', ink: '#86682A' }, // 앰버/골드
  '고려가요': { tone: '#8A9A6E', ink: '#5F6E45' }, // 세이지/올리브
  '수필':     { tone: '#9A7CA8', ink: '#735683' }, // 뮤트 로즈/바이올렛
};
const GENRE_FALLBACK = { tone: '#8A8F99', ink: '#5E6470' }; // 매핑 없는 장르
const genreColor = g => GENRE_COLORS[g] || GENRE_FALLBACK;

// home-wheel ThreeDWheelPicker.jsx의 로직을 vanilla JS + 가로(rotateY)로 옮김.
// 스프링/스냅, 휠 1회=최대 1칸, 드래그 6px 초과 시 탭 아님, 관성,
// prefers-reduced-motion 대응은 원본 값 그대로.
const Carousel = (() => {
  const mod = (n, m) => ((n % m) + m) % m;
  const relativePos = (index, offset, n) => mod(index - offset + n / 2, n) - n / 2;
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const RENDER_RANGE = 4.5; // 중앙 기준 ±4.5장만 렌더, 나머지 display:none

  const reducedMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  // blur는 마우스 쓰는 데스크톱에서만 - 모바일 GPU에선 3D 요소 filter가 가장 무거움
  const finePointerMq = window.matchMedia ? window.matchMedia('(hover: hover) and (pointer: fine)') : null;

  let works = [], n = 0, cards = [];
  let viewport, track, countEl;
  let offset = 0, target = 0, vel = 0, raf = null;
  let dragging = false, wheelAcc = 0;
  let pointer = { lastX: 0, moved: 0 };
  let reduced = false, metrics = null;
  let lastCenter = -1;

  function computeMetrics() {
    const w = Math.min(window.innerWidth, 480);
    // 짧은 화면(주소창이 떠 있는 실기기 등)에서 버튼이 탭바 아래로 밀리지
    // 않도록 카드 높이를 남은 높이에 맞춰 줄임 (home-wheel 작업11과 같은 취지)
    // 작업82: 시작 버튼이 빠진 만큼 높이 여유를 카드에 돌려줌 (440 → 380)
    // 작업86: 제목 줄·정복 현황 줄도 빠져서 한 번 더 (380 → 280)
    const maxH = Math.max(200, window.innerHeight - 280);
    let cardW = clamp(Math.round(w * 0.62), 190, 270);
    let cardH = Math.round(cardW * 1.4);
    if (cardH > maxH) { cardH = maxH; cardW = Math.min(cardW, Math.round(cardH * 0.9)); }
    // 카드 중심 간 간격을 카드 폭보다 살짝 넓게 - 원통 접평면끼리 겹치면
    // 이웃 카드 모서리가 중앙 카드 앞으로 뚫고 나오므로 겹치지 않게 둠
    const spacing = cardW * 1.04;
    const baseStep = 24;
    // 작업81-a: 높이 600 미만(320×568 등)에선 카드 위아래 여백을 줄여 시작
    // 버튼이 탭바 위에 오게 함 (그림자도 CSS에서 같이 줄임). 667 이상은 그대로
    const vpad = window.innerHeight < 600 ? 40 : 64;
    return { cardW, cardH, spacing, baseStep, viewportH: cardH + vpad, drag: cardW * 0.45 };
  }

  function render() {
    const depth = reduced ? 0.35 : 1;
    const stepDeg = metrics.baseStep * depth;
    // 원본은 각도와 반지름을 함께 depth배 해서 reduced 모드에서 카드가 거의
    // 한 점에 겹침 → 가로에선 카드가 서로 뚫고 보이므로, 각도만 줄이고
    // 카드 간격(현 길이)은 유지하도록 반지름을 역산 (더 평평한 원통)
    const radius = metrics.spacing / (2 * Math.sin((stepDeg * Math.PI) / 360));
    const blurOn = !reduced && finePointerMq && finePointerMq.matches;
    track.style.transform = `translateZ(${-radius}px)`; // 중앙 카드가 z=0(원래 크기)에 오도록

    for (let i = 0; i < n; i++) {
      const el = cards[i];
      const rel = relativePos(i, offset, n);
      const abs = Math.abs(rel);
      if (abs > RENDER_RANGE) {
        if (el.style.display !== 'none') el.style.display = 'none';
        continue;
      }
      if (el.style.display === 'none') el.style.display = '';
      const scale = 1 - clamp(abs, 0, 3) * 0.06;
      el.style.transform = `rotateY(${rel * stepDeg}deg) translateZ(${radius}px) scale(${scale})`;
      el.style.opacity = clamp(1 - abs * 0.3, 0.06, 1);
      el.style.filter = blurOn ? `blur(${clamp(abs * 1.25 - 0.15, 0, 4.5)}px)` : '';
    }

    const center = mod(Math.round(offset), n);
    if (center !== lastCenter) {
      if (lastCenter >= 0) {
        cards[lastCenter].classList.remove('is-center');
        cards[lastCenter].setAttribute('aria-selected', 'false');
      }
      cards[center].classList.add('is-center');
      cards[center].setAttribute('aria-selected', 'true');
      lastCenter = center;
      currentWorkId = works[center].id;
      countEl.textContent = `${center + 1} / ${n}`;
    }
  }

  function setMoving(on) { track.classList.toggle('moving', on); }

  /* ---------- 애니메이션 루프 (스프링 + 스냅) ---------- */
  function tick() {
    raf = null;
    if (dragging) return;
    const stiffness = reduced ? 0.32 : 0.14;
    const damping = reduced ? 0.6 : 0.78;
    const d = target - offset;
    vel = (vel + d * stiffness) * damping;
    offset += vel;
    if (Math.abs(d) < 0.0008 && Math.abs(vel) < 0.0008) {
      offset = target;
      vel = 0;
      render();
      setMoving(false);
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }
  function kick() {
    setMoving(true);
    if (raf == null) raf = requestAnimationFrame(tick);
  }
  function goBy(delta) {
    target = Math.round(target) + delta;
    kick();
  }

  /* ---------- 입력 ---------- */
  function onWheel(e) {
    // 가로 휠(트랙패드)과 세로 휠 중 큰 쪽을 사용
    const dv = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    wheelAcc += dv;
    if (Math.abs(wheelAcc) >= 45) {
      goBy(Math.sign(wheelAcc)); // 1회 이벤트 = 최대 1칸
      wheelAcc = 0;
    }
  }

  // setPointerCapture를 쓰지 않는 이유는 ThreeDWheelPicker.jsx onPointerDown
  // 주석 참고 (캡처하면 Chromium이 click 대상을 뷰포트로 바꿔 카드 탭이 죽음)
  function onPointerDown(e) {
    if (e.button != null && e.button > 0) return;
    dragging = true;
    vel = 0;
    pointer = { lastX: e.clientX, moved: 0 };
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    setMoving(true);
  }
  function onPointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - pointer.lastX;
    pointer.lastX = e.clientX;
    pointer.moved += Math.abs(dx);
    const delta = -dx / metrics.drag; // 오른쪽으로 끌면 이전 작품
    offset += delta;
    vel = vel * 0.6 + delta * 0.4;
    render();
  }
  // touch-action: pan-y라서 세로 스크롤로 판정되면 브라우저가
  // pointercancel을 보냄 → 여기서 가장 가까운 카드로 스냅
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    const fling = reduced ? 0 : clamp(vel * 9, -4, 4);
    target = Math.round(offset + fling);
    kick();
  }

  function onCardClick(e) {
    const el = e.target.closest('.carousel-card');
    if (!el) return;
    if (pointer.moved > 6) return; // 드래그와 클릭 구분
    const rel = relativePos(Number(el.dataset.idx), offset, n);
    if (Math.abs(rel) < 0.5) { showDigest(works[Number(el.dataset.idx)].id); return; } // 작업82: 중앙 카드 탭 = 바로 읽기
    goBy(Math.round(rel));
    viewport.focus({ preventScroll: true });
  }

  function onKeyDown(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); goBy(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBy(-1); }
    else if (e.key === 'Home') {
      e.preventDefault();
      target = Math.round(target) + relativePos(0, target, n);
      kick();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      startCurrent();
    }
  }

  function startCurrent() {
    showDigest(works[mod(Math.round(target), n)].id);
  }

  function applyMetrics() {
    const hdr = document.querySelector('.metis-app-header');
    document.documentElement.style.setProperty('--hdr-h', (hdr ? hdr.offsetHeight : 0) + 'px');
    metrics = computeMetrics();
    viewport.style.height = metrics.viewportH + 'px';
    viewport.style.perspective = (reduced ? 2400 : 1100) + 'px';
    // 짧은 카드에선 one_line 줄 수를 줄임 - 안 그러면 카드 아래로 반쯤 잘린 줄이 보임
    viewport.style.setProperty('--line-clamp', metrics.cardH < 230 ? 2 : metrics.cardH < 280 ? 3 : 4);
    // 작업85: 짧은 카드에선 제목도 줄임 - 긴 제목(「빼앗긴 들에도 봄은 오는가」)이
    // 3줄로 접히면 one_line이 밀려 카드 밖으로 잘림
    viewport.style.setProperty('--title-size', metrics.cardH < 230 ? '17px' : metrics.cardH < 300 ? '20px' : '22px');
    cards.forEach(el => {
      el.style.width = metrics.cardW + 'px';
      el.style.height = metrics.cardH + 'px';
      el.style.marginLeft = -metrics.cardW / 2 + 'px';
      el.style.marginTop = -metrics.cardH / 2 + 'px';
    });
    fitCards();
    render();
  }

  // 작업85: 제목이 길어 여러 줄로 접히는 카드는 위 기본 줄 수로도 넘칠 수
  // 있어서(320px의 「빼앗긴 들에도 봄은 오는가」) 카드별로 넘치지 않을
  // 때까지 one_line 줄 수를 1까지 줄임. 크기 바뀔 때만 실행 - 숨겨진
  // 카드도 재야 하므로 잠깐 display를 풀고, 바로 뒤 render()가 되돌림
  function fitCards() {
    const base = Number(viewport.style.getPropertyValue('--line-clamp')) || 4;
    cards.forEach(el => {
      el.style.display = '';
      el.style.removeProperty('--line-clamp');
      for (let c = base; c > 1 && el.scrollHeight > el.clientHeight; ) {
        el.style.setProperty('--line-clamp', --c);
      }
    });
  }

  function buildCard(w, i) {
    const el = document.createElement('div');
    el.className = 'carousel-card';
    el.dataset.idx = i;
    el.setAttribute('role', 'option');
    el.setAttribute('aria-selected', 'false');
    el.style.setProperty('--genre-ink', genreColor(w.genre).ink);
    el.innerHTML = `
      <div class="carousel-card-meta"><span class="g"></span><span class="lv"></span></div>
      <div class="carousel-card-title"></div>
      <div class="carousel-card-author"></div>
      <div class="carousel-card-line"></div>`;
    el.querySelector('.g').textContent = w.genre || '';
    el.querySelector('.carousel-card-title').textContent = `「${w.title}」`;
    el.querySelector('.carousel-card-author').textContent = `${w.author} · ${w.year}`;
    el.querySelector('.carousel-card-line').textContent = w.one_line;
    return el;
  }

  // 정복 여부는 목록 복귀마다 바뀔 수 있으므로 카드를 다시 만들지 않고 표시만 갱신
  function refreshConquered() {
    works.forEach((w, i) => {
      const lv = cards[i].querySelector('.lv');
      lv.innerHTML = '';
      lv.append(w.level);
      if (isConquered(w.id)) {
        const done = document.createElement('span');
        done.className = 'carousel-card-done';
        done.textContent = ' · 정복 ✓';
        lv.append(done);
      }
    });
  }

  // 목록으로 돌아올 때 currentWorkId 카드를 애니메이션 없이 중앙에 둠
  function jumpTo(id) {
    const idx = works.findIndex(w => w.id === id);
    if (idx < 0) return;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    dragging = false;
    target = offset = Math.round(offset) + relativePos(idx, Math.round(offset), n);
    vel = 0;
    setMoving(false);
    render();
  }

  function mount(root, list) {
    works = list;
    n = list.length;
    const genres = [...new Set(list.map(w => w.genre))];
    root.innerHTML = `
      <div class="carousel-clip">
        <div class="carousel-viewport" role="listbox" tabindex="0" aria-label="작품 선택 - 좌우로 넘기고 Enter 또는 가운데 카드를 눌러 읽기">
          <div class="carousel-track"></div>
        </div>
      </div>
      <div class="carousel-nav">
        <button class="carousel-nav-btn" data-dir="-1" aria-label="이전 작품">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="carousel-nav-count"></span>
        <button class="carousel-nav-btn" data-dir="1" aria-label="다음 작품">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      ${genres.length > 1 ? '<div class="carousel-legend"></div>' : ''}`;

    viewport = root.querySelector('.carousel-viewport');
    track = root.querySelector('.carousel-track');
    countEl = root.querySelector('.carousel-nav-count');
    cards = list.map((w, i) => buildCard(w, i));
    cards.forEach(el => track.appendChild(el));

    // 장르가 2개 이상일 때만 범례 표시 (지금은 전부 "시"라 숨김)
    const legend = root.querySelector('.carousel-legend');
    if (legend) genres.forEach(g => {
      const s = document.createElement('span');
      s.style.setProperty('--genre-ink', genreColor(g).ink);
      s.textContent = g;
      legend.appendChild(s);
    });

    viewport.addEventListener('wheel', onWheel, { passive: false });
    viewport.addEventListener('pointerdown', onPointerDown);
    viewport.addEventListener('pointermove', onPointerMove);
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    window.addEventListener('pointerup', endDrag); // 뷰포트 밖에서 마우스를 놓은 경우
    viewport.addEventListener('keydown', onKeyDown);
    track.addEventListener('click', onCardClick);
    root.querySelectorAll('.carousel-nav-btn').forEach(b =>
      b.addEventListener('click', () => goBy(Number(b.dataset.dir))));

    reduced = !!(reducedMq && reducedMq.matches);
    const onReducedChange = () => { reduced = reducedMq.matches; applyMetrics(); };
    if (reducedMq) {
      if (reducedMq.addEventListener) reducedMq.addEventListener('change', onReducedChange);
      else if (reducedMq.addListener) reducedMq.addListener(onReducedChange); // iOS 13 이하 Safari
    }
    window.addEventListener('resize', applyMetrics);

    applyMetrics();
    // 웹폰트(Noto Sans KR)가 늦게 적용되면 글자 폭이 바뀌어 fitCards 결과가
    // 틀어지므로 폰트 로드 후 한 번 더 맞춤
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitCards(); render(); });
  }

  return { mount, jumpTo, refreshConquered, isMounted: () => !!viewport };
})();

function renderList() {
  updateTabQuizState();

  // 작업86: 캐러셀은 제목 가나다순 (왼쪽 → 오른쪽). DB.works 순서는 퀴즈 등이
  // 그대로 쓰므로 복사본만 정렬
  if (!Carousel.isMounted()) {
    const sorted = [...DB.works].sort((a, b) => a.title.localeCompare(b.title, 'ko'));
    Carousel.mount(document.getElementById('list-carousel'), sorted);
  }
  Carousel.refreshConquered();
  if (currentWorkId) Carousel.jumpTo(currentWorkId);
}

function updateTabQuizState() {
  const conquered = getConqueredWorks();
  const btn = document.getElementById('tab-quiz');
  if (conquered.length >= 1) {
    btn.classList.remove('disabled');
  } else {
    btn.classList.add('disabled');
  }
}

function goList() {
  // 작업95: 상세/퀴즈 위에 쌓아둔 한 칸이 있으면 history.back()으로 되돌려서
  // popstate가 목록을 그리게 함 - 여기서 직접 그리면 그 칸이 기록에 남아서
  // 목록에서 기기 뒤로가기를 눌렀을 때 방금 본 상세로 되돌아가 버림
  if (history.state && history.state.view && history.state.view !== 'list') {
    history.back();
    return;
  }
  showListView();
}

// ── View 2: Digest ──
function showDigest(workId) {
  const work = DB.works.find(w => w.id === workId);
  if (!work) return;
  currentWorkId = workId;
  // 작업88: 제목은 본문 .digest-work-title 하나만 (상단 바 제목 제거)

  const relatedHtml = work.related_works.length > 0
    ? `<div class="digest-section">
        <div class="digest-section-label">연결 작품</div>
        <div class="related-list">
          ${work.related_works.map(r => `
            <button type="button" class="related-item" onclick="showDigest('${r.id}')">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
              <span class="related-info">
                <span class="related-title">「${r.title}」</span>
                <span class="related-author">${r.author}</span>
                <span class="related-relation">${r.relation}</span>
              </span>
            </button>`).join('')}
        </div>
      </div>`
    : '';

  const headerHtml = `
    <div class="digest-work-header">
      <div class="digest-work-title">「${work.title}」</div>
      <div class="digest-work-meta">${work.author} · ${work.year} · ${work.genre}</div>
    </div>`;
  const oneLineHtml = `
    <div class="digest-section">
      <div class="digest-section-label">핵심 한 줄</div>
      <div class="digest-one-line">${work.one_line}</div>
    </div>`;
  const themeHtml = `
    <div class="digest-section">
      <div class="digest-section-label">주제 · 정서</div>
      <div class="digest-theme">${work.theme}</div>
      <div class="digest-emotion">${work.emotion.split(',').map(e => e.trim()).join(', ')}</div>
    </div>`;

  // 작업91: 전문 모드 / 요약 모드 분기. full_text는 사람이 원전에서 입력한
  // 퍼블릭도메인 작품에만 들어감 (scripts/validate_digest.js가 강제) - 화면에서도
  // rights.status를 한 번 더 확인해서 보호 중인 작품 원문은 절대 그리지 않음
  const fullMode = !!work.full_text && !!work.rights && work.rights.status === 'public_domain';

  document.getElementById('digest-content').innerHTML = fullMode
    ? `${headerHtml}
    ${renderFullText(work.full_text)}${oneLineHtml}${themeHtml}
    ${relatedHtml}`
    : `${headerHtml}${oneLineHtml}
    <div class="digest-section">
      <div class="digest-section-label">줄거리</div>
      <div class="digest-summary">${work.summary}</div>
    </div>
    <div class="digest-section">
      <div class="digest-section-label">핵심 장면</div>
      <div class="key-scene-list">
        ${work.key_scenes.map((s, i) => `
          <div class="key-scene-item">
            <div class="scene-num">${i + 1}.</div>
            <div class="scene-text">${s}</div>
          </div>`).join('')}
      </div>
    </div>${themeHtml}
    ${relatedHtml}`;

  updateConquestBtn();
  showView('view-digest');
  window.scrollTo(0, 0);
  navState({ view: 'digest', id: workId });
}

// 작업91: 시 전문 - full_text = { stanzas: [[줄, ...], ...], source: "출전", orthography }.
// 작업93: 출전 옆에 표기 방식(원문 표기/현대 표기)을 있는 그대로 덧붙임.
// 원문 글자는 데이터 그대로 이스케이프해서 넣고(줄 앞 공백 들여쓰기 보존),
// 연은 문단, 줄은 한 줄씩. 긴 줄이 화면에서 접히면 내어쓰기로 원래 줄바꿈과 구분
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function renderFullText(ft) {
  const stanzas = ft.stanzas.map(lines =>
    `<div class="poem-stanza">${lines.map(l => `<span class="poem-line">${escHtml(l)}</span>`).join('')}</div>`
  ).join('');
  return `
    <div class="digest-section">
      <div class="digest-section-label">전문</div>
      <div class="poem">${stanzas}</div>
      ${ft.source ? `<div class="poem-source">출전 · ${escHtml(ft.source)}${ft.orthography ? ` · ${escHtml(ft.orthography)}` : ''}</div>` : ''}
    </div>`;
}

function updateConquestBtn() {
  const btn = document.getElementById('conquest-btn');
  if (isConquered(currentWorkId)) {
    btn.classList.add('conquered');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline></svg> 정복 완료!`;
  } else {
    btn.classList.remove('conquered');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline></svg> 이 작품 정복 완료`;
  }
}

function toggleConquest() {
  const current = isConquered(currentWorkId);
  setConquered(currentWorkId, !current);
  updateConquestBtn();
  updateTabQuizState();
}

// ── View 3: Quiz ──
function startQuizFlow() {
  const conquered = getConqueredWorks();
  if (conquered.length === 0) {
    alert('먼저 작품을 읽어보세요! 정복한 작품이 있어야 퀴즈를 시작할 수 있어요.');
    return;
  }
  const questions = buildQuestions(conquered);
  if (questions.length === 0) {
    alert('퀴즈를 생성할 수 없습니다. 더 많은 작품을 정복해보세요!');
    return;
  }
  quizState = { questions, currentIdx: 0, score: 0, wrong: [] };
  showView('view-quiz');
  renderQuestion();
  window.scrollTo(0, 0);
  navState({ view: 'quiz' });
}

function buildQuestions(conquered) {
  const questions = [];
  const allWorks = DB.works;

  // Type 1: MCQ — 핵심 정서 (정복 4개 이상일 때)
  if (conquered.length >= 4) {
    const pool = shuffle(conquered).slice(0, 3);
    pool.forEach(w => {
      const wrong = shuffle(allWorks.filter(ow => ow.id !== w.id)).slice(0, 3).map(ow => ow.emotion);
      const options = shuffle([w.emotion, ...wrong]);
      questions.push({
        type: 'mcq',
        roundLabel: '핵심 정서 퀴즈',
        question: `「${w.title}」(${w.author})의 핵심 정서는 무엇인가요?`,
        options,
        answer: w.emotion
      });
    });
  }

  // Type 2: MCQ — 작품 맞추기 (정복 4개 이상일 때)
  if (conquered.length >= 4) {
    const pool = shuffle(conquered).slice(0, 3);
    pool.forEach(w => {
      const wrongTitles = shuffle(conquered.filter(ow => ow.id !== w.id)).slice(0, 3).map(ow => `「${ow.title}」`);
      const options = shuffle([`「${w.title}」`, ...wrongTitles]);
      questions.push({
        type: 'mcq',
        roundLabel: '작품 맞추기 퀴즈',
        question: `다음 설명에 해당하는 작품은?\n\n"${w.one_line}"`,
        options,
        answer: `「${w.title}」`
      });
    });
  }

  // Type 3: OX — 주제 퀴즈 (항상 가능)
  const oxPool = shuffle(conquered).slice(0, 3);
  oxPool.forEach(w => {
    const isTrue = Math.random() > 0.5;
    let statement, answer, explanation;
    if (isTrue) {
      statement = `「${w.title}」의 주제는 "${w.theme}"이다.`;
      answer = true;
      explanation = `맞습니다. 「${w.title}」의 주제는 "${w.theme}"입니다.`;
    } else {
      const other = allWorks.find(ow => ow.id !== w.id);
      if (other) {
        statement = `「${w.title}」의 주제는 "${other.theme}"이다.`;
        answer = false;
        explanation = `아닙니다. 「${w.title}」의 주제는 "${w.theme}"입니다.`;
      } else {
        statement = `「${w.title}」의 주제는 "${w.theme}"이다.`;
        answer = true;
        explanation = `맞습니다. 「${w.title}」의 주제는 "${w.theme}"입니다.`;
      }
    }
    questions.push({ type: 'ox', roundLabel: 'OX 퀴즈', statement, answer, explanation });
  });

  return shuffle(questions);
}

function renderQuestion() {
  const q = quizState.questions[quizState.currentIdx];
  if (!q) { showResult(); return; }

  const pct = (quizState.currentIdx / quizState.questions.length) * 100;
  const counter = `${quizState.currentIdx + 1} / ${quizState.questions.length}`;

  const container = document.getElementById('quiz-content');

  if (q.type === 'mcq') {
    container.innerHTML = `
      <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="qpb" style="width:${pct}%"></div></div>
      <div class="quiz-round-label">${q.roundLabel}</div>
      <div class="quiz-question-counter">${counter}</div>
      <div class="quiz-card">
        <div class="quiz-question" style="white-space:pre-line">${q.question}</div>
        <div class="mcq-options">
          ${q.options.map((opt, i) => `
            <button class="mcq-option" data-opt="${escAttr(opt)}" onclick="answerMCQ(this,'${escJs(opt)}')">
              <span class="mcq-num">${i + 1}</span>
              <span class="mcq-text">${opt}</span>
            </button>`).join('')}
        </div>
      </div>
      <button class="quiz-next-btn" id="quiz-next" onclick="nextQuestion()">다음</button>`;
  } else {
    container.innerHTML = `
      <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="qpb" style="width:${pct}%"></div></div>
      <div class="quiz-round-label">${q.roundLabel}</div>
      <div class="quiz-question-counter">${counter}</div>
      <div class="quiz-card">
        <div class="quiz-question">${q.statement}</div>
        <div class="ox-buttons">
          <button class="ox-btn" id="ox-o" onclick="answerOX(true)">O</button>
          <button class="ox-btn" id="ox-x" onclick="answerOX(false)">X</button>
        </div>
        <div class="ox-feedback" id="ox-fb"></div>
      </div>
      <button class="quiz-next-btn" id="quiz-next" onclick="nextQuestion()">다음</button>`;
  }
}

function escAttr(s) { return s.replace(/"/g, '&quot;'); }
function escJs(s) { return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function answerMCQ(el, chosen) {
  const q = quizState.questions[quizState.currentIdx];
  document.querySelectorAll('.mcq-option').forEach(opt => {
    opt.classList.add('answered'); opt.onclick = null;
  });
  const isCorrect = chosen === q.answer;
  if (isCorrect) {
    el.classList.add('correct'); quizState.score++;
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.mcq-option').forEach(opt => {
      if (opt.dataset.opt === q.answer) opt.classList.add('correct-hint');
    });
    quizState.wrong.push({ q: q.question || q.statement, a: q.answer });
  }
  document.getElementById('quiz-next').classList.add('visible');
}

function answerOX(answer) {
  const q = quizState.questions[quizState.currentIdx];
  const oBtn = document.getElementById('ox-o');
  const xBtn = document.getElementById('ox-x');
  const fb = document.getElementById('ox-fb');
  oBtn.disabled = true; xBtn.disabled = true;
  const isCorrect = answer === q.answer;
  if (isCorrect) {
    (answer ? oBtn : xBtn).classList.add('correct');
    quizState.score++;
    fb.textContent = '정답! ' + q.explanation;
    fb.className = 'ox-feedback show correct-fb';
  } else {
    (answer ? oBtn : xBtn).classList.add('wrong');
    (!answer ? oBtn : xBtn).classList.add('correct');
    fb.textContent = '오답. ' + q.explanation;
    fb.className = 'ox-feedback show wrong-fb';
    quizState.wrong.push({ q: q.statement, a: q.answer ? 'O (참)' : 'X (거짓)' });
  }
  document.getElementById('quiz-next').classList.add('visible');
}

function nextQuestion() {
  quizState.currentIdx++;
  renderQuestion();
  window.scrollTo(0, 0);
}

// ── View 4: Result ──
function showResult() {
  const total = quizState.questions.length;
  const score = quizState.score;
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;

  let emoji = '🎉', msg = '완벽해요!', sub = '모든 문항을 맞혔습니다.';
  if (pct < 100) { emoji = '👍'; msg = '잘했어요!'; sub = '조금만 더 연습하면 완벽합니다.'; }
  if (pct < 60) { emoji = '📚'; msg = '다시 도전해봐요!'; sub = '작품을 다시 읽고 퀴즈에 도전하세요.'; }

  let wrongHtml = '';
  if (quizState.wrong.length > 0) {
    wrongHtml = `
      <div class="result-section-label">틀린 문항</div>
      <div class="result-wrong-list">
        ${quizState.wrong.map(w => `
          <div class="result-wrong-item">
            <div class="result-wrong-q" style="white-space:pre-line">${w.q}</div>
            <div class="result-wrong-a">${w.a}</div>
          </div>`).join('')}
      </div>`;
  }

  document.getElementById('result-content').innerHTML = `
    <div class="result-score-wrap">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${score}<span> / ${total}</span></div>
      <div class="result-msg">${msg}</div>
      <div class="result-submsg">${sub}</div>
    </div>
    ${wrongHtml}
    <div class="result-actions">
      <button class="result-btn result-btn-primary" onclick="startQuizFlow()">다시 풀기</button>
      <button class="result-btn result-btn-secondary" onclick="goList()">목록으로</button>
    </div>`;

  showView('view-result');
  window.scrollTo(0, 0);
  navState({ view: 'result' });
}

// ── Boot ──
loadDB();
</script>
</body>
</html>
