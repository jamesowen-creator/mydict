<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한입 독서</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 작업13: 전 화면 공통 상단 헤더(로고+로그인상태) -->
<link rel="stylesheet" href="/css/common/appHeader.css">
<link rel="stylesheet" href="/css/common/tokens.css">
<link rel="stylesheet" href="/css/common/screenBar.css">
<style>
  :root {
    --primary: var(--color-accent, #e2583b);
    --primary-light: var(--color-surface-2, #eef1fb);
    --primary-dark: var(--color-accent-ink, #b8442e);
    /* 작업199: 정답 같은 의미색은 주제색(코랄)과 분리해 초록 유지 */
    --success-dark: var(--color-ok-ink, #085041);
    --bg: var(--color-bg, #f5f7ff);
    --card: var(--color-surface, #fff);
    --text1: var(--color-text, #1a1f3c);
    --text2: var(--color-text-sub, #4a5070);
    --border: var(--color-line, #dde2f5);
    --error: var(--color-danger, #dc2626);
    --error-dark: var(--color-danger, #dc2626);   /* 작업217-3: 오답 글자(흰 바탕 6.57:1). 프로젝트의 위험색(개념 학습 --danger, 다이얼로그 위험 버튼)과 같은 값 */
    --navbar-h: 78px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-size: var(--body-font-size);
    font-family: 'Noto Sans KR', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text1);
    min-height: 100dvh;
    max-width: var(--content-max);
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 999; gap: 16px;
  }
  /* 작업220: 화면 로딩 스피너 32px */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text2); font-size: 14px; }

  /* ── Views ── */
  .view { display: none; min-height: 100dvh; padding-bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom, 0px) + 16px); }
  .view.active { display: block; }

  /* 작업220: 상세 화면 상단 바 제목은 한 줄 말줄임(공용 screenBar.css의 두 줄 말줄임을 이 화면에서만 한 줄로) */
  .screen-bar-title.one-line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 작업199: 제목 줄은 공용 /css/common/screenBar.css(.screen-bar) */

  /* ── View 1: List (작업81: 3D 캐러셀) ──
     home-wheel ThreeDWheelPicker의 "중심 기준 offset" 방식을 가로(rotateY)로
     옮긴 것. 겹침 순서는 z-index가 아니라 translateZ로만 정함(iOS
     preserve-3d에서 z-index가 무시되는 문제 회피). overflow:hidden은
     바깥 래퍼(.carousel-clip)에만 - perspective/preserve-3d 요소에 걸면
     3D가 납작해짐. */
  /* 작업86: 목록 화면에는 [캐러셀 / ‹ › 이동 / 범례]만 남기고, 헤더와 하단
     탭바 사이 남는 높이 안에서 세로 가운데 정렬.
     --hdr-h는 공통 헤더 실제 높이(JS에서 측정) - 이걸 빼야 목록 화면이
     딱 한 화면 높이가 되어 불필요한 스크롤이 안 생김 */
  #view-list.active {
    display: flex; flex-direction: column;
    min-height: calc(100dvh - var(--hdr-h, 0px));
  }
  #view-list .content {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px;
  }

  #list-carousel {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 8px 0;
  }
  .carousel-clip {
    overflow: hidden;
    margin: 0 -16px;
  }
  .carousel-viewport {
    position: relative;
    outline: none;
    user-select: none; -webkit-user-select: none;
    touch-action: pan-y;
    perspective-origin: 50% 50%;
  }
  .carousel-viewport:focus-visible { box-shadow: inset 0 0 0 2px var(--metis-coral, #e2583b); }
  .carousel-track {
    position: absolute; inset: 0;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
  }
  /* 작업217-4: 캐러셀 카드는 테두리·둥근 모서리·그림자·그라데이션 없이 평면 흰 배경(눌림·스와이프 동작은 그대로). 장르는 글자색(--genre-ink)과 왼쪽 선으로 표시 */
  .carousel-card {
    position: absolute; top: 50%; left: 50%;
    display: flex; flex-direction: column;
    padding: 20px 18px 16px;
    border-radius: 0;
    color: var(--text1);
    background: var(--card);
    box-shadow: none;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    cursor: pointer;
    overflow: hidden;
  }
  .carousel-track.moving .carousel-card { will-change: transform, opacity; }
  /* 작업85: [태그 줄] / [제목·작가·one_line] 배치 (작업86에서 "읽기 →" 제거).
     가운데 블록은 제목 margin-top:auto + one_line margin-bottom:auto로
     남는 높이를 위아래 반씩 나눠 가져 세로 가운데에 옴 (전에는 margin-top:auto
     하나뿐이라 빈 공간이 전부 위로 몰려 내용이 카드 아래쪽에 붙었음).
     짧은 카드에서 공간이 없을 땐 태그 줄 아래 12px만 남음 */
  .carousel-card-meta {
    margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: 0.08em; color: var(--text2);
  }
  .carousel-card-meta .g { color: var(--genre-ink); font-weight: 700; }
  .carousel-card-title {
    margin-top: auto;
    font-size: var(--title-size, 22px); font-weight: 500; line-height: 1.3;
    word-break: keep-all;
  }
  /* 선택 상태는 색만이 아니라 굵기로도 구분 (작업100: 밑줄 장식 제거) */
  .carousel-card.is-center .carousel-card-title {
    font-weight: 700;
  }
  .carousel-card-author { margin-top: 6px; font-size: 13px; color: var(--text2); }
  /* 인용 강조 규칙: 왼쪽 2px 세로선 (장르 색) */
  .carousel-card-line {
    flex-shrink: 0;
    margin-top: 14px; margin-bottom: auto; padding-left: 10px;
    border-left: 2px solid var(--genre-ink);
    font-size: 13px; line-height: 1.6; color: var(--text1);
    display: -webkit-box; -webkit-line-clamp: var(--line-clamp, 4); -webkit-box-orient: vertical;
    overflow: hidden; word-break: keep-all;
  }
  .carousel-card-done { color: var(--text1); font-weight: 700; letter-spacing: 0.02em; }
  .carousel-nav {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin-top: 8px;
    font-size: 12px; color: var(--text2);
  }
  .carousel-nav-count { font-family: 'Inter', sans-serif; min-width: 56px; text-align: center; }
  /* 작업217-2: 이전·다음 화살표는 테두리·배경 없이 글자(‹ ›) 그대로, 터치 영역 44×44px. 글자색 --text1(흰 바탕 약 17:1), 호버 --primary-dark(5.38:1) */
  .carousel-nav-btn {
    position: relative;
    width: 44px; height: 44px; padding: 0 0 4px;
    border: none; border-radius: 0; background: transparent;
    color: var(--text1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans KR', sans-serif; font-size: 32px; line-height: 1; font-weight: 400;
  }
  .carousel-nav-btn:hover:not(:disabled) { color: var(--primary-dark); }
  .carousel-nav-btn:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; border-radius: 4px; }
  .carousel-legend {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 10px;
    margin-top: 12px; font-size: 12px; color: var(--text2);
  }
  /* 작업128: 범례 클릭 필터 - 터치 영역 최소 36px, 선택/흐림 상태 */
  .carousel-legend-item {
    display: inline-flex; align-items: center; min-height: 36px;
    padding: 0 6px; border-radius: 10px; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  .carousel-legend-item:hover { background: rgba(0,0,0,0.04); }
  .carousel-legend-item:focus-visible { outline: 2px solid var(--genre-ink); outline-offset: 1px; }
  .carousel-legend-item.dim { opacity: 0.4; }
  .carousel-legend-item.active { color: var(--text1); font-weight: 700; }
  .carousel-legend-item::before {
    content: ''; display: inline-block; width: 8px; height: 8px;
    margin-right: 5px; background: var(--genre-ink); vertical-align: 0;
    flex-shrink: 0;
  }

  /* 높이 600 미만(1세대 SE 320×568 등): 세로 여백 압축 */
  @media (max-height: 599px) {
    #view-list .content { padding-top: 10px; padding-bottom: 10px; }
    #list-carousel { padding: 0; }
    .carousel-nav { margin-top: 0; }
  }

  /* ── View 2: Digest ── */
  /* 작업88: 미니멀 원칙 정리 - 초록 계열 제거, 앱 코랄로 통일.
     코랄 #e2583b는 흰 배경 대비 3.7:1이라 선·아이콘(비텍스트 3:1 기준)에만 쓰고,
     코랄 글자는 짙은 코랄 #b8442e(5.4:1, 틴트 배경 위 4.8:1)로.
     제목은 사전 상세(표제어)처럼 본문 큰 제목 하나만 - 상단 바에선 뺌 */
  #view-digest {
    --coral: var(--metis-coral, #e2583b);
    --coral-ink: var(--color-accent-ink, #b8442e);
    --coral-tint: var(--color-surface-2, #eef1fb);
  }
  #view-digest .content { padding: 20px 16px 100px; }

  .digest-work-header {
    background: var(--card);
    border: none; border-radius: 0; box-shadow: none;
    padding: 20px 16px; margin: 0 -16px 14px;   /* 작업222: 글자 시작 x 16px */
  }
  .digest-work-title { font-size: 22px; font-weight: 700; color: var(--text1); margin-bottom: 6px; line-height: 1.3; }
  .digest-work-meta { font-size: 14px; color: var(--text2); font-family: 'Inter', sans-serif; }

  .digest-section {
    background: var(--card);
    border: none; border-radius: 0; box-shadow: none;
    padding: 18px 16px; margin: 0 -16px 14px;   /* 작업222: 글자 시작 x 16px */
  }
  /* 섹션 라벨: 색 강조 없이 짙은 회색, 본문(400)과는 굵기(700)로 구분 */
  /* 작업220: 섹션 제목 규격 — 12px / 700 / --primary-dark(5.38:1) / 아래 2px 코랄 선(장식) */
  .digest-section-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--primary-dark); padding-bottom: 4px; border-bottom: 2px solid var(--primary); margin-bottom: 10px;
  }
  /* 인용 강조 규칙: 배경 박스 없이 왼쪽 2px 코랄 세로선만 */
  .digest-one-line {
    border-left: 2px solid var(--coral);
    padding: 2px 0 2px 12px;
    font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--text1);
  }
  .digest-summary {
    font-size: 14px; line-height: 1.8; color: var(--text1);
  }
  .key-scene-list { display: flex; flex-direction: column; gap: 12px; }
  .key-scene-item { display: flex; gap: 8px; align-items: baseline; }
  /* 원형 숫자 배지 대신 굵은 숫자 + 점 (사전 .meaning-num과 같은 기준) */
  .scene-num {
    flex-shrink: 0; min-width: 16px;
    font-size: 14px; font-weight: 800; font-family: 'Inter', sans-serif;
    color: var(--text1);
  }
  .scene-text { font-size: 14px; line-height: 1.7; color: var(--text1); flex: 1; }

  /* 주제·정서: 알약 배지 대신 텍스트 - 주제는 굵게, 정서는 쉼표로 이어서 */
  .digest-theme { font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--text1); }
  .digest-emotion { margin-top: 6px; font-size: 14px; line-height: 1.6; color: var(--text2); }

  /* 연결 작품: 회색 박스 대신 1px 구분선으로 나눈 줄, 화살표·관계는 코랄 */
  .related-list { display: flex; flex-direction: column; }
  /* 작업88-a: div onclick → 실제 <button>. 버튼 기본 모양(배경·테두리·가운데
     정렬·폰트)만 걷어내고 기존 줄 스타일 그대로 */
  .related-item {
    display: flex; align-items: flex-start; gap: 10px;
    width: 100%; margin: 0;
    padding: 10px 0; min-height: var(--ctl-min-h);   /* 작업222: 문학 나침반과 같은 방식(아래선, padding 10px 0) */
    background: none; border: none; border-bottom: 1px solid var(--border);
    font: inherit; color: inherit; text-align: left;
    cursor: pointer; transition: background 0.15s;
  }
  .related-item:focus-visible { outline: 2px solid var(--coral); outline-offset: -2px; }
  .related-list .related-item:last-child { border-bottom: none; }
  .related-item:hover { background: var(--coral-tint); }
  .related-item svg { width: 14px; height: 14px; color: var(--coral); flex-shrink: 0; margin-top: 3px; }
  /* 버튼 안에는 phrasing 요소만 둘 수 있어 span을 block으로 */
  .related-info { flex: 1; }
  .related-info > span { display: block; }
  .related-title { font-size: 14px; font-weight: 700; color: var(--text1); }
  .related-author { font-size: 12px; color: var(--text2); }
  .related-relation { font-size: 12px; color: var(--coral-ink); font-weight: 600; margin-top: 2px; }

  /* 작업91: 전문 모드 - 시 원문 (연 = 문단, 줄 = 한 줄) */
  .poem { font-size: 16px; line-height: 1.9; color: var(--text1); word-break: keep-all; }
  .poem-stanza + .poem-stanza { margin-top: 1.2em; }
  .poem-line {
    display: block;
    white-space: pre-wrap;              /* 줄 앞 공백(들여쓰기) 보존 */
    padding-left: 1em; text-indent: -1em; /* 화면에서 접힌 줄은 내어쓰기 */
  }
  .poem-source { margin-top: 16px; font-size: 12px; color: var(--text2); }

  /* ── 하단 내비 (작업226-2): 음성 학습·언어 사전의 하단 내비(작업224-2)와 같은 구조·크기. 색은 이 화면의 팔레트 ── */
  .bottom-nav {
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: var(--shadow-nav, 0 -2px 8px rgba(226,88,59,0.07));
    padding: 0 16px max(8px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 0;
    position: fixed;
    left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--content-max);
    bottom: 0; z-index: 100;
    min-height: var(--navbar-h);
  }
  .bottom-nav-tabs { display: flex; flex: 1; gap: 0; }
  .bottom-nav-tab {
    display: flex; flex-direction: row; align-items: baseline; justify-content: center; gap: 2px;
    flex: 1 1 0; min-width: 0; min-height: var(--ctl-min-h);
    padding: 10px 0;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 500; line-height: normal;
    color: var(--text2); cursor: pointer; text-decoration: none;
    border-top: 3px solid transparent; border-bottom: none; border-left: none; border-right: none;
    background: none; white-space: nowrap;
  }
  .bottom-nav-tab:hover:not(.active) { color: var(--text1); }
  .bottom-nav-tab.active { color: var(--primary-dark); border-top-color: var(--primary); }
  .bottom-nav-tab:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  @media (max-width: 460px) { .bottom-nav-tab { font-size: 13px; } }

  /* 정복 탭: 정복한 항목을 묶음별 텍스트 행(구분선)으로 모아 보기 */
  #view-conq .content { padding: 20px 16px; }
  .conq-title { font-size: 22px; font-weight: 700; color: var(--text1); margin-bottom: 4px; }
  .conq-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  .conq-group { margin-bottom: 20px; }
  .conq-group-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--primary-dark); padding-bottom: 4px; border-bottom: 2px solid var(--primary); margin-bottom: 4px; }
  .conq-row {
    display: flex; align-items: center; width: 100%; min-height: var(--ctl-min-h); padding: 10px 0; text-align: left;
    background: none; border: none; border-bottom: 1px solid var(--border); border-radius: 0; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 500; color: var(--text1);
  }
  .conq-group .conq-row:last-child { border-bottom: none; }
  .conq-row:hover { text-decoration: underline; text-underline-offset: 3px; }
  .conq-row:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  .conq-empty { padding: 24px 0; font-size: 14px; color: var(--text2); }

  /* 작업226-2: 정복 토글은 상세 화면 제목 줄 오른쪽(.screen-bar-end)에 둔다(하단 고정 바 없음). 박스 없는 글자: 정복 전 "정복하기"(--text2, 흰 바탕 4.83:1), 정복 후 "✓ 정복함"(코랄 계열 --coral-ink #b8442e 5.38:1, 굵게). 높이 44px 이상, aria-pressed로 상태 전달 */
  .conquest-btn {
    flex: none; min-height: var(--ctl-min-h); padding: 10px 8px; margin-right: -8px;
    border: none; border-radius: 0; background: transparent; cursor: pointer;
    font-size: 15px; font-weight: 500; white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text2);
  }
  .conquest-btn.conquered { color: var(--coral-ink); font-weight: 700; }
  .conquest-btn:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; border-radius: 4px; }

  /* ── View 3: Quiz ── */
  #view-quiz .content { padding: 20px 16px; }

  .quiz-progress-bar-wrap {
    height: 6px; background: var(--primary-light);
    border-radius: 3px; margin-bottom: 20px; overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%; background: var(--primary);
    border-radius: 3px; transition: width 0.3s ease;
  }
  .quiz-round-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--primary-dark); margin-bottom: 6px;   /* 작업220: 코랄 글자 대비 4.5:1 이상(--primary 3.5:1 → --primary-dark 5.38:1) */
  }
  .quiz-question-counter { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
  .quiz-card {
    background: var(--card); border: none; border-radius: 0; box-shadow: none; padding: 20px 16px; margin: 0 -16px;   /* 작업222: 글자 시작 x 16px */
  }
  .quiz-question {
    font-size: 17px; font-weight: 700; line-height: 1.6;   /* 작업221: 질문 글자 17px / 700 / 주 글자색 */
    margin-bottom: 20px; color: var(--text1);
  }
  /* 작업217-3: 4지선다는 박스 없이 번호+본문 행(보기 사이는 아래 구분선). 상태는 색 하나로만 구분하지 않고 기호(○ ✕)와 굵기·밑줄을 함께 쓴다.
     정답 ○+--success-dark(흰 바탕 약 10:1), 내가 고른 오답 ✕+--error-dark(6.57:1), 고른 보기는 굵게+밑줄, 오답을 골라도 정답 보기에 ○가 보인다 */
  .mcq-options { display: flex; flex-direction: column; gap: 0; }
  .mcq-option {
    display: flex; align-items: flex-start; gap: 8px; width: 100%; min-height: var(--ctl-min-h); text-align: left;
    padding: 12px 0;
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    border-radius: 0; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text1);
  }
  .mcq-option:last-child { border-bottom: none; }
  .mcq-option::before { content: ''; flex: none; width: 16px; text-align: center; font-size: 14px; font-weight: 700; line-height: 1.5; }
  .mcq-option:hover:not(.answered) .mcq-text { text-decoration: underline; text-underline-offset: 3px; }
  .mcq-option:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  .mcq-option.answered { cursor: default; }
  .mcq-num { flex: none; width: 20px; text-align: right; font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--text2); }
  .mcq-option.correct, .mcq-option.correct-hint { color: var(--success-dark); }
  .mcq-option.wrong { color: var(--error-dark); }
  .mcq-option.correct::before, .mcq-option.correct-hint::before { content: '○'; }
  .mcq-option.wrong::before { content: '✕'; }
  .mcq-option.correct .mcq-num, .mcq-option.correct-hint .mcq-num, .mcq-option.wrong .mcq-num { color: inherit; font-weight: 700; }
  .mcq-option.correct .mcq-text, .mcq-option.correct-hint .mcq-text { color: var(--success-dark); font-weight: 700; }
  .mcq-option.wrong .mcq-text { color: var(--error-dark); font-weight: 700; }
  .mcq-option.correct .mcq-text, .mcq-option.wrong .mcq-text { text-decoration: underline; text-underline-offset: 3px; }
  .mcq-text { flex: 1; min-width: 0; font-size: 15px;   /* 작업221: 보기 글자 15px / 400 / 주 글자색 */ line-height: 1.5; color: var(--text1); word-break: keep-all; }

  .ox-buttons { display: flex; gap: 12px; margin-top: 4px; }
  /* 작업217-3: O/X는 박스 없이 큰 글자(32px 굵게)만, 눌림 영역은 높이 80px 그대로(투명). 고른 쪽은 밑줄, 채점 후 라벨 "○ 정답"(--success-dark) / "✕ 오답"(--error-dark) */
  .ox-btn {
    position: relative; flex: 1; height: 80px; padding: 0 0 14px;
    border: none; border-radius: 0; background: transparent; color: var(--text1); cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1;
    display: flex; align-items: center; justify-content: center;
  }
  /* 라벨은 절대 위치라 글자 밑줄이 번지지 않는다 */
  .ox-btn::after { content: ''; position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.4; }
  .ox-btn:hover:not(:disabled) { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .ox-btn:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  .ox-btn:disabled { cursor: default; }
  .ox-btn.picked { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .ox-btn.correct { color: var(--success-dark); }
  .ox-btn.correct::after { content: '○ 정답'; }
  .ox-btn.wrong { color: var(--error-dark); }
  .ox-btn.wrong::after { content: '✕ 오답'; }
  /* 작업217-3: 해설 줄은 색 바탕 없이 기호(○/✕)+글자색 */
  .ox-feedback { position: relative; margin-top: 12px; padding: 10px 0 10px 24px; font-size: 13px; font-weight: 500; line-height: 1.6; display: none; }   /* 작업222: 기호 자리 24px(.msg와 같은 방식) */
  .ox-feedback.show { display: block; }
  /* 작업221: 정오 한 줄(.fb-line)만 기호+초록/빨강, 해설은 주 글자색 */
  .ox-feedback.correct-fb, .ox-feedback.wrong-fb { color: var(--text1); }
  .ox-feedback.correct-fb::before { color: var(--success-dark); }
  .ox-feedback.wrong-fb::before { color: var(--error-dark); }
  .ox-feedback .fb-line { font-weight: 700; }
  .ox-feedback.correct-fb .fb-line { color: var(--success-dark); }
  .ox-feedback.wrong-fb .fb-line { color: var(--error-dark); }
  .ox-feedback::before { position: absolute; left: 2px; top: 10px; width: 16px; text-align: center; font-weight: 800; }
  .ox-feedback.correct-fb::before { content: '○'; }
  .ox-feedback.wrong-fb::before { content: '✕'; }

  .quiz-next-btn {
    min-height: var(--ctl-min-h); margin-top: 20px;
    background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e)); color: #fff;
    border: none; border-radius: var(--btn-radius);
    padding: 10px 20px; width: 100%;   /* 작업220: 주 버튼 규격 — 높이 최소 44px, 15px / 600, 좌우 padding 20px */
    font-size: 15px; font-weight: 600; cursor: pointer;
    display: none; font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s;
  }
  .quiz-next-btn.visible { display: block; }
  .quiz-next-btn:hover { background: var(--btn-primary-bg-hover, #9c3a27); }

  /* ── View 4: Result ── */
  #view-result .content { padding: 24px 16px; }
  /* 작업217-3: 점수는 박스·테두리·그림자 없이 큰 숫자 글자(아래 구분선만). 점수 글자색은 --primary(흰 바탕 3.53:1)가 아니라 --primary-dark(5.38:1) */
  .result-score-wrap {
    text-align: center; margin-bottom: 28px;
    padding: 12px 0 24px; background: transparent;
    border: none; border-radius: 0; box-shadow: none; border-bottom: 1px solid var(--border);
  }
  .result-score { font-size: 42px; font-weight: 700; color: var(--primary-dark); font-family: 'Inter', sans-serif; }
  .result-score span { font-size: 18px; color: var(--text2); }
  .result-msg { font-size: 16px; font-weight: 600; color: var(--text1); margin-top: 8px; }
  .result-submsg { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .result-section-label { font-size: 12px; font-weight: 700; color: var(--primary-dark); margin-bottom: 12px; letter-spacing: 0.03em; padding-bottom: 4px; border-bottom: 2px solid var(--primary); }
  .result-wrong-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  /* 작업217-3: 틀린 문항은 박스 없이 구분선 행. 정답 글자는 --success-dark(흰 바탕 약 10:1) */
  .result-wrong-item {
    background: transparent; border: none; border-radius: 0;
    border-bottom: 1px solid var(--border); padding: 12px 0;
  }
  .result-wrong-list .result-wrong-item:last-child { border-bottom: none; }
  .result-wrong-q { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  .result-wrong-a { font-size: 14px; font-weight: 600; color: var(--success-dark); }
  .result-wrong-a::before { content: '정답: '; color: var(--text2); font-weight: 400; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .result-btn {
    min-height: var(--ctl-min-h); border-radius: var(--btn-radius); padding: 10px 20px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .result-btn-primary { background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e)); color: #fff; }
  .result-btn-primary:hover { background: var(--btn-primary-bg-hover, #9c3a27); }
  /* 작업217-2: 보조 결과 버튼은 박스 없이 밑줄 텍스트(높이 44px = .result-btn min-height, 가로 44px 이상). 글자 --text2는 페이지 바탕(#FAFAF9) 위 4.63:1 */
  /* 작업220: 텍스트 버튼 규격 — 15px / 600, 보조색, padding 0 8px, 최소 44×44px, 밑줄 */
  .result-btn-secondary { background: transparent; color: var(--text2); border: none; padding: 0 8px; min-height: var(--ctl-min-h); min-width: var(--ctl-min-h); font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .result-btn-secondary:hover { background: transparent; color: var(--text1); }
  .result-btn-secondary:focus-visible { outline: 2px solid var(--text1); outline-offset: 2px; border-radius: 4px; }

  /* ── Misc ── */
  .error-msg { text-align: center; padding: 40px 24px; color: var(--error); font-size: 14px; }
</style>
</head>
<body>

<!-- 작업13: 전 화면 공통 상단 헤더 - 화면별 top-bar(뒤로가기/제목)는
     그대로 두고 그 위에 얹음(대체하지 않음) -->
<script src="/js/common/appHeader.js"></script>
<script>MetisAppHeader.inject();</script>
<script src="/js/common/dialog.js"></script>
<script>if (!window.metisConfirm) { window.metisConfirm = function (m) { return Promise.resolve(confirm(m)); }; window.metisAlert = function (m) { alert(m); return Promise.resolve(); }; }   // dialog.js를 못 불렀을 때 기본 대화상자로 대체</script>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>작품 데이터 로딩 중…</p>
</div>

<!-- Access Denied -->
<div id="access-denied" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center">
  <div style="font-size:48px">🔒</div>
  <h2 style="font-size:18px;font-weight:700;color:var(--text1)">이용 권한이 없습니다</h2>
  <p style="font-size:14px;color:var(--text2);line-height:1.6">한입 독서 이용 권한이 없습니다.<br>관리자에게 문의해주세요.</p>
  <a href="/" style="display:inline-flex;align-items:center;gap:8px;background:var(--btn-primary-bg, var(--primary));color:#fff;padding:14px 24px;border-radius:14px;font-size:15px;font-weight:700;text-decoration:none">METIS 홈으로</a>
</div>

<!-- View 1: List -->
<div id="view-list" class="view">
  <div class="content">
    <div id="list-carousel"></div>
  </div>
</div>

<!-- View 2: Digest -->
<div id="view-digest" class="view">
  <div class="screen-bar">
    <button class="screen-bar-back" onclick="goList()" aria-label="목록으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <h1 class="screen-bar-title one-line" id="digest-bar-title"></h1>
    <button class="conquest-btn screen-bar-end" id="conquest-btn" aria-pressed="false" onclick="toggleConquest()">정복하기</button>
  </div>
  <div class="content" id="digest-content"></div>
</div>

<!-- View 3: Quiz -->
<div id="view-quiz" class="view">
  <div class="screen-bar">
    <button class="screen-bar-back" onclick="goList()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <h1 class="screen-bar-title">독서 퀴즈</h1>
  </div>
  <div class="content" id="quiz-content"></div>
</div>

<!-- View 4: Result -->
<div id="view-result" class="view">
  <div class="screen-bar"><h1 class="screen-bar-title">퀴즈 결과</h1></div>
  <div class="content" id="result-content"></div>
</div>

<!-- 정복 탭: 정복한 작품 모아보기(localStorage 조회만) -->
<div id="view-conq" class="view">
  <div class="content">
    <div class="conq-title">정복</div>
    <div class="conq-sub" id="conq-sub"></div>
    <div id="conq-list"></div>
  </div>
</div>

<!-- 하단 내비 (작업226-2): 홈 / 정복 / 퀴즈 -->
<nav id="bottom-nav" class="bottom-nav" aria-label="한입 독서 메뉴">
  <div class="bottom-nav-tabs">
    <button type="button" class="bottom-nav-tab" id="nav-home" data-tab="home">홈</button>
    <button type="button" class="bottom-nav-tab" id="nav-conq" data-tab="conq">정복</button>
    <button type="button" class="bottom-nav-tab" id="nav-quiz" data-tab="quiz" aria-disabled="true">퀴즈</button>
  </div>
</nav>

<script>
// ── State ──
let DB = null;
let currentWorkId = null;
let quizState = { questions: [], currentIdx: 0, score: 0, wrong: [] };

// 작업128: 범례 장르 필터 (전체=null / 시 / 소설). 기존 digest_conquest_* 키와
// 겹치지 않는 새 localStorage 키 사용
const FILTER_STORAGE_KEY = 'digest_genre_filter';
let genreFilter = localStorage.getItem(FILTER_STORAGE_KEY) || null;
let legendItems = []; // 전체 DB 기준 장르별 편수 - 필터와 무관하게 한 번만 계산

// ── Utility ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isConquered(id) {
  return localStorage.getItem(`digest_conquest_${id}`) === 'true';
}

function setConquered(id, val) {
  localStorage.setItem(`digest_conquest_${id}`, val ? 'true' : 'false');
}

function getConqueredWorks() {
  if (!DB) return [];
  return DB.works.filter(w => isConquered(w.id));
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // 작업226-2: 활성 탭 — 홈 = 목록·작품 상세 / 정복 = 정복 모아보기 / 퀴즈 = 퀴즈·결과
  const tab = (id === 'view-quiz' || id === 'view-result') ? 'quiz' : id === 'view-conq' ? 'conq' : 'home';
  for (const b of document.querySelectorAll('#bottom-nav [data-tab]')) {
    const on = b.dataset.tab === tab;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
}

// ── History (작업95) ──
// 원래 showView는 화면만 바꾸고 기록을 전혀 남기지 않아서, 상세/퀴즈 화면에서
// 기기·브라우저 뒤로가기를 누르면 이 페이지 자체를 떠나 앱 홈(/)으로 나갔음.
// 사전 페이지(작업55/58)와 같은 방식으로: 목록(list)을 바닥 상태로 깔고,
// 상세·퀴즈·결과는 그 위에 한 칸만 쌓음(이미 한 칸 위면 replace). 그래서
// 어느 화면에서든 뒤로가기 한 번이면 목록, 목록에서 한 번 더면 페이지를 떠남.
// 연결 작품으로 옮겨 갈 때도 replace라서 앱 안 ‹ 버튼(goList)과 똑같이 목록으로 감.
let _navFromPop = false;
function navState(state) {
  if (_navFromPop) return; // popstate로 그리는 중에는 기록을 건드리지 않음
  const cur = history.state && history.state.view;
  if (!cur || cur === 'list' || cur === 'conq') history.pushState(state, '');   // 작업226-2: 정복 탭 위에도 쌓음(상세·퀴즈에서 ‹ = 정복 탭)
  else history.replaceState(state, '');
}
// 작업128: 목록 화면의 history.state에 현재 필터를 실어 둠 - 상세/퀴즈로
// 쌓인 위에서 뒤로가기(popstate)로 돌아올 때 이 값을 읽어 필터를 복원
function syncListHistoryState() {
  if (_navFromPop) return;
  if (!history.state || history.state.view === 'list') {
    history.replaceState({ view: 'list', filter: genreFilter }, '');
  }
}
function showListView() {
  renderList();
  showView('view-list');
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  if (!DB) return;
  const st = e.state || { view: 'list' };
  _navFromPop = true;
  try {
    // 방어적 확인(작업58 교훈): 없는 작품 id나 이미 사라진 퀴즈 상태로 돌아오면 목록으로
    if (st.view === 'digest' && DB.works.some(w => w.id === st.id)) {
      showDigest(st.id);
    } else if (st.view === 'quiz' && quizState.questions.length && quizState.currentIdx < quizState.questions.length) {
      showView('view-quiz');
      renderQuestion();
      window.scrollTo(0, 0);
    } else if (st.view === 'result' && quizState.questions.length) {
      showResult();
    } else if (st.view === 'conq') {
      renderAndShowConq();
    } else {
      if ('filter' in st) genreFilter = st.filter;
      showListView();
    }
  } finally {
    _navFromPop = false;
  }
});

// ── Permission Check ──
async function checkPermission() {
  const token = localStorage.getItem('mydict_token');
  if (!token) return true;
  try {
    const r = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return true;
    const me = await r.json();
    return me.perm_digest_reading !== false;
  } catch { return true; }
}

// ── Data Load ──
async function loadDB() {
  const allowed = await checkPermission();
  if (!allowed) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('access-denied').style.display = 'flex';
    return;
  }
  try {
    const res = await fetch('digest_db.json');
    if (!res.ok) throw new Error('네트워크 오류');
    DB = await res.json();
    legendItems = buildLegendItems();
    document.getElementById('loading').style.display = 'none';
    renderList();
    showView('view-list');
    // 작업95: 새로고침해도 history.state는 남음 - 상세였으면 그 작품을 다시 열고,
    // 퀴즈/결과처럼 메모리 상태가 사라진 화면이었으면 목록 상태로 바꿔 둠
    const st = history.state;
    if (st && st.view === 'digest' && DB.works.some(w => w.id === st.id)) {
      _navFromPop = true;
      try { showDigest(st.id); } finally { _navFromPop = false; }
    } else {
      syncListHistoryState();
    }
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div class="error-msg">데이터를 불러오지 못했습니다.<br>${e.message}</div>`;
  }
}

// ── View 1: List (작업81: 3D 캐러셀) ──

// 장르 → 카드 색. 새 장르는 여기에 한 줄만 추가하면 됨.
// 작업82: 카드는 흰 배경. tone은 기획 기준색, ink는 흰 카드(#FBFAF8까지)
// 위 장르 라벨·띠·밑줄·인용선에 쓰는 색으로 AA 4.5:1을 넘기도록 같은 계열에서
// 어둡게 조정 (기준색 그대로는 흰 배경 대비 2.4~3.7:1).
const GENRE_COLORS = {
  '시':       { tone: '#C97452', ink: '#A65A3B' }, // 테라코타
  '소설':     { tone: '#6E88A6', ink: '#56708E' }, // 블루
  '시조':     { tone: '#C9A24A', ink: '#86682A' }, // 앰버/골드
  '고려가요': { tone: '#8A9A6E', ink: '#5F6E45' }, // 세이지/올리브
  '수필':     { tone: '#9A7CA8', ink: '#735683' }, // 뮤트 로즈/바이올렛
  '고전소설': { tone: '#8B6F47', ink: '#6B5435' }, // 세피아/고동
};
const GENRE_FALLBACK = { tone: '#8A8F99', ink: '#5E6470' }; // 매핑 없는 장르
const genreColor = g => GENRE_COLORS[g] || GENRE_FALLBACK;

// 작업128: 범례 항목(장르별 편수) - 전체 DB 기준, 편수 내림차순
function buildLegendItems() {
  const counts = {};
  DB.works.forEach(w => { counts[w.genre] = (counts[w.genre] || 0) + 1; });
  return Object.keys(counts)
    .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'ko'))
    .map(g => ({ genre: g, count: counts[g] }));
}

// 제목 가나다순 정렬 + genreFilter 적용된 목록 (캐러셀에 넘길 작품 목록)
function getFilteredWorks() {
  const sorted = [...DB.works].sort((a, b) => a.title.localeCompare(b.title, 'ko'));
  return genreFilter ? sorted.filter(w => w.genre === genreFilter) : sorted;
}

// 범례 클릭 핸들러 - 같은 장르를 다시 누르면 전체로 복귀
function setGenreFilter(genre) {
  genreFilter = (genreFilter === genre) ? null : genre;
  if (genreFilter) localStorage.setItem(FILTER_STORAGE_KEY, genreFilter);
  else localStorage.removeItem(FILTER_STORAGE_KEY);
  renderList();
}

// home-wheel ThreeDWheelPicker.jsx의 로직을 vanilla JS + 가로(rotateY)로 옮김.
// 스프링/스냅, 휠 1회=최대 1칸, 드래그 6px 초과 시 탭 아님, 관성,
// prefers-reduced-motion 대응은 원본 값 그대로.
const Carousel = (() => {
  const mod = (n, m) => ((n % m) + m) % m;
  const relativePos = (index, offset, n) => mod(index - offset + n / 2, n) - n / 2;
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const RENDER_RANGE = 4.5; // 중앙 기준 ±4.5장만 렌더, 나머지 display:none

  const reducedMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  // blur는 마우스 쓰는 데스크톱에서만 - 모바일 GPU에선 3D 요소 filter가 가장 무거움
  const finePointerMq = window.matchMedia ? window.matchMedia('(hover: hover) and (pointer: fine)') : null;

  let works = [], n = 0, cards = [];
  let viewport, track, countEl, legendEl;
  let offset = 0, target = 0, vel = 0, raf = null;
  let dragging = false, wheelAcc = 0;
  let pointer = { lastX: 0, moved: 0 };
  let reduced = false, metrics = null;
  let lastCenter = -1;

  function computeMetrics() {
    const w = Math.min(window.innerWidth, 480);
    // 짧은 화면(주소창이 떠 있는 실기기 등)에서 버튼이 탭바 아래로 밀리지
    // 않도록 카드 높이를 남은 높이에 맞춰 줄임 (home-wheel 작업11과 같은 취지)
    // 작업82: 시작 버튼이 빠진 만큼 높이 여유를 카드에 돌려줌 (440 → 380)
    // 작업86: 제목 줄·정복 현황 줄도 빠져서 한 번 더 (380 → 280)
    const maxH = Math.max(200, window.innerHeight - 280);
    let cardW = clamp(Math.round(w * 0.62), 190, 270);
    let cardH = Math.round(cardW * 1.4);
    if (cardH > maxH) { cardH = maxH; cardW = Math.min(cardW, Math.round(cardH * 0.9)); }
    // 카드 중심 간 간격을 카드 폭보다 살짝 넓게 - 원통 접평면끼리 겹치면
    // 이웃 카드 모서리가 중앙 카드 앞으로 뚫고 나오므로 겹치지 않게 둠
    const spacing = cardW * 1.04;
    const baseStep = 24;
    // 작업81-a: 높이 600 미만(320×568 등)에선 카드 위아래 여백을 줄여 시작
    // 버튼이 탭바 위에 오게 함 (그림자도 CSS에서 같이 줄임). 667 이상은 그대로
    const vpad = window.innerHeight < 600 ? 40 : 64;
    return { cardW, cardH, spacing, baseStep, viewportH: cardH + vpad, drag: cardW * 0.45 };
  }

  function render() {
    const depth = reduced ? 0.35 : 1;
    const stepDeg = metrics.baseStep * depth;
    // 원본은 각도와 반지름을 함께 depth배 해서 reduced 모드에서 카드가 거의
    // 한 점에 겹침 → 가로에선 카드가 서로 뚫고 보이므로, 각도만 줄이고
    // 카드 간격(현 길이)은 유지하도록 반지름을 역산 (더 평평한 원통)
    const radius = metrics.spacing / (2 * Math.sin((stepDeg * Math.PI) / 360));
    const blurOn = !reduced && finePointerMq && finePointerMq.matches;
    track.style.transform = `translateZ(${-radius}px)`; // 중앙 카드가 z=0(원래 크기)에 오도록

    for (let i = 0; i < n; i++) {
      const el = cards[i];
      const rel = relativePos(i, offset, n);
      const abs = Math.abs(rel);
      if (abs > RENDER_RANGE) {
        if (el.style.display !== 'none') el.style.display = 'none';
        continue;
      }
      if (el.style.display === 'none') el.style.display = '';
      const scale = 1 - clamp(abs, 0, 3) * 0.06;
      el.style.transform = `rotateY(${rel * stepDeg}deg) translateZ(${radius}px) scale(${scale})`;
      el.style.opacity = clamp(1 - abs * 0.3, 0.06, 1);
      el.style.filter = blurOn ? `blur(${clamp(abs * 1.25 - 0.15, 0, 4.5)}px)` : '';
    }

    const center = mod(Math.round(offset), n);
    if (center !== lastCenter) {
      if (lastCenter >= 0) {
        cards[lastCenter].classList.remove('is-center');
        cards[lastCenter].setAttribute('aria-selected', 'false');
      }
      cards[center].classList.add('is-center');
      cards[center].setAttribute('aria-selected', 'true');
      lastCenter = center;
      currentWorkId = works[center].id;
      countEl.textContent = `${center + 1} / ${n}`;
    }
  }

  function setMoving(on) { track.classList.toggle('moving', on); }

  /* ---------- 애니메이션 루프 (스프링 + 스냅) ---------- */
  function tick() {
    raf = null;
    if (dragging) return;
    const stiffness = reduced ? 0.32 : 0.14;
    const damping = reduced ? 0.6 : 0.78;
    const d = target - offset;
    vel = (vel + d * stiffness) * damping;
    offset += vel;
    if (Math.abs(d) < 0.0008 && Math.abs(vel) < 0.0008) {
      offset = target;
      vel = 0;
      render();
      setMoving(false);
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }
  function kick() {
    setMoving(true);
    if (raf == null) raf = requestAnimationFrame(tick);
  }
  function goBy(delta) {
    target = Math.round(target) + delta;
    kick();
  }

  /* ---------- 입력 ---------- */
  function onWheel(e) {
    // 가로 휠(트랙패드)과 세로 휠 중 큰 쪽을 사용
    const dv = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    wheelAcc += dv;
    if (Math.abs(wheelAcc) >= 45) {
      goBy(Math.sign(wheelAcc)); // 1회 이벤트 = 최대 1칸
      wheelAcc = 0;
    }
  }

  // setPointerCapture를 쓰지 않는 이유는 ThreeDWheelPicker.jsx onPointerDown
  // 주석 참고 (캡처하면 Chromium이 click 대상을 뷰포트로 바꿔 카드 탭이 죽음)
  function onPointerDown(e) {
    if (e.button != null && e.button > 0) return;
    dragging = true;
    vel = 0;
    pointer = { lastX: e.clientX, moved: 0 };
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    setMoving(true);
  }
  function onPointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - pointer.lastX;
    pointer.lastX = e.clientX;
    pointer.moved += Math.abs(dx);
    const delta = -dx / metrics.drag; // 오른쪽으로 끌면 이전 작품
    offset += delta;
    vel = vel * 0.6 + delta * 0.4;
    render();
  }
  // touch-action: pan-y라서 세로 스크롤로 판정되면 브라우저가
  // pointercancel을 보냄 → 여기서 가장 가까운 카드로 스냅
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    const fling = reduced ? 0 : clamp(vel * 9, -4, 4);
    target = Math.round(offset + fling);
    kick();
  }

  function onCardClick(e) {
    const el = e.target.closest('.carousel-card');
    if (!el) return;
    if (pointer.moved > 6) return; // 드래그와 클릭 구분
    const rel = relativePos(Number(el.dataset.idx), offset, n);
    if (Math.abs(rel) < 0.5) { showDigest(works[Number(el.dataset.idx)].id); return; } // 작업82: 중앙 카드 탭 = 바로 읽기
    goBy(Math.round(rel));
    viewport.focus({ preventScroll: true });
  }

  function onKeyDown(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); goBy(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBy(-1); }
    else if (e.key === 'Home') {
      e.preventDefault();
      target = Math.round(target) + relativePos(0, target, n);
      kick();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      startCurrent();
    }
  }

  function startCurrent() {
    showDigest(works[mod(Math.round(target), n)].id);
  }

  function applyMetrics() {
    const hdr = document.querySelector('.metis-app-header');
    document.documentElement.style.setProperty('--hdr-h', (hdr ? hdr.offsetHeight : 0) + 'px');
    metrics = computeMetrics();
    viewport.style.height = metrics.viewportH + 'px';
    viewport.style.perspective = (reduced ? 2400 : 1100) + 'px';
    // 짧은 카드에선 one_line 줄 수를 줄임 - 안 그러면 카드 아래로 반쯤 잘린 줄이 보임
    viewport.style.setProperty('--line-clamp', metrics.cardH < 230 ? 2 : metrics.cardH < 280 ? 3 : 4);
    // 작업85: 짧은 카드에선 제목도 줄임 - 긴 제목(「빼앗긴 들에도 봄은 오는가」)이
    // 3줄로 접히면 one_line이 밀려 카드 밖으로 잘림
    viewport.style.setProperty('--title-size', metrics.cardH < 230 ? '17px' : metrics.cardH < 300 ? '20px' : '22px');
    cards.forEach(el => {
      el.style.width = metrics.cardW + 'px';
      el.style.height = metrics.cardH + 'px';
      el.style.marginLeft = -metrics.cardW / 2 + 'px';
      el.style.marginTop = -metrics.cardH / 2 + 'px';
    });
    fitCards();
    render();
  }

  // 작업85: 제목이 길어 여러 줄로 접히는 카드는 위 기본 줄 수로도 넘칠 수
  // 있어서(320px의 「빼앗긴 들에도 봄은 오는가」) 카드별로 넘치지 않을
  // 때까지 one_line 줄 수를 1까지 줄임. 크기 바뀔 때만 실행 - 숨겨진
  // 카드도 재야 하므로 잠깐 display를 풀고, 바로 뒤 render()가 되돌림
  function fitCards() {
    const base = Number(viewport.style.getPropertyValue('--line-clamp')) || 4;
    cards.forEach(el => {
      el.style.display = '';
      el.style.removeProperty('--line-clamp');
      for (let c = base; c > 1 && el.scrollHeight > el.clientHeight; ) {
        el.style.setProperty('--line-clamp', --c);
      }
    });
  }

  function buildCard(w, i) {
    const el = document.createElement('div');
    el.className = 'carousel-card';
    el.dataset.idx = i;
    el.setAttribute('role', 'option');
    el.setAttribute('aria-selected', 'false');
    el.style.setProperty('--genre-ink', genreColor(w.genre).ink);
    el.innerHTML = `
      <div class="carousel-card-meta"><span class="g"></span><span class="lv"></span></div>
      <div class="carousel-card-title"></div>
      <div class="carousel-card-author"></div>
      <div class="carousel-card-line"></div>`;
    el.querySelector('.g').textContent = w.genre || '';
    el.querySelector('.carousel-card-title').textContent = `「${w.title}」`;
    el.querySelector('.carousel-card-author').textContent = `${w.author} · ${w.year}`;
    el.querySelector('.carousel-card-line').textContent = w.one_line;
    return el;
  }

  // 정복 여부는 목록 복귀마다 바뀔 수 있으므로 카드를 다시 만들지 않고 표시만 갱신
  function refreshConquered() {
    works.forEach((w, i) => {
      const lv = cards[i].querySelector('.lv');
      lv.innerHTML = '';
      lv.append(w.level);
      if (isConquered(w.id)) {
        const done = document.createElement('span');
        done.className = 'carousel-card-done';
        done.textContent = ' · 정복 ✓';
        lv.append(done);
      }
    });
  }

  // 목록으로 돌아올 때 currentWorkId 카드를 애니메이션 없이 중앙에 둠.
  // 작업128: 필터 전환으로 해당 id가 새 목록에 없으면 첫 작품으로 폴백
  function jumpTo(id) {
    if (n === 0) return;
    let idx = works.findIndex(w => w.id === id);
    if (idx < 0) idx = 0;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    dragging = false;
    target = offset = Math.round(offset) + relativePos(idx, Math.round(offset), n);
    vel = 0;
    setMoving(false);
    render();
  }

  // 작업128: mount()에서 분리 - 카드 DOM만 다시 만듦(리스너는 손대지 않음).
  // setList()와 최초 mount() 양쪽에서 공용으로 씀
  function buildCardsDOM(list) {
    works = list;
    n = list.length;
    track.innerHTML = '';
    cards = list.map((w, i) => buildCard(w, i));
    cards.forEach(el => track.appendChild(el));
    lastCenter = -1; // 새 카드 배열이라 이전 중앙 인덱스가 의미 없음 - render()가 다시 표시
    applyMetrics(); // 크기 재계산 + fitCards + render
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitCards(); render(); });
  }

  // 작업128: 필터 전환 시 목록 교체. 리스너는 다시 등록하지 않고
  // 진행 중이던 애니메이션/드래그 상태만 초기화한 뒤 카드를 다시 그림
  function setList(list) {
    if (!viewport) return; // mount 전에는 무시
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    dragging = false;
    vel = 0;
    offset = 0;
    target = 0;
    buildCardsDOM(list);
  }

  // 작업128: 범례(전체 DB 기준)를 다시 그림 - 필터와 무관하게 항상 모든 장르를
  // 보여주되, 현재 선택된 장르만 강조하고 나머지는 흐리게 표시
  function renderLegend(items, activeGenre, onItemClick) {
    if (!legendEl) return;
    legendEl.innerHTML = '';
    items.forEach(it => {
      const s = document.createElement('span');
      s.className = 'carousel-legend-item';
      s.tabIndex = 0;
      s.setAttribute('role', 'button');
      s.setAttribute('aria-pressed', String(it.genre === activeGenre));
      if (activeGenre && it.genre !== activeGenre) s.classList.add('dim');
      if (it.genre === activeGenre) s.classList.add('active');
      s.style.setProperty('--genre-ink', genreColor(it.genre).ink);
      s.textContent = `${it.genre} ${it.count}`;
      s.addEventListener('click', () => onItemClick(it.genre));
      s.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onItemClick(it.genre); }
      });
      legendEl.appendChild(s);
    });
  }

  // 작업128: mount()는 뷰포트/트랙/네비/범례 뼈대 생성 + 리스너를 최초 1회만
  // 바인딩. 카드 DOM 생성은 buildCardsDOM()에 위임해 setList()와 공유
  function mount(root, list) {
    if (viewport) return; // 최초 1회 가드 (기존 동작 유지)
    root.innerHTML = `
      <div class="carousel-clip">
        <div class="carousel-viewport" role="listbox" tabindex="0" aria-label="작품 선택 - 좌우로 넘기고 Enter 또는 가운데 카드를 눌러 읽기">
          <div class="carousel-track"></div>
        </div>
      </div>
      <div class="carousel-nav">
        <button class="carousel-nav-btn" data-dir="-1" aria-label="이전 작품">‹</button>
        <span class="carousel-nav-count"></span>
        <button class="carousel-nav-btn" data-dir="1" aria-label="다음 작품">›</button>
      </div>
      <div class="carousel-legend"></div>`;

    viewport = root.querySelector('.carousel-viewport');
    track = root.querySelector('.carousel-track');
    countEl = root.querySelector('.carousel-nav-count');
    legendEl = root.querySelector('.carousel-legend');

    viewport.addEventListener('wheel', onWheel, { passive: false });
    viewport.addEventListener('pointerdown', onPointerDown);
    viewport.addEventListener('pointermove', onPointerMove);
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    window.addEventListener('pointerup', endDrag); // 뷰포트 밖에서 마우스를 놓은 경우
    viewport.addEventListener('keydown', onKeyDown);
    track.addEventListener('click', onCardClick);
    root.querySelectorAll('.carousel-nav-btn').forEach(b =>
      b.addEventListener('click', () => goBy(Number(b.dataset.dir))));

    reduced = !!(reducedMq && reducedMq.matches);
    const onReducedChange = () => { reduced = reducedMq.matches; applyMetrics(); };
    if (reducedMq) {
      if (reducedMq.addEventListener) reducedMq.addEventListener('change', onReducedChange);
      else if (reducedMq.addListener) reducedMq.addListener(onReducedChange); // iOS 13 이하 Safari
    }
    window.addEventListener('resize', applyMetrics);

    buildCardsDOM(list);
  }

  return { mount, setList, renderLegend, jumpTo, refreshConquered, isMounted: () => !!viewport };
})();

function renderList() {
  updateTabQuizState();

  // 작업128: Carousel.setList()가 내부적으로 currentWorkId를 새 목록의 첫
  // 작품으로 갱신하므로, 호출 전에 원래 가려던 id를 먼저 떼어 둠
  const wantId = currentWorkId;

  // 작업86: 캐러셀은 제목 가나다순 (왼쪽 → 오른쪽). DB.works 순서는 퀴즈 등이
  // 그대로 쓰므로 복사본만 정렬 (작업128: genreFilter까지 적용)
  const filtered = getFilteredWorks();
  if (!Carousel.isMounted()) {
    Carousel.mount(document.getElementById('list-carousel'), filtered);
  } else {
    Carousel.setList(filtered);
  }
  Carousel.renderLegend(legendItems, genreFilter, setGenreFilter);
  Carousel.refreshConquered();
  Carousel.jumpTo(wantId);
  syncListHistoryState();
}

function updateTabQuizState() {
  const conquered = getConqueredWorks();
  // 작업226-2: 0개여도 눌러 안내를 볼 수 있음(흐림 대신 aria-disabled)
  document.getElementById('nav-quiz').setAttribute('aria-disabled', String(conquered.length === 0));
}

// ── 하단 내비 (작업226-2) ──
// 퀴즈 풀이 중: 한 문제라도 답했고 결과 화면 전
const quizInProgress = () => document.getElementById('view-quiz').classList.contains('active')
  && (quizState.score + quizState.wrong.length > 0 || quizState.currentIdx > 0);
async function onTab(tab) {
  const active = document.querySelector('.view.active').id;
  if (tab === 'quiz') { if (active === 'view-quiz' || active === 'view-result') return; startQuizFlow(); return; }
  if (active === (tab === 'home' ? 'view-list' : 'view-conq')) { window.scrollTo(0, 0); return; }   // 첫 화면 재클릭 = 맨 위로
  if (quizInProgress() && !(await metisConfirm('퀴즈를 그만할까요? 지금까지의 답은 저장되지 않습니다.'))) return;
  if (tab === 'home') {
    showListView();
    if (history.state && history.state.view !== 'list') history.replaceState({ view: 'list', filter: genreFilter }, '');   // 탭 전환은 기록을 교체
  } else {
    renderAndShowConq();
    navState({ view: 'conq' });
  }
}
for (const b of document.querySelectorAll('#bottom-nav [data-tab]')) b.addEventListener('click', () => onTab(b.dataset.tab));

// 정복 탭: 정복한 작품을 장르별로(localStorage 조회만)
function renderConq() {
  const list = getConqueredWorks();
  document.getElementById('conq-sub').textContent = list.length ? '정복한 작품 ' + list.length + '편' : '';
  const box = document.getElementById('conq-list');
  if (!list.length) { box.innerHTML = '<div class="conq-empty">아직 정복한 항목이 없어요</div>'; return; }
  const genres = [...new Set(list.map(w => w.genre || '기타'))].sort((a, b) => a.localeCompare(b, 'ko'));
  box.innerHTML = genres.map(g => `
    <div class="conq-group">
      <div class="conq-group-label">${g}</div>
      ${list.filter(w => (w.genre || '기타') === g).map(w => `<button type="button" class="conq-row" data-work-id="${w.id}" onclick="showDigest('${w.id}')">「${w.title}」</button>`).join('')}
    </div>`).join('');
}
function renderAndShowConq() {
  renderConq();
  showView('view-conq');
  window.scrollTo(0, 0);
}

function goList() {
  // 작업95: 상세/퀴즈 위에 쌓아둔 한 칸이 있으면 history.back()으로 되돌려서
  // popstate가 목록을 그리게 함 - 여기서 직접 그리면 그 칸이 기록에 남아서
  // 목록에서 기기 뒤로가기를 눌렀을 때 방금 본 상세로 되돌아가 버림
  if (history.state && history.state.view && history.state.view !== 'list') {
    history.back();
    return;
  }
  showListView();
}

// ── View 2: Digest ──
function showDigest(workId) {
  const work = DB.works.find(w => w.id === workId);
  if (!work) return;
  currentWorkId = workId;
  // 작업88: 제목은 본문 .digest-work-title 하나만 (상단 바 제목 제거)
  document.getElementById('digest-bar-title').textContent = '「' + work.title + '」';   // 작업220: 상단 바 제목 = 개념/작품 이름(길면 말줄임)

  const relatedHtml = work.related_works.length > 0
    ? `<div class="digest-section">
        <div class="digest-section-label">연결 작품</div>
        <div class="related-list">
          ${work.related_works.map(r => `
            <button type="button" class="related-item" onclick="showDigest('${r.id}')">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
              <span class="related-info">
                <span class="related-title">「${r.title}」</span>
                <span class="related-author">${r.author}</span>
                <span class="related-relation">${r.relation}</span>
              </span>
            </button>`).join('')}
        </div>
      </div>`
    : '';

  const headerHtml = `
    <div class="digest-work-header">
      <div class="digest-work-title">「${work.title}」</div>
      <div class="digest-work-meta">${work.author} · ${work.year} · ${work.genre}</div>
    </div>`;
  const oneLineHtml = `
    <div class="digest-section">
      <div class="digest-section-label">핵심 한 줄</div>
      <div class="digest-one-line">${work.one_line}</div>
    </div>`;
  const themeHtml = `
    <div class="digest-section">
      <div class="digest-section-label">주제 · 정서</div>
      <div class="digest-theme">${work.theme}</div>
      <div class="digest-emotion">${work.emotion.split(',').map(e => e.trim()).join(', ')}</div>
    </div>`;

  // 작업101: 원본(full_text) 유무와 관계없이 항상 같은 기본 레이아웃(핵심 한 줄 →
  // [원문] → 줄거리 → 핵심 장면 → 주제·정서 → 연결 작품)을 쓴다. 원본이 있는
  // 작품만 "원문" 섹션이 그 위에 추가로 붙고, 없는 작품은 그 자리가 그냥 빈다 -
  // 예전처럼 원본 유무로 줄거리/핵심 장면 자체가 사라지는 별도 레이아웃은 없앰.
  // full_text는 사람이 원전에서 입력한 퍼블릭도메인 작품에만 들어감
  // (scripts/validate_digest.js가 강제) - 화면에서도 rights.status를 한 번 더
  // 확인해서 보호 중인 작품 원문은 절대 그리지 않음
  const fullMode = !!work.full_text && !!work.rights && work.rights.status === 'public_domain';

  document.getElementById('digest-content').innerHTML = `${headerHtml}${oneLineHtml}
    ${fullMode ? renderFullText(work.full_text) : ''}
    <div class="digest-section">
      <div class="digest-section-label">줄거리</div>
      <div class="digest-summary">${work.summary}</div>
    </div>
    <div class="digest-section">
      <div class="digest-section-label">핵심 장면</div>
      <div class="key-scene-list">
        ${work.key_scenes.map((s, i) => `
          <div class="key-scene-item">
            <div class="scene-num">${i + 1}.</div>
            <div class="scene-text">${s}</div>
          </div>`).join('')}
      </div>
    </div>${themeHtml}
    ${relatedHtml}`;

  updateConquestBtn();
  showView('view-digest');
  window.scrollTo(0, 0);
  navState({ view: 'digest', id: workId });
}

// 작업91: 시 전문 - full_text = { stanzas: [[줄, ...], ...], source: "출전", orthography }.
// 작업93: 출전 옆에 표기 방식(원문 표기/현대 표기)을 있는 그대로 덧붙임.
// 원문 글자는 데이터 그대로 이스케이프해서 넣고(줄 앞 공백 들여쓰기 보존),
// 연은 문단, 줄은 한 줄씩. 긴 줄이 화면에서 접히면 내어쓰기로 원래 줄바꿈과 구분
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function renderFullText(ft) {
  const stanzas = ft.stanzas.map(lines =>
    `<div class="poem-stanza">${lines.map(l => `<span class="poem-line">${escHtml(l)}</span>`).join('')}</div>`
  ).join('');
  return `
    <div class="digest-section">
      <div class="digest-section-label">전문</div>
      <div class="poem">${stanzas}</div>
      ${ft.source ? `<div class="poem-source">출전 · ${escHtml(ft.source)}${ft.orthography ? ` · ${escHtml(ft.orthography)}` : ''}</div>` : ''}
    </div>`;
}

function updateConquestBtn() {
  const btn = document.getElementById('conquest-btn');
  // 작업217-3: 박스 없는 글자 버튼. 상태는 글자(정복하기 / ✓ 정복함)·굵기·색과 aria-pressed로 전달
  const on = isConquered(currentWorkId);
  btn.classList.toggle('conquered', on);
  btn.setAttribute('aria-pressed', String(on));
  btn.textContent = on ? '✓ 정복함' : '정복하기';
}

function toggleConquest() {
  const current = isConquered(currentWorkId);
  setConquered(currentWorkId, !current);
  updateConquestBtn();
  updateTabQuizState();
}

// ── View 3: Quiz ──
function startQuizFlow() {
  const conquered = getConqueredWorks();
  if (conquered.length === 0) {
    metisAlert('먼저 작품을 읽어보세요! 정복한 작품이 있어야 퀴즈를 시작할 수 있어요.');
    return;
  }
  const questions = buildQuestions(conquered);
  if (questions.length === 0) {
    metisAlert('퀴즈를 생성할 수 없습니다. 더 많은 작품을 정복해보세요!');
    return;
  }
  quizState = { questions, currentIdx: 0, score: 0, wrong: [] };
  showView('view-quiz');
  renderQuestion();
  window.scrollTo(0, 0);
  navState({ view: 'quiz' });
}

function buildQuestions(conquered) {
  const questions = [];
  const allWorks = DB.works;

  // Type 1: MCQ — 핵심 정서 (정복 4개 이상일 때)
  if (conquered.length >= 4) {
    const pool = shuffle(conquered).slice(0, 3);
    pool.forEach(w => {
      const wrong = shuffle(allWorks.filter(ow => ow.id !== w.id)).slice(0, 3).map(ow => ow.emotion);
      const options = shuffle([w.emotion, ...wrong]);
      questions.push({
        type: 'mcq',
        roundLabel: '핵심 정서 퀴즈',
        question: `「${w.title}」(${w.author})의 핵심 정서는 무엇인가요?`,
        options,
        answer: w.emotion
      });
    });
  }

  // Type 2: MCQ — 작품 맞추기 (정복 4개 이상일 때)
  if (conquered.length >= 4) {
    const pool = shuffle(conquered).slice(0, 3);
    pool.forEach(w => {
      const wrongTitles = shuffle(conquered.filter(ow => ow.id !== w.id)).slice(0, 3).map(ow => `「${ow.title}」`);
      const options = shuffle([`「${w.title}」`, ...wrongTitles]);
      questions.push({
        type: 'mcq',
        roundLabel: '작품 맞추기 퀴즈',
        question: `다음 설명에 해당하는 작품은?\n\n"${w.one_line}"`,
        options,
        answer: `「${w.title}」`
      });
    });
  }

  // Type 3: OX — 주제 퀴즈 (항상 가능)
  const oxPool = shuffle(conquered).slice(0, 3);
  oxPool.forEach(w => {
    const isTrue = Math.random() > 0.5;
    let statement, answer, explanation;
    if (isTrue) {
      statement = `「${w.title}」의 주제는 "${w.theme}"이다.`;
      answer = true;
      explanation = `맞습니다. 「${w.title}」의 주제는 "${w.theme}"입니다.`;
    } else {
      const other = allWorks.find(ow => ow.id !== w.id);
      if (other) {
        statement = `「${w.title}」의 주제는 "${other.theme}"이다.`;
        answer = false;
        explanation = `아닙니다. 「${w.title}」의 주제는 "${w.theme}"입니다.`;
      } else {
        statement = `「${w.title}」의 주제는 "${w.theme}"이다.`;
        answer = true;
        explanation = `맞습니다. 「${w.title}」의 주제는 "${w.theme}"입니다.`;
      }
    }
    questions.push({ type: 'ox', roundLabel: 'OX 퀴즈', statement, answer, explanation });
  });

  return shuffle(questions);
}

function renderQuestion() {
  const q = quizState.questions[quizState.currentIdx];
  if (!q) { showResult(); return; }

  const pct = (quizState.currentIdx / quizState.questions.length) * 100;
  const counter = `${quizState.currentIdx + 1} / ${quizState.questions.length}`;

  const container = document.getElementById('quiz-content');

  if (q.type === 'mcq') {
    container.innerHTML = `
      <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="qpb" style="width:${pct}%"></div></div>
      <div class="quiz-round-label">${q.roundLabel}</div>
      <div class="quiz-question-counter">${counter}</div>
      <div class="quiz-card">
        <div class="quiz-question" style="white-space:pre-line">${q.question}</div>
        <div class="mcq-options">
          ${q.options.map((opt, i) => `
            <button class="mcq-option" data-opt="${escAttr(opt)}" onclick="answerMCQ(this,'${escJs(opt)}')">
              <span class="mcq-num">${i + 1}</span>
              <span class="mcq-text">${opt}</span>
            </button>`).join('')}
        </div>
      </div>
      <button class="quiz-next-btn" id="quiz-next" onclick="nextQuestion()">다음</button>`;
  } else {
    container.innerHTML = `
      <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="qpb" style="width:${pct}%"></div></div>
      <div class="quiz-round-label">${q.roundLabel}</div>
      <div class="quiz-question-counter">${counter}</div>
      <div class="quiz-card">
        <div class="quiz-question">${q.statement}</div>
        <div class="ox-buttons">
          <button class="ox-btn" id="ox-o" onclick="answerOX(true)">O</button>
          <button class="ox-btn" id="ox-x" onclick="answerOX(false)">X</button>
        </div>
        <div class="ox-feedback" id="ox-fb"></div>
      </div>
      <button class="quiz-next-btn" id="quiz-next" onclick="nextQuestion()">다음</button>`;
  }
}

function escAttr(s) { return s.replace(/"/g, '&quot;'); }
function escJs(s) { return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function answerMCQ(el, chosen) {
  const q = quizState.questions[quizState.currentIdx];
  document.querySelectorAll('.mcq-option').forEach(opt => {
    opt.classList.add('answered'); opt.onclick = null;
  });
  const isCorrect = chosen === q.answer;
  if (isCorrect) {
    el.classList.add('correct'); quizState.score++;
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.mcq-option').forEach(opt => {
      if (opt.dataset.opt === q.answer) opt.classList.add('correct-hint');
    });
    quizState.wrong.push({ q: q.question || q.statement, a: q.answer });
  }
  document.getElementById('quiz-next').classList.add('visible');
}

function setOxFeedback(fb, text) {   // 작업221: 정오 한 줄(정답!/오답./맞습니다./아닙니다.)만 따로 감싸 색을 입힌다
  const m = String(text).match(/^(정답!|오답\.|아닙니다\.|맞습니다\.)\s*/);
  fb.textContent = '';
  if (!m) { fb.textContent = text; return; }
  const line = document.createElement('b'); line.className = 'fb-line'; line.textContent = m[1];
  fb.appendChild(line); fb.appendChild(document.createTextNode(' ' + text.slice(m[0].length)));
}

function answerOX(answer) {
  const q = quizState.questions[quizState.currentIdx];
  const oBtn = document.getElementById('ox-o');
  const xBtn = document.getElementById('ox-x');
  const fb = document.getElementById('ox-fb');
  oBtn.disabled = true; xBtn.disabled = true;
  (answer ? oBtn : xBtn).classList.add('picked');   // 작업217-3: 고른 쪽 표시(밑줄)
  const isCorrect = answer === q.answer;
  if (isCorrect) {
    (answer ? oBtn : xBtn).classList.add('correct');
    quizState.score++;
    setOxFeedback(fb, '정답! ' + q.explanation);
    fb.className = 'ox-feedback show correct-fb';
  } else {
    (answer ? oBtn : xBtn).classList.add('wrong');
    (!answer ? oBtn : xBtn).classList.add('correct');
    setOxFeedback(fb, '오답. ' + q.explanation);
    fb.className = 'ox-feedback show wrong-fb';
    quizState.wrong.push({ q: q.statement, a: q.answer ? 'O (참)' : 'X (거짓)' });
  }
  document.getElementById('quiz-next').classList.add('visible');
}

function nextQuestion() {
  quizState.currentIdx++;
  renderQuestion();
  window.scrollTo(0, 0);
}

// ── View 4: Result ──
function showResult() {
  const total = quizState.questions.length;
  const score = quizState.score;
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;

  let msg = '완벽해요!', sub = '모든 문항을 맞혔습니다.';
  if (pct < 100) { msg = '잘했어요!'; sub = '조금만 더 연습하면 완벽합니다.'; }
  if (pct < 60) { msg = '다시 도전해봐요!'; sub = '작품을 다시 읽고 퀴즈에 도전하세요.'; }

  let wrongHtml = '';
  if (quizState.wrong.length > 0) {
    wrongHtml = `
      <div class="result-section-label">틀린 문항</div>
      <div class="result-wrong-list">
        ${quizState.wrong.map(w => `
          <div class="result-wrong-item">
            <div class="result-wrong-q" style="white-space:pre-line">${w.q}</div>
            <div class="result-wrong-a">${w.a}</div>
          </div>`).join('')}
      </div>`;
  }

  document.getElementById('result-content').innerHTML = `
    <div class="result-score-wrap">
      <div class="result-score">${score}<span> / ${total}</span></div>
      <div class="result-msg">${msg}</div>
      <div class="result-submsg">${sub}</div>
    </div>
    ${wrongHtml}
    <div class="result-actions">
      <button class="result-btn result-btn-primary" onclick="startQuizFlow()">다시 풀기</button>
      <button class="result-btn result-btn-secondary" onclick="goList()">목록으로</button>
    </div>`;

  showView('view-result');
  window.scrollTo(0, 0);
  navState({ view: 'result' });
}

// ── Boot ──
loadDB();
</script>
