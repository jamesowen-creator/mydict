<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>개념 지도 - METIS</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common/appHeader.css">
<link rel="stylesheet" href="/css/common/tokens.css">
<link rel="stylesheet" href="/css/common/screenBar.css">
<style>
  /* 작업270-1·271-1: 개념 지도(개발 중). 옛 개념학습(concept_study.html)과 별도 화면.
     색·크기·모서리는 /css/common/tokens.css 의 변수만 쓴다(직접 hex 없음, 글자 크기 11·12·13·14·15·16·18·22, 모서리 10·16·50%). */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100dvh;
    overflow-x: hidden;
    line-height: 1.6;
    font-size: var(--body-font-size);
    max-width: var(--content-max);
    margin: 0 auto;
  }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  :focus-visible { outline: 2px solid var(--color-text); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #loading, #access-denied { position: fixed; inset: 0; z-index: 999; background: var(--color-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #loading p, #access-denied p { color: var(--color-text-sub); font-size: 14px; }
  #access-denied h2 { font-size: 18px; font-weight: 800; }

  .btn { min-height: var(--ctl-min-h); padding: 0 16px; border: none; border-radius: var(--radius-ctl); background: var(--color-accent-ink); color: var(--color-surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn.text { background: transparent; color: var(--color-accent-ink); padding: 0 10px; }
  .btn.danger { background: var(--color-danger-ink); }
  .wrap { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--gutter) 40px; }
  .sec { padding: 20px 0 8px; border-bottom: 1px solid var(--color-line); }
  .sec:last-child { border-bottom: none; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--ctl-min-h); }
  .sec-title { font-size: 18px; font-weight: 800; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
  .hint { margin-top: 6px; font-size: 14px; color: var(--color-text-sub); }
  .msg { min-height: 0; margin-top: 8px; font-size: 14px; color: var(--color-danger-ink); }
  .msg:empty { display: none; }

  /* 주제 트리 */
  #tree, #tree ul { list-style: none; }
  .t-row { display: flex; align-items: center; min-height: var(--ctl-min-h); border-bottom: 1px solid var(--color-line); }
  .t-toggle, .t-spacer { flex: none; width: 36px; height: var(--ctl-min-h); display: inline-flex; align-items: center; justify-content: center; background: none; border: none; color: var(--color-text-sub); }
  .t-toggle svg { transition: transform 0.15s; }
  .t-toggle[aria-expanded=true] svg { transform: rotate(90deg); }
  .t-node { flex: 1; min-width: 0; min-height: var(--ctl-min-h); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px; background: none; border: none; text-align: left; font-weight: 500; }
  .t-node .t-title { min-width: 0; overflow-wrap: anywhere; }
  .t-node .t-count { flex: none; font-size: 13px; color: var(--color-text-sub); font-weight: 400; }
  .t-node[aria-current=true] { font-weight: 800; color: var(--color-accent-ink); background: var(--color-surface-2); border-radius: var(--radius-ctl); }
  #topic-actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 0 14px; }

  /* 개념 목록 */
  #concept-list { list-style: none; }
  .c-item { padding: 12px 0; border-bottom: 1px solid var(--color-line); }
  .c-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .c-term { font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
  .c-en { font-size: 14px; color: var(--color-text-sub); overflow-wrap: anywhere; }
  .c-memo { margin-top: 4px; font-size: 14px; color: var(--color-text-sub); white-space: pre-wrap; overflow-wrap: anywhere; }
  .c-tools { display: flex; gap: 4px; margin-top: 4px; margin-left: -10px; }

  /* 대화상자 */
  dialog { margin: auto; width: min(calc(100vw - 32px), 420px); max-height: calc(100dvh - 32px); overflow-y: auto; border: 1px solid var(--color-line); border-radius: var(--card-radius); padding: 20px; background: var(--color-surface); color: var(--color-text); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  dialog h3 { font-size: 18px; font-weight: 800; line-height: 1.3; }
  dialog .field { margin-top: 14px; }
  dialog label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  dialog input, dialog textarea, dialog select { width: 100%; min-height: var(--ctl-min-h); padding: 8px 12px; border: 1px solid var(--color-line-strong); border-radius: var(--input-radius); background: var(--color-surface); }
  dialog textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  dialog .body-text { margin-top: 12px; white-space: pre-line; overflow-wrap: anywhere; }
  dialog .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  /* 입력창 포커스: 코랄 테두리 + 링, outline 없음 */
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--color-accent); box-shadow: var(--ring-focus); }

  /* 작업273-1: 개념 검색 → AI 설명 카드 */
  .sec-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--color-accent-ink); }
  .explain-form { margin-top: 8px; }
  .explain-row { display: flex; gap: 8px; margin-top: 4px; }
  .explain-row input { flex: 1; min-width: 0; min-height: var(--ctl-min-h); padding: 8px 12px; border: 1px solid var(--color-line-strong); border-radius: var(--input-radius); background: var(--color-surface); }
  .explain-card { margin-top: 12px; padding: 16px; border: 1px solid var(--color-line); border-radius: var(--card-radius); background: var(--color-surface); }
  .explain-card .e-term { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
  .explain-card .field { margin-top: 12px; }
  .explain-card label { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 700; }
  .explain-card input, .explain-card textarea { width: 100%; min-height: var(--ctl-min-h); padding: 8px 12px; border: 1px solid var(--color-line-strong); border-radius: var(--input-radius); background: var(--color-surface); }
  .explain-card textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
  .explain-card .e-note { margin-top: 8px; font-size: 14px; color: var(--color-text-sub); }
  .explain-card .btn-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .c-item.hl { background: var(--color-surface-2); border-radius: var(--radius-ctl); padding-left: 8px; padding-right: 8px; }
  .c-expl { margin-top: 4px; }
  .c-expl summary { min-height: var(--ctl-min-h); display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--color-accent-ink); font-weight: 700; font-size: 14px; }
  .c-expl .e-src { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--color-accent-ink); }
  .c-expl dl { margin: 0 0 8px; }
  .c-expl dt { margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--color-text-sub); }
  .c-expl dd { margin: 2px 0 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* 작업273-2: 지도 화면 */
  .map-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding-top: 12px; }
  .map-pick { margin-top: 4px; padding: 8px 12px; max-height: 40dvh; overflow-y: auto; border: 1px solid var(--color-line); border-radius: var(--card-radius); background: var(--color-surface); }
  .pick-topic { margin: 8px 0 0; }
  .pick-row { display: flex; align-items: center; gap: 10px; min-height: var(--ctl-min-h); cursor: pointer; }
  .pick-row input { width: 22px; height: 22px; flex: none; accent-color: var(--color-accent-ink); }
  .pick-term { font-weight: 700; overflow-wrap: anywhere; }
  .pick-en { font-size: 13px; color: var(--color-text-sub); overflow-wrap: anywhere; }
  .map-save-state { font-size: 13px; color: var(--color-text-sub); margin-right: auto; padding: 0 6px; }
  .map-save-state.changed { color: var(--color-accent-ink); font-weight: 700; }
  .map-opt-bar { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 10px; background: var(--color-surface); border: 1px solid var(--color-accent-ink); border-radius: var(--radius-ctl); font-size: 13px; }
  .map-opt-bar span { flex: 1 1 140px; }
  .m-node.preview rect { stroke: var(--color-accent-ink); stroke-dasharray: 4 3; }
  #map-hint { min-height: 3.2em; }   /* 안내가 한 줄↔두 줄로 바뀌어도 캔버스가 밀리지 않게 높이를 고정 */
  .map-canvas { position: relative; margin-top: 8px; height: calc(100dvh - var(--hdr-h, 65px) - 320px); min-height: 320px; border: 1px solid var(--color-line); border-radius: var(--card-radius); background: var(--color-surface); overflow: hidden; }
  .map-canvas .msg { position: absolute; left: 8px; right: 8px; bottom: 8px; margin: 0; padding: 6px 10px; background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-ctl); }   /* 오류 문구는 캔버스 위에 겹쳐 보여 캔버스를 밀지 않는다 */
  #map-svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .m-node rect { fill: var(--color-surface); stroke: var(--color-line-strong); stroke-width: 1.5; cursor: grab; }
  .m-node.sel rect { fill: var(--color-surface-2); stroke: var(--color-accent); stroke-width: 2.5; }
  .m-node.temp rect { stroke-dasharray: 5 3; }
  .m-node:focus-visible rect { stroke: var(--color-text); stroke-width: 2.5; }
  .m-node-text { font-size: 13px; font-weight: 700; fill: var(--color-text); pointer-events: none; }
  .m-edge-line { fill: none; stroke: var(--color-text-sub); stroke-width: 1.6; pointer-events: none; }
  .m-edge-hit { fill: none; stroke: transparent; stroke-width: 22; cursor: pointer; }
  .m-edge-label { font-size: 12px; fill: var(--color-text-sub); paint-order: stroke; stroke: var(--color-surface); stroke-width: 4px; pointer-events: none; }
  .m-arrow-path { fill: var(--color-text-sub); }
  .edge-pair { margin-top: 12px; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
  .edge-flip-row { margin-top: 4px; margin-left: -10px; }
</style>
</head>
<body>

<script src="/js/common/appHeader.js"></script>
<script>MetisAppHeader.inject();</script>
<script src="/js/map/mapCore.js?v=1"></script>
<script src="/js/cmap/mapGeometry.js?v=1"></script>
<script src="/js/cmap/layoutOptimize.js?v=1"></script>

<div id="loading" role="status"><p>불러오는 중…</p></div>

<div id="access-denied" hidden>
  <svg class="ic" viewBox="0 0 24 24" width="40" height="40"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  <h2>이용 권한이 없습니다</h2>
  <p>개념 지도는 아직 개발 중이며<br>권한이 있는 계정만 사용할 수 있습니다.</p>
  <a class="btn" href="/">METIS 홈으로</a>
</div>

<div id="app" hidden>
 <div id="main-view">
  <div class="screen-bar">
    <button id="back-btn" class="screen-bar-back" type="button" aria-label="홈으로"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h1 class="screen-bar-title">개념 지도</h1>
  </div>
  <div class="wrap">
    <section class="sec" id="topics-sec" aria-label="주제">
      <div class="sec-head">
        <h2 class="sec-title">주제</h2>
        <button id="add-root-btn" class="btn text" type="button">주제 추가</button>
      </div>
      <p id="topics-msg" class="msg" role="alert"></p>
      <ul id="tree" role="tree" aria-label="주제 목록"></ul>
      <p id="tree-empty" class="hint" hidden>아직 주제가 없습니다. 첫 주제를 만들어 보세요.</p>
      <div id="topic-actions" hidden>
        <button id="act-add-child" class="btn text" type="button">하위 주제 추가</button>
        <button id="act-rename" class="btn text" type="button">이름 변경</button>
        <button id="act-move" class="btn text" type="button">이동</button>
        <button id="act-map" class="btn text" type="button">지도 보기</button>
        <button id="act-delete" class="btn text" type="button">삭제</button>
      </div>
    </section>
    <section class="sec" id="concepts-sec" aria-label="개념" hidden>
      <div class="sec-head">
        <h2 class="sec-title" id="concepts-title">개념</h2>
        <button id="add-concept-btn" class="btn text" type="button">개념 추가</button>
      </div>
      <p id="concepts-msg" class="msg" role="alert"></p>
      <form id="explain-form" class="explain-form" novalidate>
        <label for="explain-term" class="sec-label">개념 검색</label>
        <div class="explain-row">
          <input id="explain-term" type="text" maxlength="80" autocomplete="off" placeholder="낯선 개념을 입력해 설명 받기">
          <button id="explain-go" class="btn" type="submit">설명 받기</button>
        </div>
      </form>
      <div id="explain-card" class="explain-card" hidden aria-live="polite"></div>
      <ul id="concept-list"></ul>
      <p id="concepts-empty" class="hint" hidden>이 주제에는 아직 개념이 없습니다.</p>
    </section>
  </div>
 </div>

 <!-- 작업273-2: 지도 화면(최상위 주제 하나의 지도) -->
 <div id="map-view" hidden>
  <div class="screen-bar">
    <button id="map-back" class="screen-bar-back" type="button" aria-label="주제 화면으로"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>

    <div class="map-tools">

    </div>
    <div class="map-tools">
      <span id="map-save-state" class="map-save-state" role="status"></span>
      <button id="map-save" class="btn text" type="button">저장</button>
      <button id="map-opt" class="btn text" type="button">배치 최적화</button>
      <button id="map-undo" class="btn text" type="button" hidden>되돌리기</button>

    <div id="map-pick-panel" class="map-pick" hidden><div id="map-pick-list"></div></div>
    <p id="map-hint" class="hint"></p>
    <div class="map-canvas"><div id="map-opt-bar" class="map-opt-bar" hidden><span id="map-opt-info"></span><button id="map-opt-apply" class="btn" type="button">적용</button><button id="map-opt-cancel" class="btn text" type="button">취소</button></div><svg id="map-svg" role="group" aria-label="개념 지도"></svg><p id="map-msg" class="msg" role="alert"></p></div>
  </div>
 </div>
</div>

<dialog id="name-dlg" aria-labelledby="name-heading">
  <form id="name-form" novalidate>
    <h3 id="name-heading"></h3>
    <div class="field"><label id="name-label" for="name-input"></label><input id="name-input" type="text" maxlength="80" autocomplete="off"></div>
    <p id="name-msg" class="msg" role="alert"></p>
    <div class="btn-row"><button id="name-cancel" class="btn text" type="button">취소</button><button id="name-ok" class="btn" type="submit">저장</button></div>
  </form>

<dialog id="move-dlg" aria-labelledby="move-heading">

    <h3 id="move-heading">주제 이동</h3>

    <div class="btn-row"><button id="move-cancel" class="btn text" type="button">취소</button><button id="move-ok" class="btn" type="submit">이동</button></div>

<dialog id="confirm-dlg" aria-labelledby="confirm-heading">
  <form id="confirm-form" novalidate>
    <h3 id="confirm-heading"></h3>
    <p id="confirm-text" class="body-text"></p>
    <p id="confirm-msg" class="msg" role="alert"></p>
    <div class="btn-row"><button id="confirm-cancel" class="btn text" type="button">취소</button><button id="confirm-ok" class="btn danger" type="submit">삭제</button></div>

<dialog id="edge-dlg" aria-labelledby="edge-heading">
  <form id="edge-form" novalidate>

    <p id="edge-type-hint" class="hint"></p>

    <div class="btn-row"><button id="edge-delete" class="btn text" type="button" hidden>연결 삭제</button><button id="edge-cancel" class="btn text" type="button">취소</button><button id="edge-ok" class="btn" type="submit">저장</button></div>
  </form>
</dialog>

<dialog id="concept-dlg" aria-labelledby="concept-heading">
  <form id="concept-form" novalidate>
    <h3 id="concept-heading"></h3>
    <div class="field"><label for="concept-term">개념 이름</label><input id="concept-term" type="text" maxlength="80" autocomplete="off"></div>
    <div class="field"><label for="concept-english">영문 표기 (선택)</label><input id="concept-english" type="text" maxlength="120" autocomplete="off"></div>
    <div class="field"><label for="concept-memo">메모 (선택)</label><textarea id="concept-memo" maxlength="2000"></textarea></div>
    <p class="sec-label" style="margin-top:14px">설명 (선택)</p>
    <div class="field"><label for="concept-ex-definition">정의</label><textarea id="concept-ex-definition" maxlength="220"></textarea></div>
    <div class="field"><label for="concept-ex-in_context">이 주제에서의 의미</label><textarea id="concept-ex-in_context" maxlength="220"></textarea></div>
    <div class="field"><label for="concept-ex-example">쉬운 예</label><textarea id="concept-ex-example" maxlength="150"></textarea></div>
    <div class="field"><label for="concept-ex-confusion">헷갈리기 쉬운 점</label><textarea id="concept-ex-confusion" maxlength="150"></textarea></div>
    <p id="concept-msg" class="msg" role="alert"></p>
    <div class="btn-row"><button id="concept-cancel" class="btn text" type="button">취소</button><button id="concept-ok" class="btn" type="submit">저장</button></div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
function getToken() { try { return localStorage.getItem('mydict_token'); } catch (e) { return null; } }

// 개발 중인 화면이므로 fail-closed: /api/me 가 성공하고 perm_concept_map 이 명시적으로 true 일 때만 보여 준다
// (옛 개념학습은 명시적 false 일 때만 거부하는 fail-open 이다)
async function hasPermission() {
  const token = getToken();
  if (!token) return false;
  try {
    const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) return false;

// 응답을 { status, body }로 돌려준다. 네트워크 오류는 status 0

      body: body === undefined ? undefined : JSON.stringify(body),

const byId = id => S.topics.find(t => t.id === id) || null;
const childrenOf = pid => S.topics.filter(t => (t.parent_id === undefined ? null : t.parent_id) === pid).sort((a, b) => a.sort_order - b.sort_order || a.id - b.id);

// ── 작업273-1: 개념 검색 → AI 백과사전 설명 → 읽고(고치고) 저장 ──
// 자동 재시도는 하지 않는다(AI 비용 보호): 오류 카드의 [다시 시도]와 설명 카드의 [다시 설명]은 사용자가 누를 때만 요청한다.
// 40초 안에 응답이 없으면 요청을 끊고 오류 카드를 보인다(테스트에서만 window.__CMAP_AI_TIMEOUT_MS 로 덮어씀).
const EXPLAIN_TIMEOUT_MS = 40000;

  clearTimeout(tm);

  if (r.status === 200 && r.body.ok && r.body.existing) {

    S.highlightId = r.body.concept.id;
    renderExplain(); renderConcepts();
    const el = document.querySelector('#concept-list [data-id="' + r.body.concept.id + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (r.status === 200 && r.body.ok && r.body.explanation) {
    const f = {};
    for (const k of Object.keys(EXPLAIN_LABELS)) f[k] = r.body.explanation[k] || '';

    renderExplain();

  }
  // 429(하루 한도)는 다시 시도해도 소용없으므로 버튼 없이 안내만
  S.explain = { status: 'error', term, message: errText(r, '설명을 가져오지 못했습니다. 잠시 후 다시 시도해주세요.'), retry: r.status !== 429 };
  renderExplain();
}

function renderExplain() {
  const card = $('explain-card');
  const e = S.explain;
  card.textContent = '';
  card.hidden = !e;
  $('explain-go').disabled = !!e && e.status === 'loading';
  if (!e) return;
  if (e.status === 'loading') {
    card.append(h('div', { class: 'e-term', text: e.term }), h('p', { class: 'e-note', role: 'status', 'data-t': 'explain-loading', text: '설명을 만드는 중…' }),
      h('div', { class: 'btn-row' }, h('button', { class: 'btn text', type: 'button', 'data-t': 'explain-cancel', text: '취소', onclick: closeExplain })));
    return;
  }
  if (e.status === 'error') {
    card.append(h('div', { class: 'e-term', text: e.term }), h('p', { class: 'msg', role: 'alert', 'data-t': 'explain-error', text: e.message }),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn text', type: 'button', 'data-t': 'explain-close', text: '닫기', onclick: closeExplain }),
        e.retry ? h('button', { class: 'btn', type: 'button', 'data-t': 'explain-retry', text: '다시 시도', onclick: () => requestExplain(e.term) }) : null));
    return;
  }
  if (e.status === 'existing') {
    card.append(h('div', { class: 'e-term', text: e.term }), h('p', { class: 'e-note', 'data-t': 'explain-existing', text: '이 주제에 이미 있는 개념이에요. 아래 목록에서 저장된 설명을 볼 수 있어요.' }),
      h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', 'data-t': 'explain-close', text: '확인', onclick: () => { S.highlightId = null; closeExplain(); renderConcepts(); } })));
    return;
  }
  // ready: 4항목을 읽고 고칠 수 있다
  const fields = h('div', {});
  for (const k of Object.keys(EXPLAIN_LABELS)) {
    const ta = h('textarea', { id: 'explain-f-' + k, maxlength: 250, 'data-t': 'explain-field', 'data-k': k });
    ta.value = e.fields[k];
    ta.addEventListener('input', () => { e.fields[k] = ta.value; });
    fields.append(h('div', { class: 'field' }, h('label', { for: 'explain-f-' + k, text: EXPLAIN_LABELS[k] }), ta));
  }
  const en = h('input', { id: 'explain-english', type: 'text', maxlength: 120, autocomplete: 'off', 'aria-label': '영문 표기' });
  en.value = e.english;
  en.addEventListener('input', () => { e.english = en.value; });
  const msg = h('p', { class: 'msg', role: 'alert', id: 'explain-msg', 'data-t': 'explain-msg' });
  const saveBtn = h('button', { class: 'btn', type: 'button', id: 'explain-save', 'data-t': 'explain-save', text: '저장' });
  saveBtn.addEventListener('click', async () => {
    if (!e.fields.definition.trim()) { msg.textContent = '정의는 비워 둘 수 없습니다.'; return; }
    const edited = Object.keys(EXPLAIN_LABELS).some(k => e.fields[k].trim() !== e.orig[k].trim());
    saveBtn.disabled = true;
    const topicId = S.selectedId;
    const r = await api('POST', '/api/cmap/topics/' + topicId + '/concepts', { term: e.term, english: e.english, explanation: e.fields, explanation_source: edited ? 'manual' : 'ai' });
    saveBtn.disabled = false;
    if (!okStatus(r)) { msg.textContent = errText(r); return; }
    S.highlightId = r.body.concept.id;
    $('explain-term').value = '';
    closeExplain();
    await refresh();
  });
  card.append(
    h('div', { class: 'e-term', text: e.term }),
    h('p', { class: 'sec-label', 'data-t': 'explain-label', style: 'margin-top:4px', text: 'AI 설명 · 확인 필요' }),
    h('div', { class: 'field' }, h('label', { for: 'explain-english', text: '영문 표기 (선택)' }), en),
    fields, msg,
    h('div', { class: 'btn-row' },
      h('button', { class: 'btn text', type: 'button', 'data-t': 'explain-cancel', text: '취소', onclick: closeExplain }),
      h('button', { class: 'btn text', type: 'button', 'data-t': 'explain-again', text: '다시 설명', onclick: () => requestExplain(e.term) }),
      saveBtn));
}

$('explain-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const term = $('explain-term').value.trim();
  if (!term) { $('concepts-msg').textContent = '검색할 개념을 입력해 주세요.'; return; }
  $('concepts-msg').textContent = '';
  S.highlightId = null;
  requestExplain(term);
});

function deleteConcept(c) {
  openConfirm({
    heading: '개념 삭제',
    text: '‘' + c.term + '’ 개념을 삭제합니다.\n지도에서 쓰고 있는 개념이면 지도의 노드와 연결도 함께 사라져요.',
    action: async () => {
      const r = await api('DELETE', '/api/cmap/concepts/' + c.id);
      if (!okStatus(r) && r.status !== 404) return { failed: errText(r) };
      await refresh();
      return {};
    },
  });
}

// ── 작업273-2: 지도 보기 ──
$('act-map').addEventListener('click', () => {
  let root = byId(S.selectedId);
  if (!root) return;
  while (root.parent_id !== null && root.parent_id !== undefined) root = byId(root.parent_id);
  window.CmapMap.open(root.id);
});
$('map-back').addEventListener('click', () => { window.CmapMap.close(); refresh(); });
$('map-pick-toggle').addEventListener('click', () => window.CmapMap.togglePanel());

// ── 시작 ──
function applyHeaderHeight() {
  const hdr = document.querySelector('.metis-app-header');
  if (hdr) document.documentElement.style.setProperty('--hdr-h', hdr.offsetHeight + 'px');
}
window.addEventListener('resize', applyHeaderHeight);
$('back-btn').addEventListener('click', () => { location.href = '/'; });

(async function init() {
  const allowed = await hasPermission();
  $('loading').hidden = true;
  if (!allowed) { $('access-denied').hidden = false; return; }
  $('app').hidden = false;
  applyHeaderHeight();
  await refresh();
  if (S.topics.length && S.selectedId === null) selectTopic(childrenOf(null)[0].id);
})();
</script>
</body>
</html>
