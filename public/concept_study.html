<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>개념학습 - METIS</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common/appHeader.css">
<link rel="stylesheet" href="/css/common/tokens.css">
<link rel="stylesheet" href="/css/common/screenBar.css">
<style>
  /* 작업195: 개념학습. 개념 하나에서 시작해 AI가 쉬운 설명과 다음 한 걸음을 제안한다.
     METIS 미니멀 디자인 원칙(docs/design/design-principles.md): 카드·뱃지 없이 여백과 1px 구분선,
     포인트 색은 코랄 하나, 터치 영역 44px 이상, 인라인 SVG 아이콘만. */
  /* 작업200: 사전(english_dictionary.html)의 색을 그대로 쓴다. 다크모드는 쓰지 않는다. 반경·글자 같은 색 아닌 값은 /css/common/tokens.css */
  :root {
    --bg: var(--color-bg, #f5f7ff);
    --surface: var(--color-surface, #ffffff);
    --surface2: var(--color-surface-2, #eef1fb);
    --text: var(--color-text, #1a1f3c);
    --text2: var(--color-text-sub, #4a5070);
    --line: var(--color-line, #dde2f5);
    --accent: var(--color-accent, #e2583b);
    --accent-text: var(--color-accent-ink, #b8442e);
    --on-accent: var(--color-surface, #fff);
    --danger: var(--color-danger, #dc2626);
    --focus: var(--color-text, #1a1f3c);
    --node-line: #868ca8;   /* 지도 노드 테두리: 흰 배경 대비 3.3:1(비텍스트 3:1 이상) */
    --success-dark: var(--color-ok-ink, #085041);   /* 작업217-3: 정답 글자(흰 바탕 약 10:1). 음성 학습·읽기 화면의 --success-dark와 같은 값 */
    --info-bg: var(--color-surface-2, #eef1fb);     /* 안내 박스 배경(코랄 연한 색) */
    --navbar-h: 78px;       /* 작업226-3: 하단 내비 높이(음성 학습·사전과 같은 값) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    line-height: 1.6;
    font-size: var(--body-font-size);
    /* 작업223: 문학 나침반·음성 학습·한입 독서와 같은 방식 — 본문 열(--content-max)을 가운데에 두어, 공용 헤더·제목 바도 같은 열 안에 오게 함(태블릿 폭에서 왼쪽으로 쏠리던 문제) */
    max-width: var(--content-max);
    margin: 0 auto;
  }
  button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .wrap { max-width: var(--content-max); margin: 0 auto; padding: 0 16px; }
  /* 작업226-3: 하단 내비(78px) 위에 입력 바가 얹히므로 학습 화면의 하단 여백 = 내비 + 입력 바(--ask-h, 실제 높이를 측정해 넣음) + 여유. 퀴즈 중에는 입력 바가 없으니 내비만 */
  #app { padding-bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom) + 16px); }
  #app.in-study { padding-bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom) + var(--ask-h, 76px) + 16px); }
  #app.in-study.in-quiz { padding-bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom) + 16px); }

  /* 로딩·권한 없음 */
  #loading, #access-denied { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #loading p, #access-denied p { color: var(--text2); font-size: 14px; }
  #access-denied h2 { font-size: 20px; font-weight: 800; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  /* 공통 요소 */
  /* 작업220: 섹션 제목 규격 — 12px / 700 / --accent-text(#b8442e, 페이지 바탕 위 5.25:1) / 블록으로 쓰이는 제목은 아래 2px 코랄 선(장식) */
  .label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent-text); text-transform: uppercase; }
  .muted { color: var(--text2); }
  .small { font-size: 13px; }
  /* 작업220: 주 버튼 규격 — 높이 최소 44px, 15px / 600, 좌우 padding 20px, 테두리 없음 */
  .btn { min-height: 44px; padding: 10px 20px; border: none; font-size: 15px; background: var(--surface2); border-radius: var(--btn-radius); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e)); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { background: var(--btn-primary-bg-hover, #9c3a27); }
  .btn.primary:active:not(:disabled) { background: var(--btn-primary-bg-active, #86311f); }
  /* 작업216-4: 보조 동작은 박스 없이 텍스트(음성 학습의 .btn.text와 같은 사양). 터치 영역: 높이 44px(.btn) + 가로 44px 이상(min-width).
     글자 대비(계산값): --text2 #4a5070 은 흰 바탕 7.86:1 / --bg 7.35 / 안내 상자 7.05 / 오류 상자 6.82, 위험 --danger #B42318 은 6.57 / 6.15 / 5.90 / 5.70 (모두 4.5:1 이상).
     이 화면의 .btn에는 :hover 채움 규칙이 없어 호버에서 바탕이 새지 않는다. 포커스 윤곽선은 전역 :focus-visible(2px, --focus)을 쓴다. */
  /* 작업220: 텍스트 버튼 규격 — 15px / 600, 보조색, padding 0 8px, 최소 44×44px, 밑줄 */
  .btn.text { background: transparent; border: none; padding: 0 8px; min-height: 44px; min-width: 44px; font-size: 15px; font-weight: 600; color: var(--text2); text-decoration: underline; text-underline-offset: 3px; }
  .btn.text:hover:not(:disabled), .btn.text:active:not(:disabled) { background: transparent; color: var(--text); }
  .btn.text.danger { color: var(--danger); }
  .btn.text.danger:hover:not(:disabled), .btn.text.danger:active:not(:disabled) { color: var(--danger); }
  .btn.block { display: flex; width: 100%; }
  .iconbtn { width: 44px; height: 44px; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--text2); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  input[type=text], textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--input-radius); padding: 11px 12px; min-height: 44px; line-height: 1.5;
  }
  textarea { resize: vertical; min-height: 88px; }
  .field { margin-top: 14px; }
  .field > .label { display: block; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  .counter { font-size: 12px; color: var(--text2); text-align: right; margin-top: 2px; }
  .msg { position: relative; margin-top: 12px; padding: 10px 0 10px 24px; font-size: 13px; font-weight: 500; line-height: 1.6; }
  /* 작업217-4: 메시지는 색 바탕·테두리 없이 앞의 기호와 글자색으로 구분한다. ✕ 오류(--danger 흰 바탕 6.57:1) / i 안내(--accent-text 5.38:1) */
  .msg::before { position: absolute; left: 2px; top: 10px; width: 16px; text-align: center; font-weight: 800; }
  .msg:empty { display: none; }
  .msg.error, .msg.err-block { color: var(--danger); }
  .msg.error::before, .msg.err-block::before { content: '✕'; }
  .msg.info { color: var(--accent-text); }
  .msg.info::before { content: 'i'; }
  .busy-line { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 14px; margin-top: 12px; }
  .busy-line .spinner { width: 20px; height: 20px; border-width: 2px; }   /* 작업220: 버튼 안·인라인 스피너 20px */

  /* 목록 화면 */
  .view-head { padding: 24px 0 8px; }
  /* 작업220: 목록 첫 화면 제목 22px / 700 / 주 글자색 */
  .view-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .view-sub { color: var(--text2); font-size: 14px; margin-top: 4px; }
  .rows { margin-top: 16px; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
  .row-main { flex: 1; min-width: 0; text-align: left; background: transparent; border: none; padding: 14px 4px; min-height: 56px; }
  .row-title { font-size: 17px; font-weight: 700; word-break: break-all; }
  .row-meta { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .row-meta b { font-weight: 700; color: var(--text); }
  .row-actions { display: flex; align-items: center; }
  .row-edit { flex: 1; padding: 10px 0; }
  .empty-state { padding: 40px 0; text-align: center; color: var(--text2); line-height: 1.8; }
  .start-form { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 4px; }

  /* 학습 화면 */
  /* 작업200: 학습 화면 제목 줄은 공용 /css/common/screenBar.css(.screen-bar) */
  .seg { display: inline-flex; }
  .seg button { min-height: 44px; padding: 0 12px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text2); font-weight: 500; }
  .seg button[aria-pressed=true] { color: var(--text); font-weight: 800; border-bottom-color: var(--accent); }
  .section { padding: 22px 0; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--hdr-h, 65px) + 72px); }
  .section:last-of-type { border-bottom: none; }
  .term { font-size: 26px; font-weight: 800; line-height: 1.3; word-break: break-all; letter-spacing: -0.01em; }
  .english { color: var(--text2); font-size: 14px; margin-top: 2px; word-break: break-all; }
  .group { font-size: 13px; color: var(--text2); margin-top: 6px; }
  .source { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; margin-top: 10px; color: var(--accent-text); }
  .source.user { color: var(--text2); }
  .place { font-size: 13px; color: var(--text2); margin-top: 8px; }
  .sec { margin-top: 18px; }
  .sec > .label { display: block; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  .sec p { white-space: pre-wrap; word-break: break-word; }
  .sec.quote p { border-left: 2px solid var(--accent); padding-left: 12px; }
  .empty-explain { margin-top: 16px; color: var(--text2); }
  .state-note { margin-top: 10px; font-size: 13px; color: var(--text2); border-left: 2px solid var(--line); padding-left: 10px; }
  /* 작업217-3: 이해함 토글은 박스 없이 글자. 평소 현재 레이블(--text2), 켜짐(aria-pressed=true)은 앞에 "✓ " + --accent-text(#b8442e) + 굵게 */
  .toggle { min-height: 44px; padding: 0 8px; background: transparent; border: none; border-radius: 0; display: inline-flex; align-items: center; gap: 0; font-weight: 500; color: var(--text2); }
  .toggle[aria-pressed=true] { color: var(--accent-text); font-weight: 800; }
  .toggle[aria-pressed=true]::before { content: '✓ '; white-space: pre; }
  .toggle .ic { display: none; }
  .toggle:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
  .save-state { font-size: 12px; color: var(--text2); min-height: 18px; margin-top: 2px; }

  /* 다음 한 단계 */
  .next-main { margin-top: 12px; }
  .next-term { font-size: 20px; font-weight: 800; word-break: break-all; }
  .kv { margin-top: 10px; }
  .kv .label { display: block; margin-bottom: 1px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  .actions { margin-top: 16px; }
  .alts { margin-top: 18px; border-top: 1px solid var(--line); }
  .alts > summary { list-style: none; min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text2); cursor: pointer; }
  .alts > summary::-webkit-details-marker { display: none; }
  .alts > summary .ic { transition: transform 0.15s; }
  .alts[open] > summary .ic { transform: rotate(90deg); }
  .alt { padding: 14px 0; border-top: 1px solid var(--line); }
  .alt:first-of-type { border-top: none; }
  .alt-term { font-size: 16px; font-weight: 700; word-break: break-all; }
  .react { margin-top: 18px; padding-top: 4px; border-top: 1px solid var(--line); }
  .react .label { display: block; margin: 10px 0 2px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }

  /* 학습 기록: 진행 막대 + 선택 경로 */
  .record { padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
  .progress { display: flex; align-items: center; gap: 10px; }
  .progress .bar { flex: 1; height: 4px; background: var(--line); }
  .progress .bar > i { display: block; height: 100%; background: var(--accent); }
  .progress .count { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .progress .count b { color: var(--text); font-weight: 800; }
  .path-line { display: flex; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 14px; }
  .path-line .sep { color: var(--text2); padding: 0 2px; }
  .path-line button { min-height: 44px; min-width: 44px; padding: 0 6px; background: transparent; border: none; font-weight: 500; color: var(--text2); max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .path-line button[aria-current=true] { color: var(--text); font-weight: 800; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 5px; text-decoration-thickness: 2px; }

  /* 지도 */
  .map-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 6px; }
  .map-tools .btn { min-height: 44px; padding: 0 10px; background: transparent; border-color: transparent; font-weight: 500; color: var(--text2); }
  .map-tools .btn[aria-pressed=true] { color: var(--text); font-weight: 800; border-bottom: 2px solid var(--accent); }
  .map-box { height: 400px; border: 1px solid var(--line); border-radius: var(--card-radius); background: var(--surface); overflow: hidden; touch-action: none; position: relative; }
  .map-open-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .map-open-row .btn { min-height: 44px; }
  .map-open-meta { font-size: 13px; color: var(--text2); }
  html.map-open, html.map-open body { overflow: hidden; }
  dialog.map-sheet { padding: 0; border: none; border-radius: 0; margin: 0; max-width: none; max-height: none; width: 100vw; height: 100vh; height: 100dvh; overscroll-behavior: contain; overflow: hidden; }
  dialog.map-sheet[open] { display: flex; flex-direction: column; }
  @media (min-width: 768px) {
    dialog.map-sheet { margin: auto; width: min(1200px, calc(100vw - 48px)); height: calc(100vh - 48px); height: calc(100dvh - 48px); border: 1px solid var(--line); border-radius: var(--card-radius); }
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 800; }
  .sheet-head .btn { min-height: 44px; min-width: 44px; }
  .sheet-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 8px 12px 12px; }
  .sheet-body .map-box { flex: 1 1 auto; min-height: 0; height: auto; }
  .sheet-body .map-hint { margin: 6px 0 0; }
  .map-box svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .map-hint { font-size: 12px; color: var(--text2); margin-top: 6px; }
  /* 작업227-18: 지도 인사이트 패널(접힘이 기본). 박스 없이 구분선 행으로 */
  .map-ins { flex: 0 0 auto; border-top: 1px solid var(--line); margin-top: 6px; }
  .map-ins-toggle { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: transparent; border: 0; padding: 0 4px; font-weight: 700; color: var(--text); cursor: pointer; }
  .map-ins-list { list-style: none; margin: 0; padding: 0; max-height: min(30vh, 220px); overflow-y: auto; }
  .map-ins-list li { border-top: 1px solid var(--line); }
  .map-ins-row { display: block; width: 100%; min-height: 44px; text-align: left; background: transparent; border: 0; padding: 8px 4px; font-size: 14px; line-height: 1.5; color: var(--text); cursor: pointer; }
  .map-ins-row[aria-pressed=true] { font-weight: 800; box-shadow: inset 3px 0 0 var(--accent); padding-left: 10px; }
  .map-ins-row .on { display: block; font-size: 12px; font-weight: 700; color: var(--accent-text); }
  div.map-ins-row { cursor: default; }
  .sheet-body .map-box { min-height: 160px; }
  .m-edge path.line { fill: none; stroke: var(--text2); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .m-edge path.hit { fill: none; stroke: transparent; stroke-width: 28; cursor: pointer; vector-effect: non-scaling-stroke; pointer-events: stroke; }   /* 눈에 안 보이는 두꺼운 클릭 영역(화면 28px 고정) */
  .m-edge.hl path.line { stroke: var(--text); stroke-width: 2.5; }
  .m-edge.dim { opacity: 0.25; }
  .m-edge text { font-size: 11px; fill: var(--text2); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; pointer-events: none; }
  .m-edge.hl text { fill: var(--text); font-weight: 700; }
  .m-edge.ghost path.line { stroke: var(--accent); stroke-dasharray: 5 4; }
  .m-node { cursor: pointer; }
  .m-node rect { fill: var(--surface); stroke: var(--node-line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .m-node text { font-size: 13px; fill: var(--text); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .m-node.hl rect { stroke: var(--text); stroke-width: 2; }
  .m-node.hl text { font-weight: 700; }
  .m-node.sel rect { stroke: var(--accent); stroke-width: 3; }
  .m-node.sel text { font-weight: 800; }
  .m-node.dim { opacity: 0.35; }
  .m-node.path { opacity: 0.75; }
  .map-box marker path { fill: var(--text); }
  .m-node.ghost rect { stroke: var(--accent); stroke-dasharray: 5 4; fill: transparent; }
  .m-node.ghost text { fill: var(--accent-text); font-weight: 700; }
  .m-node:focus-visible rect { outline: none; stroke: var(--focus); stroke-width: 3; }
  .m-edge:focus-visible { outline: none; }
  .m-edge:focus-visible path.line { stroke: var(--focus); stroke-width: 3; }
  .m-label { font-size: 12px; fill: var(--text2); font-weight: 700; }
  .map-note { color: var(--text2); padding: 18px 0; }

  /* 목록 보기 */
  .grp { margin-top: 18px; }
  .grp:first-child { margin-top: 0; }
  .grp > .label { display: block; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  .grp-head { display: grid; grid-template-columns: 24px 1fr; align-items: center; width: 100%; min-height: 44px; padding: 6px 0; text-align: left; background: transparent; border: none; border-bottom: 1px solid var(--line); }
  .grp-head .ic { transition: transform 0.15s; color: var(--text2); }
  .grp-head[aria-expanded=true] .ic { transform: rotate(90deg); }
  .grp-head .grp-name { padding-bottom: 0; border-bottom: none; word-break: break-all; }
  .grp-sum { grid-column: 2; font-size: 12px; color: var(--text2); }
  .lrow { display: flex; align-items: center; border-bottom: 1px solid var(--line); }

  /* 보류·제외 관리 */

  select { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--input-radius); padding: 11px 12px; min-height: 44px; line-height: 1.5; color: inherit; }
  /* 연결 목록·추가 */
  .lk { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .lk-row { display: flex; align-items: center; gap: 8px; }
  .lk-pair { font-weight: 700; word-break: break-all; }
  .lk .btn.text { min-width: 44px; }   /* 터치 영역 44px */
  .lk-meta { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .lk-reason { margin-top: 4px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .lk-reason .lk-reason-h { font-weight: 700; color: var(--text2); }
  .lk-edit { margin-top: 8px; }

  /* 음성 입력 */
  .with-mic { display: flex; gap: 8px; }
  .with-mic input { flex: 1; min-width: 0; }
  /* 작업217-2: 마이크는 박스 없이 아이콘만(44×44px 유지). 꺼짐=--text2(흰 바탕 7.86:1), 켜짐(aria-pressed=true)=--danger(흰 바탕 6.57:1)+굵게+밑줄.
     아이콘이라 글자 밑줄이 보이지 않으므로 아래쪽 2px 선(::after)으로 밑줄을 그린다(테두리가 아님) */
  .btn.mic { width: 44px; padding: 0; flex: none; position: relative; background: transparent; border: none; color: var(--text2); }
  .ask .btn.mic { padding: 0; }
  .btn.mic[aria-pressed=true] { color: var(--danger); font-weight: 800; text-decoration: underline; }
  .btn.mic[aria-pressed=true]::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 6px; height: 2px; background: var(--danger); }
  /* 돌아보기 퀴즈 */
  .qz-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 14px; }
  /* 작업217-3: 문제 영역은 테두리·둥근 모서리 없이 흰 바탕 면만 */
  .qz-q { margin: 10px -16px 0; padding: 16px; border: none; border-radius: 0; background: var(--surface); }   /* 작업222: 글자 시작 x 16px */
  .qz-prompt { margin-top: 6px; font-size: 18px; font-weight: 700; white-space: pre-wrap; word-break: break-word; }
  /* 작업217-3: 보기는 박스 없이 행(보기 사이는 아래 구분선). 상태는 색 하나로만 구분하지 않고 기호(○ ✕)와 굵기·밑줄을 함께 쓴다.
     정답 ○+--success-dark(흰 바탕 약 10:1), 내가 고른 오답 ✕+--danger(6.57:1), 고른 보기는 밑줄. 답한 뒤 버튼은 disabled라서 흐려지지 않게 opacity 1 */
  .qz-opts { display: grid; gap: 0; margin-top: 12px; }
  .btn.qz-opt { width: 100%; min-height: 44px; padding: 12px 0; align-items: flex-start; justify-content: flex-start; text-align: left; font-size: 15px; font-weight: 400; white-space: normal; word-break: break-word;
    background: transparent; border: none; border-bottom: 1px solid var(--line); border-radius: 0; color: var(--text); }
  .qz-opts .btn.qz-opt:last-child { border-bottom: none; }
  .btn.qz-opt:disabled { opacity: 1; }
  .qz-opt.right { color: var(--success-dark); font-weight: 700; }
  .qz-opt.wrong { color: var(--danger); font-weight: 700; }
  .qz-opt.mine > span:last-child { text-decoration: underline; text-underline-offset: 3px; }
  .qz-mark { flex: none; width: 16px; text-align: center; font-weight: 800; }
  /* 작업221: 보기 번호(폭 20px 고정, 보조색) — 다른 화면의 4지선다와 같은 모양 */

  /* ── 하단 내비 (작업226-3): 음성 학습·언어 사전의 하단 내비(작업224-2)와 같은 구조·크기. 색은 이 화면의 팔레트 ── */

  /* 퀴즈·지도를 학습 목록에서 누르면 뜨는 "어떤 학습으로 할까요?" 고르기(음성 학습의 과목 고르기와 같은 dialog 방식, 텍스트 행) */

  .bottom-bar { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--content-max); bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom)); z-index: 120; background: var(--bg); border-top: 1px solid var(--line); }   /* 작업226-3: 하단 내비 위에 붙음(안전영역은 내비가 맡음) */

</style>

<script>
'use strict';
const $ = id => document.getElementById(id);
const TERM_MAX = 80;
const AI_FAIL_TEXT = 'AI 설명을 받지 못했습니다. 다시 받아 보세요.';
const TEXT_FIELDS = [
  ['definition', '정의', 2000],
  ['example', '예시', 1000],
  ['simple_text', '쉬운 설명', 1000],
  ['deeper_text', '더 깊게 설명', 1000],
];

// ── 로그인·권한(한입 독서·과학·음성 학습과 같은 구조) ──
function getToken() { try { return localStorage.getItem('mydict_token'); } catch (e) { return null; } }
// /api/me의 perm_concept_study가 명시적으로 false일 때만 차단하고, 토큰 없음·응답 오류·예외·필드 없음은 통과(fail-open)
async function checkPermission() {
  const token = getToken();
  if (!token) return true;
  try {
    const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) return true;
    const me = await r.json();
    return me.perm_concept_study !== false;
  } catch (e) { return true; }
}

// 응답을 { status, body }로 돌려준다. 네트워크 오류는 status 0
async function api(method, url, body) {
  try {
    const r = await fetch(url, {
      method,
      headers: Object.assign({ Authorization: 'Bearer ' + getToken() }, body === undefined ? {} : { 'Content-Type': 'application/json' }),
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    let json = null;
    try { json = await r.json(); } catch (e) { /* 본문 없음 */ }
    return { status: r.status, body: json };
  } catch (e) { return { status: 0, body: null }; }
}

function errText(r, fallback) {
  if (r.status === 0) return '네트워크에 연결할 수 없습니다. 입력한 내용은 그대로 두었으니 연결을 확인한 뒤 다시 시도해 주세요.';
  if (r.status === 401) return '로그인이 필요합니다. 홈에서 로그인한 뒤 다시 열어 주세요.';
  if (r.status === 403) return '개념학습 이용 권한이 없습니다.';
  if (r.status === 404) return '찾을 수 없습니다. 이미 삭제되었을 수 있습니다.';
  if (r.status === 503) return '지금은 이 기능을 사용할 수 없습니다.';
  if (r.body && r.body.error && (r.status === 400 || r.status === 409 || r.status === 429)) return r.body.error;   // 서버 문구 그대로
  return fallback || '문제가 발생했습니다. 잠시 후 다시 시도해 주세요.';
}

// ── DOM 도우미(데이터는 항상 textContent로만 넣는다) ──
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

function startRename(row, s) {
  const input = h('input', { type: 'text', maxlength: 80, value: s.topic, 'aria-label': '분야 이름' });

        const r = await busy('저장하는 중…', () => api('PATCH', '/api/concepts/studies/' + s.id, { topic }));

async function deleteStudy(s) {
  if (!(await metisConfirm("'" + s.topic + "' 학습과 그 안의 개념 " + s.item_count + '개가 모두 삭제됩니다. 삭제할까요?', { danger: true }))) return;

el('start-form').addEventListener('submit', async ev => {

  const msg = el('start-msg');

// ── 학습 화면 ──
async function loadStudy(id) {
  const r = await api('GET', '/api/concepts/studies/' + id);
  if (r.status !== 200) {
    S.study = null;
    el('study-title').textContent = '개념학습';
    el('detail-wrap').hidden = true; el('study-empty').hidden = true;
    el('study-msg').className = 'msg error'; el('study-msg').textContent = errText(r);
    return;
  }
  S.study = r.body.study; S.items = r.body.items; S.links = r.body.links;
  const sel = r.body.study.selected_item_id;
  const path = r.body.study.path || [];
  S.selId = itemById(sel) ? sel : (path.length ? path[path.length - 1] : (S.items[0] ? S.items[0].id : null));
  if (!itemById(S.selId)) S.selId = S.items[0] ? S.items[0].id : null;
  renderStudy();
}

function renderStudy() {
  el('study-title').textContent = S.study.topic;
  const msg = el('study-msg');
  msg.textContent = '';
  if (S.notice && S.notice.studyId === S.study.id && (S.notice.itemId === null || S.notice.itemId === S.selId)) {
    msg.className = S.notice.info ? 'msg info' : 'msg err-block';
    msg.append(S.notice.text);
    if (S.notice.retryFn) msg.append(' ', h('button', { class: 'btn text', type: 'button', 'data-t': 'ai-retry', onclick: () => S.notice.retryFn() }, '다시 받기'));

  updateNav();

  el('detail-wrap').hidden = !hasItems || inQuiz;

// ── 학습 기록: 이해 진행 막대 + 선택 경로(A › B › C) ──
function renderRecord() {
  const rec = el('record');

  const bar = el('progress-bar');
  bar.setAttribute('aria-valuemax', String(total)); bar.setAttribute('aria-valuenow', String(understood));
  bar.firstElementChild.style.width = Math.round(understood / total * 100) + '%';
  const cnt = el('progress-count');
  cnt.textContent = '';
  cnt.append(h('b', {}, understood), ' / ' + total);
  const nav = el('path-line');

// ── 목록 보기(작업204): [목록 | 그룹] 전환. 그룹은 group_label 기준(접기·펼치기, 개수·이해 상태 요약). 접힘 상태는 화면에서만 유지 ──
const REVIEW_TEXT = { understood: '이해함', confused: '헷갈림', new: '학습 전' };
S.listMode = 'group';           // 'flat'(목록) | 'group'(그룹)
S.grpCollapsed = new Set();     // 접어 둔 그룹 이름('' = 그룹 없음). 서버에 저장하지 않는다
function listRow(it) {
  return h('div', { class: 'lrow', 'data-id': it.id },
    h('button', { class: 'lrow-main', type: 'button', 'data-t': 'list-item', 'aria-current': it.id === S.selId ? 'true' : null, onclick: () => selectItem(it.id) },
      h('div', { class: 'lrow-term' }, it.term),
      h('div', { class: 'lrow-meta' }, (REVIEW_TEXT[it.review_state] || '학습 전') + ' · ' + (it.origin || '출처 미상'))));
}
function renderListPane(pane) {
  const active = S.items.filter(i => i.status === 'active');
  if (!active.length) { pane.append(h('p', { class: 'map-note' }, '학습 중인 개념이 없습니다.')); return; }
  const mode = btn => h('button', { class: 'btn', type: 'button', 'data-t': 'list-mode-' + btn[0], 'aria-pressed': String(S.listMode === btn[0]), onclick: () => { S.listMode = btn[0]; renderExplorePane(); } }, btn[1]);
  pane.append(h('div', { class: 'map-tools', 'data-t': 'list-mode' }, mode(['flat', '목록']), mode(['group', '그룹'])));
  if (S.listMode === 'flat') { active.forEach(it => pane.append(listRow(it))); return; }
  const groups = new Map();
  for (const it of active) {
    const g = it.group_label || '';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(it);
  }
  const labels = [...groups.keys()].sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b, 'ko')));
  for (const g of labels) {
    const list = groups.get(g);
    const open = !S.grpCollapsed.has(g);
    const cnt = { understood: 0, confused: 0, new: 0 };
    for (const it of list) cnt[it.review_state in cnt ? it.review_state : 'new']++;
    pane.append(h('div', { class: 'grp', 'data-t': 'group', 'data-group': g },
      h('button', { class: 'grp-head', type: 'button', 'data-t': 'group-toggle', 'aria-expanded': String(open),

        h('span', { class: 'label grp-name' }, g || '그룹 없음'),
        h('span', { class: 'grp-sum', 'data-t': 'group-sum' }, list.length + '개 · 이해 ' + cnt.understood + ' · 헷갈림 ' + cnt.confused + ' · 새것 ' + cnt.new)),
      open ? list.map(listRow) : null));
  }
}

}

// ── 작업227-18: 지도 인사이트(클라이언트 전용). 활성 개념과 그 사이의 연결, group_label·review_state 만으로 계산한 사실을 한 줄씩 보여 준다 ──
// 문장 5종: hub 허브 / iso 고립 / bridge 다리 / conf 헷갈림 몰림 / und 이해 비율. 해당 없으면 그 문장은 없다. ids = 문장을 누르면 초점으로 강조할 개념
function computeInsights() {
  const { active, links } = mapParts();
  const out = [];
  if (active.length < 3) return out;
  const q = t => '‘' + t + '’';
  const byId = new Map(active.map(i => [i.id, i]));
  const nb = new Map(active.map(i => [i.id, new Set()]));
  for (const l of links) { nb.get(l.from_item_id).add(l.to_item_id); nb.get(l.to_item_id).add(l.from_item_id); }
  const ordered = active.slice().sort((a, b) => a.id - b.id);
  const hub = ordered.reduce((best, i) => (nb.get(i.id).size > nb.get(best.id).size ? i : best), ordered[0]);   // 동점이면 id 가 작은 개념(앞에서부터 보므로 처음 것 유지)
  const hubN = nb.get(hub.id).size;
  if (hubN >= 3) out.push({ key: 'hub', text: q(hub.term) + pickJosa(hub.term, '은', '는') + ' 연결이 ' + hubN + '개로 가장 많아요.', ids: [hub.id] });
  const iso = ordered.filter(i => nb.get(i.id).size === 0);
  if (iso.length) out.push({ key: 'iso', ids: iso.map(i => i.id),
    text: iso.length <= 3 ? '아직 연결이 없는 개념: ' + iso.map(i => q(i.term)).join(', ') + '.' : '아직 연결이 없는 개념이 ' + iso.length + '개 있어요(' + iso.slice(0, 2).map(i => q(i.term)).join(', ') + ' 외).' });
  let bridge = null;
  for (const i of ordered) {
    const gs = [...new Set([...nb.get(i.id)].map(id => byId.get(id).group_label).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
    if (gs.length >= 2 && (!bridge || gs.length > bridge.gs.length)) bridge = { i, gs };
  }
  if (bridge) out.push({ key: 'bridge', ids: [bridge.i.id],
    text: q(bridge.i.term) + pickJosa(bridge.i.term, '은', '는') + ' ' + bridge.gs.slice(0, 3).map(q).join('·') + (bridge.gs.length > 3 ? ' 외 ' + (bridge.gs.length - 3) + '개' : '') + ' 그룹을 이어 줘요.' });
  const groups = new Map();
  for (const i of ordered) if (i.group_label) { if (!groups.has(i.group_label)) groups.set(i.group_label, []); groups.get(i.group_label).push(i); }
  let conf = null;
  for (const [g, m] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ko'))) {
    const c = m.filter(i => i.review_state === 'confused').length;
    if (m.length >= 3 && c / m.length >= 0.5 && (!conf || c / m.length > conf.c / conf.m.length || (c / m.length === conf.c / conf.m.length && c > conf.c))) conf = { g, m, c };
  }
  if (conf) out.push({ key: 'conf', ids: conf.m.map(i => i.id), text: q(conf.g) + ' 그룹에 헷갈림이 몰려 있어요(' + conf.c + '/' + conf.m.length + ').' });
  const und = ordered.filter(i => i.review_state === 'understood');
  out.push({ key: 'und', ids: und.map(i => i.id), text: '전체 ' + active.length + '개 중 ' + und.length + '개를 이해했어요(' + Math.round(und.length / active.length * 100) + '%).' });
  return out;
}
// 패널: 기본 접힘. 문장을 누르면 그 개념(들)을 초점으로 강조하고, 같은 문장을 다시 누르면 해제한다
function insightPanel(insights) {
  if (!insights.length) return null;
  const open = S.map.insOpen;
  const list = open ? h('ul', { class: 'map-ins-list', 'data-t': 'ins-list' }, insights.map(ins => {
    const on = !!(S.map.hi && S.map.hi.key === ins.key);
    const toggle = () => { S.map.hi = on ? null : { key: ins.key }; S.sheet.fit = true; renderMapSheetBody(); };
    return h('li', {}, ins.ids.length
      ? h('button', { class: 'map-ins-row', type: 'button', 'data-t': 'ins-row', 'data-key': ins.key, 'aria-pressed': String(on), onclick: toggle }, ins.text, on ? h('span', { class: 'on' }, '지도에서 강조 중 · 다시 누르면 해제') : null)
      : h('div', { class: 'map-ins-row', 'data-t': 'ins-row', 'data-key': ins.key }, ins.text));
  })) : null;
  return h('div', { class: 'map-ins', 'data-t': 'insights' },
    h('button', { class: 'map-ins-toggle', type: 'button', 'data-t': 'ins-toggle', 'aria-expanded': String(open), onclick: () => { S.map.insOpen = !S.map.insOpen; renderMapSheetBody(); } }, h('span', {}, '지도에서 읽기'), h('span', { 'aria-hidden': 'true' }, open ? '접기' : '펼치기')),
    list);
}

const MAP_MIN_SCALE = 0.05, MAP_MAX_SCALE = 3;
// 작업227-16: 열 때 노드 글자의 화면 크기 하한(px)과 노드 글자의 SVG 단위 크기(CSS .m-node text 와 같게). 허브·간선 라벨 기준은 작업227-15 시안과 같다
const MAP_READ_PX = 12, MAP_FONT_UNITS = 13;
const HUB_MIN_DEG = 5;           // 허브 = 연결 수 상위 15% 이면서 이 값 이상
const EDGE_LABEL_MAX = 8;        // 진한 선이 이 수 이하일 때만 선 위에 종류 단어를 쓴다
const EDGE_DASH = { '일부': '7 4', '종류': '2 4', '구별': '8 3 2 3' };   // 새 5종의 선 모양(사용·일으킴 = 실선, 진한 선의 새 5종에는 화살표)   // 60개 지도를 가로 화면의 낮은 상자에도 전부 맞출 수 있는 하한
let mapDrag = null;
// 지도 그리기(배치·경로 강조·전체 보기 토글은 기존 그대로). 팝업의 body 안에 도구 줄 + 지도 상자 + 안내를 만든다
function drawMap(pane) {
  const { active, activeIds, links } = mapParts();
  const sel = selItem();
  const nodes = active.map(i => i.id).sort((a, b) => a - b);
  const edges = links.map(l => [l.from_item_id, l.to_item_id]);
  // 다음 한 단계(기본 제안)는 점선 노드로 현재 개념 옆에 둔다
  const sg = sel && sel.status === 'active' && sel.content_source !== 'none' && Array.isArray(sel.suggestions) && sel.suggestions[0] ? sel.suggestions[0] : null;
  if (sg) { nodes.push('ghost'); edges.push([sel.id, 'ghost']); }
  const { pos, labelY } = layoutMap(nodes, edges);
  const pathSet = new Set(((S.study.path || []).filter(id => activeIds.has(id))).concat(sel ? [sel.id] : []));
  const full = S.map.full;
  // 작업227-16(안1 이웃 보기): 초점 = 선택한 활성 개념, 없으면 경로의 마지막 활성 개념, 그것도 없으면 연결이 가장 많은 개념. 초점과 1단계 이웃(+다음 제안 점선 노드)을 진하게 보여 준다
  const degOf = new Map(nodes.map(id => [id, 0]));
  for (const l of links) { degOf.set(l.from_item_id, degOf.get(l.from_item_id) + 1); degOf.set(l.to_item_id, degOf.get(l.to_item_id) + 1); }
  const pathActive = (S.study.path || []).filter(id => activeIds.has(id));
  // 작업227-18: 인사이트 문장을 눌러 강조 중이면(S.map.hi) 그 개념들이 초점이다. 개념이 바뀌어 문장이 사라졌거나 대상이 없어졌으면 강조를 푼다
  const insights = computeInsights();
  const hiIns = S.map.hi ? insights.find(i => i.key === S.map.hi.key && i.ids.length) : null;
  if (S.map.hi && !hiIns) S.map.hi = null;
  const hiSet = hiIns ? new Set(hiIns.ids) : null;
  const focusId = hiIns ? hiIns.ids[0] : sel && activeIds.has(sel.id) ? sel.id : pathActive.length ? pathActive[pathActive.length - 1]
    : nodes.filter(id => id !== 'ghost').slice().sort((a, b) => degOf.get(b) - degOf.get(a) || a - b)[0];
  const nbrs = new Set(hiSet || [focusId]);
  if (!hiSet || hiSet.size === 1) for (const [a, b] of edges) { if (a === focusId) nbrs.add(b); if (b === focusId) nbrs.add(a); }   // 한 개념이 초점이면 그 이웃까지(ghost 가 있으면 함께)
  // 허브: 연결 수 상위 15% 이면서 5개 이상인 개념(시안 값). 허브에 닿은 선은 초점이 아니면 더 연하게 그린다
  const degSorted = nodes.filter(id => id !== 'ghost').map(id => degOf.get(id)).sort((a, b) => a - b);
  const hubDeg = Math.max(HUB_MIN_DEG, degSorted[Math.floor(degSorted.length * 0.85)] || 0);
  const isHub = id => degOf.get(id) >= hubDeg;

  pane.append(h('div', { class: 'map-tools' },
    h('button', { class: 'btn', type: 'button', 'data-t': 'map-full', 'aria-pressed': String(full), onclick: () => { S.map.full = !S.map.full; renderExplorePane(); } }, '전체 연결 보기'),
    h('button', { class: 'btn text', type: 'button', 'data-t': 'zoom-in', onclick: () => zoomBy(1.25) }, '확대'),
    h('button', { class: 'btn text', type: 'button', 'data-t': 'zoom-out', onclick: () => zoomBy(0.8) }, '축소'),
    h('button', { class: 'btn text', type: 'button', 'data-t': 'zoom-fit', onclick: () => { S.sheet.fit = true; renderMapSheetBody(); } }, '화면 맞춤')));
  const box = h('div', { class: 'map-box', 'data-t': 'map-box' });
  pane.append(box);
  pane.append(h('p', { class: 'map-hint' }, full ? '모든 연결을 보여 줍니다. 개념을 누르면 선택하고, 선을 누르면 연결한 이유를 볼 수 있어요.' : '선택한 개념과 바로 이어진 개념을 진하게 보여 줍니다. 점선은 다음 제안이에요. 선을 눌러 이유를 보세요.'));

  const insPanel = insightPanel(insights);
  if (insPanel) pane.append(insPanel);

  const termOf = id => (itemById(id) || {}).term || '';
  const svg = sv('svg', { role: 'group', 'aria-label': '개념 지도', 'data-t': 'map-svg' });
  const gEdges = sv('g'), gNodes = sv('g');
  svg.append(sv('defs', {}, sv('marker', { id: 'm-arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, sv('path', { d: 'M0,0 L10,5 L0,10 z' }))), gEdges, gNodes);
  // 간선 단계: 진함(초점에 닿은 선 + 경로 안의 선) / 중간(초점의 이웃끼리) / 연함(그 밖, 허브에 닿으면 더 연함). 전체 보기에서는 연한 선도 더 잘 보이게 한다
  const strong = hiSet && hiSet.size > 1 ? (l => hiSet.has(l.from_item_id) && hiSet.has(l.to_item_id))
    : hiSet ? (l => l.from_item_id === focusId || l.to_item_id === focusId)
    : (l => l.from_item_id === focusId || l.to_item_id === focusId || (pathSet.has(l.from_item_id) && pathSet.has(l.to_item_id)));
  const nStrong = links.filter(strong).length;
  for (const l of links) {
    const hl = strong(l);
    const mid = !hl && nbrs.has(l.from_item_id) && nbrs.has(l.to_item_id);
    const hub = !hl && (isHub(l.from_item_id) || isHub(l.to_item_id));
    const op = hl ? 1 : full ? (mid ? 0.9 : hub ? 0.35 : 0.5) : (mid ? 0.35 : hub ? 0.12 : 0.2);
    const g = geom(l.from_item_id, l.to_item_id);
    const rel = String(l.label || l.relation_type || '');
    const open = () => openEdge(l);
    const isNew = NEW_RELATION_TYPES.includes(l.relation_type);
    const e = sv('g', { class: 'm-edge' + (hl ? ' hl' : '') + (op < 0.5 ? ' dim' : ''), 'data-t': 'edge', 'data-id': l.id, 'data-hl': hl ? '1' : '0', 'data-hub': hub ? '1' : '0', style: op < 1 ? 'opacity:' + op : null, role: 'button', tabindex: 0, 'aria-label': `${termOf(l.from_item_id)}와 ${termOf(l.to_item_id)}의 관계: ${rel}` },
      sv('path', { class: 'line', d: g.d, 'stroke-dasharray': EDGE_DASH[l.relation_type] || null, 'marker-end': hl && isNew ? 'url(#m-arrow)' : null }), sv('path', { class: 'hit', d: g.d }),
      hl && nStrong <= EDGE_LABEL_MAX && rel ? sv('text', { x: g.mx, y: g.my - 4 }, clipText(rel, 8)) : null);   // 라벨은 진한 선이 적을 때만(많으면 선 모양과 눌러서 보는 카드)
    e.addEventListener('click', () => { if (!mapDrag || !mapDrag.moved) open(); });
    e.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } });
    gEdges.append(e);
  }
  function geom(a, b) { return edgeGeom(pos.get(a), pos.get(b)); }
  if (sg) {
    const g = geom(sel.id, 'ghost');
    gEdges.append(sv('g', { class: 'm-edge ghost hl', 'data-t': 'ghost-edge' }, sv('path', { class: 'line', d: g.d })));
  }
  for (const id of nodes) {
    const p = pos.get(id);
    if (id === 'ghost') {
      const gn = sv('g', { class: 'm-node ghost', 'data-t': 'ghost', 'data-term': sg.term, role: 'button', tabindex: 0, 'aria-label': '다음 제안: ' + sg.term, transform: `translate(${p.x},${p.y})` },
        sv('title', {}, '다음 제안: ' + sg.term), sv('rect', { width: MAPD.W, height: MAPD.H }), sv('text', { x: MAPD.W / 2, y: MAPD.H / 2 }, clipText(sg.term, 9)));
      // 다음 제안은 학습 화면 아래쪽에 있으므로 팝업을 닫고 그곳으로 간다
      const go = () => { if (!mapDrag || !mapDrag.moved) { closeMapSheet(false); el('nextstep').scrollIntoView({ block: 'start' }); } };
      gn.addEventListener('click', go);
      gn.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
      gNodes.append(gn);
      continue;
    }
    const it = itemById(id);
    const inNb = nbrs.has(id), hl = inNb || (!hiSet && pathSet.has(id)), isSel = id === S.selId;
    const n = sv('g', { class: 'm-node' + (hl ? ' hl' : '') + (isSel ? ' sel' : '') + (!full && !hl ? ' dim' : '') + (hl && !inNb && !full ? ' path' : ''), 'data-t': 'node', 'data-id': id, 'data-hl': hl ? '1' : '0', role: 'button', tabindex: 0, 'aria-label': it.term + (isSel ? ' (현재 개념)' : ''), transform: `translate(${p.x},${p.y})` },
      sv('title', {}, it.term), sv('rect', { width: MAPD.W, height: MAPD.H }), sv('text', { x: MAPD.W / 2, y: MAPD.H / 2 }, clipText(it.term, 9)));
    const go = () => { if (!mapDrag || !mapDrag.moved) { S.map.hi = null; selectItem(id); } };   // 개념을 직접 고르면 인사이트 강조는 해제
    n.addEventListener('click', go);
    n.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
    gNodes.append(n);
  }
  if (labelY !== null) gNodes.append(sv('text', { class: 'm-label', x: 0, y: labelY }, '연결 없는 개념'));
  box.append(svg);

  // 보기 영역(viewBox): 열릴 때 전체 지도를 화면에 맞추고(글자 크기 하한 없음), 이후 확대·축소·이동 상태는 다시 그려도 유지한다
  const sh = S.sheet;
  const cw = box.clientWidth || 358, ch = box.clientHeight || 400;
  function fitView() {
    const r = nodes.map(id => pos.get(id));
    const b = { x0: Math.min(...r.map(q => q.x)) - 24, x1: Math.max(...r.map(q => q.x + MAPD.W)) + 24, y0: Math.min(...r.map(q => q.y)) - 24, y1: Math.max(...r.map(q => q.y + MAPD.H)) + 24 };
    if (labelY !== null) b.y0 -= 16;
    const fit = Math.min(cw / (b.x1 - b.x0), ch / (b.y1 - b.y0), 1.5);
    // 작업227-16: 열 때 기본 배율은 노드 글자가 화면에서 12px 이상이 되는 값(12/13)을 하한으로 한다. 전체가 안 들어오면 줄이지 않고 끌어서 본다(직접 축소는 기존 범위)
    const floor = MAP_READ_PX / MAP_FONT_UNITS;
    const vw = () => cw / sh.scale, vh = () => ch / sh.scale;
    if (full) {
      sh.scale = Math.max(floor, fit);
      sh.tx = (b.x1 - b.x0) <= vw() ? (b.x0 + b.x1) / 2 - vw() / 2 : b.x0 - 8 / sh.scale;   // 안 들어오면 왼쪽 위부터
      sh.ty = (b.y1 - b.y0) <= vh() ? (b.y0 + b.y1) / 2 - vh() / 2 : b.y0;
    } else {
      const fp = [...nbrs].map(id => pos.get(id)).filter(Boolean);
      const fb = { x0: Math.min(...fp.map(q => q.x)) - 16, x1: Math.max(...fp.map(q => q.x + MAPD.W)) + 16, y0: Math.min(...fp.map(q => q.y)) - 16, y1: Math.max(...fp.map(q => q.y + MAPD.H)) + 16 };
      const want = Math.min(cw / (fb.x1 - fb.x0), ch / (fb.y1 - fb.y0), 1.2);
      sh.scale = Math.max(floor, want);
      const c = want >= floor ? { x: (fb.x0 + fb.x1) / 2, y: (fb.y0 + fb.y1) / 2 } : (q => ({ x: q.x + MAPD.W / 2, y: q.y + MAPD.H / 2 }))(pos.get(focusId));
      sh.tx = c.x - vw() / 2; sh.ty = c.y - vh() / 2;
      // 지도 바깥의 빈 곳이 보이지 않게 보이는 영역을 지도 범위 안으로 맞춘다(지도가 더 작으면 가운데)
      sh.tx = (b.x1 - b.x0) <= vw() ? (b.x0 + b.x1) / 2 - vw() / 2 : Math.min(Math.max(sh.tx, b.x0), b.x1 - vw());
      sh.ty = (b.y1 - b.y0) <= vh() ? (b.y0 + b.y1) / 2 - vh() / 2 : Math.min(Math.max(sh.ty, b.y0), b.y1 - vh());
    }
    sh.fit = false;
  }
  function apply() { svg.setAttribute('viewBox', `${sh.tx} ${sh.ty} ${cw / sh.scale} ${ch / sh.scale}`); }
  if (sh.fit) fitView();
  sh.cw = cw;
  apply();
  S.mapView = { apply, cw, ch, svg };

  // 끌어서 이동(포인터 1개) / 핀치 확대(포인터 2개)
  const ptrs = new Map();
  let pinch = null;
  svg.addEventListener('pointerdown', ev => {
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (ptrs.size === 1) mapDrag = { x: ev.clientX, y: ev.clientY, tx: sh.tx, ty: sh.ty, moved: false, id: ev.pointerId };
    else if (ptrs.size === 2) {
      const [p1, p2] = [...ptrs.values()];
      const rect = svg.getBoundingClientRect();
      const mx = (p1.x + p2.x) / 2 - rect.left, my = (p1.y + p2.y) / 2 - rect.top;
      pinch = { dist: Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1, scale: sh.scale, wx: sh.tx + mx / sh.scale, wy: sh.ty + my / sh.scale };
      if (mapDrag) mapDrag.moved = true;
    }
  });
  svg.addEventListener('pointermove', ev => {
    if (!ptrs.has(ev.pointerId)) return;
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (ptrs.size >= 2 && pinch) {
      const [p1, p2] = [...ptrs.values()];
      const rect = svg.getBoundingClientRect();
      const mx = (p1.x + p2.x) / 2 - rect.left, my = (p1.y + p2.y) / 2 - rect.top;
      sh.scale = Math.max(MAP_MIN_SCALE, Math.min(MAP_MAX_SCALE, pinch.scale * (Math.hypot(p1.x - p2.x, p1.y - p2.y) / pinch.dist)));
      sh.tx = pinch.wx - mx / sh.scale; sh.ty = pinch.wy - my / sh.scale;   // 두 손가락 가운데 아래의 지점이 제자리에 있게
      apply();
      return;
    }
    if (!mapDrag || ev.pointerId !== mapDrag.id) return;
    const dx = ev.clientX - mapDrag.x, dy = ev.clientY - mapDrag.y;
    if (!mapDrag.moved && Math.hypot(dx, dy) < 6) return;
    if (!mapDrag.moved) { mapDrag.moved = true; try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* 무시 */ } }
    sh.tx = mapDrag.tx - dx / sh.scale; sh.ty = mapDrag.ty - dy / sh.scale;
    apply();
  });
  const end = ev => {
    ptrs.delete(ev.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 1) {   // 핀치가 끝나고 한 손가락이 남으면 그 손가락으로 이어서 이동(튀지 않게 기준을 다시 잡는다)
      const [id, q] = [...ptrs.entries()][0];
      mapDrag = { x: q.x, y: q.y, tx: sh.tx, ty: sh.ty, moved: true, id };
    }
    if (ptrs.size === 0 && mapDrag) setTimeout(() => { mapDrag = null; }, 0);
  };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  // 마우스 휠 확대(데스크톱): 커서 아래 지점을 고정
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const wx = sh.tx + mx / sh.scale, wy = sh.ty + my / sh.scale;
    sh.scale = Math.max(MAP_MIN_SCALE, Math.min(MAP_MAX_SCALE, sh.scale * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)));
    sh.tx = wx - mx / sh.scale; sh.ty = wy - my / sh.scale;
    apply();
  }, { passive: false });
}

function zoomBy(f) {
  const sh = S.sheet, v = S.mapView;
  if (!v) return;
  const cx = sh.tx + v.cw / sh.scale / 2, cy = sh.ty + v.ch / sh.scale / 2;
  sh.scale = Math.max(MAP_MIN_SCALE, Math.min(MAP_MAX_SCALE, sh.scale * f));
  sh.tx = cx - v.cw / sh.scale / 2; sh.ty = cy - v.ch / sh.scale / 2;
  sh.fit = false;
  v.apply();
}

async function startQuiz() {
  const r = await busy('문제를 만드는 중…', () => api('GET', '/api/concepts/studies/' + S.study.id + '/review?count=5'));
  if (!r) return;
  if (r.status !== 200) { showMsg(errText(r)); return; }
  S.quiz = { questions: r.body.questions || [], message: r.body.message || null, i: 0, answered: null, results: [], error: null };

function closeQuiz() { S.quiz = null; renderStudy(); }
async function answerQuiz(choice) {
  const qz = S.quiz;
  if (!qz || qz.answered) return;
  const q = qz.questions[qz.i];
  const r = await busy('채점하는 중…', () => api('POST', '/api/concepts/studies/' + S.study.id + '/review/answer', { token: q.token, choice }));
  if (!r || S.quiz !== qz) return;
  if (r.status !== 200) { qz.error = errText(r); renderQuiz(); return; }
  qz.error = null;

  qz.results.push({ item: r.body.item, correct: r.body.correct });

  }

  const card = h('div', { class: 'qz-q', 'data-t': 'quiz-question', 'data-kind': q.kind },
    h('div', { class: 'label' }, q.kind === 'A' ? '이 설명에 맞는 용어는?' : '이 용어의 설명은?'),
    h('div', { class: 'qz-prompt', 'data-t': 'quiz-prompt' }, q.prompt));
  if (q.ai_source) card.append(h('div', { class: 'source', 'data-t': 'quiz-ai' }, 'AI 설명 · 확인 필요'));
  const opts = h('div', { class: 'qz-opts', role: 'group', 'aria-label': '보기' });
  q.options.forEach((text, idx) => {
    const isRight = a && idx === a.correct_index;
    const isMine = a && idx === a.choice;
    const cls = 'btn qz-opt' + (isRight ? ' right' : (isMine ? ' wrong' : '')) + (isMine ? ' mine' : '');
    opts.append(h('button', { class: cls, type: 'button', 'data-t': 'quiz-opt', 'data-i': idx, disabled: a ? true : null, onclick: () => answerQuiz(idx) },
      h('span', { class: 'qz-mark', 'aria-hidden': 'true' }, a ? (isRight ? '○' : (isMine ? '✕' : '')) : ''),
      h('span', { class: 'qz-num', 'aria-hidden': 'true' }, String(idx + 1)),
      h('span', {}, text)));
  });
  card.append(opts);
  box.append(card);
  if (qz.error) box.append(h('div', { class: 'msg error', role: 'alert', 'data-t': 'quiz-error' }, qz.error),
    h('div', { class: 'btn-row', style: 'margin-top:8px' }, h('button', { class: 'btn text', type: 'button', 'data-t': 'quiz-skip', onclick: nextQuiz }, '다음 문제로')));
  if (a) {
    box.append(h('div', { class: 'qz-fb ' + (a.correct ? 'right' : 'wrong'), 'data-t': 'quiz-feedback', role: 'status' }, a.correct ? '○ 정답입니다' : '✕ 틀렸어요'));
    const ex = h('div', { class: 'qz-explain', 'data-t': 'quiz-explain' },
      h('div', { class: 'label' }, '정답'),
      h('div', { class: 'next-term', style: 'font-size:18px' }, a.item.term),
      h('p', {}, a.item.definition || ''));
    if (a.item.example) ex.append(h('div', { class: 'label', style: 'display:block;margin-top:8px' }, '예시'), h('p', {}, a.item.example));
    if (a.item.content_source === 'ai') ex.append(h('div', { class: 'source', style: 'margin-top:6px' }, 'AI 설명 · 확인 필요'));
    box.append(ex);
    const last = qz.i + 1 >= total;

      h('button', { class: 'btn primary block', type: 'button', 'data-t': 'quiz-next', onclick: nextQuiz }, last ? '결과 보기' : '다음'));
    if (!a.correct) {

      row.append(done ? h('span', { class: 'lrow-meta', 'data-t': 'quiz-marked', style: 'align-self:center' }, '헷갈림으로 표시됨')

    }
    box.append(row);
  }

// ── 연결(작업203): 현재 개념과 이어진 연결 목록, 직접 연결 추가·삭제 ──
const OLD_RELATION_TYPES = ['포함', '원인→결과', '순서', '대비', '비슷함', '기타 관련'];   // 이전 종류(표시는 기존 그대로)
const NEW_RELATION_TYPES = ['사용', '일부', '종류', '일으킴', '구별'];                       // 작업227-11: 문장으로 보여 주는 새 5종
const isNewRel = t => NEW_RELATION_TYPES.includes(t);

// 아래 pickJosa·formatSentence 는 lib/concept_links_b2.js 의 같은 이름 함수를 그대로 복사한 것이다(작업227-8, 서버 파일은 require 하지 않음). 고치면 원본도 함께 고칠 것.
// 단어의 마지막 글자(괄호·기호·공백은 건너뜀)로 받침 여부를 판단해 [받침 있음, 받침 없음] 중 하나를 고른다.
// 한글: 받침 유무. 영문: 한국어 읽기 기준으로 L·M·N·R만 받침 있음. 숫자: 0·1·3·6·7·8 받침 있음. 그 밖의 글자는 받침 없음으로 본다.
function pickJosa(word, withBatchim, withoutBatchim) {
  const chars = Array.from(String(word == null ? '' : word));
  let last = '';
  for (let i = chars.length - 1; i >= 0; i--) { if (/[가-힣A-Za-z0-9]/.test(chars[i])) { last = chars[i]; break; } }
  let has = false;
  if (/[가-힣]/.test(last)) has = (last.charCodeAt(0) - 0xAC00) % 28 !== 0;
  else if (/[A-Za-z]/.test(last)) has = 'LMNR'.indexOf(last.toUpperCase()) >= 0;
  else if (/[0-9]/.test(last)) has = '013678'.indexOf(last) >= 0;
  return has ? withBatchim : withoutBatchim;
}
// 사용 "A는 B를 사용한다" / 일부 "A는 B의 일부이다" / 종류 "A는 B의 한 종류이다" / 일으킴 "A는 B를 일으킨다" / 구별 "A와 B는 구별해야 한다"
// 옛 관계 종류(포함·원인→결과·순서·대비·비슷함·기타 관련)는 "A → B (종류)" 로 돌려준다.
function formatSentence(predicate, subjectTerm, objectTerm) {
  const a = String(subjectTerm == null ? '' : subjectTerm).trim(), b = String(objectTerm == null ? '' : objectTerm).trim();
  if (predicate === '사용') return a + pickJosa(a, '은', '는') + ' ' + b + pickJosa(b, '을', '를') + ' 사용한다';
  if (predicate === '일부') return a + pickJosa(a, '은', '는') + ' ' + b + '의 일부이다';
  if (predicate === '종류') return a + pickJosa(a, '은', '는') + ' ' + b + '의 한 종류이다';
  if (predicate === '일으킴') return a + pickJosa(a, '은', '는') + ' ' + b + pickJosa(b, '을', '를') + ' 일으킨다';
  if (predicate === '구별') return a + pickJosa(a, '과', '와') + ' ' + b + pickJosa(b, '은', '는') + ' 구별해야 한다';
  return a + ' → ' + b + (predicate ? ' (' + predicate + ')' : '');
}

// 연결 l 의 문장: 새 5종이면 "A는 B를 사용한다", 그 밖(옛 6종·모르는 값)이면 기존 화살표 표시. from = 주어, to = 목적어
function linkPairText(l, fromTerm, toTerm) {
  return isNewRel(l.relation_type) ? formatSentence(l.relation_type, fromTerm, toTerm) : fromTerm + ' → ' + toTerm;
}
// 관계 종류 select 의 option 들: 새 5종 위, 옛 6종은 "이전 종류" 묶음, 모르는 값이 현재 값이면 그 값을 따로 둔다
function relationOptions(current) {
  const opt = t => h('option', { value: t }, t);
  const out = NEW_RELATION_TYPES.map(opt);
  out.push(h('optgroup', { label: '이전 종류' }, OLD_RELATION_TYPES.map(opt)));
  if (typeof current === 'string' && current && !isNewRel(current) && !OLD_RELATION_TYPES.includes(current)) out.push(h('optgroup', { label: '현재 값' }, opt(current)));
  return out;
}

// 연결 수정(작업209-3): 관계 종류·문구·이유·방향. 바뀐 것만 PATCH로 보낸다(안 바뀌었으면 닫기만)
function openLinkEdit(l, entry) {
  const a = itemById(l.from_item_id), b = itemById(l.to_item_id);
  let swapped = false;
  const pair = h('div', { class: 'lk-pair', 'data-t': 'edit-pair' });
  const typeSel = h('select', { id: 'le-type', 'aria-label': '관계 종류', 'data-t': 'edit-type' }, relationOptions(l.relation_type));
  typeSel.value = l.relation_type;   // 옛 값이면 그 값이 선택된 채로 열린다
  const showPair = () => { pair.textContent = linkPairText({ relation_type: typeSel.value }, ((swapped ? b : a) || { term: '' }).term, ((swapped ? a : b) || { term: '' }).term); };
  showPair();
  typeSel.addEventListener('change', showPair);
  const label = h('input', { id: 'le-label', type: 'text', maxlength: LABEL_MAX, autocomplete: 'off', 'aria-label': '관계 문구', 'data-t': 'edit-label' });
  label.value = l.label || '';

async function restoreItem(it, { select, explain }) {

// 현재 개념과 이어진 개념(지도상 위치)
function placeText(it) {
  const parts = [];
  for (const l of S.links) {
    if (l.from_item_id !== it.id && l.to_item_id !== it.id) continue;
    const other = itemById(l.from_item_id === it.id ? l.to_item_id : l.from_item_id);
    if (!other) continue;
    if (isNewRel(l.relation_type)) {   // 작업227-11: 새 5종은 문장 그대로(주어 = from, 목적어 = to)
      const fa = itemById(l.from_item_id), ta = itemById(l.to_item_id);
      parts.push(formatSentence(l.relation_type, fa ? fa.term : '', ta ? ta.term : ''));
      continue;
    }
    const rel = [l.label, l.relation_type].filter(Boolean).map(String).join(' · ');
    parts.push(l.to_item_id === it.id ? `‘${other.term}’에서 이어짐 (${rel || '관련'})` : `‘${other.term}’로 이어짐 (${rel || '관련'})`);
  }
  return parts.slice(0, 3).join(' / ');
}

  );

  memo.addEventListener('input', () => scheduleNote(it.id, memo.value, state));
  memo.addEventListener('blur', () => flushNote());

// ── 메모 자동 저장 ──
function scheduleNote(itemId, value, stateEl) {
  clearTimeout(S.note.timer);
  S.note = { itemId, value, timer: setTimeout(() => flushNote(), 800) };
  stateEl.textContent = '입력 중…';
}
async function flushNote() {
  const n = S.note;
  if (n.itemId === null || n.value === null) return;
  clearTimeout(n.timer);
  S.note = { itemId: null, timer: null, value: null };
  const stateEl = $('note-state');
  if (stateEl && selItem() && selItem().id === n.itemId) stateEl.textContent = '저장 중…';
  const r = await api('PATCH', '/api/concepts/items/' + n.itemId, { note: n.value });
  const it = itemById(n.itemId);
  if (r.status === 200) { if (it) it.note = r.body.note; if (stateEl && selItem() && selItem().id === n.itemId) stateEl.textContent = '저장됨'; }
  else if (stateEl) stateEl.textContent = '저장하지 못했습니다. ' + errText(r, '다시 시도해 주세요.');
}

async function toggleUnderstood(it) {
  const next = it.review_state === 'understood' ? 'new' : 'understood';
  const r = await busy('저장하는 중…', () => api('PATCH', '/api/concepts/items/' + it.id, { review_state: next }));
  if (!r) return;
  if (r.status !== 200) { showMsg(errText(r)); return; }
  mergeItem(it, r.body);
  renderStudy();
}

function showMsg(text) {
  setNotice({ text });
  if (S.study) renderStudy();
}

// ── 설명 직접 고치기 ──
function openEdit(it, host, tools) {
  tools.hidden = true;
  host.textContent = '';
  const areas = {};
  const msg = h('div', { class: 'msg error', role: 'alert' });
  const form = h('form', { novalidate: true, 'data-t': 'edit-form' });
  for (const [key, label, max] of TEXT_FIELDS) {
    const ta = h('textarea', { id: 'edit-' + key, maxlength: max, 'aria-label': label });
    ta.value = it[key] || '';
    const cnt = h('div', { class: 'counter' }, clen(ta.value) + ' / ' + max);
    ta.addEventListener('input', () => { cnt.textContent = clen(ta.value) + ' / ' + max; });
    areas[key] = ta;
    form.append(h('div', { class: 'field' }, h('label', { class: 'label', for: 'edit-' + key }, label), ta, cnt));
  }
  form.append(msg, h('div', { class: 'btn-row', style: 'margin-top:14px' },
    h('button', { class: 'btn primary', type: 'submit', 'data-t': 'edit-save' }, '저장'),
    h('button', { class: 'btn text', type: 'button', onclick: () => { host.textContent = ''; tools.hidden = false; } }, '취소')));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const changes = {};
    for (const [key, label, max] of TEXT_FIELDS) {
      const v = areas[key].value;
      if (clen(v) > max) { msg.textContent = label + '은(는) ' + max + '자 이하여야 합니다.'; return; }
      if (v !== (it[key] || '')) changes[key] = v;
    }
    if (!Object.keys(changes).length) { host.textContent = ''; tools.hidden = false; return; }
    const r = await busy('저장하는 중…', () => api('PATCH', '/api/concepts/items/' + it.id, changes));
    if (!r) return;
    if (r.status !== 200) { msg.textContent = errText(r); return; }
    mergeItem(it, r.body);
    setNotice(null);
    renderStudy();
  });
  host.append(form);
  areas.definition.focus();
}

function suggestionBlock(sg, big) {

    kv('지금 필요한 이유', sg.reason),

    )

}

function renderNext() {
  const it = selItem();
  const box = el('nextstep');
  box.textContent = '';
  if (!it) return;
  box.append(h('div', { class: 'label' }, '다음 한 단계'));
  const list = Array.isArray(it.suggestions) ? it.suggestions.slice(0, 3) : [];
  if (it.content_source === 'none') {
    box.append(h('p', { class: 'muted', style: 'margin-top:8px' }, '설명을 받으면 다음에 배울 개념을 제안해 드려요.'));
  } else if (list.length) {
    box.append(suggestionBlock(list[0], true));
    const alts = list.slice(1);
    if (alts.length) {
      box.append(h('details', { class: 'alts', 'data-t': 'alts' },
        h('summary', {}, icon('chevron'), '다른 후보 ' + alts.length + '개'),
        alts.map(a => suggestionBlock(a, false))));
    }
  } else {
    box.append(h('p', { class: 'muted', 'data-t': 'no-suggest', style: 'margin-top:8px' }, '남은 제안이 없습니다. 아래 입력창에 궁금한 개념을 직접 입력하거나, 제안을 다시 받아 보세요.'));
    box.append(h('div', { class: 'actions' }, h('button', { class: 'btn text', type: 'button', 'data-t': 'refresh-suggest', onclick: () => refreshSuggestions(it) }, '제안 다시 받기')));
  }
  if (it.content_source !== 'none') {
    box.append(h('div', { class: 'react' },
      h('span', { class: 'label' }, '이 설명이 어땠나요?'),
      h('div', { class: 'btn-row', style: 'margin-top:6px' },
        h('button', { class: 'btn text', type: 'button', 'data-t': 'react-easier', onclick: () => respond(it, 'easier') }, '더 쉬운 설명'),
        h('button', { class: 'btn text', type: 'button', 'data-t': 'react-deeper', onclick: () => respond(it, 'deeper') }, '더 깊게'),
        h('button', { class: 'btn text', type: 'button', 'data-t': 'react-other', onclick: () => respond(it, 'other') }, '다른 길'))));
  }
}

// ── AI 호출 흐름 ──
async function doExplore(text, via, fromId) {
  const body = { text, via };
  if (fromId) body.from_item_id = fromId;
  const r = await busy('설명을 만드는 중…', () => api('POST', '/api/concepts/studies/' + S.study.id + '/explore', body));
  if (!r) return false;
  if (r.status !== 200) { showMsg(errText(r)); return false; }     // 429는 서버 문구 그대로, 입력은 그대로 둔다
  const item = r.body.item;
  if (r.body.ai_error) {
    S.retryFrom[item.id] = fromId || null;
    setNotice({ itemId: item.id, text: AI_FAIL_TEXT, retryFn: () => doExplore(item.term, 'input', S.retryFrom[item.id]) });
  } else {
    // AI가 만든 연결(현재 개념과의 연결 + 기존 개념과의 연결)을 한 번 알려 준다
    const made = (r.body.link ? 1 : 0) + (Array.isArray(r.body.links) ? r.body.links.length : 0);
    if (made > 0) setNotice({ itemId: item.id, info: true, text: made + '개 연결을 만들었습니다.' });
    else setNotice(null);
  }
  await loadStudy(S.study.id);
  el('detail').scrollIntoView({ block: 'start' });
  return true;
}

function addSuggestion(sg) {
  const it = selItem();
  return doExplore(sg.term, 'suggestion', it ? it.id : null);
}

// 같은 이름으로 explore를 다시 불러 비어 있는 설명을 채운다
function retryAi() {
  const it = selItem();
  if (it) return doExplore(it.term, 'input', S.retryFrom[it.id] || null);
}

async function sideline(sg, status) {
  const it = selItem();
  const r = await busy('저장하는 중…', async () => {
    const c = await api('POST', '/api/concepts/studies/' + S.study.id + '/items', { term: sg.term, origin: 'AI 제안' });
    if (c.status !== 201) return c;
    const p = await api('PATCH', '/api/concepts/items/' + c.body.id, { status });
    return p.status === 200 ? { status: 200 } : p;
  });
  if (!r) return;
  if (r.status === 200) setNotice(null); else setNotice({ text: r.status === 409 ? '이미 있는 개념입니다.' : errText(r) });
  const keep = it ? it.id : null;
  await loadStudy(S.study.id);
  if (keep && itemById(keep)) { S.selId = keep; renderStudy(); }
}

async function respond(it, kind) {
  const r = await busy('설명을 만드는 중…', () => api('POST', '/api/concepts/items/' + it.id + '/respond', { kind }));
  if (!r) return;
  if (r.status !== 200) { showMsg(errText(r)); return; }
  Object.assign(it, r.body.item);
  setNotice(r.body.ai_error ? { itemId: it.id, text: AI_FAIL_TEXT, retryFn: () => respond(it, kind) } : null);
  renderStudy();
}

async function refreshSuggestions(it) {
  const r = await busy('설명을 만드는 중…', () => api('POST', '/api/concepts/items/' + it.id + '/suggestions/refresh'));
  if (!r) return;
  if (r.status !== 200) { showMsg(errText(r)); return; }
  Object.assign(it, r.body.item);
  setNotice(r.body.ai_error ? { itemId: it.id, text: AI_FAIL_TEXT, retryFn: () => refreshSuggestions(it) } : null);
  renderStudy();
  if (!r.body.ai_error && r.body.refreshed === false) { const m = el('study-msg'); m.className = 'msg info'; m.textContent = '아직 남은 제안이 있어 새로 받지 않았습니다.'; }
}

// ── 음성 입력(작업206): 녹음 → 서버 변환 → 입력창에 채우기 ──
// voice_study.html의 녹음 코드(MediaRecorder 형식 후보, 마이크 권한 오류 문구, 업로드 방식)를 복제해 이 화면 안에 독립시킨 것이다(코드 공유 없음).
// 변환 결과는 입력창에 채우기만 한다. 사용자가 확인·수정한 뒤 직접 "추가"를 눌러야 AI가 호출된다(변환만으로 AI 호출 없음).
// 음성은 서버에 저장되지 않는다. 마이크가 안 되거나 변환이 실패해도 글자 입력은 그대로 쓸 수 있다.
const MIC_MAX_SEC = 60;
const MIC_MAX_BYTES = 6 * 1024 * 1024;
const MIC_MIMES = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'];
const Mic = { state: 'idle', owner: null, rec: null, stream: null, chunks: [], t0: 0, timer: null, mime: '' };   // idle | recording | stopping | cancelled | transcribing
const MIC_TARGETS = [
  { input: 'start-first', btn: 'start-first-mic', msg: 'start-first-voice', lock: null },
  { input: 'ask-input', btn: 'ask-mic', msg: 'ask-voice', lock: 'ask-submit' },
];
const micSupported = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
function micPickMime() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  for (const m of MIC_MIMES) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
const micClock = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
function micSay(o, text, kind) { const m = el(o.msg); m.textContent = text || ''; m.className = 'msg ' + (kind || 'info') + (o.msg === 'ask-voice' ? ' ask-msg' : ''); }
function micPaint(o, recording) {
  const b = el(o.btn);
  b.textContent = '';
  b.append(icon(recording ? 'stop' : 'mic'));
  b.setAttribute('aria-pressed', String(recording));
  b.setAttribute('aria-label', recording ? '녹음 끝내기' : '음성으로 입력');
}
function micRelease() { if (Mic.stream) { try { Mic.stream.getTracks().forEach(t => t.stop()); } catch (e) { /* 무시 */ } } Mic.stream = null; }
function micErrText(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return '마이크 사용이 허용되지 않았습니다. 브라우저(또는 기기) 설정에서 이 사이트의 마이크를 허용하면 음성으로 입력할 수 있어요. 지금은 글로 입력해 주세요.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return '사용할 수 있는 마이크를 찾지 못했습니다. 글로 입력해 주세요.';
  if (n === 'NotReadableError') return '마이크를 사용할 수 없습니다. 다른 앱이 마이크를 쓰고 있지 않은지 확인해 주세요.';
  return '마이크를 켜지 못했습니다. 잠시 후 다시 시도하거나 글로 입력해 주세요.';
}
function micHttpText(r) {
  if (r.status === 413) return '녹음 파일이 너무 큽니다. 더 짧게 말해 주세요.';
  if (r.status === 415) return '이 기기의 녹음 형식은 지원되지 않습니다. 글로 입력해 주세요.';
  if (r.status === 502) return '음성 변환 서비스에 문제가 있었습니다. 잠시 후 다시 시도하거나 글로 입력해 주세요.';
  return errText(r, '음성 변환에 실패했습니다. 글로 입력해 주세요.');   // 429는 서버 문구("하루 N회까지…") 그대로
}
async function micToggle(o) {
  if (Mic.state === 'recording' && Mic.owner === o) { micStop(); return; }
  if (Mic.state !== 'idle') return;
  micSay(o, '');
  if (!micSupported()) { micSay(o, '이 브라우저는 음성 입력을 지원하지 않습니다. 글로 입력해 주세요.', 'error'); return; }
  Mic.state = 'stopping';   // 권한 창이 떠 있는 동안 중복 시작 방지
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { Mic.state = 'idle'; micSay(o, micErrText(e), 'error'); return; }
  const mime = micPickMime();
  let rec;
  try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); Mic.state = 'idle'; micSay(o, '이 기기에서는 녹음을 시작할 수 없습니다. 글로 입력해 주세요.', 'error'); return; }
  Object.assign(Mic, { stream, rec, owner: o, chunks: [], mime: rec.mimeType || mime || '', t0: Date.now(), state: 'recording' });
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) Mic.chunks.push(ev.data); };
  rec.onstop = () => micStopped(o);
  rec.onerror = () => micStop();
  stream.getAudioTracks().forEach(t => { t.onended = () => micStop(); });
  rec.start(1000);
  micPaint(o, true);
  if (o.lock) el(o.lock).disabled = true;   // 녹음·변환 중에는 보내기를 잠가 중간 내용이 AI로 가지 않게 한다
  Mic.timer = setInterval(() => {
    const sec = (Date.now() - Mic.t0) / 1000;
    micSay(o, '녹음 중 ' + micClock(sec) + ' / ' + micClock(MIC_MAX_SEC) + ' · 다시 누르면 끝나요', 'info');
    if (sec >= MIC_MAX_SEC) micStop();
  }, 250);
  micSay(o, '녹음 중 0:00 / ' + micClock(MIC_MAX_SEC) + ' · 다시 누르면 끝나요', 'info');
}
function micStop() {
  if (Mic.state !== 'recording') return;
  clearInterval(Mic.timer); Mic.timer = null;
  Mic.state = 'stopping';
  try { Mic.rec.stop(); } catch (e) { micStopped(Mic.owner); }
}
// 화면을 떠나거나 닫을 때: 녹음을 버린다(업로드하지 않음)
function micCancel() {
  if (Mic.state !== 'recording') return;
  clearInterval(Mic.timer); Mic.timer = null;
  Mic.state = 'cancelled';
  try { Mic.rec.stop(); } catch (e) { micStopped(Mic.owner); }
}
function micDone(o) {
  Mic.state = 'idle'; Mic.owner = null; Mic.rec = null; Mic.chunks = [];
  micPaint(o, false);
  el(o.btn).disabled = false;
  if (o.lock) el(o.lock).disabled = false;
}
async function micUpload(blob, seconds) {
  try {
    const r = await fetch('/api/concepts/voice/transcribe', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + getToken(), 'Content-Type': blob.type, 'X-Audio-Seconds': String(seconds) },
      body: blob,
    });
    let json = null;
    try { json = await r.json(); } catch (e) { /* 본문 없음 */ }
    return { status: r.status, body: json };
  } catch (e) { return { status: 0, body: null }; }
}
async function micStopped(o) {
  clearInterval(Mic.timer); Mic.timer = null;
  const seconds = Math.min(MIC_MAX_SEC, Math.round((Date.now() - Mic.t0) / 1000));
  const chunks = Mic.chunks;
  const mime = (chunks[0] && chunks[0].type) || Mic.mime || 'audio/webm';
  const cancelled = Mic.state === 'cancelled';
  micRelease();
  Mic.chunks = [];
  if (cancelled) { micSay(o, ''); micDone(o); return; }
  if (!chunks.length) { micSay(o, '녹음된 소리가 없습니다. 다시 시도해 주세요.', 'error'); micDone(o); return; }
  const blob = new Blob(chunks, { type: mime });
  if (blob.size > MIC_MAX_BYTES) { micSay(o, '녹음 파일이 너무 큽니다. 더 짧게 말해 주세요.', 'error'); micDone(o); return; }
  Mic.state = 'transcribing';
  micPaint(o, false);
  el(o.btn).disabled = true;
  micSay(o, '글로 바꾸는 중…', 'info');
  const r = await micUpload(blob, seconds);
  if (r.status === 200) {
    const text = r.body && typeof r.body.text === 'string' ? r.body.text.trim() : '';
    if (!text) micSay(o, '들리는 말을 찾지 못했습니다. 다시 말해 주세요.', 'info');
    else {
      const input = el(o.input);
      const max = input.maxLength > 0 ? input.maxLength : TERM_MAX;
      let v = input.value.trim() ? input.value.trim() + ' ' + text : text;
      let cut = false;
      if (clen(v) > max) { v = Array.from(v).slice(0, max).join(''); cut = true; }
      input.value = v;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      micDone(o);
      input.focus();
      micSay(o, (cut ? '길어서 ' + max + '자까지만 넣었어요. ' : '') + '변환 결과를 확인하고 고친 뒤 직접 추가해 주세요. (자동으로 추가되지 않아요)', 'info');
      return;
    }
  } else micSay(o, micHttpText(r), 'error');
  micDone(o);
}
for (const o of MIC_TARGETS) {
  el(o.btn).append(icon('mic'));
  el(o.btn).addEventListener('click', () => micToggle(o));
}
window.addEventListener('hashchange', micCancel);
window.addEventListener('pagehide', micCancel);

// ── 하단 내비 (작업226-3) ──
// 활성 탭: 학습 = 목록·학습 화면(퀴즈 중이 아닐 때) / 퀴즈 = 학습 화면에서 돌아보기 퀴즈 진행 중 / 지도 = 활성 표시 없음(시트만 열기)
function updateNav() {
  const quiz = el('app').classList.contains('in-quiz');
  for (const b of document.querySelectorAll('#bottom-nav [data-tab]')) {
    const on = b.dataset.tab === (quiz ? 'quiz' : 'study');
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
}
// 입력 바 높이를 측정해 하단 여백에 반영한다(안내 줄이 생겨 높이가 바뀌어도 가려지지 않게)
(function watchAskBar() {
  const bar = document.querySelector('.bottom-bar');
  if (!bar || !window.ResizeObserver) return;
  new ResizeObserver(() => document.documentElement.style.setProperty('--ask-h', bar.offsetHeight + 'px')).observe(bar);
})();
// 한 문제라도 답했고 결과 화면 전인 퀴즈 풀이 중
const quizInProgress = () => !!S.quiz && S.quiz.questions.length > 0 && S.quiz.i < S.quiz.questions.length && (S.quiz.results.length > 0 || !!S.quiz.answered);
// 마이크 녹음·변환 중이면 확인 후 녹음을 버린다(해시가 안 바뀌는 지도 탭도 같음). false = 이동하지 않음
async function micConfirmLeave() {
  if (Mic.state === 'recording' || Mic.state === 'stopping') {
    if (!(await metisConfirm('녹음 중입니다. 이동하면 녹음이 취소됩니다. 이동할까요?'))) return false;
    micCancel();
  } else if (Mic.state === 'transcribing') {
    if (!(await metisConfirm('음성을 글로 바꾸는 중입니다. 이동하면 변환 결과를 받지 못할 수 있어요. 이동할까요?'))) return false;
  }
  return true;
}
// 작업226-4: 목록에서 고르기로 학습을 열 때는 목록 카드를 눌러 여는 것과 같게 새 history 칸을 쌓아(뒤로가기 = 목록) route() 를 직접 부른다(pushState 는 hashchange 를 일으키지 않음)
async function goStudyPage(id) {
  S.quiz = null;
  history.pushState(null, '', location.pathname + location.search + '#s=' + id);
  await route();
}
// 학습 → 목록: 학습을 목록에서 열었다면(S.cameFromList) history.back() 으로 그 칸을 되돌려 목록이 두 칸 쌓이지 않게 한다 — hashchange 가 route() 를 불러 목록을 그리므로 flushNote 흐름 그대로.
// 주소(#s=id)로 바로 들어왔다면 되돌릴 목록 칸이 없으니 그 칸의 해시만 교체하고 route() 를 직접 부른다.
async function goListPage() {
  S.quiz = null;
  if (S.cameFromList) { history.back(); return; }
  history.replaceState(null, '', location.pathname + location.search);
  await route();
}
// 목록에서 퀴즈·지도를 누르면 "어떤 학습으로 할까요?" 고르기. 선택한 학습 id(없으면 null)
function pickStudy() {
  return new Promise(resolve => {
    const dlg = el('study-picker'), box = el('study-picker-list');
    box.textContent = '';
    let picked = null;
    if (!S.studies.length) box.append(h('p', { class: 'muted', 'data-t': 'picker-empty' }, '아직 학습이 없어요'));
    for (const st of S.studies) box.append(h('button', { type: 'button', class: 'pick-row', 'data-t': 'pick-study', 'data-id': String(st.id), onclick: () => { picked = st.id; dlg.close(); } }, st.topic));
    dlg.addEventListener('close', () => resolve(picked), { once: true });
    dlg.showModal();
  });
}
async function onTab(tab) {
  const inStudy = !el('view-study').hidden;
  if (tab === 'study') {
    if (!inStudy) { window.scrollTo(0, 0); return; }   // 목록 첫 화면 재클릭 = 맨 위로
    if (!(await micConfirmLeave())) return;
    if (quizInProgress() && !(await metisConfirm('퀴즈를 그만할까요? 지금까지의 답은 저장되지 않습니다.'))) return;
    await goListPage();
    return;
  }
  if (tab === 'quiz') {
    if (inStudy && el('app').classList.contains('in-quiz')) return;   // 퀴즈 재클릭은 무동작
    if (!(await micConfirmLeave())) return;
    if (!inStudy) {
      const id = await pickStudy();
      if (id === null) return;
      await goStudyPage(id);
    }
    if (S.items.length) await startQuiz();
    return;
  }
  // 지도: 화면 전환 없이 시트만 연다
  if (!(await micConfirmLeave())) return;
  if (inStudy && el('app').classList.contains('in-quiz')) {
    if (quizInProgress() && !(await metisConfirm('퀴즈를 그만할까요? 지금까지의 답은 저장되지 않습니다.'))) return;
    S.quiz = null; renderStudy();
  }
  if (!inStudy) {
    const id = await pickStudy();
    if (id === null) return;
    await goStudyPage(id);
  }
  if (S.items.length) openMapSheet(); else showMsg('지도로 볼 개념이 아직 없어요. 입력창에 개념을 하나 넣어 보세요.');
}

window.addEventListener('pagehide', () => { flushNote(); });

(async function init() {
  const allowed = await checkPermission();
  el('loading').hidden = true;
  if (!allowed) { el('access-denied').hidden = false; el('access-denied').style.display = 'flex'; return; }
  el('app').hidden = false;
  applyHeaderHeight();
  const hdr = document.querySelector('.metis-app-header');
  if (hdr && window.ResizeObserver) { try { new ResizeObserver(applyHeaderHeight).observe(hdr); } catch (e) { /* 무시 */ } }
  await route();
})();
</script>
</body>
