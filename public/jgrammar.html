<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>문장 학습</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common/appHeader.css">
<link rel="stylesheet" href="/css/common/tokens.css">
<link rel="stylesheet" href="/css/common/screenBar.css">
<style>
  /* 작업JG-1: 문장 학습(작업313: 일본어 문법 해설을 언어 선택형으로 일반화). 독립 화면(다른 메뉴와 코드·데이터를 공유하지 않음).
     docs/design/design-principles.md: 박스 없이 텍스트 중심, 문법 항목은 문단과 구분선으로만 나눈다. 색은 tokens.css 의 --color-* 만 쓴다. */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-size: var(--body-font-size); font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); line-height: 1.5; }
  .content { max-width: var(--content-max); margin: 0 auto; padding: var(--sp-16) var(--gutter) var(--sp-24); }

  .lead { font-size: var(--fs-13); color: var(--color-text-sub); margin-bottom: var(--sp-12); }
  textarea {
    display: block; width: 100%; min-height: 96px; resize: vertical;
    padding: var(--sp-12); font: inherit; font-size: var(--fs-16); line-height: 1.6;
    color: var(--color-text); background: var(--color-surface);
    border: 1px solid var(--color-line); border-radius: var(--input-radius); outline: none;
  }
  textarea:focus { box-shadow: var(--ring-focus); }
  .input-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-12); margin-top: var(--sp-8); }
  .count { font-size: var(--fs-12); color: var(--color-text-sub); }
  .btn {
    min-height: var(--ctl-min-h); padding: var(--sp-12) var(--sp-20); font: inherit; font-size: var(--fs-14); font-weight: var(--btn-weight);
    color: var(--color-surface); background: var(--btn-primary-bg); border: 0; border-radius: var(--btn-radius); cursor: pointer;
  }
  .btn:hover { background: var(--btn-primary-bg-hover); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .btn.text { padding: var(--sp-0) var(--sp-8); color: var(--color-text-sub); background: none; text-decoration: underline; font-weight: 500; }
  .btn.text:hover { background: none; color: var(--color-text); }
  .lang-switch { display: flex; align-items: center; margin-bottom: var(--sp-4); color: var(--color-text-sub); }   /* 작업313: 언어 선택 — 박스 없이 텍스트 링크(.btn.text), 선택된 항목만 진하게 */
  .lang-switch[hidden] { display: none; }   /* 작업314: 중국어를 고를 때만 보이는 간체·번체 줄 */
  .lang-switch .btn.text { min-width: var(--ctl-min-h); }
  .lang-switch .btn.text[aria-pressed="true"] { color: var(--color-text); font-weight: 700; text-decoration: none; }
  .photo-links { display: flex; align-items: center; gap: var(--sp-8); }
  .photo-links input[type=file] { display: none; }
  #picks { margin-top: var(--sp-16); }
  .picks-title { font-size: var(--fs-12); font-weight: 700; color: var(--color-text-sub); padding-bottom: var(--sp-8); }
  .pick { display: block; width: 100%; min-height: var(--ctl-min-h); padding: var(--sp-12) var(--sp-0); text-align: left; font: inherit; font-size: var(--fs-16); line-height: 1.6; color: var(--color-text); background: none; border: 0; border-top: 1px solid var(--color-line); cursor: pointer; }
  .pick:hover { font-weight: 600; }
  #saved { margin-top: var(--sp-24); }
  .saved-item { display: flex; align-items: center; gap: var(--sp-8); border-top: 1px solid var(--color-line); }
  .saved-item .pick { flex: 1; min-width: 0; border-top: 0; }
  .saved-date { display: block; font-size: var(--fs-12); color: var(--color-text-sub); }
  .saved-empty { padding-top: var(--sp-12); border-top: 1px solid var(--color-line); font-size: var(--fs-14); color: var(--color-text-sub); }
  .msg { margin-top: var(--sp-16); font-size: var(--fs-14); color: var(--color-text-sub); }
  .msg.error { color: var(--color-danger); }

  #result { margin-top: var(--sp-24); }
  .translation { font-size: var(--fs-18); font-weight: 600; line-height: 1.6; padding-bottom: var(--sp-16); }
  .result-tools { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .speak-area { display: flex; align-items: center; }
  .speak-area .btn.text { min-width: var(--ctl-min-h); }   /* 짧은 글자(듣기)도 터치 가로 44px 이상 */
  .speak-note { font-size: var(--fs-12); color: var(--color-text-sub); }
  .furi-toggle { margin-left: auto; }
  .source { padding-bottom: var(--sp-8); font-size: var(--fs-22); line-height: 1.6; }
  .source rt { font-size: var(--fs-11); font-weight: 400; color: var(--color-text-sub); }
  #result.no-furigana .source rt { display: none; }
  #result.pinyin .source ruby { white-space: nowrap; margin-right: var(--sp-4); }   /* 작업314: 병음은 글자 폭이 넓어, 한 단어의 병음이 줄 끝에서 끊기거나 이웃 병음과 붙어 보이지 않게 */
  .g-item { padding: var(--sp-16) 0; border-top: 1px solid var(--color-line); }
  .g-head { display: flex; align-items: baseline; gap: var(--sp-8); flex-wrap: wrap; }
  .g-name { font-size: var(--fs-18); font-weight: 700; }
  .g-level { font-size: var(--fs-12); font-weight: 600; color: var(--color-text-sub); }
  .g-meaning { margin-top: var(--sp-4); font-size: var(--fs-15); }
  .g-label { margin-top: var(--sp-12); font-size: var(--fs-12); font-weight: 700; color: var(--color-text-sub); }
  .g-text { font-size: var(--fs-14); line-height: 1.6; }
  /* 작업317: 영어 문장 구조 — 박스 없이 들여쓰기 목록. 자식은 왼쪽 가는 선과 들여쓰기로 구분하고, 긴 text·note 는 줄바꿈한다 */
  .u-item .g-name, .u-item .g-meaning, .u-item .g-text { overflow-wrap: anywhere; }   /* 작업318: 영어 의미 단위 목록의 긴 text·meaning 은 줄바꿈 */
  #result > .picks-title { padding-top: var(--sp-16); }
  .s-node { padding-top: var(--sp-8); }
  .s-head { font-size: var(--fs-12); font-weight: 700; color: var(--color-text-sub); overflow-wrap: anywhere; }
  .s-text { font-size: var(--fs-15); font-weight: 500; overflow-wrap: anywhere; }
  .s-note { font-size: var(--fs-13); color: var(--color-text-sub); overflow-wrap: anywhere; }
  .s-children { margin-left: var(--sp-4); padding-left: var(--sp-12); border-left: 1px solid var(--color-line); }
  .disclaimer { padding-top: var(--sp-16); border-top: 1px solid var(--color-line); font-size: var(--fs-11); color: var(--color-text-sub); }
</style>
</head>
<body>

<script src="/js/common/appHeader.js"></script>
<script>MetisAppHeader.inject();</script>

<script src="/js/common/dialog.js"></script>
<script>if (!window.metisConfirm) { window.metisConfirm = function (m) { return Promise.resolve(confirm(m)); }; }   // dialog.js를 못 불렀을 때 기본 확인창으로 대체</script>

<div class="screen-bar">
  <a class="screen-bar-back" href="/" aria-label="홈으로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>
  <h1 class="screen-bar-title">문장 학습</h1>
</div>

<main class="content">
  <p class="msg" id="denied" hidden>사용 권한이 없습니다. 관리자에게 문의해 주세요.</p>
  <div id="main" hidden>
  <p class="lang-switch" role="group" aria-label="언어 선택">
    <button type="button" class="btn text" data-lang="ja" aria-pressed="true">일본어</button>
    <span aria-hidden="true">·</span>
    <button type="button" class="btn text" data-lang="en" aria-pressed="false">영어</button>
    <span aria-hidden="true">·</span>
    <button type="button" class="btn text" data-lang-group="zh" aria-pressed="false">중국어</button>
  </p>
  <p class="lang-switch" id="zh-switch" role="group" aria-label="중국어 글자체" hidden>
    <button type="button" class="btn text" data-lang="zh-Hans" aria-pressed="false">간체</button>
    <span aria-hidden="true">·</span>
    <button type="button" class="btn text" data-lang="zh-Hant" aria-pressed="false">번체</button>
  </p>
  <p class="lead" id="lead">일본어 문장을 입력하면 그 문장을 이해하는 데 필요한 문법을 골라 설명해 드립니다.</p>
  <textarea id="sentence" aria-label="일본어 문장" maxlength="200" lang="ja" placeholder="例: 私は毎日学校に行きます。" autocomplete="off"></textarea>
  <div class="input-foot">
    <span class="photo-links">
      <button type="button" class="btn text" id="shoot">사진 찍기</button>
      <button type="button" class="btn text" id="pick">사진 선택</button>
      <input type="file" id="file-camera" accept="image/*" capture="environment" aria-label="사진 찍기">
      <input type="file" id="file-gallery" accept="image/*" aria-label="사진 선택">
    </span>
    <span class="count" id="count">0 / 200</span>
    <button type="button" class="btn" id="go">문법 설명</button>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <section id="picks" hidden></section>
  <section id="result" hidden></section>
  <section id="saved" aria-label="저장한 문장"></section>
  </div>
</main>

<script>
(function () {
  var KANA_KANJI = /[぀-ゟ゠-ヿ㐀-䶿一-鿿\u{20000}-\u{2FA1F}]/u;
  // 작업313: 로마자가 하나도 없거나, 로마자가 아닌 글자(가나·한자·한글 등)가 로마자보다 많으면 영어 문장이 아니다(서버 looksEnglish 와 같은 기준. 숫자·기호·공백은 세지 않음)
  function looksEnglish(text) {
    var latin = 0, other = 0, chars = Array.from(String(text));
    for (var i = 0; i < chars.length; i++) { if (/\p{Script=Latin}/u.test(chars[i])) latin++; else if (/\p{L}/u.test(chars[i])) other++; }
    return latin > 0 && other <= latin;
  }
  // 작업314: 중국어 — 한자가 하나라도 있고 일본어 가나(히라가나·가타카나)가 없으면 통과. 간체·번체 글자체는 검사하지 않는다(서버 looksChinese 와 같은 기준)
  function looksChinese(text) { return /[\u3400-\u4DBF\u4E00-\u9FFF\u{20000}-\u{2FA1F}]/u.test(text) && !/[\u3040-\u30FF]/.test(text); }
  // 작업313: 언어별 화면 설정(서버 lib/jgrammar.js 의 LANGS 와 같은 값). reading: 원문 위 읽기 표시 종류(furigana·pinyin·없음). 작업314: 중국어 간체·번체 추가
  var LANG_UI = {
    ja: { name: '일본어', max: 200, htmlLang: 'ja', speech: 'ja-JP', test: function (t) { return KANA_KANJI.test(t); }, reading: 'furigana', levelKey: 'jlpt', levelPrefix: 'JLPT ',
      lead: '일본어 문장을 입력하면 그 문장을 이해하는 데 필요한 문법을 골라 설명해 드립니다.', aria: '일본어 문장', placeholder: '例: 私は毎日学校に行きます。',
      empty: '일본어 문장을 입력해 주세요.', notLang: '일본어 문장(히라가나·가타카나·한자)을 입력해 주세요.', noneFound: '일본어 문장을 찾지 못했습니다.', disclaimer: 'AI가 생성한 설명과 읽기라 틀릴 수 있습니다' },
    en: { name: '영어', max: 300, htmlLang: 'en', speech: 'en-US', test: looksEnglish, reading: null, levelKey: 'level', levelPrefix: 'CEFR ',
      lead: '영어 문장을 입력하면 그 문장을 이해하는 데 필요한 문법을 골라 설명해 드립니다.', aria: '영어 문장', placeholder: 'e.g. She has lived in Seoul since 2020.',
      empty: '영어 문장을 입력해 주세요.', notLang: '선택한 언어(영어)의 문장이 아닙니다. 영어 문장을 입력해 주세요.', noneFound: '영어 문장을 찾지 못했습니다.', disclaimer: 'AI가 생성한 설명이라 틀릴 수 있습니다' },
    'zh-Hans': { name: '중국어', max: 200, htmlLang: 'zh-Hans', speech: 'zh-CN', test: looksChinese, reading: 'pinyin', levelKey: 'level', levelPrefix: 'HSK ',
      lead: '중국어(간체) 문장을 입력하면 그 문장을 이해하는 데 필요한 문법을 골라 설명해 드립니다.', aria: '중국어 간체 문장', placeholder: '例：我每天去学校。',
      empty: '중국어 문장을 입력해 주세요.', notLang: '선택한 언어(중국어 간체)의 문장이 아닙니다. 중국어 문장(한자)을 입력해 주세요.', noneFound: '중국어 문장을 찾지 못했습니다.', disclaimer: 'AI가 생성한 설명과 병음이라 틀릴 수 있습니다' },
    'zh-Hant': { name: '중국어', max: 200, htmlLang: 'zh-Hant', speech: 'zh-TW', test: looksChinese, reading: 'pinyin', levelKey: 'level', levelPrefix: 'HSK ',
      lead: '중국어(번체) 문장을 입력하면 그 문장을 이해하는 데 필요한 문법을 골라 설명해 드립니다.', aria: '중국어 번체 문장', placeholder: '例：我每天去學校。',
      empty: '중국어 문장을 입력해 주세요.', notLang: '선택한 언어(중국어 번체)의 문장이 아닙니다. 중국어 문장(한자)을 입력해 주세요.', noneFound: '중국어 문장을 찾지 못했습니다.', disclaimer: 'AI가 생성한 설명과 병음이라 틀릴 수 있습니다' },
  };
  var LANG_KEY = 'jgrammar_lang';
  var lang = 'ja';   // 현재 선택한 언어. 시작할 때 localStorage 의 값을 읽고(try/catch), 바꾸면 입력·결과·읽어주기를 초기화한다
  try { var savedLang = localStorage.getItem(LANG_KEY); if (savedLang && Object.prototype.hasOwnProperty.call(LANG_UI, savedLang)) lang = savedLang; } catch (e) { /* 읽지 못하면 일본어 */ }
  var ZH_KEY = 'jgrammar_zh';   // 마지막에 쓴 간체/번체(처음 중국어를 고르면 간체)
  var lastZh = lang.indexOf('zh') === 0 ? lang : 'zh-Hans';
  if (lang.indexOf('zh') !== 0) { try { var savedZh = localStorage.getItem(ZH_KEY); if (savedZh === 'zh-Hans' || savedZh === 'zh-Hant') lastZh = savedZh; } catch (e) { /* 읽지 못하면 간체 */ } }
  function cur() { return LANG_UI[lang]; }
  var $ = function (id) { return document.getElementById(id); };
  var input = $('sentence'), go = $('go'), msg = $('msg'), result = $('result'), count = $('count'), picks = $('picks');
  var OCR_MAX_BYTES = 5 * 1024 * 1024, OCR_MAX_SIDE = 1600;   // 서버 상한과 같은 값(5MB). 휴대폰 사진은 크므로 올리기 전에 긴 변 1600px 로 줄인다
  var OCR_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];

  function token() { try { return localStorage.getItem('mydict_token'); } catch (e) { return null; } }
  function setMsg(text, isError) { msg.textContent = text || ''; msg.className = 'msg' + (isError ? ' error' : ''); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  // 작업JG-2: /api/me 에서 perm_jgrammar 가 true 이거나 관리자일 때만 입력창을 보여 준다(fail-closed). 서버도 같은 기준으로 다시 검사한다.
  async function checkAccess() {
    var t = token(), ok = false;
    if (t) {
      try {
        var r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + t } });
        if (r.ok) { var me = await r.json(); ok = me.perm_jgrammar === true || me.role === 'admin'; }
      } catch (e) { ok = false; }
    }
    $(ok ? 'main' : 'denied').hidden = false;
    if (ok) loadSaved();   // 권한이 없으면 저장 목록은 요청도 하지 않는다
  }
  checkAccess();

  function updateCount() { count.textContent = Array.from(input.value).length + ' / ' + cur().max; }
  input.addEventListener('input', updateCount);

  // ── 작업JG-6: 저장한 문장. 설명이 정상 반환되면 서버가 본인 목록에 저장한다. 목록 조회·열기는 AI 를 부르지 않는다(저장된 결과를 그대로 표시). ──
  var savedBox = $('saved');
  function validResult(r) { return r && typeof r.translation === 'string' && (Array.isArray(r.grammar) || isNewEn(r) || isEnUnits(r)); }
  // 작업318: 영어 형식 판별은 units 키부터. units 키가 있으면 형식 3(의미 단위. 배열 또는 null), 없고 structure 키가 있으면 형식 2(작업317), 둘 다 없으면 형식 1(문법 항목 목록). 옛 형식은 변환하지 않고 기존 방식으로 표시한다
  function isEnUnits(r) { return lang === 'en' && !!r && Object.prototype.hasOwnProperty.call(r, 'units') && (r.units === null || Array.isArray(r.units)); }
  function isNewEn(r) { return lang === 'en' && !!r && !Object.prototype.hasOwnProperty.call(r, 'units') && Object.prototype.hasOwnProperty.call(r, 'structure') && Array.isArray(r.points); }   // 형식 2(작업317)
  function dateText(v) { var d = new Date(v); return isNaN(d) ? '' : d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.'; }
  function authHeaders() { return { 'Authorization': 'Bearer ' + (token() || '') }; }

  function renderSaved(items) {
    savedBox.textContent = '';
    savedBox.appendChild(el('p', 'picks-title', '저장한 문장'));
    if (!items.length) { savedBox.appendChild(el('p', 'saved-empty', '저장한 문장이 없습니다.')); return; }
    items.forEach(function (it) {
      var row = el('div', 'saved-item');
      var open = el('button', 'pick'); open.type = 'button';
      open.appendChild(document.createTextNode(it.sentence));
      open.appendChild(el('span', 'saved-date', dateText(it.last_used_at)));
      open.addEventListener('click', function () {
        if (!validResult(it.result)) return;
        setMsg(''); fillInput(it.sentence); render(it.result, it.sentence);   // 저장된 결과를 바로 표시(AI 호출 없음)
      });
      var del = el('button', 'btn text', '삭제'); del.type = 'button';
      del.setAttribute('aria-label', '삭제: ' + it.sentence);
      del.addEventListener('click', async function () {
        if (!(await window.metisConfirm('저장한 문장을 삭제할까요?', { danger: true, okText: '삭제' }))) return;
        del.disabled = true;
        try {
          var res = await fetch('/api/jgrammar/saved/' + encodeURIComponent(it.id), { method: 'DELETE', headers: authHeaders() });
          if (res.ok || res.status === 404) loadSaved(); else { del.disabled = false; setMsg('삭제하지 못했습니다. 잠시 후 다시 시도해주세요.', true); }

      sync(); tools.appendChild(tg);
    }
    var enUnits = isEnUnits(r), newEn = isNewEn(r), hasStructure = newEn && Array.isArray(r.structure) && r.structure.length > 0;   // enUnits: 형식 3, newEn: 형식 2(구조는 토글 없이 항상 표시)
    if (tools.firstChild.firstChild || hasReading) result.appendChild(tools);
    if (sentence) result.appendChild(renderSource(sentence, ruby));
    result.appendChild(el('p', 'translation', r.translation));
    if (enUnits) {   // 작업318: 형식 3 — 의미 단위 목록과 전체 흐름. units 가 null 이면 번역만, flow 가 null 이면 전체 흐름 줄만 생략
      if (Array.isArray(r.units) && r.units.length) {
        result.appendChild(el('h2', 'picks-title', '의미 단위'));
        r.units.forEach(function (u) {
          if (!u || typeof u.text !== 'string' || typeof u.meaning !== 'string' || typeof u.role !== 'string') return;
          var item = el('article', 'g-item u-item');
          item.appendChild(el('h3', 'g-name', u.text));
          item.appendChild(el('p', 'g-meaning', u.meaning));
          item.appendChild(el('p', 'g-label', '역할'));
          item.appendChild(el('p', 'g-text', u.role));
          if (typeof u.reason === 'string' && u.reason !== '') { item.appendChild(el('p', 'g-label', '이유')); item.appendChild(el('p', 'g-text', u.reason)); }
          result.appendChild(item);
        });
        if (typeof r.flow === 'string' && r.flow !== '') { result.appendChild(el('h2', 'picks-title', '전체 흐름')); result.appendChild(el('p', 'g-text', r.flow)); }
      }
      result.appendChild(el('p', 'disclaimer', cur().disclaimer));
      result.hidden = false;
      return;
    }
    if (hasStructure) result.appendChild(renderStructure(r.structure));
    var items = newEn ? r.points : r.grammar;
    if (newEn && items.length) result.appendChild(el('h2', 'picks-title', '알아둘 문법'));   // points 가 비면 소제목 포함 전체를 그리지 않는다
    items.forEach(function (g) {
      var item = el('article', 'g-item');
      var head = el('div', 'g-head');
      head.appendChild(el('h2', 'g-name', g.name));
      var level = g[cur().levelKey];
      if (level) head.appendChild(el('span', 'g-level', cur().levelPrefix + level));   // 일본어 JLPT·영어 CEFR. 확실하지 않은 레벨(null)은 표시하지 않는다
      item.appendChild(head);
      item.appendChild(el('p', 'g-meaning', g.meaning));
      item.appendChild(el('p', 'g-label', '이 문장에서'));
      item.appendChild(el('p', 'g-text', g.form));
      item.appendChild(el('p', 'g-label', '비슷한 표현과의 차이'));
      item.appendChild(el('p', 'g-text', g.contrast));
      result.appendChild(item);
    });
    result.appendChild(el('p', 'disclaimer', cur().disclaimer));
    result.hidden = false;
  }

  function setBusy(on) { go.disabled = on; $('shoot').disabled = on; $('pick').disabled = on; }

  async function submit() {
    var sentence = input.value.trim();
    stopSpeech();
    result.hidden = true; picks.hidden = true;
    var reqLang = lang, ui = cur();
    if (!sentence) { setMsg(ui.empty, true); return; }
    if (Array.from(sentence).length > ui.max) { setMsg('문장은 ' + ui.max + '자까지 입력할 수 있습니다.', true); return; }
    if (!ui.test(sentence)) { setMsg(ui.notLang, true); return; }   // AI 를 부르지 않는다
    var t = token();
    if (!t) { setMsg('로그인 후 이용할 수 있습니다. 홈에서 로그인해 주세요.', true); return; }
    setBusy(true); setMsg('설명을 만들고 있습니다…');
    try {
      var res = await fetch('/api/jgrammar/explain', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
        body: JSON.stringify({ sentence: sentence, lang: reqLang }),
      });
      var data = null;
      try { data = await res.json(); } catch (e) { /* 본문 없음 */ }
      if (reqLang !== lang) return;   // 분석하는 동안 언어를 바꿨으면 결과를 쓰지 않는다(서버에는 요청한 언어로 저장됨)
      if (res.ok && data && data.ok && data.result) { setMsg(''); render(data.result, sentence); loadSaved(); }
      else setMsg((data && data.error) || '설명을 가져오지 못했습니다. 잠시 후 다시 시도해주세요.', true);
    } catch (e) {
      setMsg('설명을 가져오지 못했습니다. 잠시 후 다시 시도해주세요.', true);
    } finally { setBusy(false); }
  }
  go.addEventListener('click', submit);

  // ── 작업313: 언어 선택. 바꾸면 입력창·결과·사진 후보·메시지·읽어주기(읽는 중이면 정지)를 초기화하고 저장 목록을 그 언어 것으로 다시 불러온다. 선택은 localStorage 에 기억(실패해도 동작) ──
  var langBtns = Array.prototype.slice.call(document.querySelectorAll('.lang-switch [data-lang]'));
  var zhGroupBtn = document.querySelector('.lang-switch [data-lang-group="zh"]'), zhRow = $('zh-switch');
  function applyLang() {
    var ui = cur();
    input.maxLength = ui.max; input.lang = ui.htmlLang; input.placeholder = ui.placeholder; input.setAttribute('aria-label', ui.aria);
    $('lead').textContent = ui.lead;
    langBtns.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    var isZh = lang.indexOf('zh') === 0;
    zhGroupBtn.setAttribute('aria-pressed', isZh ? 'true' : 'false');
    zhRow.hidden = !isZh;   // 간체·번체 줄은 중국어를 고를 때만
    updateCount();
  }
  function setLang(code) {
    if (code === lang || !Object.prototype.hasOwnProperty.call(LANG_UI, code)) return;
    stopSpeech();
    lang = code;
    lsSet(LANG_KEY, code);
    if (code.indexOf('zh') === 0) { lastZh = code; lsSet(ZH_KEY, code); }
    input.value = ''; picks.hidden = true; picks.textContent = ''; result.hidden = true; result.textContent = ''; speakCtx = null; setMsg('');
    applyLang();
    if (!$('main').hidden) loadSaved();   // 권한이 없으면 저장 목록은 요청도 하지 않는다
  }
  langBtns.forEach(function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); }); });
  zhGroupBtn.addEventListener('click', function () { setLang(lastZh); });   // 중국어를 다시 고르면 마지막에 쓴 간체/번체
  applyLang();
})();
</script>
</body>
</html>
