<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>과학 - METIS</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 작업13: 전 화면 공통 상단 헤더(로고+로그인상태) -->
<link rel="stylesheet" href="/css/common/appHeader.css">
<style>
  /* 작업149: digest_reading.html의 색상 토큰과 같은 계열(초록 primary,
     따뜻한 회백색 bg)로 맞추되, 이 페이지는 목록/상세 뷰가 없는 단일
     정적 화면이라 해당 레이아웃은 가져오지 않고 새로 작성함 */
  :root {
    --primary: #1D9E75;
    --primary-light: #E1F5EE;
    --bg: #FAFAF9;
    --text1: #1a1a1a;
    --text2: #6b7280;
    --border: rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text1);
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  .science-empty {
    min-height: calc(100dvh - 57px); /* 57px ≈ appHeader 실측 높이(패딩 8px×2 + 콘텐츠) */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }

  .science-empty-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .science-empty-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text1);
  }

  .science-empty-text {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
  }

  .science-home-link {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primary);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    border: none;
  }
</style>
</head>
<body>

<!-- 작업13: 전 화면 공통 상단 헤더 -->
<script src="/js/common/appHeader.js"></script>
<script>MetisAppHeader.inject();</script>

<div class="science-empty">
  <div class="science-empty-icon">🔬</div>
  <div class="science-empty-title">과학 콘텐츠를 준비하고 있습니다</div>
  <div class="science-empty-text">곧 새로운 과학 콘텐츠로 찾아올게요.<br>잠시만 기다려 주세요.</div>
  <a href="/" class="science-home-link">METIS 홈으로</a>
</div>

</body>
</html>
