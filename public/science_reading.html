<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>과학 - METIS</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 작업13: 전 화면 공통 상단 헤더(로고+로그인상태) -->
<link rel="stylesheet" href="/css/common/appHeader.css">
<link rel="stylesheet" href="/css/common/tokens.css">
<link rel="stylesheet" href="/css/common/screenBar.css">
<style>
  /* 작업153: digest_reading.html을 복제한 독립 파일. 작업173: 하단 탭바와
     개념 정복 버튼(conquest-bar)을 추가함(퀴즈 엔진·결과 화면은 작업174).
     작업155: 범례 필터 방식을 버리고 과목 선택 화면(view-subjects)을 추가 -
     3단계(과목 선택 → 과목별 캐러셀 → 개념 상세) 구조로 바뀜 */
  :root {
    --primary: #e2583b;
    --primary-light: #FDF0EC;
    --primary-dark: #b8442e;
    /* 작업199: 정답 같은 의미색은 주제색(코랄)과 분리해 초록 유지 */
    --success: #1D9E75;
    --success-light: #E1F5EE;
    --success-dark: #085041;
    --bg: #FAFAF9;
    --card: #FFFFFF;
    --text1: #1a1a1a;
    --text2: #6b7280;
    --border: rgba(0,0,0,0.08);
    --error: #E24B4A;
    --error-light: #FCEBEB;
    --error-dark: #B42318;   /* 작업217-3: 오답 글자(흰 바탕 6.57:1). 프로젝트의 위험색(개념 학습 --danger, 다이얼로그 위험 버튼)과 같은 값 */
    --navbar-h: 78px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-size: var(--body-font-size);
    font-family: 'Noto Sans KR', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text1);
    min-height: 100dvh;
    max-width: var(--content-max);
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 999; gap: 16px;
  }
  /* 작업220: 화면 로딩 스피너 32px */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text2); font-size: 14px; }

  /* ── Views ── */
  .view { display: none; min-height: 100dvh; padding-bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom, 0px) + 16px); }
  .view.active { display: block; }

  /* 작업220: 상세 화면 상단 바 제목은 한 줄 말줄임(공용 screenBar.css의 두 줄 말줄임을 이 화면에서만 한 줄로) */
  .screen-bar-title.one-line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 작업199: 제목 줄은 공용 /css/common/screenBar.css(.screen-bar) */

  /* 작업155: 과목별 캐러셀 상단의 현재 과목 칩 */
  /* 작업216-6: 표시만 하는 분야 이름은 알약·채움 없이 글자. 색 의미(분야)는 글자색 --field-ink로 옮김(흰 바탕 5.52~6.98:1; 흰 글자+분야 색 바탕은 3.05~4.4:1이었음) */
  .subject-chip {
    display: inline-flex; align-items: center;
    font-size: 12px; font-weight: 700;
    color: var(--field-ink, #5E6470);
  }

  /* ── View 0: Subject select (작업155) ── */
  #view-subjects .content { padding: 20px 16px; }
  /* 작업220: 목록 첫 화면 제목 22px / 700 / 주 글자색 */
  .subjects-title { font-size: 22px; font-weight: 700; color: var(--text1); margin-bottom: 4px; }
  .subjects-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  /* 작업217-4: 과목 선택은 박스·분야색 틴트 없이 텍스트 행(구분선, 오른쪽 "›", 높이 56px). 분야색은 분야 이름 글자색(--field-ink)으로만 */
  .subject-grid { display: flex; flex-direction: column; gap: 0; }
  .subject-card {
    display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px;
    width: 100%; min-height: 56px; padding: 10px 0;
    border: none; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent;
    cursor: pointer; text-align: left;
    font-family: inherit;
  }
  .subject-card::after { content: '›'; grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 26px; line-height: 1; color: var(--text2); }
  .subject-card:hover .subject-name { text-decoration: underline; text-underline-offset: 3px; }
  .subject-card:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  .subject-card .subject-name { font-size: 17px; font-weight: 700; color: var(--field-ink, var(--text1)); }
  .subject-card .subject-count { font-size: 13px; color: var(--text2); }
  .subject-card.disabled { cursor: default; opacity: 0.55; }
  .subject-card.disabled::after { content: ''; }
  .subject-card.disabled .subject-name { color: var(--text2); }

  /* ── View 1: 과목별 캐러셀 (digest_reading.html 작업81의 3D 캐러셀과 동일 메커니즘) ── */
  #view-list.active {
    display: flex; flex-direction: column;
    min-height: calc(100dvh - var(--hdr-h, 0px));
  }
  #view-list .content {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px;
  }

  #list-carousel {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 8px 0;
  }
  .carousel-clip {
    overflow: hidden;
    margin: 0 -16px;
  }
  .carousel-viewport {
    position: relative;
    outline: none;
    user-select: none; -webkit-user-select: none;
    touch-action: pan-y;
    perspective-origin: 50% 50%;
  }
  .carousel-viewport:focus-visible { box-shadow: inset 0 0 0 2px var(--metis-coral, #e2583b); }
  .carousel-track {
    position: absolute; inset: 0;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
  }
  /* 작업217-4: 캐러셀 카드는 테두리·둥근 모서리·그림자·그라데이션 없이 평면 흰 배경(눌림·스와이프 동작은 그대로). 분야색은 글자색(--field-ink)과 왼쪽 선으로 표시 */
  .carousel-card {
    position: absolute; top: 50%; left: 50%;
    display: flex; flex-direction: column;
    padding: 20px 18px 16px;
    border-radius: 0;
    color: var(--text1);
    background: var(--card);
    box-shadow: none;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    cursor: pointer;
    overflow: hidden;
  }
  .carousel-track.moving .carousel-card { will-change: transform, opacity; }
  .carousel-card-meta {
    margin-bottom: 12px;
    font-size: 11px; letter-spacing: 0.08em; color: #6B7280;
  }
  .carousel-card-meta .g { color: var(--field-ink); font-weight: 700; }
  .carousel-card-done { color: var(--text1); font-weight: 700; letter-spacing: 0.02em; }
  .carousel-card-title {
    margin-top: auto;
    font-size: var(--title-size, 22px); font-weight: 500; line-height: 1.3;
    word-break: keep-all;
  }
  .carousel-card.is-center .carousel-card-title { font-weight: 700; }
  .carousel-card-line {
    flex-shrink: 0;
    margin-top: 14px; margin-bottom: auto; padding-left: 10px;
    border-left: 2px solid var(--field-ink);
    font-size: 13px; line-height: 1.6; color: var(--text1);
    display: -webkit-box; -webkit-line-clamp: var(--line-clamp, 4); -webkit-box-orient: vertical;
    overflow: hidden; word-break: keep-all;
  }
  .carousel-nav {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin-top: 8px;
    font-size: 12px; color: var(--text2);
  }
  .carousel-nav-count { font-family: 'Inter', sans-serif; min-width: 56px; text-align: center; }
  /* 작업217-2: 이전·다음 화살표는 테두리·배경 없이 글자(‹ ›) 그대로, 터치 영역 44×44px. 글자색 --text1(흰 바탕 약 17:1), 호버 --primary-dark(5.38:1) */
  .carousel-nav-btn {
    position: relative;
    width: 44px; height: 44px; padding: 0 0 4px;
    border: none; border-radius: 0; background: transparent;
    color: var(--text1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans KR', sans-serif; font-size: 30px; line-height: 1; font-weight: 400;
  }
  .carousel-nav-btn:hover:not(:disabled) { color: var(--primary-dark); }
  .carousel-nav-btn:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; border-radius: 4px; }

  @media (max-height: 599px) {
    #view-list .content { padding-top: 10px; padding-bottom: 10px; }
    #list-carousel { padding: 0; }
    .carousel-nav { margin-top: 0; }
  }

  /* ── View 2: Concept detail ── */
  #view-science {
    --coral: var(--metis-coral, #e2583b);
    --coral-ink: #b8442e;
    --coral-tint: #FDF0EC;
  }
  #view-science .content { padding: 20px 16px 100px; }

  .science-work-header {
    background: var(--card);
    border: none; border-radius: 0; box-shadow: none;
    padding: 20px 16px; margin: 0 -16px 14px;   /* 작업222: 글자 시작 x 16px */
  }
  .science-work-title { font-size: 24px; font-weight: 700; color: var(--text1); margin-bottom: 6px; line-height: 1.3; }
  .science-work-meta { font-size: 14px; color: var(--text2); font-family: 'Inter', sans-serif; }

  .science-section {
    background: var(--card);
    border: none; border-radius: 0; box-shadow: none;
    padding: 18px 16px; margin: 0 -16px 14px;   /* 작업222: 글자 시작 x 16px */
  }
  /* 작업220: 섹션 제목 규격 — 12px / 700 / --primary-dark(5.38:1) / 아래 2px 코랄 선(장식) */
  .science-section-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--primary-dark); padding-bottom: 4px; border-bottom: 2px solid var(--primary); margin-bottom: 10px;
  }
  .science-one-line {
    border-left: 2px solid var(--coral);
    padding: 2px 0 2px 12px;
    font-size: 15px; font-weight: 600; line-height: 1.6; color: var(--text1);
  }
  .science-summary {
    font-size: 14px; line-height: 1.8; color: var(--text1);
  }
  .key-point-list { display: flex; flex-direction: column; gap: 12px; }
  .key-point-item { display: flex; gap: 8px; align-items: baseline; }
  .point-num {
    flex-shrink: 0; min-width: 16px;
    font-size: 14px; font-weight: 800; font-family: 'Inter', sans-serif;
    color: var(--text1);
  }
  .point-text { font-size: 14px; line-height: 1.7; color: var(--text1); flex: 1; }

  .science-example { font-size: 14px; line-height: 1.8; color: var(--text1); }
  .science-misconception { font-size: 14px; line-height: 1.8; color: var(--text1); }

  /* 관련 개념: 연결 작품(digest)과 같은 줄 구분선 패턴 */
  .related-list { display: flex; flex-direction: column; }
  .related-item {
    display: flex; align-items: flex-start; gap: 10px;
    width: 100%; margin: 0;
    padding: 10px 0; min-height: var(--ctl-min-h);   /* 작업222: 문학 나침반과 같은 방식(아래선, padding 10px 0) */
    background: none; border: none; border-bottom: 1px solid var(--border);
    font: inherit; color: inherit; text-align: left;
    cursor: pointer; transition: background 0.15s;
  }
  .related-item:focus-visible { outline: 2px solid var(--coral); outline-offset: -2px; }
  .related-list .related-item:last-child { border-bottom: none; }
  .related-item:hover { background: var(--coral-tint); }
  .related-item svg { width: 14px; height: 14px; color: var(--coral); flex-shrink: 0; margin-top: 3px; }
  .related-info { flex: 1; }
  .related-info > span { display: block; }
  .related-title { font-size: 14px; font-weight: 700; color: var(--text1); }
  .related-relation { font-size: 12px; color: var(--coral-ink); font-weight: 600; margin-top: 2px; }

  /* 출처 목록 */
  .source-list { display: flex; flex-direction: column; gap: 10px; }
  .source-item { padding: 10px 0; border-top: 1px solid var(--border); }
  .source-item:first-child { border-top: none; padding-top: 0; }
  .source-name { font-size: 13px; font-weight: 700; color: var(--text1); }
  .source-name a { color: var(--primary-dark); text-decoration: underline; }   /* 작업220: 문장 속 링크 = 밑줄 + --primary-dark(5.38:1) */
  /* 작업216-8: 표시만 하는 출처 등급은 알약·채움 없이 작은 보조색 글자. 글자 --text2는 흰 바탕 4.83:1 */
  .source-tier {
    display: inline-block; margin-left: 6px;
    font-size: 11px; font-weight: 700; color: var(--text2);
    vertical-align: middle;
  }
  .source-publisher { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .source-note { font-size: 12px; color: var(--text2); margin-top: 2px; }   /* 작업220: #9ca3af(흰 바탕 2.6:1) → 보조색(4.83:1) */

  .error-msg { text-align: center; padding: 40px 24px; color: var(--error); font-size: 14px; }

  /* ── 하단 내비 (작업226-2): 음성 학습·언어 사전의 하단 내비(작업224-2)와 같은 구조·크기. 색은 이 화면의 팔레트 ── */
  .bottom-nav {
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(226,88,59,0.07);
    padding: 0 16px max(8px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 0;
    position: fixed;
    left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--content-max);
    bottom: 0; z-index: 100;
    min-height: var(--navbar-h);
  }
  .bottom-nav-tabs { display: flex; flex: 1; gap: 0; }
  .bottom-nav-tab {
    display: flex; flex-direction: row; align-items: baseline; justify-content: center; gap: 2px;
    flex: 1 1 0; min-width: 0; min-height: var(--ctl-min-h);
    padding: 10px 0;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 500; line-height: normal;
    color: var(--text2); cursor: pointer; text-decoration: none;
    border-top: 3px solid transparent; border-bottom: none; border-left: none; border-right: none;
    background: none; white-space: nowrap;
  }
  .bottom-nav-tab:hover:not(.active) { color: var(--text1); }
  .bottom-nav-tab.active { color: var(--primary-dark); border-top-color: var(--primary); }
  .bottom-nav-tab:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  @media (max-width: 460px) { .bottom-nav-tab { font-size: 13px; } }

  /* 정복 탭: 정복한 항목을 묶음별 텍스트 행(구분선)으로 모아 보기 */
  #view-conq .content { padding: 20px 16px; }
  .conq-title { font-size: 22px; font-weight: 700; color: var(--text1); margin-bottom: 4px; }
  .conq-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  .conq-group { margin-bottom: 20px; }
  .conq-group-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--primary-dark); padding-bottom: 4px; border-bottom: 2px solid var(--primary); margin-bottom: 4px; }
  .conq-row {
    display: flex; align-items: center; width: 100%; min-height: var(--ctl-min-h); padding: 10px 0; text-align: left;
    background: none; border: none; border-bottom: 1px solid var(--border); border-radius: 0; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 500; color: var(--text1);
  }
  .conq-group .conq-row:last-child { border-bottom: none; }
  .conq-row:hover { text-decoration: underline; text-underline-offset: 3px; }
  .conq-row:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  .conq-empty { padding: 24px 0; font-size: 14px; color: var(--text2); }

  /* 작업226-2: 정복 토글은 상세 화면 제목 줄 오른쪽(.screen-bar-end)에 둔다(하단 고정 바 없음). 박스 없는 글자: 정복 전 "정복하기"(--text2, 흰 바탕 4.83:1), 정복 후 "✓ 정복함"(코랄 계열 --coral-ink #b8442e 5.38:1, 굵게). 높이 44px 이상, aria-pressed로 상태 전달 */
  .conquest-btn {
    flex: none; min-height: var(--ctl-min-h); padding: 10px 8px; margin-right: -8px;
    border: none; border-radius: 0; background: transparent; cursor: pointer;
    font-size: 15px; font-weight: 500; white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text2);
  }
  .conquest-btn.conquered { color: var(--coral-ink); font-weight: 700; }
  .conquest-btn:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; border-radius: 4px; }

  /* ── View 3: Quiz (작업174: digest_reading.html 368-481과 같은 모양) ── */
  #view-quiz .content { padding: 20px 16px; }

  .quiz-progress-bar-wrap {
    height: 6px; background: var(--primary-light);
    border-radius: 3px; margin-bottom: 20px; overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%; background: var(--primary);
    border-radius: 3px; transition: width 0.3s ease;
  }
  .quiz-round-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--primary-dark); margin-bottom: 6px;   /* 작업220: 코랄 글자 대비 4.5:1 이상(--primary 3.5:1 → --primary-dark 5.38:1) */
  }
  .quiz-question-counter { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
  .quiz-card {
    background: var(--card); border: none; border-radius: 0; box-shadow: none; padding: 20px 16px; margin: 0 -16px;   /* 작업222: 글자 시작 x 16px */
  }
  .quiz-question {
    font-size: 17px; font-weight: 700; line-height: 1.6;   /* 작업221: 질문 글자 17px / 700 / 주 글자색 */
    margin-bottom: 20px; color: var(--text1);
    white-space: pre-line; word-break: keep-all;
  }
  /* 작업217-3: 4지선다는 박스 없이 번호+본문 행(보기 사이는 아래 구분선). 상태는 색 하나로만 구분하지 않고 기호(○ ✕)와 굵기·밑줄을 함께 쓴다.
     정답 ○+--success-dark(흰 바탕 약 10:1), 내가 고른 오답 ✕+--error-dark(6.57:1), 고른 보기는 굵게+밑줄, 오답을 골라도 정답 보기에 ○가 보인다 */
  .mcq-options { display: flex; flex-direction: column; gap: 0; }
  .mcq-option {
    display: flex; align-items: flex-start; gap: 8px; width: 100%; min-height: var(--ctl-min-h); text-align: left;
    padding: 12px 0;
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    border-radius: 0; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text1);
  }
  .mcq-option:last-child { border-bottom: none; }

<script>
// ── State ──
let DB = null;
let currentField = null;
let currentConceptId = null;

// 분야 → 카드 색. digest_reading.html의 GENRE_COLORS와 같은 {tone,ink} 형식.
const FIELD_COLORS = {
  '물리':     { tone: '#D1574F', ink: '#A33E38' },
  '화학':     { tone: '#3F9E9E', ink: '#2C7373' },
  '생물':     { tone: '#4F9E63', ink: '#357048' },
  '지구과학': { tone: '#5E72C9', ink: '#4254A0' },
};
const FIELD_FALLBACK = { tone: '#8A8F99', ink: '#5E6470' };
const fieldColor = f => FIELD_COLORS[f] || FIELD_FALLBACK;
const FIELD_ORDER = ['물리', '화학', '생물', '지구과학'];

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // 작업226-2: 활성 탭 — 홈 = 과목 선택·과목별 목록·개념 상세 / 정복 = 정복 모아보기 / 퀴즈 = 퀴즈·결과
  const tab = (id === 'view-quiz' || id === 'view-result') ? 'quiz' : id === 'view-conq' ? 'conq' : 'home';
  for (const b of document.querySelectorAll('#bottom-nav [data-tab]')) {
    const on = b.dataset.tab === tab;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
}

// ── Conquest (작업173) ──
// 정복 기록은 브라우저 localStorage에만 저장(서버·DB 없음). 기본은 항상
// localStorage를 읽는다(다른 탭의 변경도 반영). 쓰기(setItem)가 예외를 던진
// 항목만 메모리 객체에 기록해 그 id에 한해 메모리 값을 우선한다. 읽기까지
// 막힌 환경이면 false로 처리한다. (작업174: 작업173의 "메모리 우선"을 보정)
const CONQUEST_PREFIX = 'science_conquest_';
const _memConquest = {}; // setItem 실패한 id만

function isConquered(id) {
  if (Object.prototype.hasOwnProperty.call(_memConquest, id)) return _memConquest[id];
  try { return localStorage.getItem(CONQUEST_PREFIX + id) === 'true'; } catch (e) { return false; }
}

function setConquered(id, val) {
  try {
    localStorage.setItem(CONQUEST_PREFIX + id, val ? 'true' : 'false');
    delete _memConquest[id];
  } catch (e) {
    _memConquest[id] = !!val;
  }
}

function getConqueredConcepts() {
  if (!DB) return [];
  return DB.concepts.filter(c => isConquered(c.id));
}

function updateConquestBtn() {
  const btn = document.getElementById('conquest-btn');
  // 작업217-3: 박스 없는 글자 버튼. 상태는 글자(정복하기 / ✓ 정복함)·굵기·색과 aria-pressed로 전달
  const on = isConquered(currentConceptId);
  btn.classList.toggle('conquered', on);
  btn.setAttribute('aria-pressed', String(on));
  btn.textContent = on ? '✓ 정복함' : '정복하기';
}

function toggleConquest() {
  if (!currentConceptId) return;
  setConquered(currentConceptId, !isConquered(currentConceptId));
  updateConquestBtn();
  updateTabQuizState();
}

// "퀴즈" 탭: 정복 개념이 1개 이상이면 disabled 해제(0개면 흐리게, 클릭은 가능)
function updateTabQuizState() {
  document.getElementById('nav-quiz').setAttribute('aria-disabled', String(getConqueredConcepts().length === 0));   // 작업226-2: 0개여도 눌러 안내를 볼 수 있음(흐림 대신 aria-disabled)
}

// ── Quiz (작업174) ──
// 문항은 저장하지 않고, 정복한 개념의 DB 필드(title, one_line, key_points)를
// 고정 문구와 조합해 매번 새로 만든다(API·비용 없음). 새 문장은 만들지 않는다.
// 한입 독서 퀴즈와 달리: 오답 재료를 무작위로 고르고(고정 첫 항목 아님),
// 관련(related) 개념과 정답을 드러내는 문장을 제외하며, 선지 중복을 검사한다.
let quizState = { questions: [], currentIdx: 0, score: 0, wrong: [], answered: false };
const QUIZ_MAX_PER_TYPE = 3;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 작업176 G2: 퀴즈 재료에서 제외하는 key_point 패턴(나중에 조정하기 쉽게 상수 하나로 둠)
// - 연도 표기(예: "1909년") 또는 자료·연구 서술형 표현이 들어 있는 문장은 개념 설명이 아님
const QUIZ_KEYPOINT_EXCLUDE = {
  pattern: /\d{4}\s*년/,
  words: ['문항', '다큐', '연구', '조사', '설문', '논문', '교재', '학생', '교사', '졸업생', 'SERC', '하버드', '제시되었', '정답으로', '나온다', '발표', '보고서'],
};
// 제외 사유 문자열(제외 대상이 아니면 null)
function keyPointExcludeReason(k) {
  const hits = [];
  if (QUIZ_KEYPOINT_EXCLUDE.pattern.test(k)) hits.push(String(QUIZ_KEYPOINT_EXCLUDE.pattern));
  QUIZ_KEYPOINT_EXCLUDE.words.forEach(w => { if (k.includes(w)) hits.push(w); });
  return hits.length ? hits.join(', ') : null;
}

// 작업176 G3: 제목 토큰 겹침 검사(기존 "제목 전체 포함" 검사를 대체)
// 제목을 공백·"·"·","·괄호로 나누고, 토큰 끝의 조사 "와/과/의"를 떼고 소문자로 만든다.
// 괄호 안 표기(예: "몰(mol)"의 mol)도 토큰이다.
function titleTokens(title) {
  const toks = String(title).split(/[\s·,()（）]+/).map(t => {
    t = t.trim().toLowerCase();
    if (t.length >= 2 && /[와과의]$/.test(t)) t = t.slice(0, -1);
    return t;
  }).filter(Boolean);
  return [...new Set(toks)];
}
// 토큰이 2글자 이상이면 부분 문자열로, 1글자면 단어 첫 글자(문두 또는 공백 뒤)로 나타날 때 겹침.
// 공백은 유지하고 대소문자는 무시한다.
function titleOverlaps(text, title) {
  const t = String(text).toLowerCase();
  return titleTokens(title).some(tok =>
    tok.length >= 2 ? t.includes(tok) : (t.startsWith(tok) || t.includes(' ' + tok)));
}
// 양방향 related 맵: 한쪽에만 적혀 있어도 서로 관련으로 본다
function buildRelatedMap() {
  const m = {};
  DB.concepts.forEach(c => { m[c.id] = new Set(); });
  DB.concepts.forEach(c => (c.related || []).forEach(r => {
    m[c.id].add(r.id);
    if (m[r.id]) m[r.id].add(c.id);
  }));
  return m;
}
// 작업177 H1: 수동 제외 key_point(id#번호, key_points의 1부터 센 순번). T1·T2·T3 모든 재료에서 제외
const QUIZ_KEYPOINT_MANUAL_EXCLUDE = new Set(['science_009#3', 'science_013#2', 'science_014#2']);

// 그 개념의 key_point 중 수동 제외(H1)·G2 제외 대상이 아니고 자기 제목 토큰과 겹치지 않는 것만 사용 가능
function usableKeyPoints(c) {
  return c.key_points.filter((k, i) =>
    !QUIZ_KEYPOINT_MANUAL_EXCLUDE.has(c.id + '#' + (i + 1)) &&
    keyPointExcludeReason(k) === null &&
    !titleOverlaps(k, c.title));
}
function otherConcepts(c, rel) {
  return DB.concepts.filter(o => o.id !== c.id && !rel[c.id].has(o.id));
}
// 작업177 H2: T2 오답·T3 거짓의 "다른 개념"은 정답 개념과 다른 분야에서만 고른다(같은 분야 보충 없음)
function otherFieldConcepts(c, rel) {
  return otherConcepts(c, rel).filter(o => o.field !== c.field);
}
// 작업177 H3: T1 단서 후보 = one_line(제목 토큰 겹침 없을 때) + 사용 가능한 key_point들
function conceptClues(c) {
  const out = [];
  if (!titleOverlaps(c.one_line, c.title)) out.push(c.one_line);
  return out.concat(usableKeyPoints(c));
}

// 아래 세 빌더는 한 번의 퀴즈 안에서 쓴 문장(T1 단서·T2 정답·T3 진술)을 used 집합으로
// 공유해 같은 문장이 유형 사이에서 중복 출제되지 않게 한다(작업177 H3).

// T1 개념 맞추기: 단서 문장(one_line 또는 key_point) → 제목 4지선다
function buildConceptQuestions(conquered, rel, used) {
  const out = [];
  const cands = shuffle(conquered.filter(c => conceptClues(c).length > 0));
  for (const c of cands) {
    if (out.length >= QUIZ_MAX_PER_TYPE) break;
    const clues = shuffle(conceptClues(c).filter(k => !used.has(k)));
    if (!clues.length) continue;
    const clue = clues[0];
    const wrong = [];
    const seen = new Set([c.title]);
    for (const o of shuffle(otherConcepts(c, rel))) {
      if (wrong.length >= 3) break;
      if (seen.has(o.title) || titleOverlaps(clue, o.title)) continue;
      seen.add(o.title);
      wrong.push(o);
    }
    if (wrong.length < 3) continue;
    used.add(clue);
    out.push({
      type: 'mcq', roundLabel: '개념 맞추기',
      question: '다음 설명에 해당하는 개념은 무엇인가요?\n\n"' + clue + '"',
      options: shuffle([c.title, ...wrong.map(o => o.title)]),
      answer: c.title,
      meta: { kind: 'T1', concept: c.id, others: wrong.map(o => o.id), clue },
    });
  }
  return out;
}

// T2 핵심 포인트 확인: 제목 → key_point 4지선다 (오답은 다른 분야의 서로 다른 개념 3개)
function buildKeyPointQuestions(conquered, rel, used) {
  const out = [];
  const cands = shuffle(conquered.filter(c => usableKeyPoints(c).some(k => !used.has(k))));
  for (const c of cands) {
    if (out.length >= QUIZ_MAX_PER_TYPE) break;
    const answerKp = shuffle(usableKeyPoints(c).filter(k => !used.has(k)))[0];
    const wrong = [];
    const seen = new Set([answerKp]);
    for (const o of shuffle(otherFieldConcepts(c, rel))) {
      if (wrong.length >= 3) break;
      const kps = shuffle(usableKeyPoints(o).filter(k => !seen.has(k) && !titleOverlaps(k, c.title)));
      if (!kps.length) continue;
      seen.add(kps[0]);
      wrong.push({ o, kp: kps[0] });
    }
    if (wrong.length < 3) continue;
    used.add(answerKp);
    out.push({
      type: 'mcq', roundLabel: '핵심 포인트 확인',
      question: '다음 중 「' + c.title + '」에 대한 설명으로 옳은 것은?',
      options: shuffle([answerKp, ...wrong.map(w => w.kp)]),
      answer: answerKp,
      meta: { kind: 'T2', concept: c.id, others: wrong.map(w => w.o.id) },
    });
  }
  return out;
}

// T3 OX: "다음 설명은 「제목」에 대한 설명일까요?" + key_point 원문 — 참은 그 개념의 것, 거짓은 다른 분야 개념의 것을 붙인 것
function buildOXQuestions(conquered, rel, used) {
  const out = [];
  const cands = shuffle(conquered.filter(c => usableKeyPoints(c).length > 0));
  for (const c of cands) {
    if (out.length >= QUIZ_MAX_PER_TYPE) break;
    const own = usableKeyPoints(c).filter(k => !used.has(k));
    const pool = otherFieldConcepts(c, rel).filter(o => usableKeyPoints(o).some(k => !used.has(k) && !titleOverlaps(k, c.title)));
    let isTrue = Math.random() < 0.5;
    if (isTrue && own.length === 0) isTrue = false;
    if (!isTrue && pool.length === 0) isTrue = true; // 작업177 H2: 다른 분야 재료가 없으면 참 문항
    if (isTrue && own.length === 0) continue;
    let kp, from = c;
    if (isTrue) {
      kp = shuffle(own)[0];
    } else {
      from = shuffle(pool)[0];
      kp = shuffle(usableKeyPoints(from).filter(k => !used.has(k) && !titleOverlaps(k, c.title)))[0];
    }
    used.add(kp);
    out.push({
      type: 'ox', roundLabel: 'OX 퀴즈',
      statement: '다음 설명은 「' + c.title + '」에 대한 설명일까요?\n\n"' + kp + '"',
      answer: isTrue,
      explanation: isTrue
        ? '정답! 이 설명은 「' + c.title + '」의 핵심 포인트입니다.'
        : '아닙니다. 이 설명은 「' + from.title + '」에 대한 것입니다.',
      meta: { kind: 'T3', concept: c.id, from: from.id, isTrue, kp },
    });
  }
  return out;
}

// 정복 개념 전체에서 유형별 최대 3문항(최대 9문항), 문항 순서는 섞는다
function buildQuestions(conquered) {
  const rel = buildRelatedMap();
  const used = new Set(); // 작업177 H3: 유형 사이에서 같은 문장 중복 출제 방지
  return shuffle([
    ...buildConceptQuestions(conquered, rel, used),
    ...buildKeyPointQuestions(conquered, rel, used),
    ...buildOXQuestions(conquered, rel, used),
  ]);
}

// "퀴즈" 탭 (작업175 F2): 이미 퀴즈·결과 화면이면 아무 동작도 하지 않는다
// (진행 중인 퀴즈가 새 문항으로 바뀌어 버리는 것을 막음). 그 외 화면은 새로 시작.
// ── 하단 내비 (작업226-2) ──
const CONQ_URL = '/science_reading.html?tab=conq';
// 퀴즈 풀이 중: 한 문제라도 답했고 결과 화면 전
const quizInProgress = () => document.getElementById('view-quiz').classList.contains('active')
  && (quizState.score + quizState.wrong.length > 0 || quizState.currentIdx > 0 || quizState.answered);
async function onTab(tab) {

  if (tab === 'quiz') { onQuizTab(); return; }

  if (tab === 'home') goConceptsTab(); else goConq();
}

// 정복 탭: 정복한 개념을 과목별로(localStorage 조회만)
function renderConq() {
  const list = getConqueredConcepts();
  document.getElementById('conq-sub').textContent = list.length ? '정복한 개념 ' + list.length + '개' : '';
  const box = document.getElementById('conq-list');
  if (!list.length) { box.innerHTML = '<div class="conq-empty">아직 정복한 항목이 없어요</div>'; return; }
  box.innerHTML = FIELD_ORDER.filter(f => list.some(c => c.field === f)).map(f => `
    <div class="conq-group">
      <div class="conq-group-label">${f}</div>
      ${list.filter(c => c.field === f).map(c => `<button type="button" class="conq-row" data-concept-id="${c.id}" onclick="openConquered('${c.id}')">${c.title}</button>`).join('')}
    </div>`).join('');
}
function renderAndShowConq() {
  renderConq();
  showView('view-conq');
  window.scrollTo(0, 0);
}
function goConq() {
  resetQuizState();
  renderAndShowConq();
  if (!_navFromPop) {
    const cur = history.state && history.state.view;
    if (cur === 'conq') history.replaceState({ view: 'conq' }, '', CONQ_URL); else history.pushState({ view: 'conq' }, '', CONQ_URL);
  }
}
// 정복 목록의 행: 그 개념의 과목을 맞춰 두고 상세로(상세의 ‹ 는 기록상 직전 화면 = 정복 탭으로 돌아옴)
function openConquered(id) {
  const c = DB.concepts.find(x => x.id === id);
  if (!c) return;
  currentField = c.field;
  renderFieldCarousel(currentField);
  showScience(id);
}

function onQuizTab() {
  const active = document.querySelector('.view.active');
  if (active && (active.id === 'view-quiz' || active.id === 'view-result')) return;
  startQuizFlow();
}

// 작업175 F3: 퀴즈 상태를 빈 상태로 되돌린다(이후 뒤로/앞으로가기로 quiz·result
// history 항목에 와도 복원할 퀴즈가 없어 과목 선택 화면으로 간다)
function resetQuizState() {
  quizState = { questions: [], currentIdx: 0, score: 0, wrong: [], answered: false };
}

function startQuizFlow() {
  const conquered = getConqueredConcepts();
  if (conquered.length === 0) {
    metisAlert('먼저 개념을 정복해 주세요');
    return;
  }
  const questions = buildQuestions(conquered);
  if (questions.length === 0) {
    metisAlert('퀴즈를 만들 수 없습니다. 다른 개념도 정복해 보세요');
    return;
  }
  quizState = { questions, currentIdx: 0, score: 0, wrong: [], answered: false };
  showView('view-quiz');
  renderQuestion();
  window.scrollTo(0, 0);
  navQuizState({ view: 'quiz' });
}

// 퀴즈·결과 화면의 history: 과목 선택/목록 위에는 한 칸 push, 이미 그 위
// (상세·퀴즈·결과)면 replace. 그래서 뒤로가기 한 번이면 아래 화면으로 돌아간다.
function navQuizState(state) {
  if (_navFromPop) return;
  const cur = history.state && history.state.view;
  if (!cur || cur === 'list' || cur === 'subjects') history.pushState(state, '');
  else history.replaceState(state, '');
}

function leaveQuiz(reset) {
  if (reset) resetQuizState();
  const v = history.state && history.state.view;
  if (v === 'quiz' || v === 'result') { history.back(); return; }
  renderAndShowSubjects();
}

function renderQuestion() {
  const q = quizState.questions[quizState.currentIdx];
  if (!q) { showResult(); return; }
  quizState.answered = false;

  const total = quizState.questions.length;
  const pct = (quizState.currentIdx / total) * 100;
  const container = document.getElementById('quiz-content');
  container.innerHTML = `
    <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="qpb"></div></div>
    <div class="quiz-round-label"></div>
    <div class="quiz-question-counter"></div>
    <div class="quiz-card">
      <div class="quiz-question"></div>
      <div class="quiz-answer-area"></div>
    </div>
    <button class="quiz-next-btn" id="quiz-next" onclick="nextQuestion()"></button>`;
  document.getElementById('qpb').style.width = pct + '%';
  container.querySelector('.quiz-round-label').textContent = q.roundLabel;
  container.querySelector('.quiz-question-counter').textContent = (quizState.currentIdx + 1) + ' / ' + total;
  container.querySelector('.quiz-question').textContent = q.type === 'mcq' ? q.question : q.statement;
  document.getElementById('quiz-next').textContent = quizState.currentIdx + 1 >= total ? '결과 보기' : '다음';

  const area = container.querySelector('.quiz-answer-area');
  if (q.type === 'mcq') {
    const list = document.createElement('div');
    list.className = 'mcq-options';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mcq-option';
      btn.dataset.opt = opt;
      const num = document.createElement('span'); num.className = 'mcq-num'; num.textContent = String(i + 1);
      const txt = document.createElement('span'); txt.className = 'mcq-text'; txt.textContent = opt;
      btn.append(num, txt);
      btn.addEventListener('click', () => answerMCQ(btn, opt));
      list.appendChild(btn);
    });
    area.appendChild(list);
  } else {
    area.innerHTML = `
      <div class="ox-buttons">
        <button type="button" class="ox-btn" id="ox-o">O</button>
        <button type="button" class="ox-btn" id="ox-x">X</button>
      </div>
      <div class="ox-feedback" id="ox-fb"></div>`;
    document.getElementById('ox-o').addEventListener('click', () => answerOX(true));
    document.getElementById('ox-x').addEventListener('click', () => answerOX(false));
  }
}

function answerMCQ(el, chosen) {
  const q = quizState.questions[quizState.currentIdx];
  if (!q || quizState.answered || q.graded) return;
  quizState.answered = true;
  q.graded = true; // 작업175 F1: 같은 문항은 두 번 채점하지 않는다
  document.querySelectorAll('.mcq-option').forEach(opt => opt.classList.add('answered'));
  if (chosen === q.answer) {
    el.classList.add('correct');
    quizState.score++;
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.mcq-option').forEach(opt => {
      if (opt.dataset.opt === q.answer) opt.classList.add('correct-hint');
    });
    quizState.wrong.push({ q: q.question, a: q.answer });
  }
  document.getElementById('quiz-next').classList.add('visible');
}

function setOxFeedback(fb, text) {   // 작업221: 정오 한 줄(정답!/오답./맞습니다./아닙니다.)만 따로 감싸 색을 입힌다
  const m = String(text).match(/^(정답!|오답\.|아닙니다\.|맞습니다\.)\s*/);
  fb.textContent = '';
  if (!m) { fb.textContent = text; return; }
  const line = document.createElement('b'); line.className = 'fb-line'; line.textContent = m[1];
  fb.appendChild(line); fb.appendChild(document.createTextNode(' ' + text.slice(m[0].length)));
}

function answerOX(answer) {
  const q = quizState.questions[quizState.currentIdx];
  if (!q || quizState.answered || q.graded) return;
  quizState.answered = true;
  q.graded = true; // 작업175 F1
  const oBtn = document.getElementById('ox-o');
  const xBtn = document.getElementById('ox-x');
  const fb = document.getElementById('ox-fb');
  oBtn.disabled = true; xBtn.disabled = true;
  (answer ? oBtn : xBtn).classList.add('picked');   // 작업217-3: 고른 쪽 표시(밑줄)
  if (answer === q.answer) {
    (answer ? oBtn : xBtn).classList.add('correct');
    quizState.score++;
    setOxFeedback(fb, q.explanation);
    fb.className = 'ox-feedback show correct-fb';
  } else {
    (answer ? oBtn : xBtn).classList.add('wrong');
    (!answer ? oBtn : xBtn).classList.add('correct');
    // 작업175 F4: 틀렸을 때는 해설 앞의 "정답! "(참 문항)·"아닙니다. "(거짓 문항)을 떼고 "오답. "을 붙인다
    setOxFeedback(fb, '오답. ' + q.explanation.replace(/^(정답! |아닙니다\. )/, ''));
    fb.className = 'ox-feedback show wrong-fb';
    quizState.wrong.push({ q: q.statement, a: q.answer ? 'O (참)' : 'X (거짓)' });
  }
  document.getElementById('quiz-next').classList.add('visible');
}

function nextQuestion() {
  quizState.currentIdx++;
  renderQuestion();
  window.scrollTo(0, 0);
}

function showResult() {
  const total = quizState.questions.length;
  const score = quizState.score;
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;

  let msg = '완벽해요!', sub = '모든 문항을 맞혔습니다.';
  if (pct < 100) { msg = '잘했어요!'; sub = '조금만 더 연습하면 완벽합니다.'; }
  if (pct < 60) { msg = '다시 도전해봐요!'; sub = '개념을 다시 읽고 퀴즈에 도전하세요.'; }

  const root = document.getElementById('result-content');
  root.innerHTML = `
    <div class="result-score-wrap">
      <div class="result-score"></div>
      <div class="result-msg"></div>
      <div class="result-submsg"></div>
    </div>
    <div id="result-wrong"></div>
    <div class="result-actions">
      <button class="result-btn result-btn-primary" onclick="startQuizFlow()">다시 풀기</button>
      <button class="result-btn result-btn-secondary" onclick="leaveQuiz(true)">개념 목록으로</button>
    </div>`;
  const scoreEl = root.querySelector('.result-score');
  scoreEl.textContent = String(score);
  const tot = document.createElement('span'); tot.textContent = ' / ' + total; scoreEl.appendChild(tot);
  root.querySelector('.result-msg').textContent = msg;
  root.querySelector('.result-submsg').textContent = sub;

  if (quizState.wrong.length > 0) {
    const wrap = document.getElementById('result-wrong');
    const label = document.createElement('div'); label.className = 'result-section-label'; label.textContent = '틀린 문항';
    const list = document.createElement('div'); list.className = 'result-wrong-list';
    quizState.wrong.forEach(w => {
      const item = document.createElement('div'); item.className = 'result-wrong-item';
      const qq = document.createElement('div'); qq.className = 'result-wrong-q'; qq.textContent = w.q;
      const aa = document.createElement('div'); aa.className = 'result-wrong-a'; aa.textContent = w.a;
      item.append(qq, aa); list.appendChild(item);
    });
    wrap.append(label, list);
  }

  showView('view-result');
  window.scrollTo(0, 0);
  navQuizState({ view: 'result' });
}

// "개념" 탭: 과목 선택 화면으로. 이미 과목 선택 화면이면 아무것도 하지 않아

function fieldUrl(field) { return '/science_reading.html?field=' + encodeURIComponent(field); }
const SUBJECTS_URL = '/science_reading.html';

// ── History (digest_reading.html 작업95와 같은 방식을 3단계로 확장) ──
// 작업155: 과목 선택(subjects) ↔ 과목별 캐러셀(list) ↔ 개념 상세(science) 3단계.
// subjects/list는 "뒤로가기 버튼" 클릭 시 history.back()으로 돌아가고(goSubjects/
// goList), list→science/subjects→list는 forward push. 관련 개념 링크로 다른
// 과목의 개념으로 건너뛸 때는 그 과목의 list 상태를 먼저 push한 뒤 science를
// push해서, 뒤로가기 한 번이면 "건너간 과목"의 캐러셀로 돌아가게 함.
let _navFromPop = false;

// 작업158: "과목 선택" 버튼은 history.back()(한 단계 뒤로가기) 대신 항상 과목
// 선택 화면을 직접 보여주고 그 상태를 새로 push한다. 교차 과목 이동(관련 개념
// 클릭)으로 history가 예상보다 깊어진 경우에도 이 버튼이 항상 과목 선택
// 화면에 도달하게 하기 위함 - 버튼은 #view-list(과목별 캐러셀)에만 있으므로
// 호출 시점의 history.state.view는 항상 'list'다. 이 변경 후 브라우저
// 뒤로가기를 누르면 이 push 이전 상태(= 버튼을 누르기 직전의 캐러셀)로
// 돌아간다.
function goSubjects() {
  renderAndShowSubjects();
  if (!_navFromPop) history.pushState({ view: 'subjects' }, '', SUBJECTS_URL);
}
function renderAndShowSubjects() {
  renderSubjectsGrid();
  showView('view-subjects');
  window.scrollTo(0, 0);
}

function goList() {
  if (history.state && history.state.view && history.state.view !== 'list') {
    history.back();
    return;
  }
  renderAndShowFieldList(currentField);
}
function renderAndShowFieldList(field) {
  currentField = field;
  renderFieldCarousel(field);
  showView('view-list');
  window.scrollTo(0, 0);
}

function openField(field) {
  currentField = field;
  renderFieldCarousel(field);
  showView('view-list');
  window.scrollTo(0, 0);
  if (!_navFromPop) history.pushState({ view: 'list', field }, '', fieldUrl(field));
}

window.addEventListener('popstate', e => {
  if (!DB) return;
  const st = e.state || { view: 'subjects' };
  _navFromPop = true;
  try {
    if (st.view === 'science' && DB.concepts.some(c => c.id === st.id)) {
      const concept = DB.concepts.find(c => c.id === st.id);
      currentField = (st.field && FIELD_ORDER.includes(st.field)) ? st.field : concept.field;
      renderFieldCarousel(currentField);
      showScience(st.id);
    } else if (st.view === 'quiz' && quizState.questions.length && quizState.currentIdx < quizState.questions.length) {
      // 작업174: 메모리의 퀴즈 상태가 남아 있을 때만 복원(새로고침 후에는 과목 선택으로)
      // 작업175 F1: 이미 채점된 문항이면 다음 문항(없으면 결과 화면)으로 복원해 중복 채점을 막는다
      if (quizState.answered || quizState.questions[quizState.currentIdx].graded) quizState.currentIdx++;
      if (quizState.currentIdx >= quizState.questions.length) {
        showResult();
      } else {
        showView('view-quiz');
        renderQuestion();
        window.scrollTo(0, 0);
      }
    } else if (st.view === 'result' && quizState.questions.length) {
      showResult();
    } else if (st.view === 'list' && st.field && fieldHasConcepts(st.field)) {
      renderAndShowFieldList(st.field);
    } else if (st.view === 'conq') {
      renderAndShowConq();
    } else {
      renderAndShowSubjects();
    }
  } finally {
    _navFromPop = false;
  }
});

// ── Permission Check (작업171) ──
// digest_reading.html·literature_compass.html의 checkPermission()과 같은 구조:
// /api/me의 perm_science_reading이 명시적으로 false일 때만 차단하고,
// 토큰 없음·응답 오류·예외·필드 없음은 모두 통과(fail-open)
async function checkPermission() {
  // 작업173: localStorage 접근 자체가 막힌 환경(프라이빗 모드 등)에서도 페이지가
  // 멈추지 않도록 토큰 읽기를 try로 감쌈 - 읽지 못하면 미로그인과 같이 통과
  let token = null;
  try { token = localStorage.getItem('mydict_token'); } catch (e) { return true; }
  if (!token) return true;
  try {
    const r = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return true;
    const me = await r.json();
    return me.perm_science_reading !== false;
  } catch { return true; }
}

// ── Data Load (작업171: 권한 게이트 - 차단되면 science_db.json을 요청하지 않음) ──
async function loadDB() {
  const allowed = await checkPermission();
  if (!allowed) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('access-denied').style.display = 'flex';
    return;
  }
  try {
    const res = await fetch('science_db.json');
    if (!res.ok) throw new Error('네트워크 오류');
    DB = await res.json();
    updateTabQuizState();
    document.getElementById('loading').style.display = 'none';

    const st = history.state;
    if (st && st.view === 'science' && DB.concepts.some(c => c.id === st.id)) {
      const concept = DB.concepts.find(c => c.id === st.id);
      currentField = (st.field && FIELD_ORDER.includes(st.field)) ? st.field : concept.field;
      renderFieldCarousel(currentField);
      _navFromPop = true;
      try { showScience(st.id); } finally { _navFromPop = false; }
      return;
    }
    if (st && st.view === 'list' && st.field && fieldHasConcepts(st.field)) {
      _navFromPop = true;
      try { renderAndShowFieldList(st.field); } finally { _navFromPop = false; }
      return;
    }

    // 히스토리 상태가 없는 첫 진입(또는 새로고침) - URL의 ?field= / ?tab=conq 로 판단
    const params = new URLSearchParams(location.search);
    const f = params.get('field');
    if (params.get('tab') === 'conq' || (st && st.view === 'conq')) {
      renderAndShowConq();
      history.replaceState({ view: 'conq' }, '', CONQ_URL);
    } else if (f && FIELD_ORDER.includes(f) && fieldHasConcepts(f)) {
      currentField = f;
      renderFieldCarousel(f);
      showView('view-list');
      history.replaceState({ view: 'list', field: f }, '', fieldUrl(f));
    } else {
      renderSubjectsGrid();
      showView('view-subjects');
      history.replaceState({ view: 'subjects' }, '', SUBJECTS_URL);
    }
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div class="error-msg">데이터를 불러오지 못했습니다.<br>${e.message}</div>`;
  }
}

// ── View 0: Subject select ──
function renderSubjectsGrid() {
  const counts = fieldCounts();
  const root = document.getElementById('subject-grid');
  root.innerHTML = FIELD_ORDER.map(f => {
    const n = counts[f] || 0;
    const col = fieldColor(f);
    const style = `--field-tone:${col.tone};--field-ink:${col.ink}`;
    if (n === 0) {
      return `<div class="subject-card disabled" style="${style}">
        <div class="subject-name">${f}</div>
        <div class="subject-count">준비 중</div>
      </div>`;
    }
    return `<button type="button" class="subject-card" style="${style}" onclick="openField('${f}')">
      <div class="subject-name">${f}</div>
      <div class="subject-count">개념 ${n}개</div>
    </button>`;
  }).join('');
}

// ── View 1: 과목별 캐러셀 ──
function renderFieldCarousel(field) {
  const list = DB.concepts.filter(c => c.field === field).sort((a, b) => a.title.localeCompare(b.title, 'ko'));
  if (!Carousel.isMounted()) {
    Carousel.mount(document.getElementById('list-carousel'), list);
  } else {
    Carousel.setList(list);
  }
  Carousel.jumpTo(currentConceptId);
  Carousel.refreshConquered();
  const col = fieldColor(field);
  const chip = document.getElementById('subject-chip');
  chip.textContent = field;
  chip.style.setProperty('--field-tone', col.tone);
  chip.style.setProperty('--field-ink', col.ink);
}

// home-wheel ThreeDWheelPicker.jsx → digest_reading.html Carousel을 그대로
// 복제한 모듈. 정복 여부 표시 갱신은 작업173에서 새로 작성함(refreshConquered).
// 작업155: 범례(renderLegend) 제거 - 범례 필터 대신 과목 선택 화면을 씀.
const Carousel = (() => {
  const mod = (n, m) => ((n % m) + m) % m;
  const relativePos = (index, offset, n) => mod(index - offset + n / 2, n) - n / 2;
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const RENDER_RANGE = 4.5;

  const reducedMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const finePointerMq = window.matchMedia ? window.matchMedia('(hover: hover) and (pointer: fine)') : null;

  let items = [], n = 0, cards = [];
  let viewport, track, countEl;
  let offset = 0, target = 0, vel = 0, raf = null;
  let dragging = false, wheelAcc = 0;
  let pointer = { lastX: 0, moved: 0 };
  let reduced = false, metrics = null;
  let lastCenter = -1;

  function computeMetrics() {
    const w = Math.min(window.innerWidth, 480);
    const maxH = Math.max(200, window.innerHeight - 280);
    let cardW = clamp(Math.round(w * 0.62), 190, 270);
    let cardH = Math.round(cardW * 1.4);
    if (cardH > maxH) { cardH = maxH; cardW = Math.min(cardW, Math.round(cardH * 0.9)); }
    const spacing = cardW * 1.04;
    const baseStep = 24;
    const vpad = window.innerHeight < 600 ? 40 : 64;
    return { cardW, cardH, spacing, baseStep, viewportH: cardH + vpad, drag: cardW * 0.45 };
  }

  function render() {
    const depth = reduced ? 0.35 : 1;
    const stepDeg = metrics.baseStep * depth;
    const radius = metrics.spacing / (2 * Math.sin((stepDeg * Math.PI) / 360));
    const blurOn = !reduced && finePointerMq && finePointerMq.matches;
    track.style.transform = `translateZ(${-radius}px)`;

    for (let i = 0; i < n; i++) {
      const el = cards[i];
      const rel = relativePos(i, offset, n);
      const abs = Math.abs(rel);
      if (abs > RENDER_RANGE) {
        if (el.style.display !== 'none') el.style.display = 'none';
        continue;
      }
      if (el.style.display === 'none') el.style.display = '';
      const scale = 1 - clamp(abs, 0, 3) * 0.06;
      el.style.transform = `rotateY(${rel * stepDeg}deg) translateZ(${radius}px) scale(${scale})`;
      el.style.opacity = clamp(1 - abs * 0.3, 0.06, 1);
      el.style.filter = blurOn ? `blur(${clamp(abs * 1.25 - 0.15, 0, 4.5)}px)` : '';
    }

    const center = mod(Math.round(offset), n);
    if (center !== lastCenter) {
      if (lastCenter >= 0) {
        cards[lastCenter].classList.remove('is-center');
        cards[lastCenter].setAttribute('aria-selected', 'false');
      }
      cards[center].classList.add('is-center');
      cards[center].setAttribute('aria-selected', 'true');
      lastCenter = center;
      currentConceptId = items[center].id;
      countEl.textContent = `${center + 1} / ${n}`;
    }
  }

  function setMoving(on) { track.classList.toggle('moving', on); }

  function tick() {
    raf = null;
    if (dragging) return;
    const stiffness = reduced ? 0.32 : 0.14;
    const damping = reduced ? 0.6 : 0.78;
    const d = target - offset;
    vel = (vel + d * stiffness) * damping;
    offset += vel;
    if (Math.abs(d) < 0.0008 && Math.abs(vel) < 0.0008) {
      offset = target;
      vel = 0;
      render();
      setMoving(false);
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }
  function kick() {
    setMoving(true);
    if (raf == null) raf = requestAnimationFrame(tick);
  }
  function goBy(delta) {
    target = Math.round(target) + delta;
    kick();
  }

  function onWheel(e) {
    const dv = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    wheelAcc += dv;
    if (Math.abs(wheelAcc) >= 45) {
      goBy(Math.sign(wheelAcc));
      wheelAcc = 0;
    }
  }

  function onPointerDown(e) {
    if (e.button != null && e.button > 0) return;
    dragging = true;
    vel = 0;
    pointer = { lastX: e.clientX, moved: 0 };
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    setMoving(true);
  }
  function onPointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - pointer.lastX;
    pointer.lastX = e.clientX;
    pointer.moved += Math.abs(dx);
    const delta = -dx / metrics.drag;
    offset += delta;
    vel = vel * 0.6 + delta * 0.4;
    render();
  }
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    const fling = reduced ? 0 : clamp(vel * 9, -4, 4);
    target = Math.round(offset + fling);
    kick();
  }

  function onCardClick(e) {
    const el = e.target.closest('.carousel-card');
    if (!el) return;
    if (pointer.moved > 6) return;
    const rel = relativePos(Number(el.dataset.idx), offset, n);
    if (Math.abs(rel) < 0.5) { showScience(items[Number(el.dataset.idx)].id); return; }
    goBy(Math.round(rel));
    viewport.focus({ preventScroll: true });
  }

  function onKeyDown(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); goBy(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBy(-1); }
    else if (e.key === 'Home') {
      e.preventDefault();
      target = Math.round(target) + relativePos(0, target, n);
      kick();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      startCurrent();
    }
  }

  function startCurrent() {
    showScience(items[mod(Math.round(target), n)].id);
  }

  function applyMetrics() {
    const hdr = document.querySelector('.metis-app-header');
    document.documentElement.style.setProperty('--hdr-h', (hdr ? hdr.offsetHeight : 0) + 'px');
    metrics = computeMetrics();
    viewport.style.height = metrics.viewportH + 'px';
    viewport.style.perspective = (reduced ? 2400 : 1100) + 'px';
    viewport.style.setProperty('--line-clamp', metrics.cardH < 230 ? 2 : metrics.cardH < 280 ? 3 : 4);
    viewport.style.setProperty('--title-size', metrics.cardH < 230 ? '17px' : metrics.cardH < 300 ? '20px' : '22px');
    cards.forEach(el => {
      el.style.width = metrics.cardW + 'px';
      el.style.height = metrics.cardH + 'px';
      el.style.marginLeft = -metrics.cardW / 2 + 'px';
      el.style.marginTop = -metrics.cardH / 2 + 'px';
    });
    fitCards();
    render();
  }

  function fitCards() {
    const base = Number(viewport.style.getPropertyValue('--line-clamp')) || 4;
    cards.forEach(el => {
      el.style.display = '';
      el.style.removeProperty('--line-clamp');
      for (let c = base; c > 1 && el.scrollHeight > el.clientHeight; ) {
        el.style.setProperty('--line-clamp', --c);
      }
    });
  }

  function buildCard(c, i) {
    const el = document.createElement('div');
    el.className = 'carousel-card';
    el.dataset.idx = i;
    el.setAttribute('role', 'option');
    el.setAttribute('aria-selected', 'false');
    el.style.setProperty('--field-ink', fieldColor(c.field).ink);
    el.innerHTML = `
      <div class="carousel-card-meta"><span class="g"></span></div>
      <div class="carousel-card-title"></div>
      <div class="carousel-card-line"></div>`;
    el.querySelector('.g').textContent = c.field || '';
    if (isConquered(c.id)) {
      const done = document.createElement('span');
      done.className = 'carousel-card-done';
      done.textContent = ' · 정복 ✓';
      el.querySelector('.carousel-card-meta').append(done);
    }
    el.querySelector('.carousel-card-title').textContent = c.title;
    el.querySelector('.carousel-card-line').textContent = c.one_line;
    return el;
  }

  function jumpTo(id) {
    if (n === 0) return;
    let idx = items.findIndex(c => c.id === id);
    if (idx < 0) idx = 0;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    dragging = false;
    target = offset = Math.round(offset) + relativePos(idx, Math.round(offset), n);
    vel = 0;
    setMoving(false);
    render();
  }

  function buildCardsDOM(list) {
    items = list;
    n = list.length;
    track.innerHTML = '';
    cards = list.map((c, i) => buildCard(c, i));
    cards.forEach(el => track.appendChild(el));
    lastCenter = -1;
    applyMetrics();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitCards(); render(); });
  }

  function setList(list) {
    if (!viewport) { buildCardsDOM(list); return; }
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    dragging = false;
    vel = 0;
    offset = 0;
    target = 0;
    buildCardsDOM(list);
  }

  function mount(root, list) {
    if (viewport) return;
    root.innerHTML = `
      <div class="carousel-clip">
        <div class="carousel-viewport" role="listbox" tabindex="0" aria-label="개념 선택 - 좌우로 넘기고 Enter 또는 가운데 카드를 눌러 읽기">
          <div class="carousel-track"></div>
        </div>
      </div>
      <div class="carousel-nav">
        <button class="carousel-nav-btn" data-dir="-1" aria-label="이전 개념">‹</button>
        <span class="carousel-nav-count"></span>
        <button class="carousel-nav-btn" data-dir="1" aria-label="다음 개념">›</button>
      </div>`;

    viewport = root.querySelector('.carousel-viewport');
    track = root.querySelector('.carousel-track');
    countEl = root.querySelector('.carousel-nav-count');

    viewport.addEventListener('wheel', onWheel, { passive: false });
    viewport.addEventListener('pointerdown', onPointerDown);
    viewport.addEventListener('pointermove', onPointerMove);
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    window.addEventListener('pointerup', endDrag);
    viewport.addEventListener('keydown', onKeyDown);
    track.addEventListener('click', onCardClick);
    root.querySelectorAll('.carousel-nav-btn').forEach(b =>
      b.addEventListener('click', () => goBy(Number(b.dataset.dir))));

    reduced = !!(reducedMq && reducedMq.matches);
    const onReducedChange = () => { reduced = reducedMq.matches; applyMetrics(); };
    if (reducedMq) {
      if (reducedMq.addEventListener) reducedMq.addEventListener('change', onReducedChange);
      else if (reducedMq.addListener) reducedMq.addListener(onReducedChange);
    }
    window.addEventListener('resize', applyMetrics);

    buildCardsDOM(list);
  }

  // 정복 여부는 상세에서 바뀔 수 있으므로 카드를 다시 만들지 않고 표시만 갱신
  function refreshConquered() {
    cards.forEach((el, i) => {
      const meta = el.querySelector('.carousel-card-meta');
      const old = meta.querySelector('.carousel-card-done');
      if (old) old.remove();
      if (items[i] && isConquered(items[i].id)) {
        const done = document.createElement('span');
        done.className = 'carousel-card-done';
        done.textContent = ' · 정복 ✓';
        meta.append(done);
      }
    });
  }

  return { mount, setList, jumpTo, refreshConquered, isMounted: () => !!viewport };
})();

// ── View 2: Concept detail ──
function showScience(conceptId) {
  const concept = DB.concepts.find(c => c.id === conceptId);
  if (!concept) return;

  // 작업155: 관련 개념 링크가 다른 과목을 가리키면 그 과목의 캐러셀로 먼저
  // 전환(및 push)한 뒤 상세를 연다 - 뒤로가기 한 번이면 "건너간 과목"의
  // 캐러셀로 돌아가게 하기 위함
  if (concept.field !== currentField) {
    currentField = concept.field;
    renderFieldCarousel(currentField);
    if (!_navFromPop) history.pushState({ view: 'list', field: currentField }, '', fieldUrl(currentField));
  }

  currentConceptId = conceptId;
  document.getElementById('science-bar-title').textContent = concept.title;   // 작업220: 상단 바 제목 = 개념/작품 이름(길면 말줄임)

  const relatedHtml = (concept.related || []).length > 0
    ? `<div class="science-section">
        <div class="science-section-label">관련 개념</div>
        <div class="related-list">
          ${concept.related.map(r => {
            const target = DB.concepts.find(c => c.id === r.id);
            if (!target) return '';
            return `
            <button type="button" class="related-item" onclick="showScience('${r.id}')">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
              <span class="related-info">
                <span class="related-title">${target.title}</span>
                <span class="related-relation">${r.relation}</span>
              </span>
            </button>`;
          }).join('')}
        </div>
      </div>`
    : '';

  const headerHtml = `
    <div class="science-work-header">
      <div class="science-work-title">${concept.title}</div>
      <div class="science-work-meta">${concept.field} · ${concept.level}</div>
    </div>`;
  const oneLineHtml = `
    <div class="science-section">
      <div class="science-section-label">핵심 한 줄</div>
      <div class="science-one-line">${concept.one_line}</div>
    </div>`;
  const summaryHtml = `
    <div class="science-section">
      <div class="science-section-label">핵심 설명</div>
      <div class="science-summary">${concept.summary}</div>
    </div>`;
  const keyPointsHtml = `
    <div class="science-section">
      <div class="science-section-label">핵심 포인트</div>
      <div class="key-point-list">
        ${concept.key_points.map((p, i) => `
          <div class="key-point-item">
            <div class="point-num">${i + 1}.</div>
            <div class="point-text">${p}</div>
          </div>`).join('')}
      </div>
    </div>`;
  const exampleHtml = `
    <div class="science-section">
      <div class="science-section-label">일상 예시</div>
      <div class="science-example">${concept.example}</div>
    </div>`;
  // 작업150~152: misconception은 선택 필드 - 있을 때만 섹션 자체를 렌더
  // (digest_reading.html의 full_text 조건부 렌더와 같은 패턴)
  const misconceptionHtml = concept.misconception
    ? `<div class="science-section">
        <div class="science-section-label">흔한 오해</div>
        <div class="science-misconception">${concept.misconception}</div>
      </div>`
    : '';
  const sourcesHtml = `
    <div class="science-section">
      <div class="science-section-label">출처</div>
      <div class="source-list">
        ${concept.sources.map(s => `
          <div class="source-item">
            <div class="source-name"><a href="${escAttr(s.url)}" target="_blank" rel="noopener">${s.name}</a><span class="source-tier">${s.tier}</span></div>
            <div class="source-publisher">${s.publisher}</div>
            <div class="source-note">${s.note}</div>
          </div>`).join('')}
      </div>
    </div>`;

  document.getElementById('science-content').innerHTML =
    `${headerHtml}${oneLineHtml}${summaryHtml}${keyPointsHtml}${exampleHtml}${misconceptionHtml}${relatedHtml}${sourcesHtml}`;

  updateConquestBtn();
  showView('view-science');
  window.scrollTo(0, 0);

  if (!_navFromPop) {
    const cur = history.state && history.state.view;
    const state = { view: 'science', id: conceptId, field: currentField };
    if (!cur || cur === 'list' || cur === 'conq') history.pushState(state, '');
    else history.replaceState(state, '');
  }
}

function escAttr(s) { return String(s).replace(/"/g, '&quot;'); }

// ── Boot ──
loadDB();
</script>
</body>
</html>
