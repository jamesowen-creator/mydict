<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>문학 나침반</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 작업13: 전 화면 공통 상단 헤더(로고+로그인상태) -->
<link rel="stylesheet" href="/css/common/appHeader.css">
<link rel="stylesheet" href="/css/common/tokens.css">
<link rel="stylesheet" href="/css/common/screenBar.css">
<style>
  :root {
    --primary: var(--color-accent, #e2583b);
    --primary-light: var(--color-surface-2, #eef1fb);
    --primary-dark: var(--color-accent-ink, #b8442e);
    --bg: var(--color-bg, #f5f7ff);
    --card: var(--color-surface, #fff);
    --text1: var(--color-text, #1a1f3c);
    --text2: var(--color-text-sub, #4a5070);
    --border: var(--color-line, #dde2f5);
    --error: var(--color-danger, #dc2626);
    --error-dark: var(--color-danger, #dc2626);   /* 작업217-3: 오답 글자(흰 바탕 6.57:1). 프로젝트의 위험색(개념 학습 --danger, 다이얼로그 위험 버튼)과 같은 값 */
    --success-dark: var(--color-ok-ink, #085041);   /* 작업217-3: 정답 글자(흰 바탕 약 10:1). 다른 읽기 화면의 --success-dark와 같은 값 */
    --navbar-h: 78px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-size: var(--body-font-size);
    font-family: 'Noto Sans KR', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text1);
    min-height: 100dvh;
    max-width: var(--content-max);
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 999; gap: 16px;
  }
  /* 작업220: 화면 로딩 스피너 32px */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--primary-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text2); font-size: 14px; }

  /* ── Views ── */
  .view { display: none; min-height: 100dvh; padding-bottom: calc(var(--navbar-h) + env(safe-area-inset-bottom, 0px) + 16px); }
  .view.active { display: block; }

  /* 작업199: 제목 줄은 공용 /css/common/screenBar.css(.screen-bar) */
  .progress-text { font-size: 13px; font-weight: 600; color: var(--primary-dark); font-family: 'Inter', sans-serif; }

  /* ── 하단 내비 (작업226-2): 음성 학습·언어 사전의 하단 내비(작업224-2)와 같은 구조·크기. 색은 이 화면의 팔레트 ── */
  .bottom-nav {
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: var(--shadow-nav, 0 -2px 8px rgba(226,88,59,0.07));
    padding: 0 16px max(8px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 0;
    position: fixed;
    left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--content-max);
    bottom: 0; z-index: 100;
    min-height: var(--navbar-h);
  }
  .bottom-nav-tabs { display: flex; flex: 1; gap: 0; }
  .bottom-nav-tab {
    display: flex; flex-direction: row; align-items: baseline; justify-content: center; gap: 2px;
    flex: 1 1 0; min-width: 0; min-height: var(--ctl-min-h);
    padding: 10px 0;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 500; line-height: normal;
    color: var(--text2); cursor: pointer; text-decoration: none;
    border-top: 3px solid transparent; border-bottom: none; border-left: none; border-right: none;
    background: none; white-space: nowrap;
  }
  .bottom-nav-tab:hover:not(.active) { color: var(--text1); }
  .bottom-nav-tab.active { color: var(--primary-dark); border-top-color: var(--primary); }
  .bottom-nav-tab:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  @media (max-width: 460px) { .bottom-nav-tab { font-size: 13px; } }

  /* 퀴즈 탭: 사조 고르기 목록(시대별 묶음, 텍스트 행 + 구분선) */
  #view-qlist .content { padding: 20px 16px; }
  .qlist-era { margin-bottom: 20px; }
  .qlist-row {
    display: flex; align-items: center; width: 100%; min-height: var(--ctl-min-h); padding: 10px 0; text-align: left;
    background: none; border: none; border-bottom: 1px solid var(--border); border-radius: 0; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 500; color: var(--text1);
  }
  .qlist-era .qlist-row:last-child { border-bottom: none; }
  .qlist-row:hover { text-decoration: underline; text-underline-offset: 3px; }
  .qlist-row:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }

  /* ── App Link Pill ── */
  /* 작업216-6: 눌리는 링크지만 박스·알약 없이 밑줄 텍스트로(터치 영역 44px 이상). 글자 --primary-dark는 흰 바탕 5.38:1 */
  .app-link {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    min-height: var(--ctl-min-h); min-width: var(--ctl-min-h); padding: 0 6px;
    font-size: 12px; font-weight: 600;
    text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; flex-shrink: 0;
    color: var(--primary-dark);
  }
  .app-link:hover { color: var(--text1); }
  .app-link:focus-visible { outline: 2px solid var(--text1); outline-offset: 2px; border-radius: 4px; }
  .app-link svg { width: 13px; height: 13px; }

  /* 작업217-2: 홈 상단 "어휘 사전" 링크는 그라데이션 박스 없이 한 줄 밑줄 텍스트(높이 44px). 글자 --primary-dark는 페이지 바탕(#FAFAF9) 위 5.2:1 이상 */
  .dict-link {
    display: flex; align-items: center; width: fit-content; min-height: var(--ctl-min-h); min-width: var(--ctl-min-h);
    margin: 0 0 8px -6px; padding: 0 6px;
    font-size: 14px; font-weight: 600; color: var(--primary-dark);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .dict-link:hover { color: var(--text1); }
  .dict-link:focus-visible { outline: 2px solid var(--text1); outline-offset: 2px; border-radius: 4px; }

  /* ── Home View ── */
  #view-home .content { padding: 20px 16px; }
  .home-header { margin-bottom: 24px; }
  .home-header h2 { font-size: 22px; font-weight: 700; color: var(--text1); margin-bottom: 4px; }
  .home-header p { font-size: 14px; color: var(--text2); line-height: 1.5; }

  /* 작업217-4: 시대 영역은 테두리·둥근 모서리·그림자 없이 흰 바탕 면과 아래 구분선만 */
  .era-card {
    background: var(--card);
    border: none; border-radius: 0; box-shadow: none; border-bottom: 1px solid var(--border);
    padding: 20px 16px;
    margin: 0 -16px;   /* 작업222: 글자 시작 x 16px */
  }
  .era-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .era-name { font-size: 18px; font-weight: 700; color: var(--text1); }
  .era-range { font-size: 12px; color: var(--text2); font-family: 'Inter', sans-serif; }
  .era-divider { height: 1px; background: var(--border); margin: 14px 0; }
  .movement-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 10px; letter-spacing: 0.03em; }
  .movement-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .movement-pill {
    background: var(--primary-light);
    color: var(--primary-dark);
    border: 1px solid rgba(226,88,59,0.2);
    border-radius: 20px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    text-align: center;
  }
  .movement-pill:hover { background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e)); color: #fff; }
  .movement-pill .pill-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .movement-pill .pill-period { font-size: 11px; font-weight: 400; opacity: 0.65; font-family: 'Inter', sans-serif; line-height: 1.2; }

  /* ── Timeline ── */
  .timeline-wrap { display: flex; }
  .tl-axis { width: 36px; flex-shrink: 0; position: relative; border-right: 1.5px solid var(--border); }
  .tl-axis-label { position: absolute; right: 5px; transform: translateY(-50%); font-size: 11px; color: var(--text2); font-family: 'Inter', sans-serif; line-height: 1; pointer-events: none; white-space: nowrap; }
  .tl-lane { flex: 1; min-width: 80px; position: relative; }
  .tl-lane + .tl-lane { border-left: 1px solid rgba(226,88,59,0.1); }
  .tl-grid-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(226,88,59,0.15); pointer-events: none; z-index: 0; }
  .tl-bar { position: absolute; left: 3px; right: 3px; border-radius: 10px; background: var(--primary-light); border: 1px solid rgba(226,88,59,0.25); color: var(--primary-dark); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 3px 5px; overflow: hidden; transition: background 0.15s, color 0.15s; box-sizing: border-box; z-index: 1; }
  .tl-bar:hover { background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e)); color: #fff; }
  .tl-bar-dim { opacity: 0.22; pointer-events: none; cursor: default; }
  .tl-bar-name { font-size: 11px; font-weight: 600; text-align: center; word-break: keep-all; white-space: normal; line-height: 1.3; }

  /* ── Genre Filter Tabs ── */
  .genre-filter-tabs {
    display: flex;
    overflow-x: auto;
    border-bottom: 0.5px solid var(--border);
    margin: 0 0 14px;
    scrollbar-width: none;
  }
  .genre-filter-tabs::-webkit-scrollbar { display: none; }
  .genre-tab {
    flex-shrink: 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 14px 9px;
    margin-bottom: -1px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .genre-tab.active {
    color: var(--text1);
    font-weight: 700;
    border-bottom-color: #e2583b;
  }
  .genre-empty {
    font-size: 13px;
    color: var(--text2);
    padding: 4px 0 8px;
  }

  /* ── Briefing View ── */
  #view-briefing .content { padding: 20px 16px; }
  .briefing-section { margin-bottom: 20px; }
  /* 작업220: 섹션 제목 규격 — 12px / 700 / --primary-dark(5.38:1) / 아래 2px 코랄 선(장식) */
  .section-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--primary-dark); text-transform: uppercase;
    padding-bottom: 4px; border-bottom: 2px solid var(--primary);
    margin-bottom: 8px;
  }
  /* 작업217-4: 설명 영역은 테두리·둥근 모서리 없이 흰 바탕 면만 */
  .section-box {
    background: var(--card);
    border: none; border-radius: 0;
    padding: 14px 16px; margin: 0 -16px;   /* 작업222: 글자 시작 x 16px */
    font-size: 14px; line-height: 1.7; color: var(--text1);
  }
  .keyword-tags { display: flex; flex-wrap: wrap; gap: 6px 8px; }
  /* 작업216-8: 표시만 하는 핵심 키워드는 박스·알약 없이 작은 보조색 글자("·"로 구분, 마지막 제외). 글자 --text2는 페이지 바탕(#FAFAF9) 4.63:1 */
  .keyword-tag {
    font-size: 12px; font-weight: 500; color: var(--text2);
  }
  .keyword-tag:not(:last-child)::after { content: '·'; margin-left: 8px; color: var(--text2); }
  .author-chips { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  /* 작업216-6: 표시만 하는 작가 이름은 박스 없이 작은 보조색 글자(앞의 작은 점이 구분 표시). 글자 --text2는 흰 바탕 4.83:1 */
  .author-chip {
    font-size: 12px; font-weight: 600;
    color: var(--text2);
    display: flex; align-items: center; gap: 6px;
  }
  .author-chip::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--primary);
    border-radius: 50%;
  }
  .briefing-cta {
    min-height: var(--ctl-min-h); margin-top: 28px;
    background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e));
    color: #fff;
    border: none;
    border-radius: var(--btn-radius);
    padding: 10px 20px;   /* 작업220: 주 버튼 규격 — 높이 최소 44px, 15px / 600, 좌우 padding 20px */
    width: 100%;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.15s; font-family: 'Noto Sans KR', sans-serif;
  }
  .briefing-cta:hover { background: var(--btn-primary-bg-hover, #9c3a27); }
  .briefing-cta svg { width: 18px; height: 18px; }

  /* ── Cards View ── */
  #view-cards { display: none; flex-direction: column; }
  #view-cards.active { display: flex; }

  .cards-area {
    flex: 1;
    padding: 20px 16px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Flip Card */
  .flip-card-wrapper {
    width: 100%;
    perspective: 1200px;
    margin-bottom: 20px;
  }
  .flip-card {
    width: 100%; min-height: 420px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
  }
  .flip-card.flipped { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    padding: 24px;
    overflow-y: auto;
  }
  .flip-card-back { transform: rotateY(180deg); }

  /* Front face */
  .card-badges { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  /* 작업216-6: 표시만 하는 뱃지는 박스·알약·바탕 없이 작은 글자. 색 구분은 글자색으로만(사조 --primary-dark 5.38:1, 중등 #92400E 7.09:1, 고등 #831843 9.65:1 — 흰 바탕).
     나란할 때는 "·"로 구분한다. 카드 전체가 눌려 뒤집히므로 cursor는 카드에서 이어받는다 */
  .badge {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.02em;
  }
  .card-badges .badge:not(:last-child)::after { content: '·'; margin-left: 8px; color: var(--text2); font-weight: 700; }
  .badge-movement { color: var(--primary-dark); }
  .badge-level { color: #92400E; }
  .badge-level.고등 { color: #831843; }

  .card-title { font-size: 22px; font-weight: 700; color: var(--text1); margin-bottom: 6px; line-height: 1.3; }
  .card-meta { font-size: 14px; color: var(--text2); margin-bottom: 4px; font-family: 'Inter', sans-serif; }
  .card-genre { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
  .card-keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  /* 작업216-6: 키워드는 박스 없이 작은 보조색 글자("·"로 구분). 글자 --text2는 흰 바탕 4.83:1 */
  .card-keyword {
    font-size: 12px; color: var(--text2); font-weight: 500;
  }
  .card-keyword:not(:last-child)::after { content: '·'; margin-left: 6px; color: var(--text2); }
  .card-hint {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    text-align: center;
    font-size: 12px; color: var(--text2);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .card-hint svg { width: 14px; height: 14px; color: var(--primary); }

  /* Back face */
  .back-section { margin-bottom: 18px; }
  .back-section-title {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--primary-dark); margin-bottom: 6px;
    padding-bottom: 4px; border-bottom: 2px solid var(--primary);
    display: flex; align-items: center; gap: 6px;
  }
  .back-section-title svg { width: 13px; height: 13px; }
  .back-section-body { font-size: 13px; line-height: 1.75; color: var(--text1); }
  .back-divider { height: 1px; background: var(--border); margin: 14px 0; }
  .related-list { display: flex; flex-direction: column; gap: 8px; }
  /* 작업217-4: 연결 작품 항목은 색 바탕·둥근 모서리 없이 구분선 행 */
  .related-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0;
    background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0;
  }
  .related-list .related-item:last-child { border-bottom: none; }
  .related-item svg { width: 14px; height: 14px; color: var(--primary); flex-shrink: 0; margin-top: 2px; }
  .related-item-info { flex: 1; }
  .related-title { font-size: 13px; font-weight: 600; color: var(--text1); }
  .related-author { font-size: 12px; color: var(--text2); }
  .related-relation { font-size: 11px; color: var(--primary-dark); font-weight: 500; margin-top: 2px; }

  /* Card navigation */
  .card-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; padding: 0 16px 16px;
  }
  /* 작업217-2: 이전·다음 화살표는 테두리·배경 없이 글자(‹ ›) 그대로, 터치 영역 44×44px. 글자색 --text1(흰 바탕 약 17:1), 호버 --primary-dark(5.38:1) */
  .nav-btn {
    position: relative;
    width: 44px; height: 44px; padding: 0 0 4px;
    border: none; border-radius: 0; background: transparent;
    color: var(--text1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans KR', sans-serif; font-size: 32px; line-height: 1; font-weight: 400;
  }
  .nav-btn:hover:not(:disabled) { color: var(--primary-dark); }
  .nav-btn:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; border-radius: 4px; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .dot-indicators { display: flex; gap: 6px; align-items: center; flex: 1; justify-content: center; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--border); transition: all 0.2s;
  }
  .dot.active { background: var(--primary); width: 20px; border-radius: 4px; }

  .quiz-start-btn {
    min-height: var(--ctl-min-h); margin: 0 16px 16px;
    background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e));
    color: #fff;
    border: none;
    border-radius: var(--btn-radius);
    padding: 10px 20px;
    width: calc(100% - 32px);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    display: none; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.15s; font-family: 'Noto Sans KR', sans-serif;
  }
  .quiz-start-btn.visible { display: flex; }
  .quiz-start-btn:hover { background: var(--btn-primary-bg-hover, #9c3a27); }
  .quiz-start-btn svg { width: 18px; height: 18px; }

  /* ── Quiz View ── */
  #view-quiz .content { padding: 20px 16px; }

  .quiz-progress-bar-wrap {
    height: 6px; background: var(--primary-light);
    border-radius: 3px; margin-bottom: 20px; overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%; background: var(--primary);
    border-radius: 3px; transition: width 0.3s ease;
  }
  .quiz-round-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--primary-dark); margin-bottom: 6px;   /* 작업220: 코랄 글자 대비 4.5:1 이상(--primary 3.5:1 → --primary-dark 5.38:1) */
  }
  .quiz-question-counter { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
  .quiz-card {
    background: var(--card);
    border: none; border-radius: 0; box-shadow: none;
    padding: 20px 16px; margin: 0 -16px;   /* 작업222: 글자 시작 x 16px */
  }

  /* Round 1 — Matching */
  /* 작업217-3: 짝 맞추기는 박스 없이 구분선 행(열마다 아래 선). 고른 항목=--primary-dark(5.38:1)+굵게+밑줄, 맞음=○+--success-dark, 틀림=✕+--error-dark */
  .match-instruction { font-size: 14px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
  .match-columns { display: flex; gap: 12px; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 0; }
  .match-col-label { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.05em; margin-bottom: 4px; text-align: center; }
  .match-item {
    padding: 10px 0;
    background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0;
    font-size: 13px; font-weight: 500;
    text-align: center;
    cursor: pointer;
    color: var(--text1);
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    word-break: keep-all;
  }
  .match-col .match-item:last-child { border-bottom: none; }
  .match-item.selected { color: var(--primary-dark); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .match-item.correct { color: var(--success-dark); font-weight: 700; cursor: default; }
  .match-item.wrong { color: var(--error-dark); font-weight: 700; }
  .match-item.correct::before { content: '○ '; white-space: pre; }
  .match-item.wrong::before { content: '✕ '; white-space: pre; }
  .match-item.disabled { cursor: default; opacity: 0.5; }

  /* Round 2 — OX */
  .ox-question { font-size: 17px; font-weight: 700;   /* 작업221: 질문 글자 17px / 700 / 주 글자색 */
    line-height: 1.6; margin-bottom: 24px; color: var(--text1); }
  .ox-buttons { display: flex; gap: 12px; margin-top: 4px; }
  /* 작업217-3: O/X는 박스 없이 큰 글자(32px 굵게)만, 눌림 영역은 높이 80px 그대로(투명). 고른 쪽은 밑줄, 채점 후 라벨 "○ 정답"(--success-dark) / "✕ 오답"(--error-dark) */
  .ox-btn {
    position: relative; flex: 1; height: 80px; padding: 0 0 14px;
    border: none; border-radius: 0; background: transparent; color: var(--text1); cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1;
    display: flex; align-items: center; justify-content: center;
  }
  /* 라벨은 절대 위치라 글자 밑줄이 번지지 않는다 */
  .ox-btn::after { content: ''; position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.4; }
  .ox-btn:hover:not(:disabled) { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .ox-btn:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  .ox-btn:disabled { cursor: default; }
  .ox-btn.picked { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .ox-btn.correct { color: var(--success-dark); }
  .ox-btn.correct::after { content: '○ 정답'; }
  .ox-btn.wrong { color: var(--error-dark); }
  .ox-btn.wrong::after { content: '✕ 오답'; }
  /* 작업217-3: 해설 줄은 색 바탕 없이 기호(○/✕)+글자색 */
  .ox-feedback { position: relative; margin-top: 12px; padding: 10px 0 10px 24px; font-size: 13px; font-weight: 500; line-height: 1.6; display: none; }   /* 작업222: 기호 자리 24px(.msg와 같은 방식) */
  .ox-feedback.show { display: block; }
  /* 작업221: 정오 한 줄(.fb-line)만 기호+초록/빨강, 해설은 주 글자색 */
  .ox-feedback.correct-fb, .ox-feedback.wrong-fb { color: var(--text1); }
  .ox-feedback.correct-fb::before { color: var(--success-dark); }
  .ox-feedback.wrong-fb::before { color: var(--error-dark); }
  .ox-feedback .fb-line { font-weight: 700; }
  .ox-feedback.correct-fb .fb-line { color: var(--success-dark); }
  .ox-feedback.wrong-fb .fb-line { color: var(--error-dark); }
  .ox-feedback::before { position: absolute; left: 2px; top: 10px; width: 16px; text-align: center; font-weight: 800; }
  .ox-feedback.correct-fb::before { content: '○'; }
  .ox-feedback.wrong-fb::before { content: '✕'; }

  /* Round 3 — MCQ */
  .mcq-question { font-size: 17px; font-weight: 700; line-height: 1.6; margin-bottom: 20px; color: var(--text1); }
  /* 작업217-3: 4지선다는 박스 없이 번호+본문 행(보기 사이는 아래 구분선). 상태는 색 하나로만 구분하지 않고 기호(○ ✕)와 굵기·밑줄을 함께 쓴다.
     정답 ○+--success-dark(흰 바탕 약 10:1), 내가 고른 오답 ✕+--error-dark(6.57:1), 고른 보기는 굵게+밑줄, 오답을 골라도 정답 보기에 ○가 보인다 */
  .mcq-options { display: flex; flex-direction: column; gap: 0; }
  .mcq-option {
    display: flex; align-items: flex-start; gap: 8px; width: 100%; min-height: var(--ctl-min-h); text-align: left;
    padding: 12px 0;
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    border-radius: 0; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text1);
  }
  .mcq-option:last-child { border-bottom: none; }
  .mcq-option::before { content: ''; flex: none; width: 16px; text-align: center; font-size: 14px; font-weight: 700; line-height: 1.5; }
  .mcq-option:hover:not(.answered) .mcq-text { text-decoration: underline; text-underline-offset: 3px; }
  .mcq-option:focus-visible { outline: 2px solid var(--text1); outline-offset: -2px; }
  .mcq-option.answered { cursor: default; }
  .mcq-num { flex: none; width: 20px; text-align: right; font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--text2); }
  .mcq-option.correct, .mcq-option.correct-hint { color: var(--success-dark); }
  .mcq-option.wrong { color: var(--error-dark); }
  .mcq-option.correct::before, .mcq-option.correct-hint::before { content: '○'; }
  .mcq-option.wrong::before { content: '✕'; }
  .mcq-option.correct .mcq-num, .mcq-option.correct-hint .mcq-num, .mcq-option.wrong .mcq-num { color: inherit; font-weight: 700; }
  .mcq-option.correct .mcq-text, .mcq-option.correct-hint .mcq-text { color: var(--success-dark); font-weight: 700; }
  .mcq-option.wrong .mcq-text { color: var(--error-dark); font-weight: 700; }
  .mcq-option.correct .mcq-text, .mcq-option.wrong .mcq-text { text-decoration: underline; text-underline-offset: 3px; }
  .mcq-text { flex: 1; min-width: 0; font-size: 15px;   /* 작업221: 보기 글자 15px / 400 / 주 글자색 */ line-height: 1.5; color: var(--text1); word-break: keep-all; }

  .quiz-next-btn {
    min-height: var(--ctl-min-h); margin-top: 20px;
    background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e)); color: #fff;
    border: none; border-radius: var(--btn-radius);
    padding: 10px 20px; width: 100%;
    font-size: 15px; font-weight: 600; cursor: pointer;
    display: none; font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s;
  }
  .quiz-next-btn.visible { display: block; }
  .quiz-next-btn:hover { background: var(--btn-primary-bg-hover, #9c3a27); }

  /* ── Result View ── */
  #view-result .content { padding: 24px 16px; }
  /* 작업217-3: 점수는 박스·테두리·그림자 없이 큰 숫자 글자(아래 구분선만). 점수 글자색은 --primary(흰 바탕 3.53:1)가 아니라 --primary-dark(5.38:1) */
  .result-score-wrap {
    text-align: center; margin-bottom: 28px;
    padding: 12px 0 24px; background: transparent;
    border: none; border-radius: 0; box-shadow: none; border-bottom: 1px solid var(--border);
  }
  .result-score { font-size: 42px; font-weight: 700; color: var(--primary-dark); font-family: 'Inter', sans-serif; }
  .result-score span { font-size: 18px; color: var(--text2); }
  .result-msg { font-size: 16px; font-weight: 600; color: var(--text1); margin-top: 8px; }
  .result-submsg { font-size: 13px; color: var(--text2); margin-top: 4px; }

  .result-section-label { font-size: 12px; font-weight: 700; color: var(--primary-dark); margin-bottom: 12px; letter-spacing: 0.03em; padding-bottom: 4px; border-bottom: 2px solid var(--primary); }
  .result-wrong-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  /* 작업217-3: 틀린 문항은 박스 없이 구분선 행. 정답 글자는 --success-dark(흰 바탕 약 10:1) */
  .result-wrong-item {
    background: transparent; border: none; border-radius: 0;
    border-bottom: 1px solid var(--border); padding: 12px 0;
  }
  .result-wrong-list .result-wrong-item:last-child { border-bottom: none; }
  .result-wrong-q { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  .result-wrong-a { font-size: 14px; font-weight: 600; color: var(--success-dark); }
  .result-wrong-a::before { content: '정답: '; color: var(--text2); font-weight: 400; }

  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .result-btn {
    min-height: var(--ctl-min-h); border-radius: var(--btn-radius); padding: 10px 20px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .result-btn-primary { background: var(--btn-primary-bg, var(--color-accent-ink, #b8442e)); color: #fff; }
  .result-btn-primary:hover { background: var(--btn-primary-bg-hover, #9c3a27); }
  /* 작업217-2: 보조 결과 버튼은 박스 없이 밑줄 텍스트(높이 44px = .result-btn min-height, 가로 44px 이상). 글자 --text2는 페이지 바탕(#FAFAF9) 위 4.63:1 */
  /* 작업220: 텍스트 버튼 규격 — 15px / 600, 보조색, padding 0 8px, 최소 44×44px, 밑줄 */
  .result-btn-secondary { background: transparent; color: var(--text2); border: none; padding: 0 8px; min-height: var(--ctl-min-h); min-width: var(--ctl-min-h); font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .result-btn-secondary:hover { background: transparent; color: var(--text1); }
  .result-btn-secondary:focus-visible { outline: 2px solid var(--text1); outline-offset: 2px; border-radius: 4px; }

  /* ── Misc ── */
  .error-msg {
    text-align: center; padding: 40px 24px;
    color: var(--error); font-size: 14px;
  }
</style>
</head>
<body>

     그 기능이 없어짐) -->

<!-- 하단 내비 (작업226-2). 사전 탭은 기존 "어휘 사전" 링크와 같은 곳(사전 화면 /english_dictionary.html)으로 이동하며 활성 표시가 없다 -->
<nav id="bottom-nav" class="bottom-nav" aria-label="문학 나침반 메뉴">
  <div class="bottom-nav-tabs">
    <button type="button" class="bottom-nav-tab" id="nav-home" data-tab="home">홈</button>
    <button type="button" class="bottom-nav-tab" id="nav-quiz" data-tab="quiz">퀴즈</button>

  </div>
</nav>

<script>
// ── State ──
let DB = null;
let currentMovement = null;
let currentCardIndex = 0;
let isFlipped = false;
let quizData = { rounds: [], currentRound: 0, currentQ: 0, score: 0, wrong: [] };
let currentGenreFilters = {}; // eraId -> selected genre, defaults to '전체'

// ── Utility ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 하단 내비의 활성 탭: 홈 = 홈·브리핑·카드 / 퀴즈 = 퀴즈 탭·퀴즈 풀이·결과
const NAV_TAB_OF = { 'view-home': 'home', 'view-briefing': 'home', 'view-cards': 'home', 'view-qlist': 'quiz', 'view-quiz': 'quiz', 'view-result': 'quiz' };
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const a = NAV_TAB_OF[id];
  for (const b of document.querySelectorAll('#bottom-nav [data-tab]')) {
    const on = b.dataset.tab === a;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
}

// ── History (작업226-2) ──
// 화면 전환마다 기록을 남겨 뒤로가기가 직전 화면으로 돌아가게 한다(홈에서 뒤로가기는 기존대로 페이지를 떠남).
// 홈 → 브리핑 → 카드 → 퀴즈는 쌓고, 결과는 퀴즈 칸을 교체한다. 탭 전환은 홈에서 처음 나갈 때만 쌓고 나머지는 교체한다(음성 학습 224-2 방식).
let _navFromPop = false;
function navState(state, mode) {
  if (_navFromPop) return;
  const cur = history.state || {};
  const same = cur.view === state.view && cur.id === state.id;
  if (mode === 'push') history.pushState(state, '');
  else if (mode === 'replace' || same || state.view === 'result' || (state.view === 'quiz' && cur.view === 'result')) history.replaceState(state, '');
  else history.pushState(state, '');
}
// 화면 안 ‹ 버튼: 기록이 그 화면에 맞으면 뒤로가기와 같게, 아니면 직접 이동
function goBack(expected, fallback) {
  if (history.state && history.state.view === expected) history.back(); else fallback();
}
window.addEventListener('popstate', e => {
  if (!DB) return;
  const st = e.state || { view: 'home' };
  _navFromPop = true;
  try {
    if (st.view === 'briefing' && findMovement(st.id)) showBriefing(st.id);

// ── Permission Check ──
async function checkPermission() {
  const token = localStorage.getItem('mydict_token');
  if (!token) return true;
  try {
    const r = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return true;
    const me = await r.json();
    return me.perm_literature_compass !== false;
  } catch { return true; }
}

// ── Data Load ──
async function loadDB() {
  const allowed = await checkPermission();
  if (!allowed) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('access-denied').style.display = 'flex';
    return;
  }
  try {
    const res = await fetch('literature_db.json');
    if (!res.ok) throw new Error('네트워크 오류');
    DB = await res.json();
    document.getElementById('loading').style.display = 'none';
    renderHome();
    showView('view-home');
    history.replaceState({ view: 'home' }, '');
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div class="error-msg">데이터를 불러오지 못했습니다.<br>${e.message}</div>`;
  }
}

function getFilteredMovements(era, genre) {
  if (genre === '전체') return era.movements;
  return era.movements.filter(m => m.works.some(w => w.genre === genre));
}

function renderTimeline(era, genre) {
  const container = document.getElementById(`pills-${era.id}`);
  if (!container) return;

  const all = era.movements.filter(m => m.start_year && m.end_year);
  if (!all.length) { renderPills(era, genre); return; }

  const activeIds = new Set(getFilteredMovements(era, genre).map(m => m.id));

  const MIN_Y = Math.min(...all.map(m => m.start_year));
  const MAX_Y = Math.max(...all.map(m => m.end_year));
  const PX_YR = 7;
  const MIN_BAR_H = 32;

  // Interval scheduling: assign each movement to first non-overlapping lane
  const byStart = [...all].sort((a, b) => a.start_year - b.start_year);
  const laneEndYear = [];
  const laneOf = {};
  byStart.forEach(m => {
    let l = laneEndYear.findIndex(e => e <= m.start_year);
    if (l < 0) l = laneEndYear.length;
    laneOf[m.id] = l;
    laneEndYear[l] = m.end_year;
  });
  const numLanes = laneEndYear.length;

  const totalH = (MAX_Y - MIN_Y) * PX_YR + MIN_BAR_H + 16;

  // Year axis labels + grid lines (every 10 years)
  const startDec = Math.ceil((MIN_Y - 2) / 10) * 10;
  let axisHtml = '';
  let gridHtml = '';
  for (let y = startDec; y <= MAX_Y + 5; y += 10) {
    const t = Math.round((y - MIN_Y) * PX_YR);
    axisHtml += `<span class="tl-axis-label" style="top:${t}px">${y}</span>`;
    gridHtml += `<div class="tl-grid-line" style="top:${t}px"></div>`;
  }

  // Build vertical lane columns — each lane is a flex column, bars have height=duration
  let lanesHtml = '';
  for (let l = 0; l < numLanes; l++) {
    const movementsInLane = all.filter(m => laneOf[m.id] === l);
    let laneContent = gridHtml;
    movementsInLane.forEach(m => {
      const topPx = Math.round((m.start_year - MIN_Y) * PX_YR);
      const heightPx = Math.max(Math.round((m.end_year - m.start_year) * PX_YR), MIN_BAR_H);
      const dim = !activeIds.has(m.id);
      const oc = dim ? '' : `onclick="showBriefing('${m.id}')"`;
      laneContent +=
        `<button class="tl-bar${dim ? ' tl-bar-dim' : ''}" ${oc}` +
        ` style="top:${topPx}px;height:${heightPx}px"` +
        ` title="${m.name} (${m.start_year}~${m.end_year})">` +
        `<span class="tl-bar-name">${m.name}</span></button>`;
    });
    lanesHtml += `<div class="tl-lane" style="height:${totalH}px">${laneContent}</div>`;
  }

  container.innerHTML =
    `<div class="timeline-wrap">` +
    `<div class="tl-axis" style="height:${totalH}px">${axisHtml}</div>` +
    lanesHtml +
    `</div>`;
}

// ── Quiz Generation ──
function buildQuizData() {
  const movement = findMovement(currentMovement);
  const works = movement.works;
  const allMovements = getAllMovements();

  const rounds = [];

  // Round 1: Matching (작품 ↔ 작가)
  const pairs = works.map(w => ({ work: w.title, author: w.author, id: w.id }));
  rounds.push({ type: 'matching', pairs });

  // Round 2: OX (3문항)
  const oxQuestions = [];

  // True statements — work belongs to this movement
  works.slice(0, 2).forEach(w => {
    oxQuestions.push({
      statement: `「${w.title}」은(는) ${w.author}의 작품이다.`,
      answer: true,
      explanation: `맞습니다. 「${w.title}」은 ${w.author}의 ${w.year}년 작품입니다.`
    });
  });

  // False statement — mix authors/movements
  const otherWorks = getAllWorks().filter(w => w.literary_movement !== movement.name);
  if (otherWorks.length > 0) {
    const ow = otherWorks[0];
    const wrongAuthor = works[0].author;
    oxQuestions.push({
      statement: `「${ow.title}」은(는) ${wrongAuthor}의 작품이다.`,
      answer: false,
      explanation: `아닙니다. 「${ow.title}」은 ${ow.author}의 작품입니다.`
    });
  } else {
    // fallback: movement mismatch
    const w = works[0];
    const otherM = allMovements.find(m => m.id !== movement.id);
    if (otherM) {
      oxQuestions.push({
        statement: `「${w.title}」의 문학 사조는 ${otherM.name}이다.`,
        answer: false,
        explanation: `아닙니다. 「${w.title}」의 문학 사조는 ${movement.name}입니다.`
      });
    }
  }

  rounds.push({ type: 'ox', questions: oxQuestions.slice(0, 3) });

  // Round 3: MCQ (3문항 — "이 작품의 문학 사조는?")
  const mcqQuestions = [];
  const otherMovementNames = allMovements
    .filter(m => m.id !== movement.id)
    .map(m => m.name);

  works.slice(0, 3).forEach(w => {
    const wrongOptions = shuffle(otherMovementNames).slice(0, 3);
    const options = shuffle([movement.name, ...wrongOptions]);
    mcqQuestions.push({
      question: `「${w.title}」(${w.author})의 문학 사조는 무엇인가요?`,
      options,
      answer: movement.name
    });
  });

  // If fewer than 3 works, pad with author questions
  if (mcqQuestions.length < 3 && works.length > 0) {
    const w = works[0];
    const otherAuthors = getAllWorks()
      .filter(ow => ow.author !== w.author)
      .map(ow => ow.author)
      .filter((a, i, arr) => arr.indexOf(a) === i);
    const wrongAuthors = shuffle(otherAuthors).slice(0, 3);
    const authorOptions = shuffle([w.author, ...wrongAuthors]);
    mcqQuestions.push({
      question: `「${w.title}」를 쓴 시인은 누구인가요?`,
      options: authorOptions,
      answer: w.author
    });
  }

  rounds.push({ type: 'mcq', questions: mcqQuestions.slice(0, 3) });

  return rounds;
}

// ── View 4: Quiz ──
function startQuiz() {
  const rounds = buildQuizData();
  quizData = { rounds, currentRound: 0, currentQ: 0, score: 0, wrong: [], totalQ: countTotalQ(rounds) };
  document.getElementById('quiz-title').textContent = findMovement(currentMovement).name + ' 퀴즈';
  showView('view-quiz');
  navState({ view: 'quiz' });
  renderQuizRound();
  window.scrollTo(0, 0);
}

function countTotalQ(rounds) {
  return rounds.reduce((acc, r) => {
    if (r.type === 'matching') return acc + r.pairs.length;
    return acc + r.questions.length;
  }, 0);
}

function getAnsweredSoFar() {
  let count = 0;
  for (let i = 0; i < quizData.currentRound; i++) {
    const r = quizData.rounds[i];
    if (r.type === 'matching') count += r.pairs.length;
    else count += r.questions.length;
  }
  count += quizData.currentQ;
  return count;
}

function updateProgressBar() {
  const answered = getAnsweredSoFar();
  const pct = quizData.totalQ > 0 ? (answered / quizData.totalQ) * 100 : 0;
  const bar = document.getElementById('quiz-progress-bar');
  if (bar) bar.style.width = pct + '%';
}

function renderQuizRound() {
  const round = quizData.rounds[quizData.currentRound];
  if (!round) { showResult(); return; }

  const roundNames = { matching: '연결 퀴즈', ox: 'OX 퀴즈', mcq: '4지선다' };
  const roundNums = { matching: 1, ox: 2, mcq: 3 };

  if (round.type === 'matching') renderMatching(round, roundNames, roundNums);
  else if (round.type === 'ox') renderOX(round, roundNames, roundNums);
  else if (round.type === 'mcq') renderMCQ(round, roundNames, roundNums);
}

// Round 1 — Matching
function renderMatching(round, roundNames, roundNums) {
  const shuffledWorks = shuffle(round.pairs.map(p => ({ text: `「${p.work}」`, id: p.id, type: 'work' })));
  const shuffledAuthors = shuffle(round.pairs.map(p => ({ text: p.author, id: p.id, type: 'author' })));

  let selectedWork = null;
  let selectedAuthor = null;
  let matched = new Set();

  const container = document.getElementById('quiz-content');
  container.innerHTML = `
    <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="quiz-progress-bar" style="width:0%"></div></div>
    <div class="quiz-round-label">라운드 ${roundNums['matching']} · ${roundNames['matching']}</div>
    <div class="quiz-question-counter">작품과 작가를 연결하세요</div>
    <div class="quiz-card">
      <div class="match-instruction">작품명과 해당 작가를 각각 클릭하여 연결하세요. 모두 연결하면 다음 라운드로 넘어갑니다.</div>
      <div class="match-columns">
        <div class="match-col">
          <div class="match-col-label">작품</div>
          ${shuffledWorks.map(w => `<div class="match-item" id="mw-${w.id}" data-id="${w.id}" data-type="work">${w.text}</div>`).join('')}
        </div>
        <div class="match-col">
          <div class="match-col-label">작가</div>
          ${shuffledAuthors.map(a => `<div class="match-item" id="ma-${a.id}" data-id="${a.id}" data-type="author">${a.text}</div>`).join('')}
        </div>
      </div>
    </div>`;

  updateProgressBar();

  container.querySelectorAll('.match-item').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('correct') || el.classList.contains('disabled')) return;

      const type = el.dataset.type;
      const id = el.dataset.id;

      if (type === 'work') {
        if (selectedWork) selectedWork.classList.remove('selected');
        selectedWork = el;
        el.classList.add('selected');
      } else {
        if (selectedAuthor) selectedAuthor.classList.remove('selected');
        selectedAuthor = el;
        el.classList.add('selected');
      }

      if (selectedWork && selectedAuthor) {
        const wId = selectedWork.dataset.id;
        const aId = selectedAuthor.dataset.id;
        const pair = round.pairs.find(p => p.id === wId);
        const isCorrect = pair && wId === aId;

        if (isCorrect) {
          selectedWork.classList.remove('selected'); selectedWork.classList.add('correct');
          selectedAuthor.classList.remove('selected'); selectedAuthor.classList.add('correct');
          matched.add(wId);
          quizData.score++;
        } else {
          selectedWork.classList.add('wrong');
          selectedAuthor.classList.add('wrong');
          setTimeout(() => {
            if (selectedWork) { selectedWork.classList.remove('wrong', 'selected'); selectedWork = null; }
            if (selectedAuthor) { selectedAuthor.classList.remove('wrong', 'selected'); selectedAuthor = null; }
          }, 800);
        }

        if (isCorrect) { selectedWork = null; selectedAuthor = null; }

        if (matched.size === round.pairs.length) {
          setTimeout(() => {
            quizData.currentRound++;
            quizData.currentQ = 0;
            renderQuizRound();
          }, 600);
        }
      }
    });
  });
}

// Round 2 — OX
function renderOX(round, roundNames, roundNums) {
  quizData.currentQ = 0;
  renderOXQuestion(round, roundNames, roundNums);
}

function renderOXQuestion(round, roundNames, roundNums) {
  const q = round.questions[quizData.currentQ];
  if (!q) { quizData.currentRound++; quizData.currentQ = 0; renderQuizRound(); return; }

  const container = document.getElementById('quiz-content');
  container.innerHTML = `
    <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="quiz-progress-bar"></div></div>
    <div class="quiz-round-label">라운드 ${roundNums['ox']} · ${roundNames['ox']}</div>
    <div class="quiz-question-counter">${quizData.currentQ + 1} / ${round.questions.length}</div>
    <div class="quiz-card">
      <div class="ox-question">${q.statement}</div>
      <div class="ox-buttons">
        <button class="ox-btn" id="ox-o" onclick="answerOX(true)">O</button>
        <button class="ox-btn" id="ox-x" onclick="answerOX(false)">X</button>
      </div>
      <div class="ox-feedback" id="ox-feedback"></div>
    </div>
    <button class="quiz-next-btn" id="quiz-next-btn" onclick="nextOX()">다음</button>`;

  updateProgressBar();
}

function setOxFeedback(fb, text) {   // 작업221: 정오 한 줄(정답!/오답./맞습니다./아닙니다.)만 따로 감싸 색을 입힌다
  const m = String(text).match(/^(정답!|오답\.|아닙니다\.|맞습니다\.)\s*/);
  fb.textContent = '';
  if (!m) { fb.textContent = text; return; }
  const line = document.createElement('b'); line.className = 'fb-line'; line.textContent = m[1];
  fb.appendChild(line); fb.appendChild(document.createTextNode(' ' + text.slice(m[0].length)));
}

function answerOX(answer) {
  const round = quizData.rounds[quizData.currentRound];
  const q = round.questions[quizData.currentQ];
  const oBtn = document.getElementById('ox-o');
  const xBtn = document.getElementById('ox-x');
  const fb = document.getElementById('ox-feedback');

  oBtn.disabled = true; xBtn.disabled = true;
  (answer ? oBtn : xBtn).classList.add('picked');   // 작업217-3: 고른 쪽 표시(밑줄)

  const isCorrect = answer === q.answer;
  if (isCorrect) {
    quizData.score++;
    (answer ? oBtn : xBtn).classList.add('correct');
    setOxFeedback(fb, '정답! ' + q.explanation);
    fb.className = 'ox-feedback show correct-fb';
  } else {
    (answer ? oBtn : xBtn).classList.add('wrong');
    (!answer ? oBtn : xBtn).classList.add('correct');
    setOxFeedback(fb, '오답. ' + q.explanation);
    fb.className = 'ox-feedback show wrong-fb';
    quizData.wrong.push({ q: q.statement, a: q.answer ? 'O (참)' : 'X (거짓)' });
  }

  quizData.currentQ++;
  document.getElementById('quiz-next-btn').classList.add('visible');
}

function nextOX() {
  const round = quizData.rounds[quizData.currentRound];
  if (quizData.currentQ >= round.questions.length) {
    quizData.currentRound++;
    quizData.currentQ = 0;
    renderQuizRound();
  } else {
    renderOXQuestion(round, { ox: 'OX 퀴즈' }, { ox: 2 });
  }
}

// Round 3 — MCQ
function renderMCQ(round, roundNames, roundNums) {
  quizData.currentQ = 0;
  renderMCQQuestion(round, roundNames, roundNums);
}

function renderMCQQuestion(round, roundNames, roundNums) {
  const q = round.questions[quizData.currentQ];
  if (!q) { quizData.currentRound++; quizData.currentQ = 0; renderQuizRound(); return; }

  const container = document.getElementById('quiz-content');
  container.innerHTML = `
    <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" id="quiz-progress-bar"></div></div>
    <div class="quiz-round-label">라운드 ${roundNums['mcq']} · ${roundNames['mcq']}</div>
    <div class="quiz-question-counter">${quizData.currentQ + 1} / ${round.questions.length}</div>
    <div class="quiz-card">
      <div class="mcq-question">${q.question}</div>
      <div class="mcq-options">
        ${q.options.map((opt, i) => `
          <button class="mcq-option" data-opt="${opt}" onclick="answerMCQ(this, '${opt.replace(/'/g, "\\'")}')">
            <span class="mcq-num">${i + 1}</span>
            <span class="mcq-text">${opt}</span>
          </button>`).join('')}
      </div>
    </div>
    <button class="quiz-next-btn" id="quiz-next-btn" onclick="nextMCQ()">다음</button>`;

  updateProgressBar();
}

function answerMCQ(el, chosen) {
  const round = quizData.rounds[quizData.currentRound];
  const q = round.questions[quizData.currentQ];

  document.querySelectorAll('.mcq-option').forEach(opt => {
    opt.classList.add('answered');
    opt.onclick = null;
  });

  const isCorrect = chosen === q.answer;
  if (isCorrect) {
    el.classList.add('correct');
    quizData.score++;
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.mcq-option').forEach(opt => {
      if (opt.dataset.opt === q.answer) opt.classList.add('correct-hint');
    });
    quizData.wrong.push({ q: q.question, a: q.answer });
  }

  quizData.currentQ++;
  document.getElementById('quiz-next-btn').classList.add('visible');
}

function nextMCQ() {
  const round = quizData.rounds[quizData.currentRound];
  if (quizData.currentQ >= round.questions.length) {
    quizData.currentRound++;
    quizData.currentQ = 0;
    renderQuizRound();
  } else {
    renderMCQQuestion(round, { mcq: '4지선다' }, { mcq: 3 });
  }
}

// ── View 5: Result ──
function showResult() {
  const total = quizData.totalQ;
  const score = quizData.score;
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;

  let msg = '완벽해요!', sub = '모든 문항을 맞혔습니다.';
  if (pct < 100) { msg = '잘했어요!'; sub = '조금만 더 연습하면 완벽합니다.'; }
  if (pct < 60) { msg = '다시 도전해봐요!'; sub = '작품 카드를 다시 보고 퀴즈에 도전하세요.'; }

  let wrongHtml = '';
  if (quizData.wrong.length > 0) {
    wrongHtml = `
      <div class="result-section-label">틀린 문항</div>
      <div class="result-wrong-list">
        ${quizData.wrong.map(w => `
          <div class="result-wrong-item">
            <div class="result-wrong-q">${w.q}</div>
            <div class="result-wrong-a">${w.a}</div>
          </div>`).join('')}
      </div>`;
  }

  document.getElementById('result-content').innerHTML = `
    <div class="result-score-wrap">
      <div class="result-score">${score}<span> / ${total}</span></div>
      <div class="result-msg">${msg}</div>
      <div class="result-submsg">${sub}</div>
    </div>
    ${wrongHtml}
    <div class="result-actions">
      <button class="result-btn result-btn-primary" onclick="retryQuiz()">다시 풀기</button>
      <button class="result-btn result-btn-secondary" onclick="tabNav('home')">홈으로</button>
    </div>`;

  showView('view-result');
  navState({ view: 'result' });
  window.scrollTo(0, 0);
}

function retryQuiz() {
  startQuiz();
}

// ── Helpers ──
function findMovement(id) {
  for (const era of DB.eras) {
    for (const m of era.movements) {
      if (m.id === id) return m;
    }
  }
  return null;
}

function getAllMovements() {
  const all = [];
  for (const era of DB.eras) {
    for (const m of era.movements) all.push(m);
  }
  return all;
}

function getAllWorks() {
  const all = [];
  for (const era of DB.eras) {
    for (const m of era.movements) {
      for (const w of m.works) all.push(w);
    }
  }
  return all;
}

// ── Boot ──
loadDB();
</script>
